name: Build iPhone binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Prepare source
        run: |
          mkdir -p /tmp/helper-build
          cp -R "helper_interface_v2 (2)/helper_interface_v2/." /tmp/helper-build/

      - name: Check iPhone SDK
        run: xcrun --sdk iphoneos --show-sdk-path

      - name: Build
        working-directory: /tmp/helper-build
        run: make -f build/Makefile ios CXX=clang++

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: iphone-binaries
          path: |
            /tmp/helper-build/build/out/helper
            /tmp/helper-build/build/out/dump_offsets
          if-no-files-found: error
