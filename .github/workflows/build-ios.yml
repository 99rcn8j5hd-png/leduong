name: Build Task Port Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Write standalone diagnostic source
        run: |
          cat > task-port-check.cpp <<'CPP'
          // Diagnostic only: reads this process and a separately launched cooperative sample.
          // No third-party target, kernel reader, or security policy changes.
          #include <mach/mach.h>
          #include <mach/mach_error.h>
          #include <mach/vm_map.h>
          #include <mach-o/dyld.h>
          #include <unistd.h>
          #include <cerrno>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <cstdlib>
          #include <climits>
          
          static_assert(sizeof(vm_address_t) == 8, "64-bit target required");
          static volatile uint64_t marker = 0;
          
          static bool check_read(task_t task, uint64_t address, uint64_t expected) {
              uint64_t value = 0;
              vm_size_t got = 0;
              kern_return_t kr = vm_read_overwrite(task, static_cast<vm_address_t>(address),
                  sizeof(value), reinterpret_cast<vm_address_t>(&value), &got);
              if (kr != KERN_SUCCESS) {
                  std::printf("  read: %s (%d)\n", mach_error_string(kr), kr);
                  return false;
              }
              if (got != sizeof(value) || value != expected) {
                  std::printf("  read mismatch: bytes=%llu value=%llx expected=%llx\n",
                      static_cast<unsigned long long>(got),
                      static_cast<unsigned long long>(value),
                      static_cast<unsigned long long>(expected));
                  return false;
              }
              return true;
          }
          
          static bool attach_and_read(pid_t pid, uint64_t address, uint64_t expected) {
              task_t port = MACH_PORT_NULL;
              const kern_return_t kr = task_for_pid(mach_task_self(), pid, &port);
              if (kr != KERN_SUCCESS) {
                  std::printf("  task_for_pid(%d): %s (%d)\n", pid, mach_error_string(kr), kr);
                  return false;
              }
              const bool ok = check_read(port, address, expected);
              mach_port_deallocate(mach_task_self(), port);
              return ok;
          }
          
          
          static bool number(const char* text, int base, uint64_t& value) {
              if (!text || !*text || *text == '-' || *text == '+') return false;
              char* end = nullptr;
              errno = 0;
              unsigned long long parsed = std::strtoull(text, &end, base);
              if (errno || end == text || *end) return false;
              value = parsed;
              return true;
          }
          
          int main(int argc, char** argv) {
              setvbuf(stdout, nullptr, _IONBF, 0);
              marker = 0x6197A52B84C3D601ULL ^ static_cast<uint64_t>(getpid());
              const bool target_mode = argc == 2 && std::strcmp(argv[1], "--target") == 0;
              const bool probe_mode = argc == 5 && std::strcmp(argv[1], "--probe") == 0;
              if (argc != 1 && !target_mode && !probe_mode) {
                  std::fprintf(stderr, "usage: task-port-check [--target | --probe PID ADDRESS_HEX VALUE_HEX]\n");
                  return 2;
              }
              uint64_t target_pid = 0, target_address = 0, target_value = 0;
              if (probe_mode && (!number(argv[2], 10, target_pid) || !target_pid || target_pid > INT_MAX ||
                  !number(argv[3], 16, target_address) || !target_address ||
                  !number(argv[4], 16, target_value))) {
                  std::fprintf(stderr, "Invalid probe arguments. Copy the exact command from --target.\n");
                  return 2;
              }
              std::printf("task-port-check v1.1 pid=%d uid=%d euid=%d\n", getpid(), getuid(), geteuid());
              char executable[4096];
              uint32_t capacity = sizeof(executable);
              if (_NSGetExecutablePath(executable, &capacity) == 0)
                  std::printf("executable=%s\n", executable);
              if (target_mode) {
                  std::printf("SAMPLE READY. Keep this terminal open. In a SECOND terminal run:\n");
                  std::printf("sudo task-port-check --probe %d %llx %llx\n", getpid(),
                      static_cast<unsigned long long>(reinterpret_cast<uintptr_t>(&marker)),
                      static_cast<unsigned long long>(marker));
                  std::printf("This process publishes its own marker only. Ctrl+C stops it.\n");
                  for (;;) pause();
              }
              const uint64_t address = reinterpret_cast<uintptr_t>(&marker);
              const uint64_t expected = marker;
              const bool t1 = check_read(mach_task_self(), address, expected);
              std::printf("TEST1 self task + read: %s\n", t1 ? "PASS" : "FAIL");
              const bool t2 = attach_and_read(getpid(), address, expected);
              std::printf("TEST2 task_for_pid(self) + read: %s\n", t2 ? "PASS" : "FAIL");
              if (!probe_mode) {
                  std::printf("TEST3 cooperative sample: NOT RUN\n");
                  std::printf("Start task-port-check --target in one terminal and copy its probe command into a second terminal.\n");
                  return t1 && t2 ? 0 : 1;
              }
              if (target_pid == static_cast<uint64_t>(getpid())) {
                  std::fprintf(stderr, "TEST3 ERROR: target must be the separate sample process.\n");
                  return 2;
              }
              const bool t3 = attach_and_read(static_cast<pid_t>(target_pid), target_address, target_value);
              std::printf("TEST3 task_for_pid(cooperative sample) + read: %s\n", t3 ? "PASS" : "FAIL");
              std::printf("SUMMARY self_read=%s self_attach=%s sample_attach_read=%s\n",
                  t1 ? "PASS" : "FAIL", t2 ? "PASS" : "FAIL", t3 ? "PASS" : "FAIL");
              std::printf("A failed read can mean that the sample exited or its arguments are stale.\n");
              std::printf("These results do not establish access to PUBG or a need for kernel access.\n");
              return t1 && t2 && t3 ? 0 : 1;
          }
          CPP
      - name: Compile and smoke test on macOS
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra task-port-check.cpp -o task-port-check-host
          status=0
          ./task-port-check-host > host-check.log 2>&1 || status=$?
          cat host-check.log
          echo "Diagnostic exit status: $status (permission denial can be expected on this host)"
          grep -q 'TEST1 self task + read: PASS' host-check.log
      - name: Compile with real iPhone SDK
        run: |
          mkdir -p stage/DEBIAN stage/usr/bin out
          xcrun --sdk iphoneos clang++ -std=c++17 -O2 -Wall -Wextra -arch arm64 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -miphoneos-version-min=15.0 task-port-check.cpp -o stage/usr/bin/task-port-check
          xcrun lipo stage/usr/bin/task-port-check -verify_arch arm64
      - name: Sign and package diagnostic
        run: |
          brew install ldid dpkg
          cat > entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>task_for_pid-allow</key><true/></dict></plist>
          PLIST
          chmod 755 stage/usr/bin/task-port-check
          ldid -Sentitlements.plist stage/usr/bin/task-port-check
          ldid -e stage/usr/bin/task-port-check
          cat > stage/DEBIAN/control <<'CONTROL'
          Package: local.helper.taskportcheck
          Name: Task Port Check
          Version: 1.1.0
          Architecture: iphoneos-arm64e
          Maintainer: Local Test
          Section: Development
          Description: Three task-port diagnostics limited to this executable and a separately launched cooperative sample.
          CONTROL
          chmod 755 stage/DEBIAN
          chmod 644 stage/DEBIAN/control
          dpkg-deb -Zgzip --root-owner-group --build stage out/task-port-check_1.1.0_iphoneos-arm64e.deb
          dpkg-deb --info out/task-port-check_1.1.0_iphoneos-arm64e.deb
          dpkg-deb --contents out/task-port-check_1.1.0_iphoneos-arm64e.deb
          cp task-port-check.cpp host-check.log out/
      - uses: actions/upload-artifact@v4
        with:
          name: task-port-check-roothide
          path: out/
          if-no-files-found: error
