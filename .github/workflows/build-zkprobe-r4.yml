            "src/training_projection.hpp": "#pragma once\n#include <cmath>\nnamespace zk {\nstruct Projection {const char *status=\"invalid_input\";double x=0,y=0,depth=0;};\n// Normalized coordinates, horizontal FOV assumption. No game calls or memory access.\ninline Projection projectTraining(const float *point,const float *location,const float *rotation,double fov,double aspect){\n Projection r;\n if(!point||!location||!rotation||!std::isfinite(fov)||fov<1||fov>179||!std::isfinite(aspect)||aspect<0.2||aspect>5)return r;\n for(unsigned i=0;i<3;++i)if(!std::isfinite(point[i])||!std::isfinite(location[i])||!std::isfinite(rotation[i]))return r;\n const double rad=3.14159265358979323846/180, p=rotation[0]*rad,y=rotation[1]*rad,b=rotation[2]*rad;\n const double cp=std::cos(p),sp=std::sin(p),cy=std::cos(y),sy=std::sin(y),cr=std::cos(b),sr=std::sin(b);\n const double dx=double(point[0])-location[0],dy=double(point[1])-location[1],dz=double(point[2])-location[2];\n r.depth=dx*cp*cy+dy*cp*sy+dz*sp;\n if(r.depth<=1){r.status=\"behind_or_near_camera\";return r;}\n const double right=dx*(sr*sp*cy-cr*sy)+dy*(sr*sp*sy+cr*cy)-dz*sr*cp;\n const double up=-dx*(cr*sp*cy+sr*sy)+dy*(cy*sr-cr*sp*sy)+dz*cr*cp;\n const double scale=2*r.depth*std::tan(fov*rad/2);\n r.x=0.5+right/scale;r.y=0.5-up*aspect/scale;\n if(!std::isfinite(r.x)||!std::isfinite(r.y)){r.status=\"invalid_projection\";return r;}\n r.status=(r.x>=0&&r.x<=1&&r.y>=0&&r.y<=1)?\"in_view_UNVERIFIED\":\"outside_view\";return r;\n}\n}\n",
            "src/training_rank.hpp": "#pragma once\n#include <cmath>\n#include <cstdint>\nnamespace zk {\nstruct RankedMark {unsigned slot=0;int32_t index=-1;double x=0,y=0,distance=0;};\ntemplate<unsigned Capacity,unsigned MarginPercent=10> struct RankedTargets {\n static_assert(MarginPercent<50,\"valid screen margin\");\n static_assert(Capacity>0&&Capacity<=20,\"bounded target capacity\");\n RankedMark marks[Capacity]{};unsigned count=0;\n static bool before(const RankedMark &a,const RankedMark &b){\n  if(a.distance!=b.distance)return a.distance<b.distance;\n  const double ac=(a.x-.5)*(a.x-.5)+(a.y-.5)*(a.y-.5),bc=(b.x-.5)*(b.x-.5)+(b.y-.5)*(b.y-.5);\n  return ac!=bc?ac<bc:a.index<b.index;\n }\n void offer(RankedMark mark){\n  if(mark.index<0||!std::isfinite(mark.x)||!std::isfinite(mark.y)||!std::isfinite(mark.distance)||mark.distance<=0||mark.x<double(MarginPercent)/100||mark.x>1-double(MarginPercent)/100||mark.y<double(MarginPercent)/100||mark.y>1-double(MarginPercent)/100)return;\n  for(unsigned i=0;i<count;++i)if(marks[i].index==mark.index)return;\n  unsigned at=0;while(at<count&&!before(mark,marks[at]))++at;\n  if(at>=Capacity)return;\n  if(count<Capacity)++count;\n  for(unsigned i=count-1;i>at;--i)marks[i]=marks[i-1];marks[at]=mark;\n }\n};\nusing TrainingRank=RankedTargets<2>;\nusing TrainingRankEight=RankedTargets<8>;\nusing TrainingRankSixteen=RankedTargets<16>;\nusing TrainingRank360=RankedTargets<16,2>;\nusing TrainingRankTwenty=RankedTargets<20,2>;\n}\n",
            "src/training_rays.hpp": "#pragma once\n#include \"training_projection.hpp\"\n#include <cstdint>\n#include <cstring>\nnamespace zk {\nstruct RayEndpoint {bool valid=false,edge=false,behind=false;double x=0,y=0,distance=0;};\ninline RayEndpoint projectTrainingRay(const float *point,const float *location,const float *rotation,double fov,double aspect){\n RayEndpoint r;auto p=projectTraining(point,location,rotation,fov,aspect);if(!std::strcmp(p.status,\"invalid_input\")||!std::strcmp(p.status,\"invalid_projection\"))return r;\n const double dx=double(point[0])-location[0],dy=double(point[1])-location[1],dz=double(point[2])-location[2];r.distance=std::sqrt(dx*dx+dy*dy+dz*dz);if(!std::isfinite(r.distance)||r.distance<=1)return r;\n if(!std::strcmp(p.status,\"in_view_UNVERIFIED\")){r.valid=true;r.x=p.x;r.y=p.y;return r;}\n r.edge=true;r.behind=p.depth<0;double x=p.x-.5,y=p.y-.5;\n if(p.depth<=1){\n  const double rad=3.14159265358979323846/180,pitch=rotation[0]*rad,yaw=rotation[1]*rad,roll=rotation[2]*rad;\n  const double right=dx*(std::sin(roll)*std::sin(pitch)*std::cos(yaw)-std::cos(roll)*std::sin(yaw))+dy*(std::sin(roll)*std::sin(pitch)*std::sin(yaw)+std::cos(roll)*std::cos(yaw))-dz*std::sin(roll)*std::cos(pitch);\n  const double bearing=std::atan2(right,p.depth);x=std::sin(bearing);y=-std::cos(bearing); // Bearing indicator only, NOT a projected rear world point.\n }\n const double extent=std::fmax(std::fabs(x),std::fabs(y));if(!std::isfinite(extent)||extent<1e-9)return r;\n const double scale=.47/extent;r.x=.5+x*scale;r.y=.5+y*scale;r.valid=std::isfinite(r.x)&&std::isfinite(r.y);return r;\n}\nstruct RayPick {unsigned slot=0;int32_t index=-1;RayEndpoint endpoint;};\nstruct RayRank {\n RayPick marks[20]{};unsigned count=0;\n static bool before(const RayPick&a,const RayPick&b){return a.endpoint.distance!=b.endpoint.distance?a.endpoint.distance<b.endpoint.distance:a.index<b.index;}\n void offer(RayPick p){const auto &e=p.endpoint;if(p.index<0||!e.valid||!std::isfinite(e.x)||!std::isfinite(e.y)||e.x<0||e.x>1||e.y<0||e.y>1||!std::isfinite(e.distance)||e.distance<=1)return;for(unsigned i=0;i<count;++i)if(marks[i].index==p.index)return;unsigned at=0;while(at<count&&!before(p,marks[at]))++at;if(at>=20)return;if(count<20)++count;for(unsigned i=count-1;i>at;--i)marks[i]=marks[i-1];marks[at]=p;}\n};\n}\n",
            "src/training_residual.hpp": "#pragma once\n#include <cmath>\n#include <cstdint>\nnamespace zk {\nstruct TrainingResidual {bool valid=false;double dx=0,dy=0,distance=0,cameraShift=0,targetShift=0;};\ninline TrainingResidual trainingResidual(double x,double y,double width,double height,const float camera[3],const float oldCamera[3],const float target[3],const float oldTarget[3]){\n TrainingResidual r;if(!std::isfinite(x)||!std::isfinite(y)||!std::isfinite(width)||!std::isfinite(height)||width<=0||height<=0||!camera||!oldCamera||!target||!oldTarget)return r;\n double cs=0,ts=0;\n for(unsigned i=0;i<3;++i){if(!std::isfinite(camera[i])||!std::isfinite(oldCamera[i])||!std::isfinite(target[i])||!std::isfinite(oldTarget[i]))return r;cs+=std::pow(double(camera[i])-oldCamera[i],2);ts+=std::pow(double(target[i])-oldTarget[i],2);}\n r.dx=(x-.5)*width;r.dy=(y-.5)*height;r.distance=std::hypot(r.dx,r.dy);r.cameraShift=std::sqrt(cs);r.targetShift=std::sqrt(ts);r.valid=std::isfinite(r.distance)&&std::isfinite(r.cameraShift)&&std::isfinite(r.targetShift);return r;\n}\nstruct ResidualSeries {\n unsigned samples=0,settled=0;int64_t lastUs=-1;double sumX=0,sumY=0,sumDistance=0,maxDistance=0;\n bool due(int64_t now,int64_t completed)const{return completed>0&&now>=completed&&now-completed<2000000&&samples<24&&(lastUs<0||now-lastUs>=100000);}\n bool record(int64_t now,int64_t completed,const TrainingResidual&r){if(!r.valid||!due(now,completed))return false;++samples;lastUs=now;if(now-completed>=250000){++settled;sumX+=r.dx;sumY+=r.dy;sumDistance+=r.distance;if(r.distance>maxDistance)maxDistance=r.distance;}return true;}\n};\n}\n",
            "src/training_step.hpp": "#pragma once\n#include \"angle_test_core.hpp\"\n#include \"training_projection.hpp\"\n#include \"fov_preview.hpp\"\n#include <cstring>\nnamespace zk {\nstruct TrainingStep {const char*status=\"invalid_input\";float wanted[3]{};double errorPitch=0,errorYaw=0,stepPitch=0,stepYaw=0;};\ninline TrainingStep trainingStep(const float target[3],const float location[3],const float camera[3],const float control[3],double fov,double width,double height,double fraction,double maxDegrees=20,double maxCameraRoll=.25){\n TrainingStep r;if(!std::isfinite(maxDegrees)||maxDegrees<1||maxDegrees>20)return r;\n if(!target||!location||!camera||!control||!std::isfinite(width)||!std::isfinite(height)||width<=height||height<=0)return r;\n for(unsigned i=0;i<3;++i)if(!std::isfinite(target[i])||!std::isfinite(location[i])||!std::isfinite(camera[i])||!std::isfinite(control[i])||std::fabs(camera[i])>360000||std::fabs(control[i])>360000)return r;\n if(std::fabs(angleDelta(camera[2],0))>maxCameraRoll){r.status=\"camera_roll_unsupported\";return r;}\n if(std::fabs(angleDelta(control[0],camera[0]))>2||std::fabs(angleDelta(control[1],camera[1]))>2){r.status=\"camera_control_disagree\";return r;}\n const auto p=projectTraining(target,location,camera,fov,width/height);\n if(std::strcmp(p.status,\"in_view_UNVERIFIED\")){r.status=\"target_not_in_view\";return r;}\n const FovPoint point{0,p.x,p.y,false,false};if(pickFov(&point,1,width,height,fraction).index<0){r.status=\"target_outside_fov\";return r;}\n const double dx=double(target[0])-location[0],dy=double(target[1])-location[1],dz=double(target[2])-location[2],horizontal=std::hypot(dx,dy),degrees=180/3.14159265358979323846;\n if(horizontal<1){r.status=\"target_too_close_or_vertical\";return r;}\n r.errorPitch=angleDelta(std::atan2(dz,horizontal)*degrees,camera[0]);r.errorYaw=angleDelta(std::atan2(dy,dx)*degrees,camera[1]);\n const double magnitude=std::hypot(r.errorPitch,r.errorYaw);if(!std::isfinite(magnitude))return r;\n if(magnitude<.05){r.status=\"already_within_0_05_deg\";return r;}\n const double scale=std::fmin(1.0,maxDegrees/magnitude);r.stepPitch=r.errorPitch*scale;r.stepYaw=r.errorYaw*scale;\n r.wanted[0]=float(std::remainder(double(control[0])+r.stepPitch,360.0));r.wanted[1]=float(std::remainder(double(control[1])+r.stepYaw,360.0));r.wanted[2]=control[2];\n r.status=\"bounded_training_step_ready\";return r;\n}\n}\n",
            "src/vng07/Backend.h": "#pragma once\n#import <Foundation/Foundation.h>\n#include <cstdint>\n#include <atomic>\nnamespace PIBackend {\nNSDictionary* Snapshot(bool Discover, uintptr_t Selected = 0, bool IncludeBones = false);\nNSString* PlayerAim(double Width,double Height,double Radius,const std::atomic<bool>& Permit);\nNSDictionary* OverlayFrame(double Width,double Height,bool Bones,bool ShowTeam,double RangeMeters);\n}\n",
            "src/vng07/Backend.mm": "#include \"GameOffsets.h\"\n#import \"Backend.h\"\n#include \"Names.h\"\n#include \"Bones.h\"\n#include \"Projection.h\"\n#include \"PlayerAimMath.h\"\n#include \"LivePose.h\"\n#include \"OverlayStyle.h\"\n#include <mach/mach.h>\n#include <mach-o/dyld.h>\n#include <chrono>\n#include <cmath>\n#include <cstring>\n#include <unordered_map>\n#include <vector>\n\nnamespace PIBackend {\nnamespace O=PIGame;\nstatic uintptr_t Slide = 0, Names = 0, Local = 0, Selected = 0;\nstatic bool FoundImage = false;\nstatic std::vector<uintptr_t> Characters;\nstatic size_t Scanned = 0, ObjectCount = 0;\nstatic bool Complete = false;\nstatic unsigned DiscoverGeneration=0;\nstatic std::unordered_map<uintptr_t, unsigned> Types;\nstatic bool Read(uintptr_t At, void* Out, size_t Size)\n{\n    if (At < 0x10000 || At > UINTPTR_MAX - Size || Size > 1024 * 1024) return false;\n    static_assert(sizeof(vm_address_t)==8, \"ARM64 build required\");\n    vm_size_t Done = 0;\n    return vm_read_overwrite(mach_task_self(), At, Size, reinterpret_cast<vm_address_t>(Out), &Done) == KERN_SUCCESS && Done == Size;\n}\ntemplate<class T> static bool Get(uintptr_t At, T& Out) { Out = {}; return Read(At, &Out, sizeof(T)); }\nstatic uintptr_t Ptr(uintptr_t At) { uintptr_t V = 0; return Get(At, V) ? V : 0; }\nstatic NSString* Hex(uintptr_t P) { return P ? [NSString stringWithFormat:@\"0x%llX\", (unsigned long long)P] : @\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c\"; }\nstatic NSString* Text(uintptr_t At)\n{\n    struct FStringHeader { uintptr_t Data; int Count, Capacity; } H{};\n    if (!Get(At, H) || !PINames::ValidString(H.Count,H.Capacity)) return @\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c\";\n    if (!H.Count) return @\"(tr\u1ed1ng)\";\n    std::vector<unichar> Buffer(H.Count);\n    if (!Read(H.Data, Buffer.data(), Buffer.size()*2)) return @\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c\";\n    size_t Len = Buffer.size(); if (Len && !Buffer.back()) --Len;\n    return [[NSString alloc] initWithCharacters:Buffer.data() length:Len] ?: @\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c\";\n}\nstatic unsigned Type(uintptr_t Cls)\n{\n    auto Cached = Types.find(Cls); if (Cached != Types.end()) return Cached->second;\n    const uintptr_t Initial = Cls; unsigned Result = 0;\n    std::unordered_set<uintptr_t> Seen;\n    for (unsigned I=0; Cls && I<32 && Seen.insert(Cls).second; ++I)\n    {\n        int Index = 0; if (!Get(Cls+O::Object::Name,Index)) break;\n        const auto Name = PINames::Lookup(Read,Names,Index);\n        if (Name == \"LocalPlayer\") Result |= 1;\n        if (Name == \"STExtraPlayerCharacter\" || Name == \"STExtraBaseCharacter\") Result |= 2;\n        if (Name == \"PlayerController\") Result |= 4;\n        Cls = Ptr(Cls+O::Struct::Super);\n    }\n    if (Types.size() < 8192) Types[Initial] = Result;\n    return Result;\n}\nstatic bool Character(uintptr_t Obj) { return Obj && (Type(Ptr(Obj+O::Object::Class))&2); }\nstatic NSString* Number(uintptr_t At, bool Integer=false)\n{\n    if (Integer) { int V=0; return Get(At,V) ? [NSString stringWithFormat:@\"%d\",V] : @\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c\"; }\n    float V=0; return Get(At,V) && std::isfinite(V) && std::abs(V)<1e8 ? [NSString stringWithFormat:@\"%.1f\",V] : @\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c\";\n}\nstatic NSString* Vector(uintptr_t At)\n{\n    float V[3]{};\n    if (!Read(At,V,sizeof(V)) || !std::isfinite(V[0]) || !std::isfinite(V[1]) || !std::isfinite(V[2])) return @\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c\";\n    return [NSString stringWithFormat:@\"X %.1f \u00b7 Y %.1f \u00b7 Z %.1f\",V[0],V[1],V[2]];\n}\nstatic NSString* Flag(uintptr_t At, uint8_t Mask)\n{ uint8_t V=0; return Get(At,V) ? ((V&Mask) ? @\"C\u00f3\" : @\"Kh\u00f4ng\") : @\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c\"; }\nstatic NSString* PlayerKey(uintptr_t At)\n{ uint32_t V=0; return Get(At,V) ? [NSString stringWithFormat:@\"%u\",V] : @\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c\"; }\n\n#include \"LivePoseAdapter.h\"\n#include \"BoneAdapter.h\"\n#include \"PlayerAimAdapter.h\"\n#include \"OverlayAdapter.h\"\nNSString* PlayerAim(double W,double H,double R,const std::atomic<bool>& Permit){return ApplyPlayerAim(W,H,R,Permit);}\nNSDictionary* OverlayFrame(double Width,double Height,bool Bones,bool ShowTeam,double RangeMeters)\n{ return NearbyFrame(Width,Height,Bones,ShowTeam,RangeMeters); }\n\nNSDictionary* Snapshot(bool Discover, uintptr_t Choice, bool IncludeBones)\n{\n    NSString* Version = [[NSBundle mainBundle] objectForInfoDictionaryKey:@\"CFBundleShortVersionString\"];\n    if (![Version isEqualToString:[NSString stringWithUTF8String:O::GameVersion]]) return @{@\"summary\":[NSString stringWithFormat:@\"Profile offset PUBG VNG %s kh\u00f4ng kh\u1edbp game %@. C\u1ea7n \u0111\u1ed1i chi\u1ebfu SDK v\u00e0 c\u1eadp nh\u1eadt GameOffsets.h.\",O::GameVersion,Version]};\n    if (!FoundImage)\n    {\n        for (uint32_t I=0; I<_dyld_image_count(); ++I)\n        {\n            const char* Name = _dyld_get_image_name(I);\n            const char* Base = Name ? std::strrchr(Name,'/') : nullptr;\n            if (Base && std::strcmp(Base+1,\"ShadowTrackerExtra\")==0) { Slide = _dyld_get_image_vmaddr_slide(I); FoundImage = true; break; }\n        }\n    }\n    if (!FoundImage) return @{@\"summary\":@\"Ch\u01b0a t\u00ecm th\u1ea5y module ShadowTrackerExtra trong \u1ee9ng d\u1ee5ng.\"};\n    if (!Names || PINames::Lookup(Read,Names,0) != \"None\")\n    {\n        Names = 0;\n        for (uintptr_t Off : {O::Globals::GNamesPrimary,O::Globals::GNamesAlternate})\n        { std::unordered_set<uintptr_t> Seen; Names=PINames::Resolve(Read,Slide+Off,Seen); if (Names) break; }\n    }\n    if (!Names) return @{@\"summary\":@\"Ch\u01b0a x\u00e1c th\u1ef1c \u0111\u01b0\u1ee3c b\u1ea3ng t\u00ean. Ch\u1edd game t\u1ea3i xong r\u1ed3i b\u1ea5m T\u00ecm player.\",@\"diagnostics\":[NSString stringWithFormat:@\"VNG-TRAINING-HUD-07\\nASLR slide %@\\nGNames: ch\u01b0a x\u00e1c th\u1ef1c\",Hex(Slide)]};\n    const uintptr_t Objects = Slide+O::Globals::GObjects;\n    int Count=0; uintptr_t Items=0;\n    if (!Get(Objects+O::ObjectArray::Count,Count) || Count<=0 || Count>3000000 || !(Items=Ptr(Objects+O::ObjectArray::Items))) return @{@\"summary\":@\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c GObjects. Ch\u1edd game t\u1ea3i xong v\u00e0 th\u1eed t\u00ecm l\u1ea1i.\"};\n    if (Discover)\n    {\n        ++DiscoverGeneration;AimWriteBlocked=false;AimLockedPawn=0;\n        Local=0; Selected=0; Characters.clear(); Types.clear(); Scanned=0; ObjectCount=Count; Complete=true;\n        const auto Start=std::chrono::steady_clock::now();\n        std::vector<uint8_t> Buffer(512*O::ObjectArray::ItemStride);\n        for (int Base=0; Base<Count; Base+=512)\n        {\n            if (std::chrono::steady_clock::now()-Start>std::chrono::seconds(8)) { Complete=false; break; }\n            const int N=std::min(512,Count-Base);\n            if (!Read(Items+uintptr_t(Base)*O::ObjectArray::ItemStride,Buffer.data(),N*O::ObjectArray::ItemStride)) { Complete=false; continue; }\n            for (int J=0; J<N; ++J)\n            {\n                ++Scanned; uintptr_t Object=0; std::memcpy(&Object,Buffer.data()+J*O::ObjectArray::ItemStride,8);\n                uint8_t H[O::Object::HeaderSize]{}; if (!Read(Object,H,sizeof(H))) continue;\n                uint32_t Flags=0; uintptr_t Cls=0; std::memcpy(&Flags,H+O::Object::Flags,4); std::memcpy(&Cls,H+O::Object::Class,8);\n                if (Flags&O::Object::ClassDefaultMask) continue; // RF_ClassDefaultObject\n                const auto T=Type(Cls);\n                if ((T&1) && Ptr(Object+O::LocalPlayer::Controller)) Local=Object;\n                if ((T&2) && Characters.size()<512) Characters.push_back(Object);\n            }\n        }\n    }\n    if (Local && !(Type(Ptr(Local+O::Object::Class))&1)) Local=0;\n    uintptr_t Controller=Local ? Ptr(Local+O::LocalPlayer::Controller) : 0;\n    if (Controller && !(Type(Ptr(Controller+O::Object::Class))&4)) Controller=0;\n    uintptr_t Own=Controller ? Ptr(Controller+O::Controller::AcknowledgedPawn) : 0;\n    if (!Character(Own)) Own=Controller ? Ptr(Controller+O::Controller::STExtraBaseCharacter) : 0;\n    if (!Character(Own)) Own=0;\n    if (Choice==UINTPTR_MAX) Selected=0;\n    else if (Choice) Selected=Choice;\n    if (Selected && !Character(Selected)) Selected=0;\n    const uintptr_t Pawn=Selected ? Selected : Own;\n    NSMutableArray* List=[NSMutableArray array];\n    for (uintptr_t P : Characters)\n    {\n        if (List.count>=32) break;\n        if (P==Own || !Character(P)) continue;\n        const uintptr_t OwnLevel=Own?Ptr(Own+O::Object::Outer):Ptr(Controller+O::Object::Outer),Level=Ptr(P+O::Object::Outer);\n        if(!OwnLevel||!Level||(Level!=OwnLevel&&(!Ptr(OwnLevel+O::Object::Outer)||Ptr(Level+O::Object::Outer)!=Ptr(OwnLevel+O::Object::Outer))))continue;\n        [List addObject:@{@\"pointer\":@(P),@\"title\":[NSString stringWithFormat:@\"%@ \u00b7 \u0111\u1ed9i %@ \u00b7 HP %@\",Text(P+O::Character::PlayerName),Number(P+O::Character::TeamID,true),Number(P+O::Character::Health)]}];\n    }\n    NSString* Summary=Pawn ? [NSString stringWithFormat:@\"%@\\n%@ \u00b7 \u0111\u1ed9i %@\\nHP %@ / %@\",Selected ? @\"\u0110ang xem nh\u00e2n v\u1eadt \u0111\u00e3 ch\u1ecdn\" : @\"Nh\u00e2n v\u1eadt c\u1ee7a b\u1ea1n\",Text(Pawn+O::Character::PlayerName),Number(Pawn+O::Character::TeamID,true),Number(Pawn+O::Character::Health),Number(Pawn+O::Character::HealthMax)] : @\"Ch\u01b0a c\u00f3 nh\u00e2n v\u1eadt \u0111\u1ec3 \u0111\u1ecdc. B\u1ea5m T\u00ecm player sau khi v\u00e0o s\u1ea3nh ho\u1eb7c khu luy\u1ec7n t\u1eadp.\";\n    const uintptr_t Root=Pawn ? Ptr(Pawn+O::Actor::RootComponent) : 0;\n    uint64_t UID=0; const bool HasUID=Controller && Get(Controller+O::Controller::UID,UID);\n    NSString* Identity=Pawn ? [NSString stringWithFormat:@\"T\u00ean: %@\\nUID d\u1ea1ng chu\u1ed7i: %@\\nPlayerKey: %@\\n\