            "src/angle_test_core.hpp": "#pragma once\n#include <atomic>\n#include <cstdint>\n#include <cmath>\n#include <chrono>\n#include \"manual_tuning.hpp\"\nnamespace zk {\nenum class AnglePhase:unsigned {Idle,Arming,Requested,Queued,Running,Completed,Rejected};\nstruct AngleTest {\n std::atomic<AnglePhase> phase{AnglePhase::Idle};\n int64_t requestedUs=0;const char*status=\"not_requested\";float before[3]{},wanted[3]{},after[3]{};bool nativeReturned=false;int64_t completedUs=0;float cameraBefore[3]{},targetBefore[3]{};\n std::atomic_flag executing=ATOMIC_FLAG_INIT;unsigned attemptId=0;\n float targetHeightCm=0;double fireHoldUptime=0, requestUptime=0, submitUptime=0;float burstOffsetCm=0;bool automatic=false;double maxDegrees=20;unsigned durationMs=200,displayOrdinal=0,callbackCount=0,setterCalls=0,totalReadCalls=0;size_t totalReadBytes=0;double firstSetUptime=0,lastSetUptime=0;int64_t startedUs=0,lastTickUs=0,firstTurnFinishedUs=0;float lastControl[3]{};float initialFov=0;std::atomic<double> residualPt{-1};\n int32_t targetIndex=-1;double width=0,height=0,fraction=.18;double errorPitch=0,errorYaw=0,stepPitch=0,stepYaw=0;\n bool requestTarget(int64_t now,int32_t index,double w,double h,double f,double degrees=20,unsigned duration=200){if(index<0||!std::isfinite(w)||!std::isfinite(h)||!std::isfinite(f)||w<=h||h<=0||f<.05||f>.45||now<0)return false;auto expected=AnglePhase::Idle;if(!phase.compare_exchange_strong(expected,AnglePhase::Arming))return false;requestedUs=now;maxDegrees=tuneDegrees(degrees);durationMs=tuneDuration(duration);targetIndex=index;width=w;height=h;fraction=f;phase.store(AnglePhase::Requested,std::memory_order_release);return true;}\n bool request(int64_t now){auto expected=AnglePhase::Idle;if(now<0||!phase.compare_exchange_strong(expected,AnglePhase::Arming))return false;requestedUs=now;phase.store(AnglePhase::Requested,std::memory_order_release);return true;}\n bool fresh(int64_t now)const{return now>=requestedUs&&now-requestedUs<=500000;}\