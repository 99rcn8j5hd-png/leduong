            "src/esp_menu.hpp": "#pragma once\n\n@interface ZKESPMenu : UIView\n@property(nonatomic, strong) UIScrollView *body;\n@property(nonatomic, strong) UIButton *collapseButton;\n@property(nonatomic) BOOL collapsed;\n- (void)constrainToWindow;\n@end\n\n@implementation ZKESPMenu\n- (void)constrainToWindow {\n UIWindow *window = self.window;\n if (!window) return;\n CGRect area = UIEdgeInsetsInsetRect(window.bounds, window.safeAreaInsets);\n CGRect frame = self.frame;\n frame.size.height = self.collapsed ? 36 : std::min<CGFloat>(382, CGRectGetHeight(area));\n frame.origin.x = std::clamp(frame.origin.x, CGRectGetMinX(area),\n     std::max(CGRectGetMinX(area), CGRectGetMaxX(area) - CGRectGetWidth(frame)));\n frame.origin.y = std::clamp(frame.origin.y, CGRectGetMinY(area),\n     std::max(CGRectGetMinY(area), CGRectGetMaxY(area) - CGRectGetHeight(frame)));\n if (!CGRectEqualToRect(self.frame, frame)) self.frame = frame;\n self.body.frame = CGRectMake(0, 36, CGRectGetWidth(frame),\n     std::max<CGFloat>(0, CGRectGetHeight(frame) - 36));\n}\n- (void)safeAreaInsetsDidChange {\n [super safeAreaInsetsDidChange];\n [self constrainToWindow];\n}\n- (void)moveMenu:(UIPanGestureRecognizer *)gesture {\n UIWindow *window = self.window;\n if (!window) return;\n CGPoint delta = [gesture translationInView:window];\n self.center = CGPointMake(self.center.x + delta.x, self.center.y + delta.y);\n [gesture setTranslation:CGPointZero inView:window];\n [self constrainToWindow];\n}\n- (void)toggleMenu {\n self.collapsed = !self.collapsed;\n self.body.hidden = self.collapsed;\n [self.collapseButton setTitle:self.collapsed ? @\"+\" : @\"\u2212\" forState:UIControlStateNormal];\n self.collapseButton.accessibilityLabel = self.collapsed ? @\"M\u1edf menu ESP\" : @\"Thu g\u1ecdn menu ESP\";\n [self constrainToWindow];\n}\n@end\n\nstatic ZKESPMenu *espMenu = nil;\n\nstatic void placeEspControl(UIView *control, UIScrollView *body, CGRect frame) {\n [control removeFromSuperview];\n control.tran