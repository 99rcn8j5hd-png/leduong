            "src/vng07/LivePose.h": "#include \"GameOffsets.h\"\n#pragma once\n#include \"Bones.h\"\n#include <unordered_map>\nnamespace PILive {\nnamespace O=PIGame;\nstruct Candidate { int Offset=0,Count=0;bool Pair=false,Metadata=false,Base=false;double Score=0; };\nstruct Result { PIBones::Pose Pose;PIBones::Metadata Metadata;int Offset=0;bool Inferred=false;std::vector<Candidate> Candidates;std::string CacheError;int CacheCount=0; };\ninline bool Shape(const PIBones::Pose& P){\n    if(!P.Stable||P.Values.size()<8||P.Values.size()>1024)return false;\n    size_t Good=0;\n    for(const auto& T:P.Values){\n        if(!PIBones::Valid(T))continue;\n        double Norm=0;for(float V:T.Rotation)Norm+=V*V;\n        bool Scale=true;for(float V:T.Scale)if(std::abs(V)>100)Scale=false;\n        if(Norm>=0.8&&Norm<=1.2&&Scale)++Good;\n    }\n    return Good*100>=P.Values.size()*95;\n}\ntemplate<class Read,class Lookup> Result Probe(Read R,Lookup Name,uintptr_t Mesh,uintptr_t Asset,uintptr_t Skeleton){\n    Result Out;Out.Pose=PIBones::ReadPose(R,Mesh+O::Mesh::CachedComponentPose);\n    Out.CacheError=Out.Pose.Error;Out.CacheCount=Out.Pose.Header.Count;\n    std::vector<std::pair<uintptr_t,size_t>> Regions;\n    if(Asset)Regions.emplace_back(Asset,O::Mesh::AssetSize);\n    if(Skeleton)Regions.emplace_back(Skeleton,O::Mesh::SkeletonSize);\n    if(Shape(Out.Pose)){Out.Offset=O::Mesh::CachedComponentPose;Out.Metadata=PIBones::FindMetadata(R,Name,Regions,Out.Pose.Header.Count);return Out;}\n    Out.Pose={};Out.Pose.Error=\"no_valid_live_pose\";\n    std::unordered_map<int,PIBones::Metadata> Trees;\n    double Best=-1;\n    for(int Off=int(O::Mesh::ScanStart);Off+16<=int(O::Mesh::ComponentSize);Off+=8){\n        PIBones::Array H{};\n        if(!R(Mesh+Off,&H,sizeof(H))||!PIBones::ValidArray(H)||H.Count<8||H.Count>1024||H.Data%16)continue;\n        auto Pose=PIBones::ReadPose(R,Mesh+Off);if(!Shape(Pose))continue;\n        auto It=Trees.find(H.Count);\n        if(It==Trees.end())It=Trees.emplace(H.Count,PIBones::FindMetadata(R,Name,Regions,H.Count)).first;\n        bool Pair=false;\n        for(int Delta:{-16,16}){\n            if(Off+Delta<int(O::Mesh::ScanStart)||Off+Delta+16>int(O::Mesh::ComponentSize))continue;\n            PIBones::Array Other{};\n            if(R(Mesh+Off+Delta,&Other,sizeof(Other))&&Other.Count==H.Count&&Other.Data!=H.Data&&PIBones::ValidArray(Other))\n                if(Shape(PIBones::ReadPose(R,Mesh+Off+Delta)))Pair=true;\n        }\n        Candidate C{Off,H.Count,Pair,It->second.At&&!It->second.Ambiguous,Off<int(O::Mesh::NativeBaseSize),0};\n        C.Score=(C.Base?0.5:0.1)+(C.Pair?0.3:0)+(C.Metadata?0.2:0);Out.Candidates.push_back(C);\n        // Only infer component-space for arrays in the native SkinnedMesh base\n        // with a matching validated reference tree. Extended arrays stay evidence.\n        if(C.Base&&C.Metadata&&C.Score>Best){Best=C.Score;Out.Pose=std::move(Pose);Out.Metadata=It->second;Out.Offset=Off;Out.Inferred=true;}\n    }\n    return Out;\n}\n}\n",
            "src/vng07/LivePoseAdapter.h": "#pragma once\nstatic PILive::Result LiveMeshPose(uintptr_t Mesh)\n{\n    struct Choice{uintptr_t Asset=0;unsigned Epoch=0;PILive::Result Last;std::chrono::steady_clock::time_point Attempt;};\n    static std::unordered_map<uintptr_t,Choice> Choices;\n    const uintptr_t Asset=Mesh?Ptr(Mesh+O::Mesh::Asset):0,Skeleton=Asset?Ptr(Asset+O::Mesh::Skeleton):0;\n    auto It=Choices.find(Mesh);\n    const auto Now=std::chrono::steady_clock::now();\n    if(!Mesh){PILive::Result R;R.Pose.Error=\"no_mesh\";return R;}\n    if(It!=Choices.end()&&It->second.Asset==Asset&&It->second.Epoch==DiscoverGeneration&&\n       !It->second.Last.Offset&&Now-It->second.Attempt<std::chrono::seconds(3))return It->second.Last;\n    if(It!=Choices.end()&&It->second.Asset==Asset&&It->second.Epoch==DiscoverGeneration&&It->second.Last.Offset){\n        auto P=PIBones::ReadPose(Read,Mesh+It->second.Last.Offset);\n        if(PILive::Shape(P)&&P.Header.Count==It->second.Last.Pose.Header.Count){auto R=It->second.Last;R.Pose=std::move(P);return R;}\n    }\n    auto Result=PILive::Probe(Read,[](int Index){return PINames::Lookup(Read,Names,Index);},Mesh,Asset,Skeleton);\n    if(Choices.size()>=128&&It==Choices.end())Choices.clear();\n    Choices[Mesh]={Asset,DiscoverGeneration,Result,Now};\n    return Result;\n}\n",
            "src/vng07/Names.h": "#include \"GameOffsets.h\"\n#pragma once\n#include <cstdint>\n#include <string>\n#include <unordered_set>\n\nnamespace PINames\n{\nnamespace O=PIGame;\ninline bool ValidString(int Count, int Capacity)\n{ return Count >= 0 && Count <= 256 && Capacity >= Count && Capacity <= 4096; }\n\ntemplate<class Reader>\nstd::string Lookup(Reader Read, uintptr_t Table, int Index)\n{\n    if (!Table || Index < 0 || Index >= 0x4000000) return {};\n    uintptr_t Chunk = 0, Entry = 0;\n    if (!Read(Table + uintptr_t(Index / O::Names::ElementsPerChunk) * 8, &Chunk, 8) || !Chunk) return {};\n    if (!Read(Chunk + uintptr_t(Index % O::Names::ElementsPerChunk) * 8, &Entry, 8) || !Entry) return {};\n    uint32_t Packed = 0;\n    if (!Read(Entry + O::Names::PackedIndex, &Packed, 4)) return {};\n    const bool Wide = (Packed & 1) != 0;\n    std::string Out;\n    for (size_t I = 0; I < 128; ++I)\n    {\n        uint16_t C = 0;\n        if (!Read(Entry + O::Names::Characters + I * (Wide ? 2 : 1), &C, Wide ? 2 : 1)) return {};\n        if (!C) return Out;\n        if (C < 32 || C > 126) return {};\n        Out.push_back(static_cast<char>(C));\n    }\n    return {};\n}\n\ntemplate<class Reader>\nuintptr_t Resolve(Reader Read, uintptr_t Root, std::unordered_set<uintptr_t>& Seen, unsigned Depth = 0)\n{\n    if (Root < 0x10000 || Root % 8 || Depth > 16 || Seen.size() >= 48 || !Seen.insert(Root).second) return 0;\n    if (Lookup(Read, Root, 0) == \"None\") return Root;\n    for (uintptr_t Offset : {uintptr_t(0), O::Names::Manager})\n    {\n        uintptr_t Next = 0;\n        if (Read(Root + Offset, &Next, 8))\n            if (uintptr_t Table = Resolve(Read, Next, Seen, Depth + 1)) return Table;\n    }\n    int32_t Header = 0; uintptr_t Next = 0;\n    if (Read(Root, &Header, 4) && Header >= 103 && Header <= 148 && (Header - 100) % 3 == 0 && Read(Root + O::Names::LegacyNext, &Next, 8))\n    {\n        bool Good = true;\n        for (int I = 1; I < (Header - 100) / 3; ++I)\n            if (!Read(Next, &Next, 8)) { Good = false; break; }\n        if (Good) return Resolve(Read, Next, Seen, Depth + 1);\n    }\n    return 0;\n}\n}\n",
            "src/vng07/OverlayAdapter.h": "#pragma once\n// Included inside PIBackend. The renderer receives normalized viewport points.\nstatic bool SceneTransform(uintptr_t Component,PIProjection::Transform& Out,\n    std::unordered_set<uintptr_t>& Seen,unsigned Depth=0)\n{\n    using namespace PIProjection;\n    if(!Component||Depth>24||!Seen.insert(Component).second)return false;\n    float Values[9]{};uint8_t AbsoluteLocation=0,AbsoluteOther=0;\n    if(!Read(Component+O::Scene::RelativeLocation,Values,3*sizeof(float))||\n       !Read(Component+O::Scene::RelativeRotation,Values+3,3*sizeof(float))||\n       !Read(Component+O::Scene::RelativeScale,Values+6,3*sizeof(float))||\n       !Get(Component+O::Scene::AbsoluteLocationFlags,AbsoluteLocation)||!Get(Component+O::Scene::AbsoluteOtherFlags,AbsoluteOther))return false;\n    Vec Position{Values[0],Values[1],Values[2]},Angles{Values[3],Values[4],Values[5]},Scale3D{Values[6],Values[7],Values[8]};\n    if(!Finite(Position)||!Finite(Angles)||!Finite(Scale3D))return false;\n    Out={Position,Euler(Angles),Scale3D};\n    const uintptr_t Parent=Ptr(Component+O::Scene::AttachParent);\n    if(!Parent)return true;\n    if((AbsoluteLocation&O::Scene::AbsoluteLocationMask)&&(AbsoluteOther&(O::Scene::AbsoluteRotationMask|O::Scene::AbsoluteScaleMask))==(O::Scene::AbsoluteRotationMask|O::Scene::AbsoluteScaleMask))return true;\n    int Socket=0;if(!Get(Component+O::Scene::AttachSocketName,Socket))return false;\n    if(Socket!=0)return false; // A socket-relative transform needs a verified socket pose.\n    Transform ParentWorld;\n    if(!SceneTransform(Parent,ParentWorld,Seen,Depth+1))return false;\n    if(!(AbsoluteLocation&O::Scene::AbsoluteLocationMask))Out.Translation=PIProjection::Point(ParentWorld,Position);\n    if(!(AbsoluteOther&O::Scene::AbsoluteRotationMask))Out.Orientation=Combine(ParentWorld.Orientation,Out.Orientation);\n    if(!(AbsoluteOther&O::Scene::AbsoluteScaleMask))Out.Scale3D=Mul(ParentWorld.Scale3D,Scale3D);\n    return true;\n}\nstatic NSDictionary* NearbyFrame(double Width,double Height,bool DrawBones,bool ShowTeam,double MaxMeters,int AimJoint)\n{\n    using namespace PIProjection;\n    BeginAimFrame();\n    RefreshCharacterCache();\n    auto Empty=[](NSString* Status)->NSDictionary*{return @{@\"status\":Status,@\"targets\":@[]};};\n    if(AimJoint!=0&&AimJoint!=1)return Empty(@\"\u0110i\u1ec3m ng\u1eafm kh\u00f4ng h\u1ee3p l\u1ec7.\");\n    if(!Names||!Local)return Empty(@\"Ch\u01b0a t\u00ecm \u0111\u01b0\u1ee3c player/camera. M\u1edf menu \u2192 T\u00ecm nh\u00e2n v\u1eadt xung quanh.\");\n    const uintptr_t Controller=Ptr(Local+O::LocalPlayer::Controller),CameraManager=Controller?Ptr(Controller+O::Controller::CameraManager):0;\n    if(!CameraManager)return Empty(@\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c camera hi\u1ec7n t\u1ea1i. Th\u1eed t\u00ecm l\u1ea1i sau khi v\u00e0o game.\");\n    float Location[3]{},Angles[3]{},FOV=0,Aspect=0;uint8_t Flags=0,Mode=0;\n    const uintptr_t POV=CameraManager+O::Camera::Cache+O::Camera::POV;\n    if(!Read(POV+O::Camera::Location,Location,sizeof(Location))||!Read(POV+O::Camera::Rotation,Angles,sizeof(Angles))||!Get(POV+O::Camera::FOV,FOV)||!Get(POV+O::Camera::Aspect,Aspect)||!Get(POV+O::Camera::ConstrainAspectFlags,Flags)||!Get(POV+O::Camera::ProjectionMode,Mode)||Mode!=0||!std::isfinite(FOV)||FOV<=1||FOV>=179)\n        return Empty(@\"CameraCache ch\u01b0a h\u1ee3p l\u1ec7 ho\u1eb7c kh\u00f4ng ph\u1ea3i camera ph\u1ed1i c\u1ea3nh.\");\n    Vec Camera{Location[0],Location[1],Location[2]},ViewAngles{Angles[0],Angles[1],Angles[2]};\n    if(!Finite(Camera)||!Finite(ViewAngles))return Empty(@\"T\u1ecda \u0111\u1ed9/g\u00f3c camera ch\u01b0a h\u1ee3p l\u1ec7.\");\n    const auto View=Euler(ViewAngles);\n    uintptr_t Own=Ptr(Controller+O::Controller::AcknowledgedPawn);if(!Character(Own))Own=Ptr(Controller+O::Controller::STExtraBaseCharacter);if(!Character(Own))Own=0;\n    const uintptr_t OwnLevel=Own?Ptr(Own+O::Object::Outer):Ptr(Controller+O::Object::Outer);\n    const uintptr_t OwnWorld=OwnLevel?Ptr(OwnLevel+O::Object::Outer):0;\n    int OwnTeam=0;const bool HasOwnTeam=Own&&Get(Own+O::Character::TeamID,OwnTeam)&&OwnTeam>0;\n    if(!ShowTeam&&!HasOwnTeam)return Empty(@\"Ch\u01b0a x\u00e1c minh \u0111\u1ed9i local; \u0111ang \u1ea9n ESP nh\u00e2n v\u1eadt. Qu\u00e9t l\u1ea1i khi v\u00e0o tr\u1eadn.\");\n    uint32_t OwnKey=0;const bool HasOwnKey=Get(Controller+O::Controller::PlayerKey,OwnKey)&&OwnKey!=0;\n    if(!Own&&!HasOwnKey)return Empty(@\"Ch\u01b0a x\u00e1c \u0111\u1ecbnh \u0111\u01b0\u1ee3c player local \u0111\u1ec3 lo\u1ea1i b\u1ea3n th\u00e2n. Th\u1eed t\u00ecm l\u1ea1i sau khi game t\u1ea3i xong.\");\n    Vec Origin=Camera;\n    if(!Own)return Empty(@\"Ch\u01b0a x\u00e1c minh v\u1ecb tr\u00ed local \u0111\u1ec3 \u0111o kho\u1ea3ng c\u00e1ch.\");\n    {Transform T;std::unordered_set<uintptr_t> Seen;\n     if(!SceneTransform(Ptr(Own+O::Actor::RootComponent),T,Seen))return Empty(@\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c v\u1ecb tr\u00ed local; ch\u01b0a t\u00ednh ph\u1ea1m vi.\");\n     Origin=T.Translation;}\n    struct Target{uintptr_t Pawn;Transform World;double Distance;bool SameTeam;};\n    std::vector<Target> Nearby;\n    for(uintptr_t P:Characters){\n        if(P==Own||!Character(P))continue;\n        uint32_t Key=0;if(HasOwnKey&&Get(P+O::Character::PlayerKey,Key)&&Key==OwnKey)continue;\n        const uintptr_t Level=Ptr(P+O::Object::Outer);\n        if(!OwnLevel||!Level||(Level!=OwnLevel&&(!OwnWorld||Ptr(Level+O::Object::Outer)!=OwnWorld)))continue;\n        int Team=0;const bool TeamKnown=Get(P+O::Character::TeamID,Team)&&Team>0;\n        if(!ShowTeam&&!TeamKnown)continue;\n        const bool Same=HasOwnTeam&&TeamKnown&&Team==OwnTeam;\n        if(Same&&!ShowTeam)continue;\n        uint8_t Dead=0;float Health=0;\n        if(!Get(P+O::Character::Dead,Dead)||(Dead&O::Character::DeadMask)||\n           !Get(P+O::Character::Health,Health)||!std::isfinite(Health)||Health<=0)continue;\n        Transform T;std::unordered_set<uintptr_t> Seen;if(!SceneTransform(Ptr(P+O::Actor::RootComponent),T,Seen))continue;\n        Vec D=Sub(T.Translation,Origin);double Distance=sqrt(Dot(D,D))/100;\n        if(!std::isfinite(Distance)||Distance>MaxMeters)continue;\n        Nearby.push_back({P,T,Distance,Same});\n    }\n    std::sort(Nearby.begin(),Nearby.end(),[](const Target& A,const Target& B){return A.Distance<B.Distance;});\n    static std::unordered_map<uintptr_t,std::pair<size_t,PIStyle::Body>> BodyPlans;\n    static unsigned BodyGeneration=0;\n    if(BodyGeneration!=DiscoverGeneration){BodyPlans.clear();BodyGeneration=DiscoverGeneration;}\n    NSMutableArray* Targets=[NSMutableArray array];NSMutableArray* EdgeTargets=[NSMutableArray array];NSUInteger NamedSkeletons=0,ReadableSkeletons=0,InferredSkeletons=0;\n    for(size_t N=0;N<Nearby.size()&&Targets.count<64;++N){\n        const auto& T=Nearby[N];auto Anchor=Project(T.World.Translation,Camera,View,FOV,Width,Height,Aspect,Flags&O::Camera::ConstrainAspectMask);\n        auto AddEdge=[&]{\n            if(EdgeTargets.count>=64)return;\n            const auto E=EdgeIndicator(T.World.Translation,Camera,View,Width,Height,Anchor);\n            if(E.Inside)[EdgeTargets addObject:@{@\"id\":Hex(T.Pawn),@\"ray_x\":@(E.X),@\"ray_y\":@(E.Y),@\"ray_valid\":@YES,@\"edge\":@YES,@\"aim_selected\":@(T.Pawn==AimLockedPawn)}];\n        };\n        if(!Anchor.InFront){AddEdge();continue;}\n        auto Ray=Anchor;\n        NSMutableArray* Points=[NSMutableArray array];NSMutableArray* Edges=[NSMutableArray array];\n        NSMutableDictionary* PoseInfo=[@{@\"status\":@\"disabled\"} mutableCopy];\n        if(DrawBones){\n            const uintptr_t Mesh=Ptr(T.Pawn+O::Character::Mesh);\n            const auto Live=LiveMeshPose(Mesh);\n            const auto& Pose=Live.Pose;\n            NSMutableArray* Candidates=[NSMutableArray array];\n            for(const auto& C:Live.Candidates)[Candidates addObject:@{@\"offset\