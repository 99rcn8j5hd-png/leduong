# Complete source snapshot; no dependency on uploaded companion files.
name: Build ZKProbe R70 Read Only Angle Measurement Intel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Prepare complete source snapshot
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          sources=json.loads(r'''{
            "build.sh": "#!/bin/bash\nset -euo pipefail\ncd \"$(dirname \"$0\")\"\nmkdir -p build artifacts\nSDK=$(xcrun --sdk iphoneos --show-sdk-path)\nfor arch in arm64 arm64e; do\n  mkdir -p \"build/$arch\"\n  for source in src/probe.mm src/character_overlay.mm src/vng07/Backend.mm src/vng07/OverlayView.mm; do\n    unit=$(basename \"$source\" .mm)\n    xcrun clang++ -isysroot \"$SDK\" -arch \"$arch\" -miphoneos-version-min=15.0 -std=c++17 -O2 -fobjc-arc -Isrc -c \"$source\" -o \"build/$arch/$unit.o\"\n  done\n  xcrun clang++ -isysroot \"$SDK\" -arch \"$arch\" -miphoneos-version-min=15.0 -dynamiclib \"build/$arch/\"*.o -framework Foundation -framework UIKit -framework QuartzCore -framework CoreGraphics -Wl,-install_name,@rpath/ZKProbe.dylib -o \"build/$arch/ZKProbe.dylib\"\ndone\nxcrun lipo -create build/arm64/ZKProbe.dylib build/arm64e/ZKProbe.dylib -output artifacts/ZKProbe.dylib\nldid -S artifacts/ZKProbe.dylib\nxcrun lipo -info artifacts/ZKProbe.dylib\nshasum -a 256 artifacts/ZKProbe.dylib > artifacts/SHA256.txt\n",
            "src/character_overlay.h": "#pragma once\n#import <UIKit/UIKit.h>\n// Main-thread entry point; no independent constructor or menu.\nvoid ZKAttachCharacterOverlay(UIWindow *window, UIScrollView *body);\n",
            "src/character_overlay.mm": "#import \"character_overlay.h\"\n#import \"vng07/Backend.h\"\n#import \"vng07/OverlayView.h\"\n#import <QuartzCore/QuartzCore.h>\n#import <dispatch/dispatch.h>\n#include <atomic>\n#include <memory>\n#include \"SessionPolicy.h\"\n#include \"AngleMeasure.h\"\n\n@interface ZKCharacterOverlay : NSObject\n@property(nonatomic,strong) UIView *panel;\n@property(nonatomic,strong) UIButton *measureButton;\n@property(nonatomic,strong) UILabel *measureText;\n@property(nonatomic,strong) UILabel *measureHUD;\n@property(nonatomic,strong) UIButton *toggle;\n@property(nonatomic,strong) UILabel *status;\n@property(nonatomic,strong) UIButton *aimToggle;\n@property(nonatomic,strong) UISlider *radius;\n@property(nonatomic,strong) UISegmentedControl *targetJoint;\n@property(nonatomic,strong) UISlider *range;\n@property(nonatomic,strong) UISlider *strength;\n@property(nonatomic,strong) UILabel *strengthText;\n@property(nonatomic,strong) UILabel *rangeText;\n@property(nonatomic,strong) PVTrainingPlayerOverlayView *overlay;\n@property(nonatomic,strong) CADisplayLink *link;\n@property(nonatomic,strong) dispatch_queue_t queue;\n@property(nonatomic) BOOL busy;\n@property(nonatomic) BOOL discover;\n@property(nonatomic) BOOL ready;\n@property(nonatomic) CFTimeInterval lastRequest;\n@property(nonatomic) CFTimeInterval lastFrame;\n- (void)tick:(CADisplayLink *)sender;\n@end\n\n@implementation ZKCharacterOverlay {\n ZKSession::Policy _session;\n ZKMeasure::Capture _measure;\n std::shared_ptr<std::atomic<bool>> _aimPermit;\n}\n- (instancetype)init {\n if ((self=[super init])) {\n  _queue=dispatch_queue_create(\"zkprobe.character-reader\", DISPATCH_QUEUE_SERIAL);\n  _panel=[[UIView alloc] initWithFrame:CGRectMake(8,4,220,620)];\n  _toggle=[UIButton buttonWithType:UIButtonTypeSystem];\n  _toggle.frame=CGRectMake(0,0,220,34);\n  [_toggle setTitle:@\"B\u1eadt ESP nh\u00e2n v\u1eadt / x\u01b0\u01a1ng\" forState:UIControlStateNormal];\n  [_toggle addTarget:self action:@selector(togglePressed) forControlEvents:UIControlEventTouchUpInside];\n  [_panel addSubview:_toggle];\n  UIButton *rescan=[UIButton buttonWithType:UIButtonTypeSystem];\n  rescan.frame=CGRectMake(0,36,220,30);\n  [rescan setTitle:@\"Qu\u00e9t l\u1ea1i nh\u00e2n v\u1eadt\" forState:UIControlStateNormal];\n  [rescan addTarget:self action:@selector(rescanPressed) forControlEvents:UIControlEventTouchUpInside];\n  [_panel addSubview:rescan];\n  _aimToggle=[UIButton buttonWithType:UIButtonTypeSystem];_aimToggle.frame=CGRectMake(0,68,220,32);\n  [_aimToggle setTitle:@\"Aim nh\u00e2n v\u1eadt: T\u1eaeT\" forState:UIControlStateNormal];\n  [_aimToggle addTarget:self action:@selector(aimPressed) forControlEvents:UIControlEventTouchUpInside];\n  [_panel addSubview:_aimToggle];\n  UILabel *fov=[[UILabel alloc] initWithFrame:CGRectMake(4,102,212,20)];\n  fov.text=@\"B\u00e1n k\u00ednh FOV (\u0111i\u1ec3m m\u00e0n h\u00ecnh)\";fov.font=[UIFont systemFontOfSize:11];fov.textColor=UIColor.whiteColor;[_panel addSubview:fov];\n  _radius=[[UISlider alloc] initWithFrame:CGRectMake(4,126,212,30)];_radius.minimumValue=40;_radius.maximumValue=220;_radius.value=120;[_panel addSubview:_radius];\n  _rangeText=[[UILabel alloc] initWithFrame:CGRectMake(4,160,212,20)];_rangeText.text=@\"Ph\u1ea1m vi \u0111\u1ecdc: 300 m\";\n  _rangeText.font=[UIFont systemFontOfSize:11];_rangeText.textColor=UIColor.whiteColor;[_panel addSubview:_rangeText];\n  _range=[[UISlider alloc] initWithFrame:CGRectMake(4,182,212,30)];_range.minimumValue=100;_range.maximumValue=500;_range.value=300;\n  [_range addTarget:self action:@selector(rangeChanged) forControlEvents:UIControlEventValueChanged];[_panel addSubview:_range];\n  _strengthText=[[UILabel alloc] initWithFrame:CGRectMake(4,216,212,20)];_strengthText.text=@\"H\u1ed7 tr\u1ee3 k\u00e9o t\u00e2m: 300%\";\n  _strengthText.font=[UIFont systemFontOfSize:11];_strengthText.textColor=UIColor.whiteColor;[_panel addSubview:_strengthText];\n  _strength=[[UISlider alloc] initWithFrame:CGRectMake(4,238,212,30)];_strength.minimumValue=0;_strength.maximumValue=3;_strength.value=3;\n  [_strength addTarget:self action:@selector(strengthChanged) forControlEvents:UIControlEventValueChanged];[_panel addSubview:_strength];\n  UILabel *jointLabel=[[UILabel alloc] initWithFrame:CGRectMake(4,278,212,20)];\n  jointLabel.text=@\"\u0110i\u1ec3m ng\u1eafm\";jointLabel.font=[UIFont systemFontOfSize:11];jointLabel.textColor=UIColor.whiteColor;[_panel addSubview:jointLabel];\n  _targetJoint=[[UISegmentedControl alloc] initWithItems:@[@\"Ng\u1ef1c\",@\"\u0110\u1ea7u\"]];\n  _targetJoint.frame=CGRectMake(4,300,212,30);_targetJoint.selectedSegmentIndex=1;\n  _targetJoint.selectedSegmentTintColor=UIColor.systemYellowColor;\n  [_targetJoint setTitleTextAttributes:@{NSForegroundColorAttributeName:UIColor.whiteColor} forState:UIControlStateNormal];\n  [_targetJoint setTitleTextAttributes:@{NSForegroundColorAttributeName:UIColor.blackColor} forState:UIControlStateSelected];\n  [_targetJoint addTarget:self action:@selector(targetChanged) forControlEvents:UIControlEventValueChanged];[_panel addSubview:_targetJoint];\n  _measureButton=[UIButton buttonWithType:UIButtonTypeSystem];_measureButton.frame=CGRectMake(4,338,212,32);\n  [_measureButton setTitle:@\"\u0110o g\u00f3c l\u00fac b\u1eafn\" forState:UIControlStateNormal];\n  [_measureButton addTarget:self action:@selector(measurePressed) forControlEvents:UIControlEventTouchUpInside];[_panel addSubview:_measureButton];\n  _measureText=[[UILabel alloc] initWithFrame:CGRectMake(4,374,212,128)];_measureText.font=[UIFont systemFontOfSize:11];_measureText.textColor=UIColor.whiteColor;_measureText.numberOfLines=9;\n  _measureText.text=@\"\u0110o ch\u1ec9 \u0111\u1ecdc \u00b7 t\u1ef1 t\u1eaft Aim\nM\u1edf ng\u1eafm tr\u01b0\u1edbc, \u0111\u1ee9ng y\u00ean \u0111\u1ec3 l\u1ea5y m\u1ed1c.\";[_panel addSubview:_measureText];\n  _measureHUD=[[UILabel alloc] initWithFrame:CGRectMake(12,64,310,112)];_measureHUD.font=[UIFont monospacedDigitSystemFontOfSize:11 weight:UIFontWeightMedium];\n  _measureHUD.numberOfLines=8;_measureHUD.textColor=UIColor.yellowColor;_measureHUD.backgroundColor=[UIColor colorWithWhite:0 alpha:.6];_measureHUD.userInteractionEnabled=NO;_measureHUD.hidden=YES;\n  _status=[[UILabel alloc] initWithFrame:CGRectMake(4,508,212,112)];\n  _status.font=[UIFont systemFontOfSize:10];_status.textColor=UIColor.whiteColor;\n  _status.numberOfLines=7;_status.text=@\"\u1ea8n \u0111\u1ed3ng \u0111\u1ed9i \u00b7 ph\u1ea1m vi 300 m \u00b7 m\u1eb7c \u0111\u1ecbnh t\u1eaft\";\n  [_panel addSubview:_status];\n  [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(pauseSession)\n      name:UIApplicationWillResignActiveNotification object:nil];\n  [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(resumeSession)\n      name:UIApplicationDidBecomeActiveNotification object:nil];\n }\n return self;\n}\n- (void)updateMeasureDisplay {\n NSString* Text=nil;\n switch(_measure.phase){\n  case ZKMeasure::Phase::Idle:break;\n  case ZKMeasure::Phase::Baseline:Text=@\"\u0110\u1ee8NG Y\u00caN \u00b7 \u0111ang l\u1ea5y m\u1ed1c 0,5 s\nCh\u01b0a b\u1eafn, kh\u00f4ng k\u00e9o m\u00e0n h\u00ecnh.\";break;\n  case ZKMeasure::Phase::Recording:Text=[NSString stringWithFormat:@\"GI\u1eee B\u1eaeN \u00b7 %.1f s \u00b7 %u m\u1eabu\nCam l\u00ean t\u1ed1i \u0111a %.3f\u00b0\nCtrl l\u00ean t\u1ed1i \u0111a %.3f\u00b0\nCh\u00eanh cam\u2212ctrl: %.3f\u2026%.3f\u00b0\nNh\u1ea3 b\u1eafn r\u1ed3i b\u1ea5m D\u1eebng \u0111o.\",_measure.last-_measure.recordStart,_measure.count,_measure.cameraUp,_measure.controlUp,_measure.residualLow,_measure.residualUp];break;\n  case ZKMeasure::Phase::Done:Text=[NSString stringWithFormat:@\"\u0110O XONG \u00b7 %.1f s \u00b7 %u m\u1eabu\nCam l\u00ean t\u1ed1i \u0111a %.3f\u00b0\nCtrl l\u00ean t\u1ed1i \u0111a %.3f\u00b0\nCh\u00eanh cam\u2212ctrl: %.3f\u2026%.3f\u00b0\nCh\u01b0a x\u00e1c minh \u0111\u00e2y l\u00e0 recoil s\u00fang.\",_measure.last-_measure.recordStart,_measure.count,_measure.cameraUp,_measure.controlUp,_measure.residualLow,_measure.residualUp];break;\n  case ZKMeasure::Phase::Failed:Text=[NSString stringWithFormat:@\"\u0110o ch\u01b0a h\u1ee3p l\u1ec7: %s\nGi\u1eef nguy\u00ean ng\u1eafm, \u0111\u1ee9ng y\u00ean r\u1ed3i \u0111o l\u1ea1i.\",_measure.reason];break;\n  case ZKMeasure::Phase::Canceled:Text=@\"\u0110\u00e3 h\u1ee7y \u0111o; b\u1ea5m \u0110o g\u00f3c l\u00fac b\u1eafn \u0111\u1ec3 l\u00e0m l\u1ea1i.\";break;\n }\n if(Text)self.measureText.text=Text;\n self.measureHUD.text=Text;self.measureHUD.hidden=Text==nil;\n [self.measureButton setTitle:_measure.active()?@\"D\u1eebng \u0111o\":@\"\u0110o g\u00f3c l\u00fac b\u1eafn\" forState:UIControlStateNormal];\n}\n- (void)measurePressed {\n if(_measure.active()){\n  if(_measure.phase==ZKMeasure::Phase::Recording)_measure.finish();else _measure.cancel();\n  [self updateMeasureDisplay];return;\n }\n if(!_session.enabled)[self togglePressed];\n if(!_session.canRead()){self.measureText.text=@\"M\u1edf game v\u00e0 b\u1eadt ESP tr\u01b0\u1edbc khi \u0111o.\";return;}\n if(_aimPermit)_aimPermit->store(false,std::memory_order_release);\n _session.aim=false;\n [self.aimToggle setTitle:@\"Aim nh\u00e2n v\u1eadt: T\u1eaeT\" forState:UIControlStateNormal];\n _session.refresh();_measure.start();[self updateMeasureDisplay];\n}\n- (void)consumeMeasurement:(NSDictionary*)Value {\n if(!_measure.active())return;\n if(![Value[@\"ok\"] boolValue]){_measure.fail(\"camera_read_failed\");[self updateMeasureDisplay];return;}\n NSArray* A=Value[@\"angles\"];\n if(A.count!=4){_measure.fail(\"invalid_angle_sample\");[self updateMeasureDisplay];return;}\n ZKMeasure::Sample Sample;\n Sample.time=[Value[@\"time\"] doubleValue];Sample.fov=[Value[@\"fov\"] doubleValue];\n Sample.controller=[Value[@\"controller\"] unsignedLongLongValue];Sample.camera=[Value[@\"camera\"] unsignedLongLongValue];\n for(unsigned I=0;I<4;++I)Sample.angle[I]=[A[I] doubleValue];\n _measure.add(Sample);[self updateMeasureDisplay];\n}\n- (void)stop {\n _measure.cancel();[self updateMeasureDisplay];\n if(_aimPermit)_aimPermit->store(false,std::memory_order_release);\n [self.aimToggle setTitle:@\"Aim nh\u00e2n v\u1eadt: T\u1eaeT\" forState:UIControlStateNormal];\n _session.stop();self.ready=NO;\n [self.link invalidate];self.link=nil;\n self.overlay.frameData=nil;self.overlay.hidden=YES;\n [self.toggle setTitle:@\"B\u1eadt ESP nh\u00e2n v\u1eadt / x\u01b0\u01a1ng\" forState:UIControlStateNormal];\n self.status.text=@\"\u0110\u00e3 t\u1eaft ESP nh\u00e2n v\u1eadt\";\n}\n- (void)rangeChanged {self.rangeText.text=[NSString stringWithFormat:@\"Ph\u1ea1m vi \u0111\u1ecdc: %.0f m\",self.range.value];}\n- (void)strengthChanged {self.strengthText.text=[NSString stringWithFormat:@\"H\u1ed7 tr\u1ee3 k\u00e9o t\u00e2m: %.0f%%\",self.strength.value*100];}\n- (void)targetChanged {\n // Cancel pending writes for the old joint before accepting another frame.\n if(_aimPermit)_aimPermit->store(false,std::memory_order_release);\n _session.refresh();\n _aimPermit=std::make_shared<std::atomic<bool>>(_session.canAim());\n self.lastFrame=0;self.overlay.frameData=nil;\n self.status.text=self.targetJoint.selectedSegmentIndex==1?@\"\u0110i\u1ec3m ng\u1eafm: \u0110\u1ea7u\":@\"\u0110i\u1ec3m ng\u1eafm: Ng\u1ef1c\";\n}\n- (void)aimPressed {\n if(_measure.active()){self.status.text=@\"D\u1eebng \u0111o tr\u01b0\u1edbc khi b\u1eadt Aim.\";return;}\n if(_session.aim){\n  _session.aim=false;\n  if(_aimPermit)_aimPermit->store(false,std::memory_order_release);\n  [self.aimToggle setTitle:@\"Aim nh\u00e2n v\u1eadt: T\u1eaeT\" forState:UIControlStateNormal];return;\n }\n if(!_session.enabled){self.status.text=@\"B\u1eadt ESP v\u00e0 t\u00ecm nh\u00e2n v\u1eadt tr\u01b0\u1edbc\";return;}\n _session.aim=true;\n _aimPermit=std::make_shared<std::atomic<bool>>(_session.canAim());\n [self.aimToggle setTitle:@\"Aim nh\u00e2n v\u1eadt: B\u1eacT\" forState:UIControlStateNormal];\n}\n- (void)togglePressed {\n if(_session.enabled){[self stop];return;}\n if(!self.overlay.window||UIApplication.sharedApplication.applicationState!=UIApplicationStateActive)return;\n _session.start();self.ready=NO;self.discover=YES;\n self.lastRequest=0;self.lastFrame=0;self.overlay.hidden=YES;\n [self.toggle setTitle:@\"T\u1eaft ESP nh\u00e2n v\u1eadt / x\u01b0\u01a1ng\" forState:UIControlStateNormal];\n self.status.text=@\"\u0110ang t\u00ecm nh\u00e2n v\u1eadt\u2026\";\n [self startDisplayLink];\n}\n- (void)startDisplayLink {\n if(self.link)return;\n self.link=[CADisplayLink displayLinkWithTarget:self selector:@selector(tick:)];\n self.link.preferredFramesPerSecond=60;\n [self.link addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];\n}\n- (void)pauseSession {\n _measure.cancel();[self updateMeasureDisplay];\n if(!_session.pause())return;\n if(_aimPermit)_aimPermit->store(false,std::memory_order_release);\n self.ready=NO;self.discover=YES;self.lastFrame=0;\n [self.link invalidate];self.link=nil;\n self.overlay.frameData=nil;self.overlay.hidden=YES;\n self.status.text=@\"T\u1ea1m d\u1eebng khi game ra n\u1ec1n \u00b7 gi\u1eef tr\u1ea1ng th\u00e1i b\u1eadt\";\n}\n- (void)resumeSession {\n if(UIApplication.sharedApplication.applicationState!=UIApplicationStateActive||!self.overlay.window||!_session.resume())return;\n self.ready=NO;self.discover=YES;self.lastFrame=0;self.lastRequest=0;\n _aimPermit=std::make_shared<std::atomic<bool>>(_session.canAim());\n self.status.text=@\"\u0110ang l\u1ea5y d\u1eef li\u1ec7u m\u1edbi \u0111\u1ec3 ti\u1ebfp t\u1ee5c\u2026\";\n [self startDisplayLink];\n}\n- (void)rescanPressed {\n _measure.cancel();[self updateMeasureDisplay];\n if(_aimPermit)_aimPermit->store(false,std::memory_order_release);\n if(!_session.enabled){[self togglePressed];return;}\n _session.refresh();self.discover=YES;self.ready=NO;self.lastFrame=0;\n _aimPermit=std::make_shared<std::atomic<bool>>(_session.canAim());\n self.overlay.hidden=YES;self.overlay.frameData=nil;\n self.status.text=@\"\u0110ang qu\u00e9t l\u1ea1i\u2026\";\n}\n- (void)tick:(CADisplayLink *)sender {\n (void)sender;\n if(!_session.enabled)return;\n if(UIApplication.sharedApplication.applicationState!=UIApplicationStateActive||!self.overlay.window){[self pauseSession];return;}\n if(!_session.canRead())return;\n const CFTimeInterval now=CACurrentMediaTime();\n if(self.lastFrame&&now-self.lastFrame>0.25){self.overlay.hidden=YES;self.overlay.frameData=nil;}\n [self.overlay displayAtTime:now];\n if(self.busy||(!self.discover&&!self.ready)||now-self.lastRequest<1.0/30.0)return;\n const CGSize size=self.overlay.bounds.size;\n if(size.width<=0||size.height<=0)return;\n const NSUInteger generation=_session.epoch;const BOOL discover=self.discover;\n const BOOL measuring=_measure.active();const auto aimPermit=_aimPermit;const int aimJoint=(int)self.targetJoint.selectedSegmentIndex;const double radius=self.radius.value;const double rangeMeters=self.range.value;const double strength=self.strength.value;\n self.busy=YES;self.discover=NO;self.lastRequest=now;\n dispatch_async(self.queue,^{@autoreleasepool {\n  NSDictionary *snapshot=discover?PIBackend::Snapshot(true,0,false):nil;\n  const BOOL ready=!discover||[snapshot[@\"players\"] isKindOfClass:NSArray.class];\n  NSDictionary *frame=ready?PIBackend::OverlayFrame(size.width,size.height,true,false,rangeMeters,aimJoint):\n      @{@\"status\":snapshot[@\"summary\"]?:@\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c profile nh\u00e2n v\u1eadt\",@\"targets\":@[]};\n  NSDictionary* measured=(ready&&measuring)?PIBackend::MeasurementAngles():nil;\n  NSString *aimStatus=nil;\n  if(ready&&aimPermit&&aimPermit->load())aimStatus=PIBackend::PlayerAim(size.width,size.height,radius,*aimPermit,strength);\n  NSMutableDictionary *shown=[frame mutableCopy];shown[@\"aim_fov_radius\"]=@(radius);\n  shown[@\"aim_joint\"]=@(aimJoint);shown[@\"aim_enabled\"]=@(aimPermit&&aimPermit->load());\n  dispatch_async(dispatch_get_main_queue(),^{\n   self.