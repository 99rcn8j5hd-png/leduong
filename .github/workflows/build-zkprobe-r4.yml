            "src/targeted_objects.hpp": "#pragma once\n#include \"targeted_names.hpp\"\n#include <array>\nnamespace zk {\nstruct ObjectSample { uint32_t index=0; const char *status=\"not_checked\"; char name[65]{},className[65]{}; };\nstruct ArraySnapshot {\n uintptr_t items=0;int32_t capacity=0,count=0;\n static ArraySnapshot decode(const unsigned char *p){ArraySnapshot h;std::memcpy(&h.items,p,8);std::memcpy(&h.capacity,p+8,4);std::memcpy(&h.count,p+12,4);return h;}\n unsigned changes(const ArraySnapshot &b)const{return (items!=b.items?1u:0u)|(capacity!=b.capacity?2u:0u)|(count!=b.count?4u:0u);}\n};\nstruct ObjectResult {ArraySnapshot before{},after{};bool afterRead=false;unsigned headerChanges=0;const char *status=\"not_checked\";int32_t count=0,capacity=0;unsigned valid=0;bool stable=false;ObjectSample sample[16]{};};\ninline bool safeSpan(uintptr_t p,size_t n){return p>=0x10000 && n<=UINTPTR_MAX-p;}\n// Fixed snapshot bound: count growth alone does not extend enumeration.\ninline const char *snapshotPolicy(const ArraySnapshot &fixed,const ArraySnapshot &previous,const ArraySnapshot &now){\n if(!candidatePointer(fixed.items)||fixed.count<=0||fixed.capacity<fixed.count||fixed.capacity>5000000||!safeSpan(fixed.items,size_t(fixed.capacity)*24))return \"invalid_baseline\";\n if(!candidatePointer(now.items)||now.count<=0||now.capacity<now.count||now.capacity>5000000||!safeSpan(now.items,size_t(now.capacity)*24))return \"invalid_current_header\";\n if(now.items!=fixed.items)return \"items_pointer_changed\";\n if(now.capacity!=fixed.capacity)return \"capacity_changed\";\n if(now.count<fixed.count||now.count<previous.count)return \"count_decreased\";\n return \"snapshot_bound_accepted\";\n}\ninline bool snapshotAccepted(const ArraySnapshot &a,const ArraySnapshot &p,const ArraySnapshot &n){return !std::strcmp(snapshotPolicy(a,p,n),\"snapshot_bound_accepted\");}\ntemplate<class Read> struct NameReader {\n Read &read;uintptr_t table;uint32_t count=0;\n struct Entry{uint32_t id=0;char text[65]{};};Entry cache[256]{};unsigned used=0;\n bool init(){int32_t n=0;if(!safeSpan(table,0x404)||!read(table+0x400,&n,4)||n<=0||n>2000000)return false;count=uint32_t(n);return true;}\n bool get(uint32_t id,char out[65]){\n  out[0]=0;if(id>=count)return false;\n  for(unsigned i=0;i<used;++i)if(cache[i].id==id){std::memcpy(out,cache[i].text,65);return true;}\n  if(used==256)used=0;\n  uintptr_t chunk=0,entry=0;uint32_t flags=0;\n  if(!read(table+(id/0x4000)*8,&chunk,8)||!candidatePointer(chunk))return false;\n  uintptr_t slot=chunk+(id%0x4000)*8;\n  if(!safeSpan(chunk,(id%0x4000)*8+8)||!read(slot,&entry,8)||!candidatePointer(entry))return false;\n  if(!read(entry+8,&flags,4)||(flags&1)||!read(entry+12,out,64))return false;\n  size_t n=0;for(;n<64&&out[n];++n)if((unsigned char)out[n]<32||(unsigned char)out[n]>126)return false;\n  if(!n||n==64)return false;\n  out[64]=0;cache[used].id=id;std::memcpy(cache[used++].text,out,65);return true;\n }\n};\nstruct ObjectHead{uintptr_t vtable;uint32_t flags;int32_t index;uintptr_t cls;uint32_t nameId,number;uintptr_t outer;};\nstatic_assert(sizeof(ObjectHead)==40,\"Expected 64-bit UObject header layout\");\ntemplate<class Read> ObjectResult checkObjects(uintptr_t array,uintptr_t names,Read read){\n ObjectResult result;\n if(!candidatePointer(array)){result.status=\"invalid_array_address\";return result;}\n unsigned char header[16]{};uintptr_t items=0;\n if(!safeSpan(array,0x20)||!read(array+0x10,header,16)){result.status=\"array_header_read_failed\";return result;}\n result.before=ArraySnapshot::decode(header);std::memcpy(&items,header,8);std::memcpy(&result.capacity,header+8,4);std::memcpy(&result.count,header+12,4);\n if(!candidatePointer(items)||result.count<=0||result.capacity<result.count||result.capacity>5000000){result.status=\"array_header_invalid\";return result;}\n NameReader<Read> nr{read,names};if(!nr.init()){result.status=\"name_count_invalid\";return result;}\n const unsigned n=unsigned(result.count)<16?unsigned(result.count):16;\n for(unsigned i=0;i<n;++i){\n  auto &s=result.sample[i];s.index=i;s.status=\"item_read_failed\";\n  uintptr_t obj=0;if(!read(items+i*24,&obj,8))continue;\n  if(!obj){s.status=\"empty_slot\";continue;}\n  if(!candidatePointer(obj)){s.status=\"object_pointer_invalid\";continue;}\n  ObjectHead h{};if(!read(obj,&h,sizeof(h))){s.status=\"object_header_read_failed\";continue;}\n  if(h.index!=int32_t(i)||!candidatePointer(h.vtable)||!candidatePointer(h.cls)){s.status=\"object_header_mismatch\";continue;}\n  ObjectHead cl{};if(!read(h.cls,&cl,sizeof(cl))){s.status=\"class_header_read_failed\";continue;}\n  if(cl.index<0||cl.index>=result.count||!candidatePointer(cl.cls)){s.status=\"class_header_mismatch\";continue;}\n  uintptr_t classSlot=0;\n  if(!safeSpan(items,size_t(cl.index)*24+8)||!read(items+size_t(cl.index)*24,&classSlot,8)||classSlot!=h.cls){s.status=\"class_index_mismatch\";continue;}\n  ObjectHead meta{};char metaName[65]{};\n  if(!read(cl.cls,&meta,sizeof(meta))||!nr.get(meta.nameId,metaName)||std::strcmp(metaName,\"Class\")){s.status=\"metaclass_name_mismatch\";continue;}\n  if(!nr.get(h.nameId,s.name)||!nr.get(cl.nameId,s.className)){s.status=\"name_decode_failed\";continue;}\n  s.status=\"index_name_class_matched\";++result.valid;\n }\n unsigned char after[16]{};\n result.afterRead=read(array+0x10,after,16);\n if(result.afterRead){result.after=ArraySnapshot::decode(after);result.headerChanges=result.before.changes(result.after);}\n result.stable=result.afterRead && result.headerChanges==0;\n if(!result.afterRead){result.status=\"array_final_header_unreadable\";return result;}\n result.status=!result.stable?\"array_changed_during_sample\":result.valid>=4?\"object_sample_matched_camera_NOT_checked\":\"object_sample_inconclusive\";\n return result;\n}\n// At most four samples and three pauses. Read failures and invalid layouts are not retried.\ntemplate<class Read,class Wait,class Report>\nObjectResult retryObjects(uintptr_t array