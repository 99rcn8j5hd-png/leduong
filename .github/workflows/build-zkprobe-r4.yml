            "src/vng07/OverlayStyle.h": "#pragma once\n#include <algorithm>\n#include <cmath>\n#include <cstdint>\n#include <string>\n#include <utility>\n#include <vector>\n\nnamespace PIStyle {\ninline std::string Lower(std::string Name) {\n    for(char& C:Name)if(C>='A'&&C<='Z')C=char(C-'A'+'a');\n    return Name;\n}\ninline bool BodyJoint(const std::string& Name) {\n    const auto N=Lower(Name);\n    for(const char* Joint:{\"pelvis\",\"spine_01\",\"spine_02\",\"spine_03\",\"neck_01\",\"head\",\n        \"upperarm_l\",\"lowerarm_l\",\"hand_l\",\"upperarm_r\",\"lowerarm_r\",\"hand_r\",\n        \"thigh_l\",\"calf_l\",\"foot_l\",\"thigh_r\",\"calf_r\",\"foot_r\"})if(N==Joint)return true;\n    return false;\n}\nstruct Body { std::vector<int> Joints;std::vector<std::pair<int,int>> Links;int Head=-1; };\ninline Body Select(const std::vector<std::string>& Names,const std::vector<int32_t>& Parents) {\n    Body B;if(Names.size()!=Parents.size())return B;\n    // Reject malformed/cyclic trees before following ancestors.\n    for(size_t I=0;I<Parents.size();++I)if(Parents[I]<-1||Parents[I]>=int(I))return B;\n    std::vector<bool> Chosen(Names.size());\n    for(size_t I=0;I<Names.size();++I)if(BodyJoint(Names[I])) {\n        Chosen[I]=true;B.Joints.push_back(int(I));if(Lower(Names[I])==\"head\")B.Head=int(I);\n    }\n    for(int I:B.Joints) {\n        int P=Parents[I];while(P>=0&&!Chosen[P])P=Parents[P];\n        if(P>=0)B.Links.emplace_back(I,P);\n    }\n    return B;\n}\nstruct Health { bool Known=false;double Ratio=0,Red=0,Green=0; };\nstruct SkeletonInk { double Radius=0,OutlineRadius=0,Line=0.5;bool Dots=false; };\ninline SkeletonInk Ink(double Height) {\n    SkeletonInk S;\n    if(!std::isfinite(Height)||Height<=0)return S;\n    S.Line=std::clamp(Height*0.006,0.45,1.15);\n    S.Radius=std::clamp(Height*0.008,0.3,1.2);\n    S.OutlineRadius=S.Radius+0.4;S.Dots=Height>=35;\n    return S;\n}\ninline Health HealthBar(double Current,double Maximum) {\n    Health H;if(!std::i