            "src/vng07/PlayerAimAdapter.h": "#pragma once\n// Included inside PIBackend. Only the serial reader queue accesses this state.\nstruct AimCandidate {\n uintptr_t Pawn=0,Mesh=0;uint32_t Key=0;PIProjection::Vec World;\n double X=0,Y=0;\n};\nstatic std::vector<AimCandidate> AimCandidates;\nstatic std::chrono::steady_clock::time_point AimFrameTime;\nstatic uintptr_t AimLockedPawn=0;\nstatic bool AimWriteBlocked=false;\nstatic void BeginAimFrame(){AimCandidates.clear();AimFrameTime=std::chrono::steady_clock::now();}\nstatic NSString* ApplyPlayerAim(double Width,double Height,double Radius,const std::atomic<bool>& Permit) {\n using namespace PIProjection;\n if(!Permit.load(std::memory_order_acquire)){AimLockedPawn=0;return @\"Aim t\u1eaft\";}\n if(AimWriteBlocked)return @\"Aim \u0111\u00e3 d\u1eebng do ch\u01b0a x\u00e1c nh\u1eadn \u0111\u01b0\u1ee3c ghi g\u00f3c; c\u1ea7n Qu\u00e9t l\u1ea1i\";\n const auto Now=std::chrono::steady_clock::now();\n const double Age=std::chrono::duration<double>(Now-AimFrameTime).count();\n if(Age<0||Age>.1||!std::isfinite(Radius)||Radius<20||Radius>300||Width<=0||Height<=0)return @\"Aim: d\u1eef li\u1ec7u c\u0169 ho\u1eb7c FOV kh\u00f4ng h\u1ee3p l\u1ec7\";\n const uintptr_t Controller=Ptr(Local+O::LocalPlayer::Controller);\n if(!Controller||!(Type(Ptr(Controller+O::Object::Class))&4))return @\"Aim: ch\u01b0a x\u00e1c minh controller\";\n uintptr_t Own=Ptr(Controller+O::Controller::AcknowledgedPawn);\n if(!Character(Own))Own=Ptr(Controller+O::Controller::STExtraBaseCharacter);\n int OwnTeam=0;if(!Character(Own)||!Get(Own+O::Character::TeamID,OwnTeam)||OwnTeam<=0)return @\"Aim: ch\u01b0a x\u00e1c minh \u0111\u1ed9i local\";\n const AimCandidate* Choice=nullptr;double Best=Radius*Radius;\n for(const auto& C:AimCandidates){\n  const double DX=(C.X-.5)*Width,DY=(C.Y-.5)*Height,Score=DX*DX+DY*DY;\n  if(Score>Radius*Radius)continue;\n  if(C.Pawn==AimLockedPawn){Choice=&C;break;}\n  if(Score<=Best){Best=Score;Choice=&C;}\n }\n if(!Choi