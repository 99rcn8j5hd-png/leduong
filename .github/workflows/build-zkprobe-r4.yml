            "src/character_overlay.mm": "#import \"character_overlay.h\"\n#import \"vng07/Backend.h\"\n#import \"vng07/OverlayView.h\"\n#import <QuartzCore/QuartzCore.h>\n#import <dispatch/dispatch.h>\n#include <atomic>\n#include <memory>\n\n@interface ZKCharacterOverlay : NSObject\n@property(nonatomic,strong) UIView *panel;\n@property(nonatomic,strong) UIButton *toggle;\n@property(nonatomic,strong) UILabel *status;\n@property(nonatomic,strong) UIButton *aimToggle;\n@property(nonatomic,strong) UISlider *radius;\n@property(nonatomic,strong) PVTrainingPlayerOverlayView *overlay;\n@property(nonatomic,strong) CADisplayLink *link;\n@property(nonatomic,strong) dispatch_queue_t queue;\n@property(nonatomic) BOOL enabled;\n@property(nonatomic) BOOL busy;\n@property(nonatomic) BOOL discover;\n@property(nonatomic) BOOL ready;\n@property(nonatomic) NSUInteger generation;\n@property(nonatomic) CFTimeInterval lastRequest;\n@property(nonatomic) CFTimeInterval lastFrame;\n- (void)tick:(CADisplayLink *)sender;\n@end\n\n@implementation ZKCharacterOverlay {\n std::shared_ptr<std::atomic<bool>> _aimPermit;\n}\n- (instancetype)init {\n if ((self=[super init])) {\n  _queue=dispatch_queue_create(\"zkprobe.character-reader\", DISPATCH_QUEUE_SERIAL);\n  _panel=[[UIView alloc] initWithFrame:CGRectMake(8,4,220,218)];\n  _toggle=[UIButton buttonWithType:UIButtonTypeSystem];\n  _toggle.frame=CGRectMake(0,0,220,34);\n  [_toggle setTitle:@\"B\u1eadt ESP nh\u00e2n v\u1eadt / x\u01b0\u01a1ng\" forState:UIControlStateNormal];\n  [_toggle addTarget:self action:@selector(togglePressed) forControlEvents:UIControlEventTouchUpInside];\n  [_panel addSubview:_toggle];\n  UIButton *rescan=[UIButton buttonWithType:UIButtonTypeSystem];\n  rescan.frame=CGRectMake(0,36,220,30);\n  [rescan setTitle:@\"Qu\u00e9t l\u1ea1i nh\u00e2n v\u1eadt\" forState:UIControlStateNormal];\n  [rescan addTarget:self action:@selector(rescanPressed) forControlEvents:UIControlEventTouchUpInside];\n  [_panel addSubview:rescan];\n  _aimToggle=[UIButton buttonWithType:UIButtonTypeSystem];_aimToggle.frame=CGRectMake(0,68,220,32);\n  [_aimToggle setTitle:@\"Aim nh\u00e2n v\u1eadt: T\u1eaeT\" forState:UIControlStateNormal];\n  [_aimToggle addTarget:self action:@selector(aimPressed) forControlEvents:UIControlEventTouchUpInside];\n  [_panel addSubview:_aimToggle];\n  UILabel *fov=[[UILabel alloc] initWithFrame:CGRectMake(4,102,212,20)];\n  fov.text=@\"B\u00e1n k\u00ednh FOV (\u0111i\u1ec3m m\u00e0n h\u00ecnh)\";fov.font=[UIFont systemFontOfSize:11];fov.textColor=UIColor.whiteColor;[_panel addSubview:fov];\n  _radius=[[UISlider alloc] initWithFrame:CGRectMake(4,126,212,30)];_radius.minimumValue=40;_radius.maximumValue=220;_radius.value=120;[_panel addSubview:_radius];\n  _status=[[UILabel alloc] initWithFrame:CGRectMake(4,162,212,56)];\n  _status.font=[UIFont systemFontOfSize:10];_status.textColor=UIColor.whiteColor;\n  _status.numberOfLines=4;_status.text=@\"\u1ea8n \u0111\u1ed3ng \u0111\u1ed9i \u00b7 ph\u1ea1m vi 300 m \u00b7 m\u1eb7c \u0111\u1ecbnh t\u1eaft\";\n  [_panel addSubview:_status];\n  [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(stop)\n      name:UIApplicationWillResignActiveNotification object:nil];\n }\n return self;\n}\n- (void)stop {\n if(_aimPermit)_aimPermit->store(false,std::memory_order_release);\n [self.aimToggle setTitle:@\"Aim nh\u00e2n v\u1eadt: T\u1eaeT\" forState:UIControlStateNormal];\n self.enabled=NO;self.ready=NO;++self.generation;\n [self.link invalidate];self.link=nil;\n self.overlay.frameData=nil;self.overlay.hidden=YES;\n [self.toggle setTitle:@\"B\u1eadt ESP nh\u00e2n v\u1eadt / x\u01b0\u01a1ng\" forState:UIControlStateNormal];\n self.status.text=@\"\u0110\u00e3 t\u1eaft ESP nh\u00e2n v\u1eadt\";\n}\n- (void)aimPressed {\n if(_aimPermit&&_aimPermit->load()){\n  _aimPermit->store(false,std::memory_order_release);\n  [self.aimToggle setTitle:@\"Aim nh\u00e2n v\u1eadt: T\u1eaeT\" forState:UIControlStateNormal];return;\n }\n if(!self.enabled){self.status.text=@\"B\u1eadt ESP v\u00e0 t\u00ecm nh\u00e2n v\u1eadt tr\u01b0\u1edbc\";return;}\n _aimPermit=std::make_shared<std::atomic<bool>>(true);\n [self.aimToggle setTitle:@\"Aim nh\u00e2n v\u1eadt: B\u1eacT\" forState:UIControlStateNormal];\n}\n- (void)togglePressed {\n if(self.enabled){[self stop];return;}\n if(!self.overlay.window||UIApplication.sharedApplication.applicationState!=UIApplicationStateActive)return;\n self.enabled=YES;self.ready=NO;self.discover=YES;++self.generation;\n self.lastRequest=0;self.lastFrame=0;self.overlay.hidden=YES;\n [self.toggle setTitle:@\"T\u1eaft ESP nh\u00e2n v\u1eadt / x\u01b0\u01a1ng\" forState:UIControlStateNormal];\n self.status.text=@\"\u0110ang t\u00ecm nh\u00e2n v\u1eadt\u2026\";\n self.link=[CADisplayLink displayLinkWithTarget:self selector:@selector(tick:)];\n self.link.preferredFramesPerSecond=60;\n [self.link addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];\n}\n- (void)rescanPressed {\n if(_aimPermit)_aimPermit->store(false,std::memory_order_release);\n [self.aimToggle setTitle:@\"Aim nh\u00e2n v\u1eadt: T\u1eaeT\" forState:UIControlStateNormal];\n if(!self.enabled){[self togglePressed];return;}\n ++self.generation;self.discover=YES;self.ready=NO;self.lastFrame=0;\n self.overlay.hidden=YES;self.overlay.frameData=nil;\n self.status.text=@\"\u0110ang qu\u00e9t l\u1ea1i\u2026\";\n}\n- (void)tick:(CADisplayLink *)sender {\n (void)sender;\n if(!self.enabled)return;\n if(UIApplication.sharedApplication.applicationState!=UIApplicationStateActive||!self.overlay.window){[self stop];return;}\n const CFTimeInterval now=CACurrentMediaTime();\n if(self.lastFrame&&now-self.lastFrame>0.25){self.overlay.hidden=YES;self.overlay.frameData=nil;}\n [self.overlay displayAtTime:now];\n if(self.busy||(!self.discover&&!self.ready)||now-self.lastRequest<1.0/30.0)return;\n const CGSize size=self.overlay.bounds.size;\n if(size.width<=0||size.height<=0)return;\n const NSUInteger generation=self.generation;const BOOL discover=self.discover;\n const auto aimPermit=_aimPermit;const double radius=self.radius.value;\n self.busy=YES;self.discover=NO;self.lastRequest=now;\n dispatch_async(self.queue,^{@autoreleasepool {\n  NSDictionary *snapshot=discover?PIBackend::Snapshot(true,0,false):nil;\n  const BOOL ready=!discover||[snapshot[@\"players\"] isKindOfClass:NSArray.class];\n  NSDictionary *frame=ready?PIBackend::OverlayFrame(size.width,size.height,true,false,300):\n      @{@\"status\":snapshot[@\"summary\"]?:@\"Ch\u01b0a \u0111\u1ecdc \u0111\u01b0\u1ee3c profile nh\u00e2n v\u1eadt\",@\"targets\":@[]};\n  NSString *aimStatus=nil;\n  if(ready&&aimPermit&&aimPermit->load())aimStatus=PIBackend::PlayerAim(size.width,size.height,radius,*aimPermit);\n  NSMutableDictionary *shown=[frame mutableCopy];shown[@\"aim_fov_radius\"]=@(radius);\n  shown[@\"aim_enabled\"]=@(aimPermit&&aimPermit->load());\n  dispatch_async(dispatch_get_main_queue(),^{\n   self.busy=NO;\n   if(!self.enabled||self.generation!=generation)return;\n   // A rotated viewport requires fresh projection, never old screen coordinates.\n   if(!CGSizeEqualToSize(size,self.overlay.bounds.size)) {if(discover)self.discover=YES;return;}\n   self.ready=ready;self.lastFrame=CACurrentMediaTime();\n   self.overlay.frameData=shown;self.overlay.hidden=NO;\n   if(frame[@\"nearby_count\"])self.status.text=[NSString stringWithFormat:\n       @\"Ph\u00e1t hi\u1ec7n: %@ \u00b7 hi\u1ec3n th\u1ecb: %@\\n300 m \u00b7 \u0111\u00e3 lo\u1ea1i \u0111\u1ed3ng \u0111\u1ed9i v\u00e0 b\u1ea3n th\u00e2n\",frame[@\"nearby_count\"],frame[@\"displayed_count\"]?:@0];\n   else self.status.text=frame[@\"status\"];\n   if(aimStatus)self.status.text=[self.status.text stringByAppendingFormat:@\"\\n%@\",aimStatus];\n  });\n }});\n}\n@end\n\nvoid ZKAttachCharacterOverlay(UIWindow *window, UIScrollView *body) {\n static ZKCharacterOverlay *controller=nil;\n if(!controller)controller=[ZKCharacterOverlay new];\n [controller stop];\n [controller.overlay removeFromSuperview];\n controller.overlay=[[PVTrainingPlayerOverlayView alloc] initWithFrame:window.bounds];\n controller.overlay.drawBones=YES;controller.overlay.drawInfo=YES;controller.overlay.drawRays=NO;\n controller.overlay.hidden=YES;\n // Under the draggable menu; never intercept game touches.\n [window addSubview:controller.overlay];\n [controller.panel removeFromSuperview];[body addSubview:controller.panel];\n body.contentSize=CGSizeMake(236,228);\n}\n",
            "src/control_rotation_probe.hpp": "#pragma once\n#include <cmath>\n#include <cstdint>\nnamespace zk {\nstruct ControlProbe {const char *status=\"not_read\";float angle[3]{};};\n// Offset is a static metadata candidate, NOT runtime-confirmed or writable authorization.\ntemplate<class Read> ControlProbe readControlCandidate(uintptr_t controller,Read read){\n ControlProbe r;if(controller<0x10000||controller>UINTPTR_MAX-0x4ec){r.status=\"bad_controller\";return r;}\n if(!read(controller+0x4e0,r.angle,sizeof(r.angle))){r.status=\"read_failed\";return r;}\n for(float a:r.angle)if(!std::isfinite(a)||std::fabs(a)>360000){r.status=\"invalid_angles\";return r;}\n r.status=\"finite_candidate_NOT_control_verified\";return r;\n}\ninline double rotationDifference(double a,double b){return std::remainder(a-b,360.0);}\n}\n",
            "src/control_route_probe.hpp": "#pragma once\n#include <cstdint>\n#include <cstring>\nnamespace zk {\nstruct ControlRoute {const char*status=\"not_checked\";uintptr_t getterRaw=0,setterRaw=0;uint32_t getterRVA=0,setterRVA=0;};\ninline bool fixedCodeMatch(uintptr_t raw,uintptr_t expected){return raw==expected||(raw&UINT64_C(0x0000ffffffffffff))==expected;}\ntemplate<class Read> ControlRoute inspectControlRoute(uintptr_t base,uintptr_t vtable,Read read){\n ControlRoute r;\n if(base<0x10000||base>UINTPTR_MAX-0x061de300||vtable<base||vtable-base>0x0b000000||vtable>UINTPTR_MAX-0x778){r.status=\"address_guard_failed\";return r;}\n if(!read(vtable+0x768,&r.getterRaw,8)||!read(vtable+0x770,&r.setterRaw,8)){r.status=\"slot_read_failed\";return r;}\n auto matches=[&](uintptr_t rva,const unsigned char *expected,size_t n){unsigned char actual[32]{};return n<=sizeof(actual)&&read(base+rva,actual,n)&&!std::memcmp(actual,expected,n);};\n const unsigned char baseGetter[]={0x00,0xe0,0x44,0xbd,0x01,0xe4,0x44,0xbd,0x02,0xe8,0x44,0xbd,0xc0,0x03,0x5f,0xd6};\n if(fixedCodeMatch(r.getterRaw,base+0x034f42d0)){\n  r.getterRVA=0x034f42d0;\n  if(!fixedCodeMatch(r.setterRaw,base+0x0348fc98)){r.status=\"override_pair_unreviewed\";return r;}\n  r.setterRVA=0x0348fc98;\n  const unsigned char getter[]={0xff,0x03,0x01,0xd1,0xe9,0x23,0x01,0x6d,0xf4,0x4f,0x02,0xa9,0xfd,0x7b,0x03,0xa9,0xfd,0xc3,0x00,0x91,0xf3,0x03,0x00,0xaa,0x9b,0x98,0x42,0x94,0xe0,0x05,0x00,0x34};const unsigned char setter[]={0xff,0x43,0x02,0xd1,0xe9,0x23,0x04,0x6d,0xf8,0x5f,0x05,0xa9,0xf6,0x57,0x06,0xa9,0xf4,0x4f,0x07,0xa9,0xfd,0x7b,0x08,0xa9,0xfd,0x03,0x02,0x91,0xf5,0x03,0x02,0xaa};\n  const unsigned char fallback[]={0x25,0xa7,0xb3,0x94};const unsigned char baseCall[]={0x23,0x38,0xb5,0x94};\n  if(!matches(0x034f42d0,getter,sizeof(getter))||!matches(0x0348fc98,setter,sizeof(setter))||!matches(0x034f43f0,fallback,4)||!matches(0x03490008,baseCall,4)||!matches(0x061de084,baseGetter,sizeof(baseGetter))){r.status=\"override_code_mismatch\";return r;}\n }else if(fixedCodeMatch(r.getterRaw,base+0x061de084)){\n  r.getterRVA=0x061de084;const uint32_t setters[]={0x061de094,0x035c49f0,0x035c4948};\n  for(uint32_t v:setters)if(fixedCodeMatch(r.setterRaw,base+v)){r.setterRVA=v;break;}\n  if(!r.setterRVA){r.status=\"setter_override_unreviewed\";return r;}\n  if(!matches(0x061de084,baseGetter,sizeof(baseGetter))){r.status=\"getter_code_mismatch\";return r;}\n }else {r.status=\"getter_override_unreviewed\";return r;}\n uintptr_t after[2]{};if(!read(vtable+0x768,after,sizeof(after))||after[0]!=r.getterRaw||after[1]!=r.setterRaw){r.status=\"slots_changed\";return r;}\n r.status=\"static_route_matched_NOT_actuation_tested\";return r;\n}\n}\n",
            "src/dyld_util.hpp": "// dyld_util.hpp \u2014 doc memory an toan + liet ke vung nho + base/range cua main image\n#pragma once\n\n#include <mach/mach.h>\n#include <mach/vm_region.h>\n#include <mach-o/dyld.h>\n#include <mach-o/loader.h>\n#include <stdint.h>\n#include <stdio.h>\n#include <string.h>\n#include <string>\n#include <vector>\n#include <algorithm>\n#include <chrono>\n#include <thread>\n#include \"scan_budget.hpp\"\n\nnamespace zk {\n\n// ---------- read an toan (khong crash khi dia chi rac) ----------\ninline bool rd(uintptr_t addr, void *out, size_t n) {\n    if (!addr || !out || !n || n > UINTPTR_MAX-addr) return false;\n    if (!allowRead(n)) return false;\n    vm_size_t got = 0;\n    kern_return_t kr = vm_read_overwrite(mach_task_self(), (vm_address_t)addr,\n                                         (vm_size_t)n, (vm_address_t)out, &got);\n    bool ok = kr == KERN_SUCCESS && got == n;\n    if (!ok) ++scanBudget().readFailures;\n    return ok;\n}\n\ntemplate <class T> inline T rdv(uintptr_t addr) {\n    T v;\n    memset(&v, 0, sizeof(T));\n    rd(addr, &v, sizeof(T));\n    return v;\n}\n\n// ---------- vung nho ----------\nstruct Region {\n    uintptr_t start;\n    uintptr_t end;\n    bool writable;\n};\n\ninline std::vector<Region>& regionCache() { static std::vector<Region> cache; return cache; }\ninline void refreshRegions() { regionCache().clear(); }\ninline const std::vector<Region> &allRegions() {\n    auto &cache=regionCache();\n    if (!cache.empty()) return cache;\n\n    vm_address_t addr = 0;\n    size_t visited=0;\n    while (visited++ < 8000 && budgetTimeOK()) {\n        vm_size_t size = 0;\n        vm_region_basic_info_data_64_t info;\n        mach_msg_type_number_t cnt = VM_REGION_BASIC_INFO_COUNT_64;\n        mach_port_t obj = MACH_PORT_NULL;\n\n        kern_return_t kr = vm_region_64(mach_task_self(), &addr, &size,\n                                        VM_REGION_BASIC_INFO_64,\n                                        (vm_region_info_t)&info, &cnt, &obj);\n        if (obj != MACH_PORT_NULL) mach_port_deallocate(mach_task_self(),obj);\n        if (kr != KERN_SUCCESS || size == 0 || size > UINTPTR_MAX-addr) break;\n\n        if (info.protection & VM_PROT_READ) {\n            Region r;\n            r.start = (uintptr_t)addr;\n            r.end = (uintptr_t)(addr + size);\n            r.writable = (info.protection & VM_PROT_WRITE) != 0;\n            cache.push_back(r);\n        }\n        addr += size;\n        if (cache.size() > 8000) break;\n    }\n    std::sort(cache.begin(), cache.end(),\n              [](const Region &a, const Region &b) { return a.start < b.start; });\n    return cache;\n}\n\ninline bool inReadableRegion(uintptr_t a) {\n    const std::vector<Region> &rs = allRegions();\n    size_t lo = 0, hi = rs.size();\n    while (lo < hi) {\n        size_t mid = (lo + hi) / 2;\n        if (rs[mid].end <= a) lo = mid + 1;\n        else hi = mid;\n    }\n    return lo < rs.size() && rs[lo].start <= a;\n}\n\n// ---------- range that cua tung image ----------\nstruct ImgRange {\n    uintptr_t base = 0;\n    uintptr_t end = 0;\n    const char *path = nullptr;\n};\n\ninline bool imageRange(uint32_t idx, ImgRange &rg) {\n    const struct mach_header_64 *mh =\n        (const struct mach_header_64 *)_dyld_get_image_header(idx);\n    if (!mh || mh->magic != MH_MAGIC_64) return false;\n\n    intptr_t slide = _dyld_get_image_vmaddr_slide(idx);\n    uintptr_t minA = UINTPTR_MAX, maxA = 0;\n\n    const uint8_t *p = (const uint8_t *)mh + sizeof(struct mach_header_64);\n    for (uint32_t c = 0; c < mh->ncmds; c++) {\n        const struct load_command *lc = (const struct load_command *)p;\n        if (lc->cmdsize < sizeof(struct load_command)) break;\n        if (lc->cmd == LC_SEGMENT_64) {\n            const struct segment_command_64 *sg = (const struct segment_command_64 *)lc;\n            if (sg->initprot == VM_PROT_NONE || sg->filesize==0) { p += lc->cmdsize; continue; }\n            uintptr_t s = (uintptr_t)slide + (uintptr_t)sg->vmaddr;\n            uintptr_t e = s + (uintptr_t)sg->vmsize;\n            if (s < minA) minA = s;\n            if (e > maxA) maxA = e;\n        }\n        p += lc->cmdsize;\n    }\n    if (maxA <= minA) return false;\n    rg.base = (uintptr_t)mh;\n    rg.end = maxA;\n    rg.path = _dyld_get_image_name(idx);\n    return true;\n}\n\ninline bool imageRangeContaining(uintptr_t addr, ImgRange &out) {\n    for (uint32_t i=0;i<_dyld_image_count();i++) {\n        const auto *mh=(const mach_header_64 *)_dyld_get_image_header(i);\n        if (!mh || mh->magic!=MH_MAGIC_64) continue;\n        const uint8_t *p=(const uint8_t *)mh+sizeof(*mh);\n        const uint8_t *end=p+mh->sizeofcmds;\n        intptr_t slide=_dyld_get_image_vmaddr_slide(i);\n        for (uint32_t c=0;c<mh->ncmds && p+sizeof(load_command)<=end;c++) {\n            const auto *lc=(const load_command *)p;\n            if (lc->cmdsize<sizeof(*lc) || (size_t)(end-p)<lc->cmdsize) break;\n            if (lc->cmd==LC_SEGMENT_64 && lc->cmdsize>=sizeof(segment_command_64)) {\n                const auto *sg=(const segment_command_64 *)p;\n                if (sg->initprot!=VM_PROT_NONE && sg->vmsize) {\n                    uintptr_t start=(uintptr_t)sg->vmaddr+slide;\n                    if (addr>=start && addr-start<sg->vmsize) {\n                        out.base=(uintptr_t)mh; out.end=start+sg->vmsize;\n                        out.path=_dyld_get_image_name(i); return true;\n                    }\n                }\n            }\n            p+=lc->cmdsize;\n        }\n    }\n    return false;\n}\n\n// ---------- base cua main executable (ShadowTrackerExtra) ----------\ninline uintptr_t mainBase() {\n    for (uint32_t i=0;i<_dyld_image_count();i++) {\n        const auto *mh=_dyld_get_image_header(i);\n        if (mh && mh->filetype==MH_EXECUTE) return (uintptr_t)mh;\n    }\n    return 0;\n}\n\ninline const char *imageNameContaining(uintptr_t addr) {\n    ImgRange r;\n    if (imageRangeContaining(addr, r) && r.path) return r.path;\n    return \"heap/other\";\n}\n\ninline bool belongsToMainImage(uintptr_t addr) {\n    ImgRange r;\n    if (!imageRangeContaining(addr, r)) return false;\n    return r.base == mainBase();\n}\n\n// ---------- quet vung RW theo tung khoi (tranh cap phat GB) ----------\nconst size_t kScanStep = 64u << 10; // 64 KB per read; bounded buffers\n\ntemplate <class F> void scanWritable(F cb) {\n    const std::vector<Region> &regs = allRegions();\n    std::vector<unsigned char> buf(kScanStep + 16);\n    for (size_t ri = 0; ri < regs.size(); ri++) {\n        const Region &r = regs[ri];\n        if (!r.writable) continue;\n        for (uintptr_t a = r.start; a < r.end; a += kScanStep) {\n            size_t want = (size_t)std::min<uintptr_t>(kScanStep, r.end - a);\n            if (want < 8) break;\n            if (!allowScan(want)) return;\n            if (!rd(a, buf.data(), want)) continue;\n            cb(a, buf.data(), want);\n            std::this_thread::sleep_for(std::chrono::milliseconds(2));\n        }\n    }\n}\n\n// quet chi trong cac vung writable cua mot image (vd: __DATA cua main binary)\ntemplate <class F> void scanImageData(uintptr_t imgBase, F cb) {\n    const std::vector<Region> &regs = allRegions();\n    std::vector<unsigned char> buf(kScanStep + 16);\n    for (size_t ri = 0; ri < regs.size(); ri++) {\n        const Region &r = regs[ri];\n        if (!r.writable) continue;\n\n        ImgRange ir;\n        if (!imageRangeContaining(r.start, ir) || ir.base != imgBase) continue;\n\n        for (uintptr_t a = r.start; a < r.end; a += kScanStep) {\n            size_t want = (size_t)std::min<uintptr_t>(kScanStep, r.end - a);\n            if (want < 8) break;\n            if (!allowScan(want)) return;\n            if (!rd(a, buf.data(), want)) continue;\n            cb(a, buf.data(), want);\n            std::this_thread::sleep_for(std::chrono::milliseconds(2));\n        }\n    }\n}\n\n} // namespace zk\n",
            "src/esp_menu.hpp": "#pragma once\n\n@interface ZKESPMenu : UIView\n@property(nonatomic, strong) UIScrollView *body;\n@property(nonatomic, strong) UIButton *collapseButton;\n@property(nonatomic) BOOL collapsed;\n- (void)constrainToWindow;\n@end\n\n@implementation ZKESPMenu\n- (void)constrainToWindow {\n UIWindow *window = self.window;\n if (!window) return;\n CGRect area = UIEdgeInsetsInsetRect(window.bounds, window.safeAreaInsets);\n CGRect frame = self.frame;\n frame.size.height = self.collapsed ? 36 : std::min<CGFloat>(270, CGRectGetHeight(area));\n frame.origin.x = std::clamp(frame.origin.x, CGRectGetMinX(area),\n     std::max(CGRectGetMinX(area), CGRectGetMaxX(area) - CGRectGetWidth(frame)));\n frame.origin.y = std::clamp(frame.origin.y, CGRectGetMinY(area),\n     std::max(CGRectGetMinY(area), CGRectGetMaxY(area) - CGRectGetHeight(frame)));\n if (!CGRectEqualToRect(self.frame, frame)) self.frame = frame;\n self.body.frame = CGRectMake(0, 36, CGRectGetWidth(frame),\n     std::max<CGFloat>(0, CGRectGetHeight(frame) - 36));\n}\n- (void)safeAreaInsetsDidChange {\n [super safeAreaInsetsDidChange];\n [self constrainToWindow];\n}\n- (void)moveMenu:(UIPanGestureRecognizer *)gesture {\n UIWindow *window = self.window;\n if (!window) return;\n CGPoint delta = [gesture translationInView:window];\n self.center = CGPointMake(self.center.x + delta.x, self.center.y + delta.y);\n [gesture setTranslation:CGPointZero inView:window];\n [self constrainToWindow];\n}\n- (void)toggleMenu {\n self.collapsed = !self.collapsed;\n self.body.hidden = self.collapsed;\n [self.collapseButton setTitle:self.collapsed ? @\"+\" : @\"\u2212\" forState:UIControlStateNormal];\n self.collapseButton.accessibilityLabel = self.collapsed ? @\"M\u1edf menu ESP\" : @\"Thu g\u1ecdn menu ESP\";\n [self constrainToWindow];\n}\n@end\n\nstatic ZKESPMenu *espMenu = nil;\n\nstatic void placeEspControl(UIView *control, UIScrollView *body, CGRect frame) {\n [control removeFromSuperview];\n control.translatesAutoresizingMaskIntoConstraints = YES;\n control.frame = frame;\n [body addSubview:control];\n}\n\nstatic void attachEspMenu(UIWindow *window) {\n espMenu = [[ZKESPMenu alloc] initWithFrame:CGRectMake(12, 12, 236, 382)];\n espMenu.backgroundColor = [UIColor colorWithWhite:0.07 alpha:0.92];\n espMenu.layer.cornerRadius = 10;\n espMenu.clipsToBounds = YES;\n\n UILabel *handle = [[UILabel alloc] initWithFrame:CGRectMake(10, 0, 176, 36)];\n handle.text = @\"ESP  \u00b7  K\u00e9o \u0111\u1ec3 di chuy\u1ec3n\";\n handle.font = [UIFont boldSystemFontOfSize:13];\n handle.textColor = UIColor.whiteColor;\n handle.userInteractionEnabled = YES;\n [handle addGestureRecognizer:[[UIPanGestureRecognizer alloc] initWithTarget:espMenu action:@selector(moveMenu:)]];\n [espMenu addSubview:handle];\n\n espMenu.collapseButton = [UIButton buttonWithType:UIButtonTypeSystem];\n espMenu.collapseButton.frame = CGRectMake(188, 0, 48, 36);\n [espMenu.collapseButton setTitle:@\"\u2212\" forState:UIControlStateNormal];\n espMenu.collapseButton.accessibilityLabel = @\"Thu g\u1ecdn menu ESP\";\n [espMenu.collapseButton addTarget:espMenu action:@selector(toggleMenu) forControlEvents:UIControlEventTouchUpInside];\n [espMenu addSubview:espMenu.collapseButton];\n\n UIScrollView *body = [[UIScrollView alloc] initWithFrame:CGRectZero];\n body.contentInsetAdjustmentBehavior = UIScrollViewContentInsetAdjustmentNever;\n body.contentSize = CGSizeMake(236, 498);\n espMenu.body = body;\n [espMenu addSubview:body];\n // The old training-target controls are detached; the new module owns ESP.\n [captureButton removeFromSuperview];[angleButton removeFromSuperview];\n [fovPanel removeFromSuperview];[fovCanvas removeFromSuperview];[trainingPanel removeFromSuperview];\n ZKAttachCharacterOverlay(window,body);\n [window addSubview:espMenu];\n [espMenu constrainToWindow];\n}\n",
            "src/fov_controls.hpp": "#pragma once\n#include \"fov_preview.hpp\"\n// All state in this header is accessed on the main thread only.\nstatic UIView *fovCanvas=nil,*fovPanel=nil;\nstatic CAShapeLayer *fovCircle=nil,*fovSelection=nil;\nstatic UILabel *fovText=nil;\nstatic UISlider *fovSlider=nil;\nstatic std::vector<zk::FovPoint> fovPoints;\nstatic CFTimeInterval fovReceived=0;\nstatic int32_t lockedFovIndex=-1;\nstatic zk::FovPick pickLockedFov(double width,double height,double fraction,bool fresh){\n if(fresh&&lockedFovIndex>=0){\n  for(size_t i=0;i<fovPoints.size()&&i<20;++i){\n   if(fovPoints[i].index!=lockedFovIndex)continue;\n   const auto retained=zk::pickFov(&fovPoints[i],1,width,height,fraction);\n   if(retained.index>=0)return retained;\n   break;\n  }\n }\n const auto picked=zk::pickFov(fresh?fovPoints.data():nullptr,fresh?fovPoints.size():0,width,height,fraction);\n lockedFovIndex=picked.index;\n return picked;\n}\nstatic void redrawFov(){\n UIWindow *window=fovCanvas.window;if(!window||window.hidden)return;\n const CGSize size=window.bounds.size;fovCanvas.frame=window.bounds;\n fovCanvas.hidden=size.width<=size.height;fovPanel.hidden=fovCanvas.hidden;\n const bool fresh=(CACurrentMediaTime()-fovReceived)*1000<=zk::TrackingRate::markerLifetimeMs;\n const auto picked=pickLockedFov(size.width,size.height,fovSlider.value,fresh);\n const CGFloat radius=picked.radius,cx=size.width*.5,cy=size.height*.5;\n [CATransaction begin];[CATransaction setDisableActions:YES];\n fovCircle.frame=fovCanvas.bounds;fovSelection.frame=fovCanvas.bounds;\n fovCircle.path=[UIBezierPath bezierPathWithOvalInRect:CGRectMake(cx-radius,cy-radius,radius*2,radius*2)].CGPath;\n fovSelection.path=nil;\n if(picked.index>=0)for(const auto&p:fovPoints)if(p.index==picked.index){UIBezierPath *selectedRay=[UIBezierPath bezierPath];\n  [selectedRay moveToPoint:CGPointMake(size.width*.5,MAX(12,window.safeAreaInsets.top+4))];\n  [selectedRay addLineToPoint:CGPointMake(p.x*size.width,p.y*size.height)];\n  fovSelection.path=selectedRay.CGPath;break;}\n [CATransaction commit];\n fovText.text=[NSString stringWithFormat:@\"FOV %.0f pt \u00b7 ch\u1ec9 b\u00e1o\",radius];\n}\n@interface ZKFovActions : NSObject\n- (void)changed:(UISlider *)slider;\n@end\n@implementation ZKFovActions\n- (void)changed:(UISlider *)slider {[NSUserDefaults.standardUserDefaults setDouble:zk::fovFraction(slider.value) forKey:@\"ZKProbe.R25.fov\"];redrawFov();}\n@end\nstatic ZKFovActions *fovActions=nil;\nstatic void attachFovControls(UIWindow *window){\n if(fovPanel.superview==window)return;\n [fovPanel removeFromSuperview];[fovCanvas removeFromSuperview];\n fovCanvas=[[UIView alloc] initWithFrame:window.bounds];fovCanvas.userInteractionEnabled=NO;\n fovCanvas.autoresizingMask=UIViewAutoresizingFlexibleWidth|UIViewAutoresizingFlexibleHeight;\n [window addSubview:fovCanvas];\n fovCircle=[CAShapeLayer layer];fovSelection=[CAShapeLayer layer];\n for(CAShapeLayer *layer in @[fovCircle,fovSelection]){layer.strokeColor=UIColor.yellowColor.CGColor;layer.fillColor=UIColor.clearColor.CGColor;[fovCanvas.layer addSublayer:layer];}\n fovCircle.lineWidth=1;fovSelection.lineWidth=0.7;fovSelection.strokeColor=UIColor.redColor.CGColor;fovSelection.lineCap=kCALineCapRound;\n fovPanel=[[UIView alloc] initWithFrame:CGRectZero];fovPanel.translatesAutoresizingMaskIntoConstraints=NO;\n fovPanel.backgroundColor=[UIColor colorWithWhite:0 alpha:.65];fovPanel.layer.cornerRadius=8;\n fovText=[[UILabel alloc] initWithFrame:CGRectMake(8,2,204,22)];fovText.font=[UIFont systemFontOfSize:12];fovText.textColor=UIColor.yellowColor;[fovPanel addSubview:fovText];\n fovSlider=[[UISlider alloc] initWithFrame:CGRectMake(8,26,204,30)];fovSlider.minimumValue=.05;fovSlider.maximumValue=.45;fovSlider.value=zk::fovFraction([NSUserDefaults.standardUserDefaults objectForKey:@\"ZKProbe.R25.fov\"]?[NSUserDefaults.standardUserDefaults doubleForKey:@\"ZKProbe.R25.fov\"]:.18);fovSlider.minimumTrackTintColor=UIColor.yellowColor;\n fovSlider.accessibilityLabel=@\"B\u00e1n k\u00ednh v\u00f2ng ch\u1ec9 b\u00e1o FOV\";\n if(!fovActions)fovActions=[ZKFovActions new];[fovSlider addTarget:fovActions action:@selector(changed:) forControlEvents:UIControlEventValueChanged];[fovPanel addSubview:fovSlider];[window addSubview:fovPanel];\n [NSLayoutConstraint activateConstraints:@[[fovPanel.leadingAnchor constraintEqualToAnchor:window.safeAreaLayoutGuide.leadingAnchor constant:8],[fovPanel.topAnchor constraintEqualToAnchor:window.safeAreaLayoutGuide.topAnchor constant:8],[fovPanel.widthAnchor constraintEqualToConstant:220],[fovPanel.heightAnchor constraintEqualToConstant:60]]];\n redrawFov();\n}\nstatic void clearFovTargets(){lockedFovIndex=-1;fovPoints.clear();fovReceived=0;redrawFov();}\nstatic void requestSelectedRayStep();\nstatic void updateFovTargets(const std::vector<zk::FovPoint>&points){fovPoints=points;fovReceived=CACurrentMediaTime();redrawFov();requestSelectedRayStep();}\n",
            "src/fov_preview.hpp": "#pragma once\n#include <cmath>\n#include <cstdint>\n#include <cstddef>\nnamespace zk {\nstruct FovPoint {int32_t index=-1;double x=0,y=0;bool edge=false,behind=false;unsigned ordinal=0;double distance=0;};\nstruct FovPick {int32_t index=-1;double radius=0,distance=0;};\ninline double fovFraction(double value){return !std::isfinite(value)?.18:std::fmax(.05,std::fmin(.45,value));}\ninline FovPick pickFov(const FovPoint *points,size_t count,double width,double height,double fraction){\n FovPick r;if(!std::isfinite(width)||!std::isfinite(height)||width<=0||height<=0)return r;\n r.radius=fovFraction(fraction)*std::fmin(width,height);double best=r.radius*r.radius;\n if(!points)return r;\n for(size_t i=0;i<count&&i<20;++i){const auto&p=points[i];if(p.index<0||p.edge||p.behind||!std::isfinite(p.x)||!std::isfinite(p.y)||p.x<0||p.x>1||p.y<0||p.y>1)continue;\n  const double dx=(p.x-.5)*width,dy=(p.y-.5)*height,d=dx*dx+dy*dy;\n  if(d<best||(d==best&&(r.index<0||p.index<r.index))){best=d;r.index=p.index;r.distance=std::sqrt(d);}\n }return r;\n}\n}\n",
            "src/image_uuid_guard.hpp": "#pragma once\n#include <cstdint>\n#include <cstring>\nnamespace zk {\ntemplate<class Read> bool imageUUIDMatches(uintptr_t base,const unsigned char expected[16],Read read){\n if(base<0x10000||(base&4095)||base>UINTPTR_MAX-32)return false;\n unsigned char header[32]{};if(!read(base,header,32))return false;\n uint32_t magic=0,count=0,bytes=0;std::memcpy(&magic,header,4);std::memcpy(&count,header+16,4);std::memcpy(&bytes,header+20,4);\n if(magic!=0xfeedfacf||!count||count>512||bytes<8||bytes>65536||count>bytes/8||base>UINTPTR_MAX-32-bytes)return false;\n uintptr_t p=base+32,end=p+bytes;\n for(uint32_t i=0;i<count;++i){\n  if(end-p<8)return false;uint32_t command[2]{};if(!read(p,command,8))return false;\n  if(command[1]<8||(command[1]&7)||command[1]>end-p)return false;\n  if(command[0]==0x1b){unsigned char uuid[16]{};return command[1]>=24&&read(p+8,uuid,16)&&!std::memcmp(uuid,expected,16);}\n  p+=command[1];\n }return false;\n}\n}\n",
            "src/manual_capture.hpp": "#pragma once\n#include <mutex>\n#include <atomic>\n#include <condition_variable>\n#include <chrono>\nnamespace zk {\nclass TrackingStop {std::atomic<bool> stopped{false};public:void reset(){stopped.store(false);}void request(){stopped.store(true);}bool requested()const{return stopped.load();}};\nenum class CapturePhase {Idle,Preparing,Ready,Measuring};\nclass CaptureGate {\n std::mutex mutex;std::condition_variable condition;CapturePhase value=CapturePhase::Idle;\npublic:\n CapturePhase phase(){std::lock_guard<std::mutex> lock(mutex);return value;}\n bool begin(){std::lock_guard<std::mutex> lock(mutex);if(value!=CapturePhase::Idle)return false;value=CapturePhase::Preparing;return true;}\n bool arm(){std::lock_guard<std::mutex> lock(mutex);if(value!=CapturePhase::Preparing)return false;value=CapturePhase::Ready;return true;}\n bool request(){std::lock_guard<std::mutex> lock(mutex);if(value!=CapturePhase::Ready)return false;value=CapturePhase::Measuring;condition.notify_all();return true;}\n template<class Rep,class Period> bool wait(const std::chrono::duration<Rep,Period> &timeout){std::unique_lock<std::mutex> lock(mutex);return condition.wait_for(lock,timeout,[&]{return value==CapturePhase::Measuring||value==CapturePhase::Idle;})&&value==CapturePhase::Measuring;}\n void finish(){std::lock_guard<std::mutex> lock(mutex);value=CapturePhase::Idle;condition.notify_all();}\n};\ninline const char *capturePhaseLabel(unsigned tick){return tick<5?\"still_baseline\":tick<10?\"move_forward\":\"still_after\";}\n}\n",
            "src/manual_tuning.hpp": "#pragma once\n#include <cmath>\n#include <cstdint>\n#include <cstddef>\n#include <algorithm>\nnamespace zk {\ninline double tuneDegrees(double value){return std::isfinite(value)?std::clamp(value,1.0,20.0):20.0;}\ninline unsigned tuneDuration(double value){return std::isfinite(value)?unsigned(std::round(std::clamp(value,0.0,600.0)/50)*50):200;}\ninline double smoothFraction(int64_t elapsed,unsigned ms){if(elapsed<0)return 0;if(!ms)return 1;const double t=std::clamp(double(elapsed)/(double(ms)*1000),0.0,1.0);return t*t*(3-2*t);}\ninline bool manualRetryAllowed(bool terminal,int64_t finished,int64_t now,unsigned attempts){return attempts<32&&terminal&&finished>0&&now>=finished&&now-finished>=2500000;}\ninline bool smoothTaskActive(int64_t elapsed,unsigned callbacks,unsigned calls,size_t bytes){return elapsed>=0&&elapsed<=1100000&&callbacks<=96&&calls<=16384&&bytes<=1048576;}\n}\n",
            "src/preparation_pacer.hpp": "#pragma once\n#include <cstdint>\nnamespace zk {\nstruct PreparationPacer {\n static constexpr int64_t workSliceUs=4000,progressIntervalUs=200000;\n int64_t sliceStart=0,lastProgress=0;\n bool yieldDue(int64_t now)const{return now>=sliceStart&&now-sliceStart>=workSliceUs;}\n void resumed(int64_t now){sliceStart=now;}\n bool progressDue(int64_t now){if(now<lastProgress||now-lastProgress<progressIntervalUs)return false;lastProgress=now;return true;}\n static unsigned percent(uint32_t next,uint32_t count){if(!count)return 0;return next>=count?100:unsigned(uint64_t(next)*100/count);}\n};\n}\n",
            "src/probe.mm": "#include <algorithm>\n#import <Foundation/Foundation.h>\n#import <UIKit/UIKit.h>\n#import <UIKit/UIGestureRecognizerSubclass.h>\n#import <QuartzCore/QuartzCore.h>\n#import <dispatch/dispatch.h>\n#include \"dyld_util.hpp\"\n#include \"targeted_names.hpp\"\n#include \"targeted_objects.hpp\"\n#include \"targeted_instances.hpp\"\n#include \"targeted_ownership.hpp\"\n#include \"targeted_camera.hpp\"\n#include \"targeted_controller_camera.hpp\"\n#include \"targeted_local_position.hpp\"\n#include \"targeted_pawn_candidates.hpp\"\n#include <pthread.h>\n#include <pthread/qos.h>\n#include <mutex>\n#include <memory>\n#include <cstdarg>\n#include \"manual_capture.hpp\"\n#include \"training_projection.hpp\"\n#include \"training_rank.hpp\"\n#include \"training_components.hpp\"\n#include <vector>\n#include \"tracking_rate.hpp\"\n#include \"preparation_pacer.hpp\"\n#include \"reselection.hpp\"\n#include \"training_rays.hpp\"\n#include \"control_rotation_probe.hpp\"\n#include \"control_route_probe.hpp\"\n#include \"thread_context_probe.hpp\"\n#include <atomic>\n#include <mach/mach.h>\n#include \"async_thread_proof.hpp\"\n#include \"angle_test.hpp\"\n#include \"training_residual.hpp\"\nstatic zk::CaptureGate captureGate;\nstatic zk::TrackingStop trackingStop;\nstatic UIButton *captureButton=nil;\nextern \"C\" void zkProbe();\nstatic void refreshCaptureButton(){\n dispatch_async(dispatch_get_main_queue(),^{\n  switch(captureGate.phase()){\n   case zk::CapturePhase::Idle:[captureButton setTitle:@\"ESP \u00b7 Chu\u1ea9n b\u1ecb\" forState:UIControlStateNormal];captureButton.enabled=YES;break;\n   case zk::CapturePhase::Preparing:[captureButton setTitle:@\"\u0110ang chu\u1ea9n b\u1ecb\u2026\" forState:UIControlStateNormal];captureButton.enabled=NO;break;\n   case zk::CapturePhase::Ready:[captureButton setTitle:@\"B\u1eadt ESP bia \u00b7 30s\" forState:UIControlStateNormal];captureButton.enabled=YES;break;\n   case zk::CapturePhase::Measuring:[captureButton setTitle:@\"D\u1eebng ESP bia\" forState:UIControlStateNormal];captureButton.enabled=YES;break;\n  }\n  refreshAngleButton();\n });\n}\nstatic void displayCapturePhase(unsigned tick){\n (void)tick;dispatch_async(dispatch_get_main_queue(),^{if(captureGate.phase()==zk::CapturePhase::Measuring&&!trackingStop.requested())[captureButton setTitle:@\"D\u1eebng ESP bia\" forState:UIControlStateNormal];});\n}\n@interface ZKManualActions : NSObject\n- (void)tapped:(id)sender;\n@end\n@implementation ZKManualActions\n- (void)tapped:(id)sender {\n (void)sender;\n if(captureGate.phase()==zk::CapturePhase::Measuring){angleActive.store(false);angleReady.store(false);trackingStop.request();[captureButton setTitle:@\"\u0110ang d\u1eebng\u2026\" forState:UIControlStateNormal];captureButton.enabled=NO;return;}\n if(captureGate.phase()==zk::CapturePhase::Idle){\n  if(captureGate.begin()){trackingStop.reset();refreshCaptureButton();dispatch_async(dispatch_get_global_queue(QOS_CLASS_UTILITY,0),^{zkProbe();});}\n }else if(captureGate.request())refreshCaptureButton();\n}\n@end\n#include \"fov_controls.hpp\"\n#include \"training_controls.hpp\"\n#include \"character_overlay.h\"\n#include \"esp_menu.hpp\"\n// UIKit-only: choose the same fresh highlighted FOV point the user can see.\nstatic zk::FovPick currentTrainingPick(){\n UIWindow*window=captureButton.window;\n if(!window||window.hidden||!fovSlider||!fovReceived||(CACurrentMediaTime()-fovReceived)*1000>zk::TrackingRate::markerLifetimeMs)return {};\n const CGSize size=window.bounds.size;return pickLockedFov(size.width,size.height,fovSlider.value,true);\n}\nstatic bool hasFreshTrainingPick(){return currentTrainingPick().index>=0;}\nstatic std::shared_ptr<zk::AsyncProof> lastAngleDispatch;\nstatic double fireHoldStart=0;\nstatic bool requestTrainingStep(bool automatic){\n const auto dispatch=std::atomic_load(&lastAngleDispatch);\n if(dispatch){\n  const auto dispatchPhase=dispatch->phase.load(std::memory_order_acquire);\n  if(dispatchPhase!=zk: