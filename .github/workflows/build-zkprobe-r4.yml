            "src/targeted_ownership.hpp": "#pragma once\n#include \"targeted_instances.hpp\"\nnamespace zk {\nstruct OuterWalkResult {const char *status=\"not_started\";unsigned nodes=0;};\n// Validator must check identity, names and slot back-reference before emitting a node.\ntemplate<class Validate,class Emit>\nOuterWalkResult walkOuter(const OwnershipTarget &target,Validate validate,Emit emit){\n OuterWalkResult result;uintptr_t p=target.ptr,seen[8]{};\n for(unsigned depth=0;depth<8;++depth){\n  if(!p){result.status=\"null_outer_end\";return result;}\n  if(!candidatePointer(p)){result.status=\"invalid_outer_pointer\";return result;}\n  for(unsigned i=0;i<depth;++i)if(seen[i]==p){result.status=\"outer_cycle\";return result;}\n  seen[depth]=p;ObjectHead h{};char name[65]{},cls[65]{};\n  if(!validate(p,h,name,cls)){result.status=\"node_validation_failed\";return result;}\n  if(depth==0&&std::memcmp(&target.original,&h,sizeof(h))){result.status=\"target_changed_since_enumeration\";return result;}\n  emit(depth,p,h,name,cls);++result.nodes;p=h.outer;\n }\n result.status=p?\"depth_limit\":\"null_outer_end\";return result;\n}\ntemplate<class Read>\nbool validateOuterNode(uintptr_t p,InstanceReader<Read> &lookup,ObjectHead &h,char name[65],char cls[65]){\n if(!candidatePointer(p)||!lookup.read(p,&h,sizeof(h)))return false;\n if(h.index<0||h.index>=lookup.count||!candidatePointer(h.cls)||!candidatePointer(h.vtable))return false;\n uintptr_t slot=0;\n if(!safeSpan(lookup.items,size_t(h.index)*24+8)||!lookup.read(lookup.items+size_t(h.index)*24,&slot,8)||slot!=p)return false;\n if(!lookup.names.get(h.nameId,name)||!lookup.className(h.cls,cls))return false;\n ObjectHead after{};return lookup.read(p,&after,sizeof(after))&&!std::memcmp(&h,&after,sizeof(h));\n}\n}\n",
            "src/targeted_pawn_candidates.hpp": "#pragma once\n#include \"targeted_local_position.hpp\"\nnamespace zk {\nstruct OwningWorld {const char *status=\"world_not_found\";uintptr_t ptr=0;int32_t index=-1;};\ntemplate<class Read> OwningWorld findOwningWorld(uintptr_t p,InstanceReader<Read> &lookup){\n OwningWorld result;uintptr_t seen[8]{};\n for(unsigned depth=0;depth<8&&p;++depth){\n  for(unsigned i=0;i<depth;++i)if(seen[i]==p){result.status=\"ownership_cycle\";return result;}\n  seen[depth]=p;ObjectHead h{};char name[65]{},cls[65]{};\n  if(!validateOuterNode(p,lookup,h,name,cls)){result.status=\"ownership_node_invalid\";return result;}\n  if(!std::strcmp(cls,\"World\")){result.status=\"owning_world_found\";result.ptr=p;result.index=h.index;return result;}\n  p=h.outer;\n }\n result.status=p?\"ownership_depth_limit\":\"world_not_found\";return result;\n}\nstruct RuntimeWorld {OwningWorld world;int32_t levelIndex=-1;};\ntemplate<class Read> RuntimeWorld resolveLevelWorld(uintptr_t p,InstanceReader<Read> &lookup,uintptr_t expectedGetter){\n RuntimeWorld result;result.world.status=\"actor_level_not_found\";uintptr_t seen[8]{};\n for(unsigned depth=0;depth<8&&p;++depth){\n  for(unsigned i=0;i<depth;++i)if(seen[i]==p){result.world.status=\"level_ownership_cycle\";return result;}\n  seen[depth]=p;ObjectHead h{};char name[65]{},cls[65]{};\n  if(!validateOuterNode(p,lookup,h,name,cls)){result.world.status=\"level_path_node_invalid\";return result;}\n  if(!std::strcmp(cls,\"Level\")){\n   result.levelIndex=h.index;uintptr_t getter=0,world=0,after=0;\n   if(!expectedGetter||!safeSpan(h.vtable,0x170)||!lookup.read(h.vtable+0x168,&getter,8)||getter!=expectedGetter){result.world.status=\"level_world_getter_mismatch\";return result;}\n   if(!safeSpan(p,0xc8)||!lookup.read(p+0xc0,&world,8)||!candidatePointer(world)){result.world.status=\"level_world_pointer_invalid\";return result;}\n   ObjectHead wh{};char wn[65]{},wc[65]{};\n   if(!validateOuterNode(world,lookup,wh,wn,wc)||std::strcmp(wc,\"World\")){result.world.status=\"level_world_object_invalid\";return result;}\n   ObjectHead h2{};\n   if(!lookup.read(p+0xc0,&after,8)||!lookup.read(p,&h2,sizeof(h2))||after!=world||std::memcmp(&h,&h2,sizeof(h))){result.world.status=\"level_world_changed_during_read\";return result;}\n   result.world.status=\"level_owning_world_validated\";result.world.ptr=world;result.world.index=wh.index;return result;\n  }\n  if(!std::strcmp(cls,\"World\"))return result;\n  p=h.outer;\n }\n return result;\n}\nstruct PawnPosition {const char *status=\"not_checked\";int32_t pawnIndex=-1,rootIndex=-1,worldIndex=-1,outerWorldIndex=-1,levelIndex=-1;uint32_t objectFlags=0,rootFlags=0;char name[65]{},cls[65]{};float position[3]{};};\ntemplate<class Read> PawnPosition readOtherPawn(const OwnershipTarget &target,uintptr_t localPawn,const OwningWorld &localWorld,InstanceReader<Read> &lookup,bool training=false,uintptr_t expectedLevelGetter=0){\n PawnPosition result;result.pawnIndex=target.original.index;\n if(target.ptr==localPawn){result.status=\"self_excluded\";return result;}\n if(!localWorld.ptr){result.status=\"local_world_unverified\";return result;}\n ObjectHead pawn{},root{};char rootName[65]{},rootClass[65]{};\n if(!validateOuterNode(target.ptr,lookup,pawn,result.name,result.cls)||std::memcmp(&pawn,&target.original,sizeof(pawn))){result.status=\"pawn_identity_rejected\";return result;}\n result.pawnIndex=pawn.index;result.objectFlags=pawn.flags;\n if(training?!trainingClass(result.cls):!std::strstr(result.cls,\"PlayerPawn\")){result.status=\"pawn_class_name_rejected\";return result;}\n const auto outerWorld=findOwningWorld(target.ptr,lookup);result.outerWorldIndex=outerWorld.index;\n auto world=outerWorld;\n if(expectedLevelGetter){const auto runtime=resolveLevelWorld(target.ptr,lookup,expectedLevelGetter);world=runtime.world;result.levelIndex=runtime.levelIndex;}\n result.worldIndex=world.index;\n if(!world.ptr){result.status=world.status;return result;}\n if(world.ptr!=localWorld.ptr||world.index!=localWorld.index){result.status=\"different_owning_world\";return result;}\n uintptr_t component=0;\n if(!safeSpan(target.ptr,0x210)||!lookup.read(target.ptr+0x208,&component,8)||!candidatePointer(component)){result.status=\"root_pointer_invalid\";return result;}\n if(!validateOuterNode(component,lookup,root,rootName,rootClass)||root.outer!=target.ptr||!std::strstr(rootClass,\"Component\")){result.status=\"root_validation_failed\";return result;}\n result.rootIndex=root.index;result.rootFlags=root.flags;\n if(!safeSpan(component,0x22c)||!lookup.read(component+0x220,result.position,12)){result.status=\"root_position_read_failed\";return result;}\n for(float v:result.position)if(!std::isfinite(v)||std::fabs(v)>1e9f){result.status=\"position_numeric_rejected\";return result;}\n uintptr_t after=0;ObjectHead p2{},r2{};\n if(!lookup.read(target.ptr+0x208,&after,8)||!lookup.read(target.ptr,&p2,sizeof(p2))||!lookup.read(component,&r2,sizeof(r2))){result.status=\"position_final_read_failed\";return result;}\n if(after!=component||std::memcmp(&pawn,&p2,sizeof(pawn))||std::memcmp(&root,&r2,sizeof(root))){result.status=\"position_identity_changed\";return result;}\n if(std::fabs(result.position[0])<0.001f&&std::fabs(result.position[1])<0.001f&&std::fabs(result.position[2])<0.001f){result.status=\"zero_translation_UNVERIFIED\";return result;}\n result.status=training?\"same_world_training_actor_candidate\":\"same_world_pawn_position_candidate\";return result;\n}\n}\n",
            "src/thread_context_probe.hpp": "#pragma once\n#include <cstdint>\n#include <cstring>\nnamespace zk {\nstruct ThreadContext {const char*status=\"not_checked\";uint32_t game=0,main=0,worker=0;bool mainMatch=false,workerMatch=false;};\ntemplate<class Read> ThreadContext inspectThreadContext(uintptr_t base,uint32_t main,uint32_t worker,Read read){\n ThreadContext r;r.main=main;r.worker=worker;\n if(base<0x10000||base>UINTPTR_MAX-0x0a58eb59){r.status=\"base_guard_failed\";return r;}\n const unsigned char expected[]={0xdd,0x28,0x00,0x95,0xa9,0x28,0x00,0x95,0x48,0xc8,0x03,0xd0,0x08,0x11,0x2d,0x91,0x00,0x01,0x00,0xb9,0x48,0xc8,0x03,0xd0,0x08,0x61,0x2d,0x91,0x29,0x00,0x80,0x52,0x09,0x01,0x00,0x39};unsigned char actual[sizeof(expected)]{};\n if(!read(base+0x02c84248,actual,sizeof(actual))||std::memcmp(actual,expected,sizeof(expected))){r.status=\"thread_init_code_mismatch\";return r;}\n uint8_t initialized=0,afterFlag=0;uint32_t after=0;\n if(!read(base+0x0a58eb58,&initialized,1)||!read(base+0x0a58eb44,&r.game,4)){r.status=\"thread_global_read_failed\";return r;}\n if(initialized!=1||!r.game){r.status=\"thread_global_not_initialized\";return r;}\n if(!read(base+0x0a58eb44,&after,4)||!read(base+0x0a58eb58,&afterFlag,1)||after!=r.game||afterFlag!=initialized){r.status=\"thread_global_changed\";return r;}\n if(!main||!worker){r.status=\"system_thread_id_unavailable\";return r;}\n r.mainMatch=r.game==main;r.workerMatch=r.game==worker;\n r.status=r.mainMatch?\"ui_thread_matches_game_id_NOT_call_authorization\":\"ui_thread_DIFFERS_from_game_id\";\n return r;\n}\n}\n",
            "src/tracking_rate.hpp": "#pragma once\n#include <cstdint>\n#include <cstring>\nnamespace zk {\nstruct TrackingRate {\n static constexpr unsigned intervalMs=50,maxTicks=600,durationMs=30000,packetMaxAgeMs=150,markerLifetimeMs=200;\n unsigned ticks=0,overruns=0;int64_t maxWorkMs=0,totalWorkMs=0,lastLogSecond=-1;\n static bool active(int64_t elapsed,unsigned tick){return elapsed>=0&&elapsed<durationMs&&tick<maxTicks;}\n static unsigned phase(unsigned second){return second<5?0:second<10?1:2;}\n bool verbose(int64_t elapsed){const auto second=elapsed/1000;if(second==lastLogSecond)return false;lastLogSecond=second;return true;}\n void record(int64_t work){if(work<0)return;++ticks;totalWorkMs+=work;if(work>maxWorkMs)maxWorkMs=work;if(work>intervalMs)++overruns;}\n static bool packetFresh(double ageMs){return ageMs>=0&&ageMs<=packetMaxAgeMs;}\n};\n// Microsecond timing only; no effect on read validation or scheduling.\nstruct TrackingWaitStats {\n uint32_t intervals=0,sleeps=0,uiCalls=0,workCalls=0;\n int64_t intervalTotal=0,intervalMax=0,sleepRequested=0,sleepActual=0,sleepOverMax=0,uiTotal=0,uiMax=0,workTotal=0,workMax=0;\n static bool valid(int64_t us){return us>=0&&us<=60000000;}\n void interval(int64_t us){if(!valid(us))return;++intervals;intervalTotal+=us;if(us>intervalMax)intervalMax=us;}\n void sleep(int64_t requested,int64_t actual){if(!valid(requested)||!valid(actual))return;++sleeps;sleepRequested+=requested;sleepActual+=actual;const int64_t over=actual>requested?actual-requested:0;if(over>sleepOverMax)sleepOverMax=over;}\n void ui(int64_t us){if(!valid(us))return;++uiCalls;uiTotal+=us;if(us>uiMax)uiMax=us;}\n void work(int64_t us){if(!valid(us))return;++workCalls;workTotal+=us;if(us>workMax)workMax=us;}\n};\ninline bool trackingVerboseLine(const char *fmt){\n const char *tags[]={\"[camera-sample]\",\"[local-position-sample]\",\"[pawn-world]\",\"[pawn-candidates]\",\"[training-candidates]\",\"[training-selection]\",\"[projection-setup]\",\"[training-actor-sample]\",\"[training-projection]\"};\n for(const char *tag:tags)if(!std::strncmp(fmt,tag,std::strlen(tag)))return true;return false;\n}\n}\n",
            "src/training_components.hpp": "#pragma once\n#include \"targeted_pawn_candidates.hpp\"\nnamespace zk {\nstruct ChildComponent {int32_t index=-1;char name[65]{},cls[65]{};float position[3]{};};\nstruct ComponentSample {const char *status=\"not_checked\";unsigned seen=0,valid=0;int32_t total=0;ChildComponent child[4]{};};\ntemplate<class Read> ComponentSample sampleChildren(uintptr_t actor,uintptr_t component,InstanceReader<Read> &lookup){\n ComponentSample result;ObjectHead root{};char rn[65]{},rc[65]{};\n if(!validateOuterNode(component,lookup,root,rn,rc)||root.outer!=actor||!std::strstr(rc,\"Component\")){result.status=\"root_rejected\";return result;}\n unsigned char raw[16]{};if(!safeSpan(component,0x22c)||!lookup.read(component+0x198,raw,16)){result.status=\"children_header_unreadable\";return result;}\n uintptr_t data=0;int32_t count=0,capacity=0;std::memcpy(&data,raw,8);std::memcpy(&count,raw+8,4);std::memcpy(&capacity,raw+12,4);result.total=count;\n if(count<0||capacity<count||capacity>128||(count&&!candidatePointer(data))){result.status=\"children_layout_rejected\";return result;}\n for(unsigned i=0;i<unsigned(count)&&i<4;++i){++result.seen;uintptr_t p=0;if(!safeSpan(data,size_t(i+1)*8)||!lookup.read(data+i*8,&p,8))continue;\n  ObjectHead h{};ChildComponent entry;\n  if(!validateOuterNode(p,lookup,h,entry.name,entry.cls)||h.outer!=actor||!std::strstr(entry.cls,\"Component\")||!safeSpan(p,0x22c))continue;\n  entry.index=h.index;if(!lookup.read(p+0x220,entry.position,12))continue;bool good=true;for(float x:entry.position)if(!std::isfinite(x)||std::fabs(x)>1e9f)good=false;\n  ObjectHead after{};uintptr_t again=0;if(!lookup.read(p,&after,sizeof(after))||std::memcmp(&h,&after,sizeof(h))||!lookup.read(data+i*8,&again,8)||again!=p)good=false;\n  if(good)result.child[result.valid++]=entry;\n }\n unsigned char after[16]{};ObjectHead rootAfter{};\n if(!lookup.read(component+0x198,after,16)||std::memcmp(raw,after,16)||!lookup.read(component,&rootAfter,size