      - name: Test name, object and instance readers
        run: |
          cd "$RUNNER_TEMP/zkprobe-instances-v22r64"
          for unit in targeted objects instances retry growth groups ownership camera link manual local pawn training level projection batches components calibration rank rate stop eight preparation sixteen budget rotation twenty rays fov control route threads async uuid angle trainingstep residual tuning; do
            clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g "tests/${unit}_test.cpp" -o "$RUNNER_TEMP/zkprobe-${unit}-test"
            "$RUNNER_TEMP/zkprobe-${unit}-test"
          done
      - name: Test imported skeleton metadata and projection
        run: |
          cd "$RUNNER_TEMP/zkprobe-instances-v22r64"
          for unit in bones_projection live_pose names overlay_style player_aim; do
            clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc/vng07 "tests/vng07/test_${unit}.cpp" -o "$RUNNER_TEMP/vng07-${unit}-test"
            "$RUNNER_TEMP/vng07-${unit}-test"
          done
      - name: Install signing tool
        run: brew install ldid-procursus
      - name: Build diagnostic dylib
        run: |
          cd "$RUNNER_TEMP/zkprobe-instances-v22r64"
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZKProbe-instances-v22r64
          path: ${{ runner.temp }}/zkprobe-instances-v22r64/artifacts/*
          if-no-files-found: error
