            "src/vng07/PlayerAimMath.h": "#pragma once\n#include \"Projection.h\"\n#include <array>\nnamespace PIPlayerAim {\nstruct Result { bool Valid=false;double ErrorPitch=0,ErrorYaw=0;std::array<float,3> Rotation{}; };\ninline Result Step(PIProjection::Vec Point,PIProjection::Vec Camera,\n                   PIProjection::Vec View,const float* Control,double Seconds,double PitchCorrection=0) {\n using namespace PIProjection;\n Result Out;\n if(!std::isfinite(PitchCorrection)||std::abs(PitchCorrection)>2.4||!Control||!Finite(Point)||!Finite(Camera)||!Finite(View)||!std::isfinite(Seconds)||Seconds<=0||Seconds>.25)return Out;\n for(int I=0;I<3;++I)if(!std::isfinite(Control[I])||std::abs(Control[I])>360000)return Out;\n const Vec D=Sub(Point,Camera);const double XY=std::hypot(D.X,D.Y);\n if(XY<1||std::hypot(XY,D.Z)<10)return Out;\n constexpr double Degrees=180.0/3.14159265358979323846;\n const double Pitch=atan2(D.Z,XY)*Degrees,Yaw=atan2(D.Y,D.X)*Degrees;\n const double Gain=1-exp(-Seconds/.08),Limit=90*std::min(Seconds,1.0/30.0);\n Out.ErrorPitch=std::remainder(Pitch-View.X,360.0);\n const double DP=std::clamp(Out.ErrorPitch*Gain+PitchCorrection,-Limit,Limit);\n Out.ErrorYaw=std::remainder(Yaw-View.Y,360.0);\n const double DY=std::clamp(Out.ErrorYaw*Gain,-Limit,Limit);\n Out.Rotation={float(std::clamp(std::remainder(double(Control[0]),360.0)+DP,-89.0,89.0)),\n     float(std::remainder(double(Control[1])+DY,360.0)),Control[2]};\n Out.Valid=true;return Out;\n}\n}\n",
            "src/vng07/Projection.h": "#pragma once\n#include <cmath>\n#include <algorithm>\nnamespace PIProjection {\nstruct Vec { double X=0,Y=0,Z=0; };\ninline Vec Add(Vec A,Vec B){return {A.X+B.X,A.Y+B.Y,A.Z+B.Z};}\ninline Vec Sub(Vec A,Vec B){return {A.X-B.X,A.Y-B.Y,A.Z-B.Z};}\ninline Vec Mul(Vec A,Vec B){return {A.X*B.X,A.Y*B.Y,A.Z*B.Z};}\ninline Vec Scale(Vec A,double S){return {A.X*S,A.Y*S,A.Z*S};}\ninline double Dot(Vec A,Vec B){return A.X*B.X+A.Y*B.Y+A.Z*B.Z;}\ninline bool Finite(Vec V){return std::isfinite(V.X)&&std::isfinite(V.Y)&&std::isfinite(V.Z);}\nstruct Rotation { Vec Forward{1,0,0},Right{0,1,0},Up{0,0,1}; };\ninline Rotation Euler(Vec Angles){\n    const double K=3.14159265358979323846/180.0;\n    const double P=Angles.X*K,Y=Angles.Y*K,R=Angles.Z*K;\n    const double CP=cos(P),SP=sin(P),CY=cos(Y),SY=sin(Y),CR=cos(R),SR=sin(R);\n    return {{CP*CY,CP*SY,SP},{SR*SP*CY-CR*SY,SR*SP*SY+CR*CY,-SR*CP},{-CR*SP*CY-SR*SY,CY*SR-CR*SP*SY,CR*CP}};\n}\ninline Vec Rotate(Rotation R,Vec V){return Add(Add(Scale(R.Forward,V.X),Scale(R.Right,V.Y)),Scale(R.Up,V.Z));}\ninline Rotation Combine(Rotation Parent,Rotation Child){return {Rotate(Parent,Child.Forward),Rotate(Parent,Child.Right),Rotate(Parent,Child.Up)};}\nstruct Transform { Vec Translation;Rotation Orientation;Vec Scale3D{1,1,1}; };\ninline Vec Point(Transform T,Vec V){return Add(T.Translation,Rotate(T.Orientation,Mul(V,T.Scale3D)));}\nstruct Screen {double X=0,Y=0,Depth=0;bool InFront=false,Inside=false;};\ninline Screen Project(Vec World,Vec Camera,Rotation View,double FOV,double Width,double Height,double Aspect=0,bool Constrain=false){\n    Screen S;\n    if(!Finite(World)||!Finite(Camera)||!std::isfinite(FOV)||FOV<=1||FOV>=179||Width<=0||Height<=0) return S;\n    Vec Delta=Sub(World,Camera);S.Depth=Dot(Delta,View.Forward);\n    if(!std::isfinite(S.Depth)||S.Depth<=1) return S;\n    double W=Width,H=Height,Left=0,Top=0;\n    if(Constrain&&std::isfinite(Aspect)&&Aspect>0.1&&Aspect<10){\n        if(W/H>Aspe