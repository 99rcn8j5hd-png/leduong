# Complete source snapshot; no dependency on uploaded companion files.
name: Build ZKProbe R64 VNG07 Character Skeleton Intel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Prepare complete source snapshot
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          sources=json.loads(r'''{
            "build.sh": "#!/bin/bash\nset -euo pipefail\ncd \"$(dirname \"$0\")\"\nmkdir -p build artifacts\nSDK=$(xcrun --sdk iphoneos --show-sdk-path)\nfor arch in arm64 arm64e; do\n  mkdir -p \"build/$arch\"\n  for source in src/probe.mm src/character_overlay.mm src/vng07/Backend.mm src/vng07/OverlayView.mm; do\n    unit=$(basename \"$source\" .mm)\n    xcrun clang++ -isysroot \"$SDK\" -arch \"$arch\" -miphoneos-version-min=15.0 -std=c++17 -O2 -fobjc-arc -Isrc -c \"$source\" -o \"build/$arch/$unit.o\"\n  done\n  xcrun clang++ -isysroot \"$SDK\" -arch \"$arch\" -miphoneos-version-min=15.0 -dynamiclib \"build/$arch/\"*.o -framework Foundation -framework UIKit -framework QuartzCore -framework CoreGraphics -Wl,-install_name,@rpath/ZKProbe.dylib -o \"build/$arch/ZKProbe.dylib\"\ndone\nxcrun lipo -create build/arm64/ZKProbe.dylib build/arm64e/ZKProbe.dylib -output artifacts/ZKProbe.dylib\nldid -S artifacts/ZKProbe.dylib\nxcrun lipo -info artifacts/ZKProbe.dylib\nshasum -a 256 artifacts/ZKProbe.dylib > artifacts/SHA256.txt\n",
            "R64_README.txt": "ZKProbe R64 \u2014 ESP nh\u00e2n v\u1eadt/x\u01b0\u01a1ng VNG07\n\nCh\u1ec9 gh\u00e9p Backend + OverlayView v\u00e0 c\u00e1c header ph\u1ee5 thu\u1ed9c t\u1eeb source ZIP ng\u01b0\u1eddi d\u00f9ng g\u1eedi.\nKh\u00f4ng gh\u00e9p Main.mm, menu g\u1ed1c, constructor ri\u00eang, ch\u1ee9c n\u0103ng dump SDK ho\u1eb7c th\u01b0 vi\u1ec7n ngo\u00e0i.\nGi\u1eef b\u1ea3n quy\u1ec1n MIT trong src/vng07/LICENSE-MIT-MJx0.txt.\n\nESP bia c\u0169 \u0111\u01b0\u1ee3c thay trong menu b\u1eb1ng ESP nh\u00e2n v\u1eadt/x\u01b0\u01a1ng. Aim bia c\u0169 kh\u00f4ng \u0111\u01b0\u1ee3c n\u1ed1i\nsang nh\u00e2n v\u1eadt; c\u00e1c \u0111i\u1ec1u khi\u1ec3n bia \u0111\u00e3 \u0111\u01b0\u1ee3c g\u1ee1 kh\u1ecfi menu c\u1ee7a b\u1ea3n n\u00e0y.\nTh\u00eam Aim nh\u00e2n v\u1eadt ri\u00eang, m\u1eb7c \u0111\u1ecbnh T\u1eaeT: b\u00e1m x\u01b0\u01a1ng spine_03 \u0111\u01b0\u1ee3c x\u00e1c minh t\u1eeb live pose\nv\u00e0 metadata trong FOV, lo\u1ea1i \u0111\u1ed3ng \u0111\u1ed9i/b\u1ea3n th\u00e2n/m\u1ee5c ti\u00eau kh\u00f4ng c\u00f2n HP. Kh\u00f4ng t\u1ef1 b\u1eafn.\nKhi b\u1eadt Aim, module c\u1eadp nh\u1eadt tr\u01b0\u1eddng ControlRotation theo profile t\u1eeb source ZIP;\n\u0111\u1ecdc l\u1ea1i g\u00f3c \u0111\u1ec3 x\u00e1c nh\u1eadn, l\u1ed7i ghi/x\u00e1c nh\u1eadn s\u1ebd ch\u1eb7n Aim t\u1edbi l\u1ea7n Qu\u00e9t l\u1ea1i ti\u1ebfp theo.\nKh\u00f4ng g\u1ecdi setter game, kh\u00f4ng d\u00f9ng \u0111\u01b0\u1eddng async anogs c\u1ee7a b\u1ea3n bia. Gain gi\u1edbi h\u1ea1n,\nkh\u00f4ng mang m\u1ee9c b\u00f9 gi\u1eadt 50/200/300 c\u1ee7a bia sang ng\u01b0\u1eddi ch\u01a1i.\n\nC\u00e1ch th\u1eed: ch\u1ec9 b\u1eadt m\u1ed9t ZKProbe, v\u00e0o khu/tr\u1eadn c\u00f3 nh\u00e2n v\u1eadt r\u1ed3i m\u1edf menu ESP.\nB\u1ea5m B\u1eadt ESP nh\u00e2n v\u1eadt / x\u01b0\u01a1ng; qu\u00e9t ban \u0111\u1ea7u ch\u1ea1y n\u1ec1n v\u00e0 c\u00f3 gi\u1edbi h\u1ea1n 8 gi\u00e2y.\nQu\u00e9t l\u1ea1i sau khi \u0111\u1ed5i b\u1ea3n \u0111\u1ed3, chuy\u1ec3n tr\u1eadn ho\u1eb7c khi c\u1ea7n t\u00ecm nh\u00e2n v\u1eadt m\u1edbi.\nM\u1eb7c \u0111\u1ecbnh \u1ea9n \u0111\u1ed3ng \u0111\u1ed9i v\u00e0 b\u1ea3n th\u00e2n, ph\u1ea1m vi 300 m, \u0111\u1ecdc t\u1ed1i \u0111a 30 khung/gi\u00e2y,\nv\u1ebd theo m\u00e0n h\u00ecnh t\u1ed1i \u0111a 60 Hz v\u00e0 n\u1ed9i suy d\u1eef li\u1ec7u. M\u1ed9t t\u00e1c v\u1ee5 \u0111\u1ecdc t\u1ea1i m\u1ed9t th\u1eddi \u0111i\u1ec3m.\nT\u1eaft/b\u1eadt l\u1ea1i b\u1ecf k\u1ebft qu\u1ea3 phi\u00ean c\u0169. R\u1eddi \u1ee9ng d\u1ee5ng s\u1ebd t\u1eaft; kh\u00f4ng v\u1ebd d\u1eef li\u1ec7u c\u0169 qu\u00e1 250 ms.\n\nB\u1ed9 \u0111\u1ebfm l\u00e0 nh\u00e2n v\u1eadt \u0111\u00e3 \u0111\u1ecdc h\u1ee3p l\u1ec7 trong ph\u1ea1m vi 300 m, bao g\u1ed3m AI/h\u00ecnh nh\u00e2n\nn\u1ebfu game d\u00f9ng c\u00f9ng nh\u00f3m class. Kh\u00f4ng ph\u1ea3i t\u1ed5ng s\u1ed1 ng\u01b0\u1eddi s\u1ed1ng trong tr\u1eadn.\nS\u1ed1 hi\u1ec3n th\u1ecb c\u00f3 th\u1ec3 nh\u1ecf h\u01a1n s\u1ed1 ph\u00e1t hi\u1ec7n do nh\u00e2n v\u1eadt ngo\u00e0i m\u00e0n h\u00ecnh ho\u1eb7c kh\u00f4ng \u0111\u1ecdc\n\u0111\u01b0\u1ee3c pose. Gi\u1edbi h\u1ea1n danh s\u00e1ch kh\u00e1m ph\u00e1 512 nh\u00e2n v\u1eadt, t\u1ed1i \u0111a 64 m\u1ee5c hi\u1ec3n th\u1ecb.\nCh\u01b0a x\u00e1c minh \u0111\u1ed9i local ho\u1eb7c \u0111\u1ed9i m\u1ee5c ti\u00eau th\u00ec kh\u00f4ng hi\u1ec3n th\u1ecb m\u1ee5c ti\u00eau \u0111\u00f3.\nKh\u00f4ng t\u1ea1o x\u01b0\u01a1ng gi\u1ea3 khi thi\u1ebfu pose/t\u00ean x\u01b0\u01a1ng. Profile \u0111\u01b0\u1ee3c gi\u1eef t\u1eeb ZIP cho VNG 4.6.0;\nkh\u00f4ng suy ra profile m\u1edbi t\u1eeb t\u00ean phi\u00ean b\u1ea3n. C\u1ea7n ki\u1ec3m tra tr\u00ean thi\u1ebft b\u1ecb c\u1ee7a ng\u01b0\u1eddi d\u00f9ng.\nESP ch\u1ec9 \u0111\u1ecdc b\u1ed9 nh\u1edb. Aim c\u00f3 ghi ControlRotation khi ng\u01b0\u1eddi d\u00f9ng b\u1eadt; kh\u00f4ng ghi log m\u1ed7i khung.\nCh\u01b0a \u0111\u01b0\u1ee3c ch\u1ea1y th\u1eed Aim tr\u00ean thi\u1ebft b\u1ecb; kh\u00f4ng kh\u1eb3ng \u0111\u1ecbnh b\u00e1m/ch\u1ed1ng gi\u1eadt nh\u01b0 b\u1ea3n bia.\nKh\u00f4ng c\u00e0i b\u1ed9 quan s\u00e1t n\u00fat b\u1eafn c\u0169 c\u1ee7a bia trong c\u1eeda s\u1ed5 game.\n",
            "src/angle_test.hpp": "#pragma once\n#include \"angle_test_core.hpp\"\n#include \"training_step.hpp\"\nstatic bool hasFreshTrainingPick();\nstatic bool requestTrainingStep(bool automatic=false);\nstatic auto oneDegreeState=std::make_shared<zk::AngleTest>();\nstatic std::atomic<unsigned> manualAttempts{0};\nstatic void attachTrainingControls(UIWindow*window);\nstatic void refreshTrainingControls();\nstatic bool retryStateReady(const std::shared_ptr<zk::AngleTest>&state){const auto phase=state->phase.load(std::memory_order_acquire);if(phase==zk::AnglePhase::Idle)return true;if(phase!=zk::AnglePhase::Completed&&phase!=zk::AnglePhase::Rejected)return false;return zk::manualRetryAllowed(true,state->completedUs,std::chrono::duration_cast<std::chrono::microseconds>(std::chrono::steady_clock::now().time_since_epoch()).count(),manualAttempts.load());}\nstatic std::atomic<uint64_t> angleEpoch{0};\nstatic std::atomic<bool> angleActive{false},angleReady{false};\nstatic int64_t angleNowUs(){return std::chrono::duration_cast<std::chrono::microseconds>(std::chrono::steady_clock::now().time_since_epoch()).count();}\nstruct AnglePayload {uintptr_t base=0,names=0,arrayRVA=0,pawn=0,world=0;int32_t controllerIndex=-1,pawnIndex=-1,worldIndex=-1;uint32_t gameThread=0;uint64_t epoch=0;zk::OwnershipTarget local,target,camera;zk::ArraySnapshot fixed;};\nstruct AngleTaskRead {\n zk::AngleTest&state;explicit AngleTaskRead(zk::AngleTest&s):state(s){}\n unsigned calls=0;size_t bytes=0;const int64_t start=angleNowUs();\n bool active()const{return angleNowUs()-start<=20000;}\n bool read(uintptr_t address,void*out,size_t n){\n  if(!active()||calls>=1024||n>65536-bytes||state.totalReadCalls>=16384||n>1048576-state.totalReadBytes||!out||address<0x10000||n>UINTPTR_MAX-address)return false;\n  ++calls;bytes+=n;++state.totalReadCalls;state.totalReadBytes+=n;vm_size_t got=0;\n  return vm_read_overwrite(mach_task_self(),(vm_address_t)address,(vm_size_t)n,(vm_address_t)out,&got)==KERN_SUCCESS&