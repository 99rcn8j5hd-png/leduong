            "tests/level_test.cpp": "#define main old_local_test_main\n#include \"local_test.cpp\"\n#undef main\n#include \"../src/targeted_pawn_candidates.hpp\"\nvoid extendWorld(LocalFixture &f){\n f.put<int32_t>(LocalFixture::names+0x400,10);\n for(unsigned id=7;id<=9;++id){f.put<uintptr_t>(LocalFixture::chunk+id*8,LocalFixture::entries+id*128);std::strcpy((char*)f.m.data()+LocalFixture::entries+id*128-LocalFixture::base+12,id==7?\"World\":id==8?\"TrainingWorld\":\"AI_Pawn\");}\n for(unsigned i=9;i<=13;++i){zk::ObjectHead h{};h.index=i;h.vtable=0x40000;h.cls=LocalFixture::object(i==9?0:i==10||i==13?9:i==11?3:4);h.nameId=i==9?7:i==10||i==13?8:i==11?9:6;h.outer=i==11?LocalFixture::object(10):i==12?LocalFixture::object(11):0;f.put(LocalFixture::object(i),h);f.put<uintptr_t>(LocalFixture::items+i*24,LocalFixture::object(i));}\n f.put<uintptr_t>(LocalFixture::object(7)+0x20,LocalFixture::object(10));f.put<uintptr_t>(LocalFixture::object(11)+0x208,LocalFixture::object(12));f.put<float>(LocalFixture::object(12)+0x220,110);f.put<float>(LocalFixture::object(12)+0x224,210);f.put<float>(LocalFixture::object(12)+0x228,310);\n}\n\nconstexpr uintptr_t expectedGetter=0x44448;\nvoid addLevels(LocalFixture &f){extendWorld(f);f.put<int32_t>(LocalFixture::names+0x400,11);f.put<uintptr_t>(LocalFixture::chunk+10*8,LocalFixture::entries+10*128);std::strcpy((char*)f.m.data()+LocalFixture::entries+10*128-LocalFixture::base+12,\"Level\");\n for(unsigned i=14;i<=16;++i){zk::ObjectHead h{};h.index=i;h.vtable=0x40000;h.cls=LocalFixture::object(i==16?0:16);h.nameId=i==16?10:6;h.outer=i==14?LocalFixture::object(10):i==15?LocalFixture::object(13):0;f.put(LocalFixture::object(i),h);f.put<uintptr_t>(LocalFixture::items+i*24,LocalFixture::object(i));}\n f.put<uintptr_t>(LocalFixture::object(7)+0x20,LocalFixture::object(14));f.put<uintptr_t>(LocalFixture::object(11)+0x20,LocalFixture::object(15));f.put<uintptr_t>(LocalFixture::object(14)+0xc0,LocalFixture::object(10));f.put<uintptr_t>(LocalFixture::object(15)+0xc0,LocalFixture::object(10));f.put<uintptr_t>(0x40000+0x168,expectedGetter);\n}\nint main(){unsigned tests=0;\n for(unsigned mode=0;mode<5;++mode){LocalFixture f;addLevels(f);if(mode==1)f.put<uintptr_t>(LocalFixture::object(15)+0xc0,LocalFixture::object(13));if(mode==2)f.put<uintptr_t>(LocalFixture::object(15)+0xc0,0);if(mode==3)f.put<uintptr_t>(0x40000+0x168,0);if(mode==4)f.put<uintptr_t>(LocalFixture::object(15)+0xc0,LocalFixture::object(6));\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,17,LocalFixture::names);assert(lookup.names.init());\n  auto local=zk::resolveLevelWorld(LocalFixture::object(7),lookup,expectedGetter);auto other=zk::resolveLevelWorld(LocalFixture::object(11),lookup,expectedGetter);\n  if(!mode){assert(local.world.ptr==other.world.ptr&&local.world.ptr==LocalFixture::object(10));assert(zk::findOwningWorld(LocalFixture::object(11),lookup).ptr==LocalFixture::object(13));zk::OwnershipTarget target;target.ptr=LocalFixture::object(11);std::memcpy(&target.original,f.m.data()+target.ptr-LocalFixture::base,sizeof(target.original));auto result=zk::readOtherPawn(target,LocalFixture::object(7),local.world,lookup,false,expectedGetter);assert(!std::strcmp(result.status,\"same_world_pawn_position_candidate\")&&result.outerWorldIndex==13&&result.worldIndex==10&&result.levelIndex==15);}\n  if(mode==1)assert(other.world.ptr!=local.world.ptr);\n  if(mode==2)assert(!std::strcmp(other.world.status,\"level_world_pointer_invalid\"));if(mode==3)assert(!std::strcmp(other.world.status,\"level_world_getter_mismatch\"));if(mode==4)assert(!std::strcmp(other.world.status,\"level_world_object_invalid\"));++tests;\n }\n {LocalFixture f;addLevels(f);unsigned reads=0;auto rd=[&](uintptr_t a,void*p,size_t n){if(a==LocalFixture::object(15)+0xc0&&++reads==2)f.put<uintptr_t>(a,0);return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,17,LocalFixture::names);assert(lookup.names.init());assert(!std::strcmp(zk::resolveLevelWorld(LocalFixture::object(11),lookup,expectedGetter).world.status,\"level_world_changed_during_read\"));++tests;}\n {zk::OwnershipTargets saved;zk::ObjectHead h{};const unsigned g=unsigned(zk::CandidateGroup::TrainingOther);for(unsigned i=0;i<32;++i)saved.save(g,0x10000+i*8,h,\"TrainingManager\");for(unsigned i=0;i<4;++i)saved.save(g,0x20000+i*8,h,\"BP_ShootingPracticeTarget_3_C\");unsigned priority=0;for(unsigned i=0;i<saved.used[g];++i)priority+=saved.records[g][i].priority?1:0;assert(saved.used[g]==36&&priority==4);const auto selection=zk::selectTraining(saved);assert(selection.count==16);for(unsigned i=0;i<4;++i)assert(saved.records[g][selection.indices[i]].priority);for(unsigned i=0;i<selection.count;++i)for(unsigned j=0;j<i;++j)assert(selection.indices[i]!=selection.indices[j]);++tests;}\n for(unsigned fail=1;fail<=100;++fail){LocalFixture f;addLevels(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,17,LocalFixture::names);assert(lookup.names.init());f.failAt=f.calls+fail;auto result=zk::resolveLevelWorld(LocalFixture::object(11),lookup,expectedGetter);assert(result.world.status&&f.calls<130);++tests;}\n std::printf(\"PASS: %u Level/World relation and priority cases\\n\",tests);return 0;\n}\n",
            "src/training_projection.hpp": "#pragma once\n#include <cmath>\nnamespace zk {\nstruct Projection {const char *status=\"invalid_input\";double x=0,y=0,depth=0;};\n// Normalized coordinates, horizontal FOV assumption. No game calls or memory access.\ninline Projection projectTraining(const float *point,const float *location,const float *rotation,double fov,double aspect){\n Projection r;\n if(!point||!location||!rotation||!std::isfinite(fov)||fov<1||fov>179||!std::isfinite(aspect)||aspect<0.2||aspect>5)return r;\n for(unsigned i=0;i<3;++i)if(!std::isfinite(point[i])||!std::isfinite(location[i])||!std::isfinite(rotation[i]))return r;\n const double rad=3.14159265358979323846/180, p=rotation[0]*rad,y=rotation[1]*rad,b=rotation[2]*rad;\n const double cp=std::cos(p),sp=std::sin(p),cy=std::cos(y),sy=std::sin(y),cr=std::cos(b),sr=std::sin(b);\n const double dx=double(point[0])-location[0],dy=double(point[1])-location[1],dz=double(point[2])-location[2];\n r.depth=dx*cp*cy+dy*cp*sy+dz*sp;\n if(r.depth<=1){r.status=\"behind_or_near_camera\";return r;}\n const double right=dx*(sr*sp*cy-cr*sy)+dy*(sr*sp*sy+cr*cy)-dz*sr*cp;\n const double up=-dx*(cr*sp*cy+sr*sy)+dy*(cy*sr-cr*sp*sy)+dz*cr*cp;\n const double scale=2*r.depth*std::tan(fov*rad/2);\n r.x=0.5+right/scale;r.y=0.5-up*aspect/scale;\n if(!std::isfinite(r.x)||!std::isfinite(r.y)){r.status=\"invalid_projection\";return r;}\n r.status=(r.x>=0&&r.x<=1&&r.y>=0&&r.y<=1)?\"in_view_UNVERIFIED\":\"outside_view\";return r;\n}\n}\n",
            "tests/projection_test.cpp": "#include \"../src/training_projection.hpp\"\n#include <cassert>\n#include <cstring>\n#include <limits>\n#include <cstdio>\n#include <initializer_list>\nint main(){unsigned count=0;const float origin[3]{},zero[3]{};float p[3]{100,0,0};\n auto r=zk::projectTraining(p,origin,zero,90,2);assert(std::fabs(r.x-.5)<1e-9&&std::fabs(r.y-.5)<1e-9);++count;\n p[1]=100;r=zk::projectTraining(p,origin,zero,90,2);assert(std::fabs(r.x-1)<1e-9);++count;\n p[1]=0;p[2]=25;r=zk::projectTraining(p,origin,zero,90,2);assert(std::fabs(r.y-.25)<1e-9);++count;\n p[0]=-100;r=zk::projectTraining(p,origin,zero,90,2);assert(!std::strcmp(r.status,\"behind_or_near_camera\"));++count;\n for(unsigned angle=0;angle<360;++angle){double a=angle*3.14159265358979323846/180;float rotation[3]{0,float(angle),0};float q[3]{float(100*std::cos(a)),float(100*std::sin(a)),0};r=zk::projectTraining(q,origin,rotation,80,2);assert(std::fabs(r.x-.5)<1e-6&&std::fabs(r.y-.5)<1e-6);++count;}\n for(float pitch:{-80.f,-40.f,0.f,40.f,80.f}){double a=pitch*3.14159265358979323846/180;float rotation[3]{pitch,0,0},q[3]{float(100*std::cos(a)),0,float(100*std::sin(a))};r=zk::projectTraining(q,origin,rotation,80,2);assert(std::fabs(r.x-.5)<1e-6&&std::fabs(r.y-.5)<1e-6);++count;}\n float roll[3]{0,0,90},q[3]{100,25,0};r=zk::projectTraining(q,origin,roll,90,2);assert(std::fabs(r.x-.5)<1e-6&&std::fabs(r.y-.25)<1e-6);++count;\n for(double bad:{0.,180.,std::numeric_limits<double>::infinity(),std::numeric_limits<double>::quiet_NaN()}){r=zk::projectTraining(q,origin,zero,bad,2);assert(!std::strcmp(r.status,\"invalid_input\"));++count;}\n q[0]=std::numeric_limits<float>::quiet_NaN();r=zk::projectTraining(q,origin,zero,90,2);assert(!std::strcmp(r.status,\"invalid_input\"));++count;\n std::printf(\"PASS: %u projection geometry cases\\n\",count);return 0;}\n",
            "tests/batches_test.cpp": "#include \"../src/targeted_instances.hpp\"\n#include <cassert>\n#include <cstdio>\nint main(){unsigned cases=0;const unsigned g=unsigned(zk::CandidateGroup::TrainingOther);\n for(unsigned n=0;n<=160;++n){zk::OwnershipTargets t;zk::ObjectHead h{};for(unsigned i=0;i<n;++i)t.save(g,0x10000+i*8,h,i%3?\"TrainingManager\":\"PracticeTarget\");\n  const unsigned count=n<128?n:128;assert(t.used[g]==count);bool seen[128]{};unsigned total=0;\n  const unsigned batches=(count+15)/16;\n  for(unsigned b=0;b<batches;++b){auto s=zk::selectTraining(t,b);assert(s.count<=16);for(unsigned i=0;i<s.count;++i){assert(s.indices[i]<count&&!seen[s.indices[i]]);seen[s.indices[i]]=true;++total;}}\n  assert(total==count);if(!count)assert(!zk::selectTraining(t,10).count);else{auto a=zk::selectTraining(t,0),b=zk::selectTraining(t,batches);assert(a.count==b.count);for(unsigned i=0;i<a.count;++i)assert(a.indices[i]==b.indices[i]);}++cases;\n }std::printf(\"PASS: %u bounded batch coverage cases\\n\",cases);return 0;}\n",
            "src/training_components.hpp": "#pragma once\n#include \"targeted_pawn_candidates.hpp\"\nnamespace zk {\nstruct ChildComponent {int32_t index=-1;char name[65]{},cls[65]{};float position[3]{};};\nstruct ComponentSample {const char *status=\"not_checked\";unsigned seen=0,valid=0;int32_t total=0;ChildComponent child[4]{};};\ntemplate<class Read> ComponentSample sampleChildren(uintptr_t actor,uintptr_t component,InstanceReader<Read> &lookup){\n ComponentSample result;ObjectHead root{};char rn[65]{},rc[65]{};\n if(!validateOuterNode(component,lookup,root,rn,rc)||root.outer!=actor||!std::strstr(rc,\"Component\")){result.status=\"root_rejected\";return result;}\n unsigned char raw[16]{};if(!safeSpan(component,0x22c)||!lookup.read(component+0x198,raw,16)){result.status=\"children_header_unreadable\";return result;}\n uintptr_t data=0;int32_t count=0,capacity=0;std::memcpy(&data,raw,8);std::memcpy(&count,raw+8,4);std::memcpy(&capacity,raw+12,4);result.total=count;\n if(count<0||capacity<count||capacity>128||(count&&!candidatePointer(data))){result.status=\"children_layout_rejected\";return result;}\n for(unsigned i=0;i<unsigned(count)&&i<4;++i){++result.seen;uintptr_t p=0;if(!safeSpan(data,size_t(i+1)*8)||!lookup.read(data+i*8,&p,8))continue;\n  ObjectHead h{};ChildComponent entry;\n  if(!validateOuterNode(p,lookup,h,entry.name,entry.cls)||h.outer!=actor||!std::strstr(entry.cls,\"Component\")||!safeSpan(p,0x22c))continue;\n  entry.index=h.index;if(!lookup.read(p+0x220,entry.position,12))continue;bool good=true;for(float x:entry.position)if(!std::isfinite(x)||std::fabs(x)>1e9f)good=false;\n  ObjectHead after{};uintptr_t again=0;if(!lookup.read(p,&after,sizeof(after))||std::memcmp(&h,&after,sizeof(h))||!lookup.read(data+i*8,&again,8)||again!=p)good=false;\n  if(good)result.child[result.valid++]=entry;\n }\n unsigned char after[16]{};ObjectHead rootAfter{};\n if(!lookup.read(component+0x198,after,16)||std::memcmp(raw,after,16)||!lookup.read(component,&rootAfter,sizeof(rootAfter))||std::memcmp(&root,&rootAfter,sizeof(root))){result.valid=0;result.status=\"children_changed\";return result;}\n result.status=count?\"bounded_child_candidates_NOT_visual_verified\":\"no_children\";return result;\n}\n}\n",
            "tests/components_test.cpp": "#define main old_local_test_main\n#include \"local_test.cpp\"\n#undef main\nvoid extendWorld(LocalFixture &f){\n f.put<int32_t>(LocalFixture::names+0x400,10);\n for(unsigned id=7;id<=9;++id){f.put<uintptr_t>(LocalFixture::chunk+id*8,LocalFixture::entries+id*128);std::strcpy((char*)f.m.data()+LocalFixture::entries+id*128-LocalFixture::base+12,id==7?\"World\":id==8?\"TrainingWorld\":\"AI_Pawn\");}\n for(unsigned i=9;i<=13;++i){zk::ObjectHead h{};h.index=i;h.vtable=0x40000;h.cls=LocalFixture::object(i==9?0:i==10||i==13?9:i==11?3:4);h.nameId=i==9?7:i==10||i==13?8:i==11?9:6;h.outer=i==11?LocalFixture::object(10):i==12?LocalFixture::object(11):0;f.put(LocalFixture::object(i),h);f.put<uintptr_t>(LocalFixture::items+i*24,LocalFixture::object(i));}\n f.put<uintptr_t>(LocalFixture::object(7)+0x20,LocalFixture::object(10));f.put<uintptr_t>(LocalFixture::object(11)+0x208,LocalFixture::object(12));f.put<float>(LocalFixture::object(12)+0x220,110);f.put<float>(LocalFixture::object(12)+0x224,210);f.put<float>(LocalFixture::object(12)+0x228,310);\n}\n\n#include \"../src/training_components.hpp\"\nint main(){unsigned tests=0;\n for(unsigned mode=0;mode<6;++mode){LocalFixture f;extendWorld(f);uintptr_t a=LocalFixture::object(7),r=LocalFixture::object(8),child=LocalFixture::object(12),list=0x48000;\n f.put<uintptr_t>(child+0x20,a);f.put<uintptr_t>(r+0x198,list);f.put<int32_t>(r+0x1a0,1);f.put<int32_t>(r+0x1a4,1);f.put<uintptr_t>(list,child);\n if(mode==1)f.put<int32_t>(r+0x1a0,0);if(mode==2)f.put<int32_t>(r+0x1a4,0);if(mode==3)f.put<uintptr_t>(child+0x20,0);if(mode==4)f.put<int32_t>(r+0x1a0,-1);if(mode==5)f.put<float>(child+0x220,std::numeric_limits<float>::quiet_NaN());\n auto rd=[&](uintptr_t p,void*out,size_t n){return f.read(p,out,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,14,LocalFixture::names);assert(lookup.names.init());auto s=zk::sampleChildren(a,r,lookup);\n if(!mode){assert(s.valid==1&&s.child[0].index==12&&s.child[0].position[0]==110);}else assert(s.valid==0);++tests;\n }\n for(unsigned fail=1;fail<=80;++fail){LocalFixture f;extendWorld(f);auto rd=[&](uintptr_t p,void*out,size_t n){return f.read(p,out,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,14,LocalFixture::names);assert(lookup.names.init());f.failAt=f.calls+fail;auto s=zk::sampleChildren(LocalFixture::object(7),LocalFixture::object(8),lookup);assert(s.status&&s.valid<=4);++tests;}\n std::printf(\"PASS: %u bounded component cases\\n\",tests);return 0;}\n",
            "tests/calibration_test.cpp": "#include \"../src/targeted_instances.hpp\"\n#include <cassert>\n#include <cstdio>\nint main(){unsigned tests=0;const unsigned g=unsigned(zk::CandidateGroup::TrainingOther);\n for(unsigned count=0;count<=140;++count){zk::OwnershipTargets t;zk::ObjectHead h{};\n  for(unsigned i=0;i<128;++i)t.save(g,0x10000+i*8,h,\"PracticeTarget\");\n  for(unsigned i=0;i<count;++i)t.save(g,0x20000+i*8,h,\"BallisticTarget_C\");\n  unsigned retained=0;for(unsigned i=0;i<t.used[g];++i)if(t.records[g][i].calibration)++retained;\n  assert(retained==(count<128?count:128));const auto a=zk::selectCalibration(t),b=zk::selectCalibration(t);assert(a.count==(count<16?count:16)&&b.count==a.count);\n  for(unsigned i=0;i<a.count;++i){assert(a.indices[i]==b.indices[i]);assert(t.records[g][a.indices[i]].calibration);for(unsigned j=0;j<i;++j)assert(a.indices[j]!=a.indices[i]);}++tests;\n }\n {zk::OwnershipTargets t;zk::ObjectHead h{};for(const char *cls:{\"BallisticTargetDC_C\",\"OtherBallisticTarget_C\",\"BallisticTarget_C_Copy\",\"PracticeTarget\",\"TrainingManager\"})t.save(g,0x10000,h,cls);assert(!zk::selectCalibration(t).count);++tests;}\n std::printf(\"PASS: %u exact-class calibration selection cases\\n\",tests);return 0;}\n",
            "src/training_rank.hpp": "#pragma once\n#include <cmath>\n#include <cstdint>\nnamespace zk {\nstruct RankedMark {unsigned slot=0;int32_t index=-1;double x=0,y=0,distance=0;};\ntemplate<unsigned Capacity,unsigned MarginPercent=10> struct RankedTargets {\n static_assert(MarginPercent<50,\"valid screen margin\");\n static_assert(Capacity>0&&Capacity<=20,\"bounded target capacity\");\n RankedMark marks[Capacity]{};unsigned count=0;\n static bool before(const RankedMark &a,const RankedMark &b){\n  if(a.distance!=b.distance)return a.distance<b.distance;\n  const double ac=(a.x-.5)*(a.x-.5)+(a.y-.5)*(a.y-.5),bc=(b.x-.5)*(b.x-.5)+(b.y-.5)*(b.y-.5);\n  return ac!=bc?ac<bc:a.index<b.index;\n }\n void offer(RankedMark mark){\n  if(mark.index<0||!std::isfinite(mark.x)||!std::isfinite(mark.y)||!std::isfinite(mark.distance)||mark.distance<=0||mark.x<double(MarginPercent)/100||mark.x>1-double(MarginPercent)/100||mark.y<double(MarginPercent)/100||mark.y>1-double(MarginPercent)/100)return;\n  for(unsigned i=0;i<count;++i)if(marks[i].index==mark.index)return;\n  unsigned at=0;while(at<count&&!before(mark,marks[at]))++at;\n  if(at>=Capacity)return;\n  if(count<Capacity)++count;\n  for(unsigned i=count-1;i>at;--i)marks[i]=marks[i-1];marks[at]=mark;\n }\n};\nusing TrainingRank=RankedTargets<2>;\nusing TrainingRankEight=RankedTargets<8>;\nusing TrainingRankSixteen=RankedTargets<16>;\nusing TrainingRank360=RankedTargets<16,2>;\nusing TrainingRankTwenty=RankedTargets<20,2>;\n}\n",
            "tests/rank_test.cpp": "#include \"../src/training_rank.hpp\"\n#include \"../src/targeted_instances.hpp\"\n#include <cassert>\n#include <algorithm>\n#include <limits>\n#include <cstdio>\nint main(){unsigned cases=0;unsigned order[]{0,1,2,3};zk::RankedMark candidates[]{{0,10,.5,.5,5000},{1,11,.3,.5,1000},{2,12,.7,.5,2000},{3,13,.03,.5,10}};\n do{zk::TrainingRank rank;for(unsigned i:order)rank.offer(candidates[i]);assert(rank.count==2&&rank.marks[0].index==11&&rank.marks[1].index==12);++cases;}while(std::next_permutation(order,order+4));\n {zk::TrainingRank r;for(double x:{-.1,0.,.03,.09,.91,1.,2.,std::numeric_limits<double>::quiet_NaN()}){r.offer({0,1,x,.5,100});assert(!r.count);++cases;}r.offer({0,10,.5,.5,100});r.offer({0,10,.5,.5,100});assert(r.count==1);++cases;}\n {zk::TrainingRank r;r.offer({0,3,.8,.5,100});r.offer({1,2,.5,.5,100});r.offer({2,1,.5,.5,100});assert(r.count==2&&r.marks[0].index==1&&r.marks[1].index==2);++cases;}\n for(unsigned n=0;n<=140;++n){zk::OwnershipTargets t;zk::ObjectHead h{};for(unsigned i=0;i<n;++i)t.save(unsigned(zk::CandidateGroup::TrainingOther),0x10000+i*8,h,\"BallisticTarget_C\");auto s=zk::selectCalibrationScan(t);assert(s.count==(n<64?n:64));for(unsigned i=0;i<s.count;++i)assert(s.indices[i]==i);++cases;}\n std::printf(\"PASS: %u ranked selection and wide-scan cases\\n\",cases);return 0;}\n",
            "src/tracking_rate.hpp": "#pragma once\n#include <cstdint>\n#include <cstring>\nnamespace zk {\nstruct TrackingRate {\n static constexpr unsigned intervalMs=50,maxTicks=600,durationMs=30000,packetMaxAgeMs=150,markerLifetimeMs=200;\n unsigned ticks=0,overruns=0;int64_t maxWorkMs=0,totalWorkMs=0,lastLogSecond=-1;\n static bool active(int64_t elapsed,unsigned tick){return elapsed>=0&&elapsed<durationMs&&tick<maxTicks;}\n static unsigned phase(unsigned second){return second<5?0:second<10?1:2;}\n bool verbose(int64_t elapsed){const auto second=elapsed/1000;if(second==lastLogSecond)return false;lastLogSecond=second;return true;}\n void record(int64_t work){if(work<0)return;++ticks;totalWorkMs+=work;if(work>maxWorkMs)maxWorkMs=work;if(work>intervalMs)++overruns;}\n static bool packetFresh(double ageMs){return ageMs>=0&&ageMs<=packetMaxAgeMs;}\n};\n// Microsecond timing only; no effect on read validation or scheduling.\nstruct TrackingWaitStats {\n uint32_t intervals=0,sleeps=0,uiCalls=0,workCalls=0;\n int64_t intervalTotal=0,intervalMax=0,sleepRequested=0,sleepActual=0,sleepOverMax=0,uiTotal=0,uiMax=0,workTotal=0,workMax=0;\n static bool valid(int64_t us){return us>=0&&us<=60000000;}\n void interval(int64_t us){if(!valid(us))return;++intervals;intervalTotal+=us;if(us>intervalMax)intervalMax=us;}\n void sleep(int64_t requested,int64_t actual){if(!valid(requested)||!valid(actual))return;++sleeps;sleepRequested+=requested;sleepActual+=actual;const int64_t over=actual>requested?actual-requested:0;if(over>sleepOverMax)sleepOverMax=over;}\n void ui(int64_t us){if(!valid(us))return;++uiCalls;uiTotal+=us;if(us>uiMax)uiMax=us;}\n void work(int64_t us){if(!valid(us))return;++workCalls;workTotal+=us;if(us>workMax)workMax=us;}\n};\ninline bool trackingVerboseLine(const char *fmt){\n const char *tags[]={\"[camera-sample]\",\"[local-position-sample]\",\"[pawn-world]\",\"[pawn-candidates]\",\"[training-candidates]\",\"[training-selection]\",\"[projection-setup]\",\"[training-actor-sample]\",\"[training-projection]\"};\n for(const char *tag:tags)if(!std::strncmp(fmt,tag,std::strlen(tag)))return true;return false;\n}\n}\n",
            "tests/rate_test.cpp": "#include \"../src/tracking_rate.hpp\"\n#include <cassert>\n#include <cstdio>\nint main(){using R=zk::TrackingRate;assert(R::intervalMs==50&&R::maxTicks==600);assert(R::active(0,0)&&R::active(29999,599)&&!R::active(30000,599)&&!R::active(0,600)&&!R::active(-1,0));assert(R::phase(4)==0&&R::phase(5)==1&&R::phase(9)==1&&R::phase(10)==2&&R::phase(15)==2);R r;unsigned logs=0;for(int ms=0;ms<30000;ms+=50)logs+=r.verbose(ms);assert(logs==30);r.record(40);r.record(75);r.record(-1);assert(r.ticks==2&&r.overruns==1&&r.totalWorkMs==115&&r.maxWorkMs==75);assert(R::packetFresh(0)&&R::packetFresh(150)&&!R::packetFresh(151)&&!R::packetFresh(-1));assert(zk::trackingVerboseLine(\"[camera-sample] value\")&&!zk::trackingVerboseLine(\"[camera-stop] invalid\")&&!zk::trackingVerboseLine(\"[tracking-pick] chosen\"));zk::TrackingWaitStats t;t.interval(50000);t.interval(90000);t.interval(-1);t.interval(60000001);assert(t.intervals==2&&t.intervalTotal==140000&&t.intervalMax==90000);\n t.sleep(49900,90000);t.sleep(50000,49999);t.sleep(-1,3);assert(t.sleeps==2&&t.sleepRequested==99900&&t.sleepActual==139999&&t.sleepOverMax==40100);\n t.ui(300);t.ui(700);t.ui(-1);t.work(400);t.work(900);t.work(60000001);assert(t.uiCalls==2&&t.uiTotal==1000&&t.uiMax==700&&t.workCalls==2&&t.workTotal==1300&&t.workMax==900);\n std::puts(\"PASS: tracking deadline, phase timing, log throttling, stale packets and performance accounting\");}\n",
            "tests/stop_test.cpp": "#include \"../src/manual_capture.hpp\"\n#include <thread>\n#include <cassert>\n#include <cstdio>\nint main(){zk::CaptureGate gate;zk::TrackingStop stop;assert(gate.begin()&&gate.arm()&&gate.request());stop.request();std::thread worker([&]{assert(stop.requested());gate.finish();});worker.join();assert(gate.phase()==zk::CapturePhase::Idle);assert(gate.begin());stop.reset();assert(!stop.requested());assert(gate.arm()&&gate.request());std::thread request([&]{stop.request();});request.join();assert(stop.requested());gate.finish();assert(gate.phase()==zk::CapturePhase::Idle);std::puts(\"PASS: stop before worker entry, cross-thread stop, next session reset and capture lifecycle\");}\n",
            "tests/eight_test.cpp": "#include \"../src/training_rank.hpp\"\n#include <cassert>\n#include <algorithm>\n#include <random>\n#include <vector>\n#include <cstdio>\nint main(){unsigned cases=0;std::mt19937 rng(8241);\n for(unsigned n=0;n<=64;++n)for(unsigned trial=0;trial<12;++trial){std::vector<unsigned> order;for(unsigned i=0;i<n;++i)order.push_back(i);std::shuffle(order.begin(),order.end(),rng);zk::TrainingRankEight rank;\n  for(unsigned i:order){rank.offer({i,int32_t(i),.5,.5,100.+i});rank.offer({i,int32_t(i),.5,.5,100.+i});}\n  assert(rank.count==std::min(n,8u));for(unsigned i=0;i<rank.count;++i)assert(rank.marks[i].index==int32_t(i)&&rank.marks[i].distance==100.+i);++cases;\n }\n {zk::TrainingRankEight rank;for(unsigned i=0;i<20;++i)rank.offer({i,int32_t(i),.01,.5,100});assert(rank.count==0);++cases;}\n {zk::TrainingRankEight rank;for(int i=20;i>=1;--i)rank.offer({unsigned(i),i,.5,.5,100});assert(rank.count==8);for(unsigned i=0;i<8;++i)assert(rank.marks[i].index==int32_t(i+1));++cases;}\n std::printf(\"PASS: %u eight-target capacity, shortage, uniqueness, ordering and input cases\\n\",cases);}\n",
            "src/preparation_pacer.hpp": "#pragma once\n#include <cstdint>\nnamespace zk {\nstruct PreparationPacer {\n static constexpr int64_t workSliceUs=4000,progressIntervalUs=200000;\n int64_t sliceStart=0,lastProgress=0;\n bool yieldDue(int64_t now)const{return now>=sliceStart&&now-sliceStart>=workSliceUs;}\n void resumed(int64_t now){sliceStart=now;}\n bool progressDue(int64_t now){if(now<lastProgress||now-lastProgress<progressIntervalUs)return false;lastProgress=now;return true;}\n static unsigned percent(uint32_t next,uint32_t count){if(!count)return 0;return next>=count?100:unsigned(uint64_t(next)*100/count);}\n};\n}\n",
            "tests/preparation_test.cpp": "#include \"../src/preparation_pacer.hpp\"\n#include <cassert>\n#include <cstdint>\n#include <cstdio>\nint main(){using P=zk::PreparationPacer;P p;assert(!p.yieldDue(0)&&!p.yieldDue(3999)&&p.yieldDue(4000));p.resumed(9000);assert(!p.yieldDue(8999)&&!p.yieldDue(12999)&&p.yieldDue(13000));assert(!p.progressDue(199999)&&p.progressDue(200000)&&!p.progressDue(200001)&&!p.progressDue(1000)&&p.progressDue(400000));assert(P::percent(0,0)==0&&P::percent(0,300000)==0&&P::percent(150000,300000)==50&&P::percent(400000,300000)==100&&P::percent(UINT32_MAX-1,UINT32_MAX)==99);P fast;unsigned yields=0;for(int64_t us=100;us<=100000;us+=100)if(fast.yieldDue(us)){++yields;fast.resumed(us+1000);}assert(yields==20);std::puts(\"PASS: prep pacing, bounded work slices, progress throttle, backwards time and percentage overflow\");}\n",
            "tests/sixteen_test.cpp": "#include \"../src/training_rank.hpp\"\n#include <cassert>\n#include <algorithm>\n#include <random>\n#include <vector>\n#include <cstdio>\nint main(){unsigned cases=0;std::mt19937 rng(8241);\n for(unsigned n=0;n<=64;++n)for(unsigned trial=0;trial<12;++trial){std::vector<unsigned> order;for(unsigned i=0;i<n;++i)order.push_back(i);std::shuffle(order.begin(),order.end(),rng);zk::TrainingRankSixteen rank;\n  for(unsigned i:order){rank.offer({i,int32_t(i),.5,.5,100.+i});rank.offer({i,int32_t(i),.5,.5,100.+i});}\n  assert(rank.count==std::min(n,16u));for(unsigned i=0;i<rank.count;++i)assert(rank.marks[i].index==int32_t(i)&&rank.marks[i].distance==100.+i);++cases;\n }\n {zk::TrainingRankSixteen rank;for(unsigned i=0;i<20;++i)rank.offer({i,int32_t(i),.01,.5,100});assert(rank.count==0);++cases;}\n {zk::TrainingRankSixteen rank;for(int i=20;i>=1;--i)rank.offer({unsigned(i),i,.5,.5,100});assert(rank.count==16);for(unsigned i=0;i<16;++i)assert(rank.marks[i].index==int32_t(i+1));++cases;}\n std::printf(\"PASS: %u sixteen-target capacity, shortage, uniqueness, ordering and input cases\\n\",cases);}\n",
            "tests/budget_test.cpp": "#include \"../src/scan_budget.hpp\"\n#include <cassert>\n#include <cstdio>\nint main(){zk::resetScanBudget(3,10);assert(zk::allowRead(2)&&zk::allowRead(2)&&zk::allowRead(2)&&!zk::allowRead(1));zk::resetScanBudget(10,4);assert(zk::allowRead(4)&&!zk::allowRead(1));zk::resetScanBudget(10,4);zk::scanBudget().readBytes=5;assert(!zk::allowRead(1));zk::resetScanBudget(0,0);assert(!zk::allowRead(1));zk::resetScanBudget(524288,16u<<20);for(unsigned i=0;i<524288;++i)assert(zk::allowRead(1));assert(!zk::allowRead(1));zk::resetScanBudget();assert(zk::scanBudget().readCallLimit==300000&&zk::scanBudget().readByteLimit==(16u<<20));std::puts(\"PASS: custom read/byte caps, overflow guard, 524288 boundary and default reset\");}\n",
            "src/reselection.hpp": "#pragma once\n#include <cstdint>\nnamespace zk {struct ReselectionClock {int64_t last=-500;unsigned committed=0;bool due(int64_t now)const{return now>=0&&(now<last||now-last>=500);}void commit(int64_t now){last=now;++committed;}};}\n",
            "tests/rotation_test.cpp": "#include \"../src/training_rank.hpp\"\n#include \"../src/training_projection.hpp\"\n#include \"../src/reselection.hpp\"\n#include <cassert>\n#include <cstring>\n#include <cstdio>\nint main(){zk::ReselectionClock clock;assert(clock.due(0));clock.commit(0);assert(!clock.due(499)&&clock.due(500));clock.commit(500);assert(!clock.due(-1)&&clock.due(1000));bool all[24]{};int centers[8]{};for(unsigned turn=0;turn<8;++turn){float camera[3]{},rotation[3]{0,float(turn*45),0};zk::TrainingRank360 rank;unsigned behind=0;for(unsigned i=0;i<24;++i){double a=i*15*3.141592653589793/180;float point[3]{float(1000*std::cos(a)),float(1000*std::sin(a)),0};auto p=zk::projectTraining(point,camera,rotation,90,2);if(!std::strcmp(p.status,\"behind_or_near_camera\"))++behind;if(!std::strcmp(p.status,\"in_view_UNVERIFIED\"))rank.offer({i,int32_t(i),p.x,p.y,1000});}assert(behind>0&&rank.count>0&&rank.count<=16);centers[turn]=rank.marks[0].index;for(unsigned i=0;i<rank.count;++i)all[rank.marks[i].index]=true;assert(rank.marks[0].index==int32_t(turn*3));}for(unsigned i=1;i<8;++i)assert(centers[i]!=centers[i-1]);unsigned seen=0;for(bool v:all)seen+=v;assert(seen==24);zk::TrainingRank360 edge;edge.offer({1,1,.904678,.438637,5000});assert(edge.count==1);edge.offer({2,2,.99,.5,100});assert(edge.count==1);std::puts(\"PASS: camera turns cover all 24 synthetic test points, behind-camera exclusion, reselect timing and 2pct margin\");}\n",
            "tests/twenty_test.cpp": "#include \"../src/training_rank.hpp\"\n#include <cassert>\n#include <algorithm>\n#include <random>\n#include <vector>\n#include <cstdio>\nint main(){unsigned cases=0;std::mt19937 rng(8241);\n for(unsigned n=0;n<=64;++n)for(unsigned trial=0;trial<12;++trial){std::vector<unsigned> order;for(unsigned i=0;i<n;++i)order.push_back(i);std::shuffle(order.begin(),order.end(),rng);zk::TrainingRankTwenty rank;\n  for(unsigned i:order){rank.offer({i,int32_t(i),.5,.5,100.+i});rank.offer({i,int32_t(i),.5,.5,100.+i});}\n  assert(rank.count==std::min(n,20u));for(unsigned i=0;i<rank.count;++i)assert(rank.marks[i].index==int32_t(i)&&rank.marks[i].distance==100.+i);++cases;\n }\n {zk::TrainingRankTwenty rank;for(unsigned i=0;i<20;++i)rank.offer({i,int32_t(i),.01,.5,100});assert(rank.count==0);++cases;}\n {zk::TrainingRankTwenty rank;for(int i=20;i>=1;--i)rank.offer({unsigned(i),i,.5,.5,100});assert(rank.count==20);for(unsigned i=0;i<20;++i)assert(rank.marks[i].index==int32_t(i+1));++cases;}\n std::printf(\"PASS: %u twenty-target capacity, shortage, uniqueness, ordering and input cases\\n\",cases);}\n",
            "src/training_rays.hpp": "#pragma once\n#include \"training_projection.hpp\"\n#include <cstdint>\n#include <cstring>\nnamespace zk {\nstruct RayEndpoint {bool valid=false,edge=false,behind=false;double x=0,y=0,distance=0;};\ninline RayEndpoint projectTrainingRay(const float *point,const float *location,const float *rotation,double fov,double aspect){\n RayEndpoint r;auto p=projectTraining(point,location,rotation,fov,aspect);if(!std::strcmp(p.status,\"invalid_input\")||!std::strcmp(p.status,\"invalid_projection\"))return r;\n const double dx=double(point[0])-location[0],dy=double(point[1])-location[1],dz=double(point[2])-location[2];r.distance=std::sqrt(dx*dx+dy*dy+dz*dz);if(!std::isfinite(r.distance)||r.distance<=1)return r;\n if(!std::strcmp(p.status,\"in_view_UNVERIFIED\")){r.valid=true;r.x=p.x;r.y=p.y;return r;}\n r.edge=true;r.behind=p.depth<0;double x=p.x-.5,y=p.y-.5;\n if(p.depth<=1){\n  const double rad=3.14159265358979323846/180,pitch=rotation[0]*rad,yaw=rotation[1]*rad,roll=rotation[2]*rad;\n  const double right=dx*(std::sin(roll)*std::sin(pitch)*std::cos(yaw)-std::cos(roll)*std::sin(yaw))+dy*(std::sin(roll)*std::sin(pitch)*std::sin(yaw)+std::cos(roll)*std::cos(yaw))-dz*std::sin(roll)*std::cos(pitch);\n  const double bearing=std::atan2(right,p.depth);x=std::sin(bearing);y=-std::cos(bearing); // Bearing indicator only, NOT a projected rear world point.\n }\n const double extent=std::fmax(std::fabs(x),std::fabs(y));if(!std::isfinite(extent)||extent<1e-9)return r;\n const double scale=.47/extent;r.x=.5+x*scale;r.y=.5+y*scale;r.valid=std::isfinite(r.x)&&std::isfinite(r.y);return r;\n}\nstruct RayPick {unsigned slot=0;int32_t index=-1;RayEndpoint endpoint;};\nstruct RayRank {\n RayPick marks[20]{};unsigned count=0;\n static bool before(const RayPick&a,const RayPick&b){return a.endpoint.distance!=b.endpoint.distance?a.endpoint.distance<b.endpoint.distance:a.index<b.index;}\n void offer(RayPick p){const auto &e=p.endpoint;if(p.index<0||!e.valid||!std::isfinite(e.x)||!std::isfinite(e.y)||e.x<0||e.x>1||e.y<0||e.y>1||!std::isfinite(e.distance)||e.distance<=1)return;for(unsigned i=0;i<count;++i)if(marks[i].index==p.index)return;unsigned at=0;while(at<count&&!before(p,marks[at]))++at;if(at>=20)return;if(count<20)++count;for(unsigned i=count-1;i>at;--i)marks[i]=marks[i-1];marks[at]=p;}\n};\n}\n",
            "tests/rays_test.cpp": "#include \"../src/training_rays.hpp\"\n#include <cassert>\n#include <limits>\n#include <cstdio>\nint main(){float loc[3]{},rot[3]{},front[3]{100,0,0},rear[3]{-100,0,0};auto a=zk::projectTrainingRay(front,loc,rot,90,2);assert(a.valid&&!a.edge&&!a.behind&&std::fabs(a.x-.5)<1e-9);auto b=zk::projectTrainingRay(rear,loc,rot,90,2);assert(b.valid&&b.edge&&b.behind&&std::fabs(b.x-.5)<1e-9&&b.y>.9);rot[1]=180;b=zk::projectTrainingRay(rear,loc,rot,90,2);assert(b.valid&&!b.edge&&!b.behind&&std::fabs(b.x-.5)<1e-6);rot[1]=0;unsigned count=0;for(unsigned i=0;i<360;++i){double angle=i*3.141592653589793/180;float p[3]{float(1000*std::cos(angle)),float(1000*std::sin(angle)),0};auto e=zk::projectTrainingRay(p,loc,rot,90,2);assert(e.valid&&e.x>=0&&e.x<=1&&e.y>=0&&e.y<=1);++count;}float bad[3]{std::numeric_limits<float>::quiet_NaN(),0,0};assert(!zk::projectTrainingRay(bad,loc,rot,90,2).valid&&!zk::projectTrainingRay(loc,loc,rot,90,2).valid&&!zk::projectTrainingRay(nullptr,loc,rot,90,2).valid);zk::RayRank rank;for(int i=30;i>=0;--i){auto e=a;e.distance=100+i;rank.offer({unsigned(i),i,e});rank.offer({unsigned(i),i,e});}assert(rank.count==20);for(unsigned i=0;i<20;++i)assert(rank.marks[i].index==int(i));std::printf(\"PASS: %u ray bearings plus front/rear, rotation, invalid input, bounds and capped unique ranking\\n\",count);}\n",
            "src/fov_preview.hpp": "#pragma once\n#include <cmath>\n#include <cstdint>\n#include <cstddef>\nnamespace zk {\nstruct FovPoint {int32_t index=-1;double x=0,y=0;bool edge=false,behind=false;unsigned ordinal=0;double distance=0;};\nstruct FovPick {int32_t index=-1;double radius=0,distance=0;};\ninline double fovFraction(double value){return !std::isfinite(value)?.18:std::fmax(.05,std::fmin(.45,value));}\ninline FovPick pickFov(const FovPoint *points,size_t count,double width,double height,double fraction){\n FovPick r;if(!std::isfinite(width)||!std::isfinite(height)||width<=0||height<=0)return r;\n r.radius=fovFraction(fraction)*std::fmin(width,height);double best=r.radius*r.radius;\n if(!points)return r;\n for(size_t i=0;i<count&&i<20;++i){const auto&p=points[i];if(p.index<0||p.edge||p.behind||!std::isfinite(p.x)||!std::isfinite(p.y)||p.x<0||p.x>1||p.y<0||p.y>1)continue;\n  const double dx=(p.x-.5)*width,dy=(p.y-.5)*height,d=dx*dx+dy*dy;\n  if(d<best||(d==best&&(r.index<0||p.index<r.index))){best=d;r.index=p.index;r.distance=std::sqrt(d);}\n }return r;\n}\n}\n",
            "src/fov_controls.hpp": "#pragma once\n#include \"fov_preview.hpp\"\n// All state in this header is accessed on the main thread only.\nstatic UIView *fovCanvas=nil,*fovPanel=nil;\nstatic CAShapeLayer *fovCircle=nil,*fovSelection=nil;\nstatic UILabel *fovText=nil;\nstatic UISlider *fovSlider=nil;\nstatic std::vector<zk::FovPoint> fovPoints;\nstatic CFTimeInterval fovReceived=0;\nstatic int32_t lockedFovIndex=-1;\nstatic zk::FovPick pickLockedFov(double width,double height,double fraction,bool fresh){\n if(fresh&&lockedFovIndex>=0){\n  for(size_t i=0;i<fovPoints.size()&&i<20;++i){\n   if(fovPoints[i].index!=lockedFovIndex)continue;\n   const auto retained=zk::pickFov(&fovPoints[i],1,width,height,fraction);\n   if(retained.index>=0)return retained;\n   break;\n  }\n }\n const auto picked=zk::pickFov(fresh?fovPoints.data():nullptr,fresh?fovPoints.size():0,width,height,fraction);\n lockedFovIndex=picked.index;\n return picked;\n}\nstatic void redrawFov(){\n UIWindow *window=fovCanvas.window;if(!window||window.hidden)return;\n const CGSize size=window.bounds.size;fovCanvas.frame=window.bounds;\n fovCanvas.hidden=size.width<=size.height;fovPanel.hidden=fovCanvas.hidden;\n const bool fresh=(CACurrentMediaTime()-fovReceived)*1000<=zk::TrackingRate::markerLifetimeMs;\n const auto picked=pickLockedFov(size.width,size.height,fovSlider.value,fresh);\n const CGFloat radius=picked.radius,cx=size.width*.5,cy=size.height*.5;\n [CATransaction begin];[CATransaction setDisableActions:YES];\n fovCircle.frame=fovCanvas.bounds;fovSelection.frame=fovCanvas.bounds;\n fovCircle.path=[UIBezierPath bezierPathWithOvalInRect:CGRectMake(cx-radius,cy-radius,radius*2,radius*2)].CGPath;\n fovSelection.path=nil;\n if(picked.index>=0)for(const auto&p:fovPoints)if(p.index==picked.index){UIBezierPath *selectedRay=[UIBezierPath bezierPath];\n  [selectedRay moveToPoint:CGPointMake(size.width*.5,MAX(12,window.safeAreaInsets.top+4))];\n  [selectedRay addLineToPoint:CGPointMake(p.x*size.width,p.y*size.height)];\n  fovSelection.path=selectedRay.CGPath;break;}\n [CATransaction commit];\n fovText.text=[NSString stringWithFormat:@\"FOV %.0f pt \u00b7 ch\u1ec9 b\u00e1o\",radius];\n}\n@interface ZKFovActions : NSObject\n- (void)changed:(UISlider *)slider;\n@end\n@implementation ZKFovActions\n- (void)changed:(UISlider *)slider {[NSUserDefaults.standardUserDefaults setDouble:zk::fovFraction(slider.value) forKey:@\"ZKProbe.R25.fov\"];redrawFov();}\n@end\nstatic ZKFovActions *fovActions=nil;\nstatic void attachFovControls(UIWindow *window){\n if(fovPanel.superview==window)return;\n [fovPanel removeFromSuperview];[fovCanvas removeFromSuperview];\n fovCanvas=[[UIView alloc] initWithFrame:window.bounds];fovCanvas.userInteractionEnabled=NO;\n fovCanvas.autoresizingMask=UIViewAutoresizingFlexibleWidth|UIViewAutoresizingFlexibleHeight;\n [window addSubview:fovCanvas];\n fovCircle=[CAShapeLayer layer];fovSelection=[CAShapeLayer layer];\n for(CAShapeLayer *layer in @[fovCircle,fovSelection]){layer.strokeColor=UIColor.yellowColor.CGColor;layer.fillColor=UIColor.clearColor.CGColor;[fovCanvas.layer addSublayer:layer];}\n fovCircle.lineWidth=1;fovSelection.lineWidth=0.7;fovSelection.strokeColor=UIColor.redColor.CGColor;fovSelection.lineCap=kCALineCapRound;\n fovPanel=[[UIView alloc] initWithFrame:CGRectZero];fovPanel.translatesAutoresizingMaskIntoConstraints=NO;\n fovPanel.backgroundColor=[UIColor colorWithWhite:0 alpha:.65];fovPanel.layer.cornerRadius=8;\n fovText=[[UILabel alloc] initWithFrame:CGRectMake(8,2,204,22)];fovText.font=[UIFont systemFontOfSize:12];fovText.textColor=UIColor.yellowColor;[fovPanel addSubview:fovText];\n fovSlider=[[UISlider alloc] initWithFrame:CGRectMake(8,26,204,30)];fovSlider.minimumValue=.05;fovSlider.maximumValue=.45;fovSlider.value=zk::fovFraction([NSUserDefaults.standardUserDefaults objectForKey:@\"ZKProbe.R25.fov\"]?[NSUserDefaults.standardUserDefaults doubleForKey:@\"ZKProbe.R25.fov\"]:.18);fovSlider.minimumTrackTintColor=UIColor.yellowColor;\n fovSlider.accessibilityLabel=@\"B\u00e1n k\u00ednh v\u00f2ng ch\u1ec9 b\u00e1o FOV\";\n if(!fovActions)fovActions=[ZKFovActions new];[fovSlider addTarget:fovActions action:@selector(changed:) forControlEvents:UIControlEventValueChanged];[fovPanel addSubview:fovSlider];[window addSubview:fovPanel];\n [NSLayoutConstraint activateConstraints:@[[fovPanel.leadingAnchor constraintEqualToAnchor:window.safeAreaLayoutGuide.leadingAnchor constant:8],[fovPanel.topAnchor constraintEqualToAnchor:window.safeAreaLayoutGuide.topAnchor constant:8],[fovPanel.widthAnchor constraintEqualToConstant:220],[fovPanel.heightAnchor constraintEqualToConstant:60]]];\n redrawFov();\n}\nstatic void clearFovTargets(){lockedFovIndex=-1;fovPoints.clear();fovReceived=0;redrawFov();}\nstatic void requestSelectedRayStep();\nstatic void updateFovTargets(const std::vector<zk::FovPoint>&points){fovPoints=points;fovReceived=CACurrentMediaTime();redrawFov();requestSelectedRayStep();}\n",
            "tests/fov_test.cpp": "#include \"../src/fov_preview.hpp\"\n#include <cassert>\n#include <limits>\n#include <cstdio>\nint main(){\n zk::FovPoint p[]={{7,.5,.5,false,true},{8,.5,.5,true,false},{3,.52,.5},{2,.5,.52}};\n auto r=zk::pickFov(p,4,1000,500,.1);assert(r.index==2&&r.radius==50);\n p[3].x=.9;assert(zk::pickFov(p,4,1000,500,.1).index==3);\n p[2].x=.56;assert(zk::pickFov(p,4,1000,500,.1).index<0);\n assert(zk::pickFov(p,4,1000,500,.2).index==3);\n p[2].x=std::numeric_limits<double>::quiet_NaN();assert(zk::pickFov(p,4,1000,500,.2).index<0);\n assert(zk::pickFov(nullptr,100,1000,500,.2).index<0);\n assert(zk::pickFov(p,4,0,500,.2).index<0);\n assert(zk::fovFraction(0)==.05&&zk::fovFraction(2)==.45);\n assert(zk::fovFraction(std::numeric_limits<double>::quiet_NaN())==.18);\n zk::FovPoint tie[]={{9,.5,.5},{4,.5,.5}};assert(zk::pickFov(tie,2,1000,500,.2).index==4);\n for(unsigned i=0;i<1000;++i){double f=i/1000.;auto a=zk::pickFov(tie,2,1000,500,f);assert(a.index==4&&a.radius>=25&&a.radius<=225);}\n std::puts(\"PASS: FOV size, screen aspect, exclusions, radius change, NaN, empty, tie and 1000 slider positions\");\n}\n",
            "src/control_rotation_probe.hpp": "#pragma once\n#include <cmath>\n#include <cstdint>\nnamespace zk {\nstruct ControlProbe {const char *status=\"not_read\";float angle[3]{};};\n// Offset is a static metadata candidate, NOT runtime-confirmed or writable authorization.\ntemplate<class Read> ControlProbe readControlCandidate(uintptr_t controller,Read read){\n ControlProbe r;if(controller<0x10000||controller>UINTPTR_MAX-0x4ec){r.status=\"bad_controller\";return r;}\n if(!read(controller+0x4e0,r.angle,sizeof(r.angle))){r.status=\"read_failed\";return r;}\n for(float a:r.angle)if(!std::isfinite(a)||std::fabs(a)>360000){r.status=\"invalid_angles\";return r;}\n r.status=\"finite_candidate_NOT_control_verified\";return r;\n}\ninline double rotationDifference(double a,double b){return std::remainder(a-b,360.0);}\n}\n",
            "tests/control_test.cpp": "#include \"../src/control_rotation_probe.hpp\"\n#include <cassert>\n#include <cstring>\n#include <limits>\n#include <cstdio>\nint main(){\n float angles[3]{20,359,0};unsigned reads=0;\n auto read=[&](uintptr_t p,void*out,size_t n){++reads;if(p!=0x104e0||n!=12)return false;std::memcpy(out,angles,n);return true;};\n auto r=zk::readControlCandidate(0x10000,read);assert(!std::strcmp(r.status,\"finite_candidate_NOT_control_verified\"));\n assert(r.angle[0]==20&&reads==1);\n assert(!std::strcmp(zk::readControlCandidate(0,read).status,\"bad_controller\")&&reads==1);\n assert(!std::strcmp(zk::readControlCandidate(UINTPTR_MAX,read).status,\"bad_controller\")&&reads==1);\n assert(!std::strcmp(zk::readControlCandidate(0x20000,read).status,\"read_failed\"));\n angles[0]=std::numeric_limits<float>::quiet_NaN();assert(!std::strcmp(zk::readControlCandidate(0x10000,read).status,\"invalid_angles\"));\n assert(zk::rotationDifference(359,1)==-2&&zk::rotationDifference(1,359)==2);\n std::puts(\"PASS: bounded control candidate read, failures, invalid angles and wrapped angle differences\");\n}\n",
            "src/control_route_probe.hpp": "#pragma once\n#include <cstdint>\n#include <cstring>\nnamespace zk {\nstruct ControlRoute {const char*status=\"not_checked\";uintptr_t getterRaw=0,setterRaw=0;uint32_t getterRVA=0,setterRVA=0;};\ninline bool fixedCodeMatch(uintptr_t raw,uintptr_t expected){return raw==expected||(raw&UINT64_C(0x0000ffffffffffff))==expected;}\ntemplate<class Read> ControlRoute inspectControlRoute(uintptr_t base,uintptr_t vtable,Read read){\n ControlRoute r;\n if(base<0x10000||base>UINTPTR_MAX-0x061de300||vtable<base||vtable-base>0x0b000000||vtable>UINTPTR_MAX-0x778){r.status=\"address_guard_failed\";return r;}\n if(!read(vtable+0x768,&r.getterRaw,8)||!read(vtable+0x770,&r.setterRaw,8)){r.status=\"slot_read_failed\";return r;}\n auto matches=[&](uintptr_t rva,const unsigned char *expected,size_t n){unsigned char actual[32]{};return n<=sizeof(actual)&&read(base+rva,actual,n)&&!std::memcmp(actual,expected,n);};\n const unsigned char baseGetter[]={0x00,0xe0,0x44,0xbd,0x01,0xe4,0x44,0xbd,0x02,0xe8,0x44,0xbd,0xc0,0x03,0x5f,0xd6};\n if(fixedCodeMatch(r.getterRaw,base+0x034f42d0)){\n  r.getterRVA=0x034f42d0;\n  if(!fixedCodeMatch(r.setterRaw,base+0x0348fc98)){r.status=\"override_pair_unreviewed\";return r;}\n  r.setterRVA=0x0348fc98;\n  const unsigned char getter[]={0xff,0x03,0x01,0xd1,0xe9,0x23,0x01,0x6d,0xf4,0x4f,0x02,0xa9,0xfd,0x7b,0x03,0xa9,0xfd,0xc3,0x00,0x91,0xf3,0x03,0x00,0xaa,0x9b,0x98,0x42,0x94,0xe0,0x05,0x00,0x34};const unsigned char setter[]={0xff,0x43,0x02,0xd1,0xe9,0x23,0x04,0x6d,0xf8,0x5f,0x05,0xa9,0xf6,0x57,0x06,0xa9,0xf4,0x4f,0x07,0xa9,0xfd,0x7b,0x08,0xa9,0xfd,0x03,0x02,0x91,0xf5,0x03,0x02,0xaa};\n  const unsigned char fallback[]={0x25,0xa7,0xb3,0x94};const unsigned char baseCall[]={0x23,0x38,0xb5,0x94};\n  if(!matches(0x034f42d0,getter,sizeof(getter))||!matches(0x0348fc98,setter,sizeof(setter))||!matches(0x034f43f0,fallback,4)||!matches(0x03490008,baseCall,4)||!matches(0x061de084,baseGetter,sizeof(baseGetter))){r.status=\"override_code_mismatch\";return r;}\n }else if(fixedCodeMatch(r.getterRaw,base+0x061de084)){\n  r.getterRVA=0x061de084;const uint32_t setters[]={0x061de094,0x035c49f0,0x035c4948};\n  for(uint32_t v:setters)if(fixedCodeMatch(r.setterRaw,base+v)){r.setterRVA=v;break;}\n  if(!r.setterRVA){r.status=\"setter_override_unreviewed\";return r;}\n  if(!matches(0x061de084,baseGetter,sizeof(baseGetter))){r.status=\"getter_code_mismatch\";return r;}\n }else {r.status=\"getter_override_unreviewed\";return r;}\n uintptr_t after[2]{};if(!read(vtable+0x768,after,sizeof(after))||after[0]!=r.getterRaw||after[1]!=r.setterRaw){r.status=\"slots_changed\";return r;}\n r.status=\"static_route_matched_NOT_actuation_tested\";return r;\n}\n}\n",
            "tests/route_test.cpp": "#include \"../src/control_route_probe.hpp\"\n#include <cassert>\n#include <cstring>\n#include <cstdio>\n#include <map>\n#include <vector>\nint main(){\n const uintptr_t base=0x100880000,vt=base+0x08642b60;uintptr_t slots[2]={base+0x034f42d0,base+0x0348fc98};\n std::map<uintptr_t,std::vector<unsigned char>> code;\n code[base+0x034f42d0]={0xff,0x03,0x01,0xd1,0xe9,0x23,0x01,0x6d,0xf4,0x4f,0x02,0xa9,0xfd,0x7b,0x03,0xa9,0xfd,0xc3,0x00,0x91,0xf3,0x03,0x00,0xaa,0x9b,0x98,0x42,0x94,0xe0,0x05,0x00,0x34};code[base+0x0348fc98]={0xff,0x43,0x02,0xd1,0xe9,0x23,0x04,0x6d,0xf8,0x5f,0x05,0xa9,0xf6,0x57,0x06,0xa9,0xf4,0x4f,0x07,0xa9,0xfd,0x7b,0x08,0xa9,0xfd,0x03,0x02,0x91,0xf5,0x03,0x02,0xaa};code[base+0x034f43f0]={0x25,0xa7,0xb3,0x94};code[base+0x03490008]={0x23,0x38,0xb5,0x94};\n code[base+0x061de084]={0x00,0xe0,0x44,0xbd,0x01,0xe4,0x44,0xbd,0x02,0xe8,0x44,0xbd,0xc0,0x03,0x5f,0xd6};\n unsigned calls=0;bool changed=false;\n auto read=[&](uintptr_t p,void*out,size_t n){++calls;if(p==vt+0x768&&n==8){std::memcpy(out,slots,8);return true;}if(p==vt+0x770&&n==8){std::memcpy(out,slots+1,8);return true;}if(p==vt+0x768&&n==16){std::memcpy(out,slots,16);if(changed)static_cast<uintptr_t*>(out)[1]=0;return true;}auto i=code.find(p);if(i==code.end()||i->second.size()!=n)return false;std::memcpy(out,i->second.data(),n);return true;};\n auto r=zk::inspectControlRoute(base,vt,read);assert(!std::strcmp(r.status,\"static_route_matched_NOT_actuation_tested\")&&r.getterRVA==0x034f42d0&&r.setterRVA==0x0348fc98);\n for(auto &entry:code){entry.second[0]^=1;assert(!std::strcmp(zk::inspectControlRoute(base,vt,read).status,\"override_code_mismatch\"));entry.second[0]^=1;}\n slots[1]=base+0x061de094;assert(!std::strcmp(zk::inspectControlRoute(base,vt,read).status,\"override_pair_unreviewed\"));\n slots[0]=base+0x061de084;assert(zk::inspectControlRoute(base,vt,read).setterRVA==0x061de094);\n slots[0]=base+100;assert(!std::strcmp(zk::inspectControlRoute(base,vt,read).status,\"getter_override_unreviewed\"));\n slots[0]=base+0x034f42d0;slots[1]=base+0x0348fc98;changed=true;assert(!std::strcmp(zk::inspectControlRoute(base,vt,read).status,\"slots_changed\"));changed=false;\n unsigned before=calls;assert(!std::strcmp(zk::inspectControlRoute(base,0,read).status,\"address_guard_failed\")&&calls==before);\n auto fail=[](uintptr_t,void*,size_t){return false;};assert(!std::strcmp(zk::inspectControlRoute(base,vt,fail).status,\"slot_read_failed\"));\n slots[0]|=UINT64_C(0xabcd000000000000);assert(zk::inspectControlRoute(base,vt,read).getterRVA==0x034f42d0);\n std::puts(\"PASS: actual override pair, all five code guards, pair mismatch, unknown route, changed slots and failed reads\");\n}\n",
            "src/thread_context_probe.hpp": "#pragma once\n#include <cstdint>\n#include <cstring>\nnamespace zk {\nstruct ThreadContext {const char*status=\"not_checked\";uint32_t game=0,main=0,worker=0;bool mainMatch=false,workerMatch=false;};\ntemplate<class Read> ThreadContext inspectThreadContext(uintptr_t base,uint32_t main,uint32_t worker,Read read){\n ThreadContext r;r.main=main;r.worker=worker;\n if(base<0x10000||base>UINTPTR_MAX-0x0a58eb59){r.status=\"base_guard_failed\";return r;}\n const unsigned char expected[]={0xdd,0x28,0x00,0x95,0xa9,0x28,0x00,0x95,0x48,0xc8,0x03,0xd0,0x08,0x11,0x2d,0x91,0x00,0x01,0x00,0xb9,0x48,0xc8,0x03,0xd0,0x08,0x61,0x2d,0x91,0x29,0x00,0x80,0x52,0x09,0x01,0x00,0x39};unsigned char actual[sizeof(expected)]{};\n if(!read(base+0x02c84248,actual,sizeof(actual))||std::memcmp(actual,expected,sizeof(expected))){r.status=\"thread_init_code_mismatch\";return r;}\n uint8_t initialized=0,afterFlag=0;uint32_t after=0;\n if(!read(base+0x0a58eb58,&initialized,1)||!read(base+0x0a58eb44,&r.game,4)){r.status=\"thread_global_read_failed\";return r;}\n if(initialized!=1||!r.game){r.status=\"thread_global_not_initialized\";return r;}\n if(!read(base+0x0a58eb44,&after,4)||!read(base+0x0a58eb58,&afterFlag,1)||after!=r.game||afterFlag!=initialized){r.status=\"thread_global_changed\";return r;}\n if(!main||!worker){r.status=\"system_thread_id_unavailable\";return r;}\n r.mainMatch=r.game==main;r.workerMatch=r.game==worker;\n r.status=r.mainMatch?\"ui_thread_matches_game_id_NOT_call_authorization\":\"ui_thread_DIFFERS_from_game_id\";\n return r;\n}\n}\n",
            "tests/threads_test.cpp": "#include \"../src/thread_context_probe.hpp\"\n#include <cassert>\n#include <cstdio>\nint main(){\n const uintptr_t base=0x100000000;uint8_t flag=1;uint32_t id=11;bool mutate=false;unsigned idReads=0,calls=0;\n unsigned char code[]={0xdd,0x28,0x00,0x95,0xa9,0x28,0x00,0x95,0x48,0xc8,0x03,0xd0,0x08,0x11,0x2d,0x91,0x00,0x01,0x00,0xb9,0x48,0xc8,0x03,0xd0,0x08,0x61,0x2d,0x91,0x29,0x00,0x80,0x52,0x09,0x01,0x00,0x39};\n auto read=[&](uintptr_t p,void*out,size_t n){++calls;if(p==base+0x02c84248&&n==sizeof(code)){std::memcpy(out,code,n);return true;}if(p==base+0x0a58eb58&&n==1){std::memcpy(out,&flag,n);return true;}if(p==base+0x0a58eb44&&n==4){uint32_t value=id;if(mutate&&++idReads==2)++value;std::memcpy(out,&value,n);return true;}return false;};\n auto r=zk::inspectThreadContext(base,11,22,read);assert(r.mainMatch&&!r.workerMatch&&r.game==11);\n r=zk::inspectThreadContext(base,33,22,read);assert(!r.mainMatch&&!r.workerMatch&&!std::strcmp(r.status,\"ui_thread_DIFFERS_from_game_id\"));\n r=zk::inspectThreadContext(base,33,11,read);assert(!r.mainMatch&&r.workerMatch);\n flag=0;assert(!std::strcmp(zk::inspectThreadContext(base,11,22,read).status,\"thread_global_not_initialized\"));flag=1;\n assert(!std::strcmp(zk::inspectThreadContext(base,0,22,read).status,\"system_thread_id_unavailable\"));\n code[0]^=1;assert(!std::strcmp(zk::inspectThreadContext(base,11,22,read).status,\"thread_init_code_mismatch\"));code[0]^=1;\n mutate=true;assert(!std::strcmp(zk::inspectThreadContext(base,11,22,read).status,\"thread_global_changed\"));\n unsigned before=calls;assert(!std::strcmp(zk::inspectThreadContext(UINTPTR_MAX,11,22,read).status,\"base_guard_failed\")&&before==calls);\n auto fail=[](uintptr_t,void*,size_t){return false;};assert(!std::strcmp(zk::inspectThreadContext(base,11,22,fail).status,\"thread_init_code_mismatch\"));\n std::puts(\"PASS: main/worker/game comparisons, invalid IDs, initialization, signature, changed globals and read failures\");\n}\n",
            "src/async_proof.hpp": "#pragma once\n#include <atomic>\n#include <cstdint>\nnamespace zk {\nenum class AsyncPhase:unsigned {Idle,Queued,Running,Completed,Rejected};\nstruct AsyncProof {\n std::atomic<AsyncPhase> phase{AsyncPhase::Idle};\n uint32_t expected=0,actual=0;int64_t delayUs=0;\n bool queue(uint32_t thread){if(!thread||phase.load()!=AsyncPhase::Idle)return false;expected=thread;phase.store(AsyncPhase::Queued,std::memory_order_release);return true;}\n bool complete(uint32_t thread,int64_t elapsed){auto wanted=AsyncPhase::Queued;if(!phase.compare_exchange_strong(wanted,AsyncPhase::Running,std::memory_order_acq_rel))return false;actual=thread;delayUs=elapsed;phase.store(AsyncPhase::Completed,std::memory_order_release);return true;}\n bool matches()const{return phase.load(std::memory_order_acquire)==AsyncPhase::Completed&&expected&&actual==expected&&delayUs>=0;}\n void reject(){phase.store(AsyncPhase::Rejected,std::memory_order_release);}\n};\n}\n",
            "tests/async_test.cpp": "#include \"../src/async_proof.hpp\"\n#include <cassert>\n#include <thread>\n#include <memory>\n#include <functional>\n#include <cstdio>\nint main(){\n zk::AsyncProof p;assert(!p.queue(0));assert(p.queue(123));assert(!p.queue(456));assert(!p.matches());\n std::thread worker([&]{assert(p.complete(123,500));assert(!p.complete(456,1));});worker.join();assert(p.matches()&&p.actual==123&&p.expected==123&&p.delayUs==500);\n zk::AsyncProof wrong;assert(wrong.queue(123));assert(wrong.complete(456,20));assert(!wrong.matches());\n zk::AsyncProof invalidTime;assert(invalidTime.queue(123));assert(invalidTime.complete(123,-1));assert(!invalidTime.matches());\n zk::AsyncProof rejected;rejected.reject();assert(!rejected.queue(123)&&!rejected.complete(123,1)&&!rejected.matches());\n std::weak_ptr<zk::AsyncProof> weak;std::function<void()> delayed;\n {auto owner=std::make_shared<zk::AsyncProof>();weak=owner;assert(owner->queue(123));delayed=[owner]{assert(owner->complete(123,30000000));};}\n assert(!weak.expired());delayed();assert(weak.lock()->matches());delayed=nullptr;assert(weak.expired());\n std::puts(\"PASS: asynchronous publication, duplicate prevention, wrong thread, invalid time, rejection and delayed callback ownership\");\n}\n",
            "src/async_thread_proof.hpp": "#pragma once\n#import <objc/runtime.h>\n#import <objc/message.h>\n#include <ptrauth.h>\n#include <cstring>\n#include <dlfcn.h>\n#include \"image_uuid_guard.hpp\"\n#include \"async_proof.hpp\"\n// One inert proof plus at most 32 user-requested bounded tasks per process via the normal factory. The observed anogs route stays installed.\nstatic auto asyncThreadProof=std::make_shared<zk::AsyncProof>();\nstatic uintptr_t asyncImplementationAddress(IMP imp){\n#if __has_feature(ptrauth_calls)\n return (uintptr_t)ptrauth_strip(imp,ptrauth_key_function_pointer);\n#else\n return (uintptr_t)imp;\n#endif\n}\ntemplate<class Read> static const char *observedAnogsProcess(Method method,Read read){\n if(!method)return \"observed_process_method_missing\";\n const char*t=method_getTypeEncoding(method);if(!t||std::strcmp(t,\"v16@0:8\"))return \"observed_process_type_mismatch\";\n const uintptr_t entry=asyncImplementationAddress(method_getImplementation(method));Dl_info info{};\n if(!entry||!dladdr((const void*)entry,&info)||!info.dli_fname||!info.dli_fbase)return \"observed_process_image_unmapped\";\n const char *name=std::strrchr(info.dli_fname,'/');name=name?name+1:info.dli_fname;\n const uintptr_t image=(uintptr_t)info.dli_fbase;\n if(std::strcmp(name,\"anogs\")||image>UINTPTR_MAX-0x13c300||entry!=image+0x13ad40)return \"observed_process_image_or_rva_mismatch\";\n const unsigned char uuid[]={0x56,0xbb,0xda,0x19,0x21,0x30,0x38,0xc2,0x85,0xb3,0xa2,0x91,0x5b,0xfb,0x84,0xbd};\n if(!zk::imageUUIDMatches(image,uuid,read))return \"observed_anogs_uuid_mismatch\";\n const unsigned char wrapper[]={0xff,0x83,0x04,0xd1,0xe0,0x07,0x00,0xa9,0xe2,0x0f,0x01,0xa9,0xe4,0x17,0x02,0xa9,0xe6,0x1f,0x03,0xa9,0xe8,0x27,0x04,0xa9,0xea,0x2f,0x05,0xa9,0xec,0x37,0x06,0xa9,0xee,0x3f,0x07,0xa9,0xf0,0x47,0x08,0xa9,0xf2,0x4f,0x09,0xa9,0xf4,0x57,0x0a,0xa9,0xf6,0x5f,0x0b,0xa9,0xf8,0x67,0x0c,0xa9,0xfa,0x6f,0x0d,0xa9,0xfc,0x77,0x0e,0xa9,0xe0,0x83,0x04,0x91,0xfe,0x03,0x0f,0xa9,