st unsigned g=unsigned(CandidateGroup::TrainingOther);unsigned ordered[128]{},count=0;\n for(unsigned pass=0;pass<2;++pass)for(unsigned i=0;i<targets.used[g]&&i<128;++i)if(targets.records[g][i].priority==(pass==0))ordered[count++]=i;\n const unsigned batches=(count+15)/16;if(!batches)return result;\n const unsigned begin=(batch%batches)*16;\n for(unsigned i=begin;i<count&&result.count<16;++i)result.indices[result.count++]=ordered[i];\n return result;\n}\ninline TrainingSelection selectCalibration(const OwnershipTargets &targets){\n TrainingSelection result;const unsigned g=unsigned(CandidateGroup::TrainingOther);\n for(unsigned i=0;i<targets.used[g]&&i<128&&result.count<16;++i)if(targets.records[g][i].calibration)result.indices[result.count++]=i;\n return result;\n}\ninline TrainingSelection selectCalibrationScan(const OwnershipTargets &targets){\n TrainingSelection result;const unsigned g=unsigned(CandidateGroup::TrainingOther);\n for(unsigned i=0;i<targets.used[g]&&i<128&&result.count<64;++i)if(targets.records[g][i].calibration)result.indices[result.count++]=i;\n return result;\n}\nstruct ClassMemo {uintptr_t ptr=0;bool good=false;char name[65]{};};\nstruct InstanceStats {uint32_t next=0,objects=0,classes=0,defaults=0,matches=0,failed=0;};\n// Reads only known object slots. Caller supplies global read budget, pacing, and log sink.\ntemplate<class Read> struct InstanceReader {\n Read read;uintptr_t items;int32_t count;NameReader<Read> names;\n ClassMemo memo[512]{};unsigned replace=0;InstanceStats stats;GroupOutput groupOutput;OwnershipTargets targets;\n char classSamples[64][65]{};unsigned sampleCount=0;\n void sampleClass(const char *name){\n  for(unsigned i=0;i<sampleCount;++i)if(!std::strcmp(classSamples[i],name))return;\n  if(sampleCount<64)std::memcpy(classSamples[sampleCount++],name,65);\n }\n InstanceReader(Read fn,uintptr_t a,int32_t n,uintptr_t table):read(fn),items(a),count(n),names{read,table}{}\n bool className(uintptr_t p,char out[65]){\n  for(auto &c:memo)if(c.ptr==p){if(c.good)std::memcpy(out,c.name,65);return c.good;}\n  auto &c=memo[replace++%512];c=ClassMemo{};c.ptr=p;\n  if(!candidatePointer(p))return false;\n  ObjectHead h{},meta{};uintptr_t at=0;char mn[65]{};\n  if(!read(p,&h,sizeof(h))||h.index<0||h.index>=count||!candidatePointer(h.cls))return false;\n  if(!read(items+size_t(h.index)*24,&at,8)||at!=p)return false;\n  if(!read(h.cls,&meta,sizeof(meta))||!names.get(meta.nameId,mn))return false;\n  if(std::strcmp(mn,\"Class\")) {\n   ObjectHead root{};char rootName[65]{};\n   if(!definitionClass(mn)||!candidatePointer(meta.cls)||!read(meta.cls,&root,sizeof(root))||!names.get(root.nameId,rootName)||std::strcmp(rootName,\"Class\"))return false;\n  }\n  if(!names.get(h.nameId,c.name))return false;\n  c.good=true;std::memcpy(out,c.name,65);return true;\n }\n template<class Emit> bool batch(Emit emit){\n  if(count<=0||!safeSpan(items,size_t(count)*24)||stats.next>=uint32_t(count))return false;\n  const uint32_t begin=stats.next,n=std::min<uint32_t>(256,uint32_t(count)-begin);\n  std::array<unsigned char,256*24> slots{};\n  if(!read(items+size_t(begin)*24,slots.data(),size_t(n)*24))return false;\n  for(uint32_t k=0;k<n;++k){\n   const uint32_t index=begin+k;uintptr_t obj=0;std::memcpy(&obj,slots.data()+k*24,8);\n   if(!obj){stats.next=index+1;continue;}\n   if(!candidatePointer(obj)){++stats.failed;stats.next=index+1;continue;}\n   ObjectHead h{};\n   if(!read(obj,&h,sizeof(h)))return false;\n   stats.next=index+1;\n   if(h.index!=int32_t(index)||!candidatePointer(h.cls)||!candidatePointer(h.vtable)){++stats.failed;continue;}\n   ++stats.objects;char cls[65]{};\n   if(!className(h.cls,cls)){++stats.failed;continue;}\n   sampleClass(cls);\n   if(definitionClass(cls)){++stats.classes;continue;}\n   if(!interestingClass(cls))continue;\n   char name[65]{};if(!names.get(h.nameId,name)){++stats.failed;continue;}\n   if(!std::strncmp(name,\"Default__\",9)){++stats.defaults;continue;}\n   ObjectHead after{};\n   if(!read(obj,&after,sizeof(after))||std::memcmp(&h,&after,sizeof(h))){++stats.failed;continue;}\n   ++stats.matches;\n   targets.save(unsigned(candidateGroup(cls)),obj,h,cls);\n   if(groupOutput.record(candidateGroup(cls)))emit(index,name,cls,h.number);\n  }\n  return stats.next<uint32_t(count);\n }\n};\n}\n",
            "src/targeted_local_position.hpp": "#pragma once\n#include \"targeted_camera.hpp\"\nnamespace zk {\nstruct LocalPosition {const char *status=\"not_checked\";int32_t controllerIndex=-1,pawnIndex=-1,rootIndex=-1;char pawnName[65]{},pawnClass[65]{};float position[3]{};};\ntemplate<class Read> LocalPosition readLocalPosition(const OwnershipTarget &target,InstanceReader<Read> &lookup){\n LocalPosition result;ObjectHead local{},controller{},pawn{},root{};char name[65]{},cls[65]{};\n if(!validateOuterNode(target.ptr,lookup,local,name,cls)||std::memcmp(&target.original,&local,sizeof(local))){result.status=\"local_player_validation_failed\";return result;}\n if(!std::strstr(cls,\"LocalPlayer\")){result.status=\"local_player_class_rejected\";return result;}\n uintptr_t c=0,p=0,r=0;\n if(!safeSpan(target.ptr,0x38)||!lookup.read(target.ptr+0x30,&c,8)||!candidatePointer(c)){result.status=\"local_controller_pointer_invalid\";return result;}\n if(!validateOuterNode(c,lookup,controller,name,cls)||!std::strstr(cls,\"PlayerController\")){result.status=\"local_controller_validation_failed\";return result;}\n result.controllerIndex=controller.index;\n if(!safeSpan(c,0x4c0)||!lookup.read(c+0x4b8,&p,8)||!candidatePointer(p)){result.status=\"controller_pawn_pointer_invalid\";return result;}\n if(!validateOuterNode(p,lookup,pawn,result.pawnName,result.pawnClass)){result.status=\"pawn_validation_failed\";return result;}\n result.pawnIndex=pawn.index;\n if(!std::strstr(result.pawnClass,\"Pawn\")&&!std::strstr(result.pawnClass,\"Character\")){result.status=\"pawn_class_name_rejected\";return result;}\n if(!safeSpan(p,0x210)||!lookup.read(p+0x208,&r,8)||!candidatePointer(r)){result.status=\"root_component_pointer_invalid\";return result;}\n if(!validateOuterNode(r,lookup,root,name,cls)||!std::strstr(cls,\"Component\")||root.outer!=p){result.status=\"root_component_validation_failed\";return result;}\n result.rootIndex=root.index;\n if(!safeSpan(r,0x22c)||!lookup.read(r+0x220,result.position,12)){result.status=\"position_read_failed\";return result;}\n for(float v:result.position)if(!std::isfinite(v)||std::fabs(v)>1e9f){result.status=\"position_numeric_validation_failed\";return result;}\n uintptr_t c2=0,p2=0,r2=0;ObjectHead l2{},controller2{},pawn2{},root2{};\n if(!lookup.read(target.ptr+0x30,&c2,8)||!lookup.read(c+0x4b8,&p2,8)||!lookup.read(p+0x208,&r2,8)||!lookup.read(target.ptr,&l2,sizeof(l2))||!lookup.read(c,&controller2,sizeof(controller2))||!lookup.read(p,&pawn2,sizeof(pawn2))||!lookup.read(r,&root2,sizeof(root2))){result.status=\"position_chain_final_read_failed\";return result;}\n if(c2!=c||p2!=p||r2!=r||std::memcmp(&local,&l2,sizeof(local))||std::memcmp(&controller,&controller2,sizeof(controller))||std::memcmp(&pawn,&pawn2,sizeof(pawn))||std::memcmp(&root,&root2,sizeof(root))){result.status=\"position_chain_changed_during_read\";return result;}\n result.status=\"local_pawn_root_position_candidate\";return result;\n}\n}\n",
            "src/targeted_names.hpp": "#pragma once\n#include <cstdint>\n#include <cstddef>\n#include <cstring>\nnamespace zk {\nstatic_assert(sizeof(uintptr_t)==8,\"64-bit pointers required\");\nstruct TargetedResult {\n const char *status=\"not_checked\";\n uint32_t chainDepth=0;\n uintptr_t table=0;\n unsigned decoded=0;\n char names[16][65]{};\n};\ninline bool candidatePointer(uintptr_t p) { return p>=0x10000 && (p&7)==0 && p<=UINTPTR_MAX-128; }\n// Model inferred from one executable; read callback must have its own hard read budget.\ntemplate<class Read> TargetedResult checkTargetedNames(uintptr_t wrapper, Read read) {\n TargetedResult r;\n if(!candidatePointer(wrapper)) { r.status=\"bad_wrapper_address\"; return r; }\n unsigned char h[16]{};\n if(!read(wrapper,h,sizeof(h))) { r.status=\"wrapper_read_failed\"; return r; }\n uint32_t tag; uintptr_t p;\n std::memcpy(&tag,h,4); std::memcpy(&p,h+8,8);\n if(!(h[4]&1)) { r.status=\"wrapper_not_initialized\"; return r; }\n if(tag<103 || tag>148 || (tag-100)%3) { r.status=\"unexpected_chain_tag\"; return r; }\n r.chainDepth=(tag-100)/3;\n if(!candidatePointer(p)) { r.status=\"invalid_chain_pointer\"; return r; }\n uintptr_t seen[16]{}; seen[0]=p;\n for(uint32_t j=1;j<r.chainDepth;++j) {\n  uintptr_t next=0;\n  if(!read(p,&next,8) || !candidatePointer(next)) { r.status=\"chain_read_failed\"; return r; }\n  for(uint32_t k=0;k<j;++k)if(next==seen[k]) { r.status=\"chain_cycle\"; return r; }\n  seen[j]=next; p=next;\n }\n uintptr_t table=0;\n if(!read(p,&table,8) || !candidatePointer(table)) { r.status=\"table_read_failed\"; return r; }\n r.table=table;\n uintptr_t chunk=0;\n if(!read(table,&chunk,8) || !candidatePointer(chunk)) { r.status=\"chunk0_read_failed\"; return r; }\n for(unsigned id=0;id<16;++id) {\n  uintptr_t entry=0;\n  if(!read(chunk+id*8,&entry,8) || !candidatePointer(entry)) { r.status=\"entry_read_failed\"; return r; }\n  uint32_t flags=0;\n  if(!read(entry+8,&flags,4)) { r.status=\"entry_flags_read_failed\