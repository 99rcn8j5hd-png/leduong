            "tests/angle_test.cpp": "#include \"../src/angle_test_core.hpp\"\n#include <cassert>\n#include <thread>\n#include <limits>\n#include <cstdio>\nint main(){\n float a[3]{20,359.5f,3},b[3]{};assert(zk::oneDegreeYaw(a,b)&&b[0]==20&&b[1]==.5f&&b[2]==3);assert(zk::angleDelta(b[1],a[1])==1);\n a[1]=-1.5f;assert(zk::oneDegreeYaw(a,b)&&b[1]==359.5f);a[0]=std::numeric_limits<float>::quiet_NaN();assert(!zk::oneDegreeYaw(a,b));\n zk::AngleTest state;assert(state.request(1000)&&!state.request(2000));assert(state.fresh(501000)&&!state.fresh(501001)&&!state.fresh(999));assert(state.queued()&&!state.queued());\n std::thread game([&]{assert(state.begin()&&!state.begin());state.nativeReturned=true;state.finish(\"returned\",true);});game.join();assert(state.phase.load()==zk::AnglePhase::Completed&&state.nativeReturned&&!state.request(3000)&&!state.rejectPending(\"duplicate\"));\n zk::AngleTest canceled;assert(canceled.request(1));assert(canceled.rejectPending(\"canceled\"));assert(!canceled.queued()&&!canceled.begin());\n zk::AngleTest queued;assert(queued.request(1)&&queued.queued());assert(queued.rejectPending(\"factory_rejected\")&&!queued.begin());\n std::puts(\"PASS: one-degree wrapping, invalid angles, request expiry, one-shot transitions, cancellation and cross-thread result publication\");\n}\n",
            "tests/async_test.cpp": "#include \"../src/async_proof.hpp\"\n#include <cassert>\n#include <thread>\n#include <memory>\n#include <functional>\n#include <cstdio>\nint main(){\n zk::AsyncProof p;assert(!p.queue(0));assert(p.queue(123));assert(!p.queue(456));assert(!p.matches());\n std::thread worker([&]{assert(p.complete(123,500));assert(!p.complete(456,1));});worker.join();assert(p.matches()&&p.actual==123&&p.expected==123&&p.delayUs==500);\n zk::AsyncProof wrong;assert(wrong.queue(123));assert(wrong.complete(456,20));assert(!wrong.matches());\n zk::AsyncProof invalidTime;assert(invalidTime.queue(123));assert(invalidTime.complete(123,-1));assert(!invalidTime.matches());\n zk::AsyncProof rejected;rejected.reject();assert(!rejected.queue(123)&&!rejected.complete(123,1)&&!rejected.matches());\n std::weak_ptr<zk::AsyncProof> weak;std::function<void()> delayed;\n {auto owner=std::make_shared<zk::AsyncProof>();weak=owner;assert(owner->queue(123));delayed=[owner]{assert(owner->complete(123,30000000));};}\n assert(!weak.expired());delayed();assert(weak.lock()->matches());delayed=nullptr;assert(weak.expired());\n std::puts(\"PASS: asynchronous publication, duplicate prevention, wrong thread, invalid time, rejection and delayed callback ownership\");\n}\n",
            "tests/batches_test.cpp": "#include \"../src/targeted_instances.hpp\"\n#include <cassert>\n#include <cstdio>\nint main(){unsigned cases=0;const unsigned g=unsigned(zk::CandidateGroup::TrainingOther);\n for(unsigned n=0;n<=160;++n){zk::OwnershipTargets t;zk::ObjectHead h{};for(unsigned i=0;i<n;++i)t.save(g,0x10000+i*8,h,i%3?\"TrainingManager\":\"PracticeTarget\");\n  const unsigned count=n<128?n:128;assert(t.used[g]==count);bool seen[128]{};unsigned total=0;\n  const unsigned batches=(count+15)/16;\n  for(unsigned b=0;b<batches;++b){auto s=zk::selectTraining(t,b);assert(s.count<=16);for(unsigned i=0;i<s.count;++i){assert(s.indices[i]<count&&!seen[s.indices[i]]);seen[s.indices[i]]=true;++total;}}\n  assert(total==count);if(!count)assert(!zk::selectTraining(t,10).count);else{auto a=zk::selectTraining(t,0),b=zk::selectTraining(t,batches);assert(a.count==b.count);for(unsigned i=0;i<a.count;++i)assert(a.indices[i]==b.indices[i]);}++cases;\n }std::printf(\"PASS: %u bounded batch coverage cases\\n\",cases);return 0;}\n",
            "tests/budget_test.cpp": "#include \"../src/scan_budget.hpp\"\n#include <cassert>\n#include <cstdio>\nint main(){zk::resetScanBudget(3,10);assert(zk::allowRead(2)&&zk::allowRead(2)&&zk::allowRead(2)&&!zk::allowRead(1));zk::resetScanBudget(10,4);assert(zk::allowRead(4)&&!zk::allowRead(1));zk::resetScanBudget(10,4);zk::scanBudget().readBytes=5;assert(!zk::allowRead(1));zk::resetScanBudget(0,0);assert(!zk::allowRead(1));zk::resetScanBudget(524288,16u<<20);for(unsigned i=0;i<524288;++i)assert(zk::allowRead(1));assert(!zk::allowRead(1));zk::resetScanBudget();assert(zk::scanBudget().readCallLimit==300000&&zk::scanBudget().readByteLimit==(16u<<20));std::puts(\"PASS: custom read/byte caps, overflow guard, 524288 boundary and default reset\");}\n",
            "tests/calibration_test.cpp": "#include \"../src/targeted_instances.hpp\"\n#include <cassert>\n#include <cstdio>\nint main(){unsigned tests=0;const unsigned g=unsigned(zk::CandidateGroup::TrainingOther);\n for(unsigned count=0;count<=140;++count){zk::OwnershipTargets t;zk::ObjectHead h{};\n  for(unsigned i=0;i<128;++i)t.save(g,0x10000+i*8,h,\"PracticeTarget\");\n  for(unsigned i=0;i<count;++i)t.save(g,0x20000+i*8,h,\"BallisticTarget_C\");\n  unsigned retained=0;for(unsigned i=0;i<t.used[g];++i)if(t.records[g][i].calibration)++retained;\n  assert(retained==(count<128?count:128));const auto a=zk::selectCalibration(t),b=zk::selectCalibration(t);assert(a.count==(count<16?count:16)&&b.count==a.count);\n  for(unsigned i=0;i<a.count;++i){assert(a.indices[i]==b.indices[i]);assert(t.records[g][a.indices[i]].calibration);for(unsigned j=0;j<i;++j)assert(a.indices[j]!=a.indices[i]);}++tests;\n }\n {zk::OwnershipTargets t;zk::ObjectHead h{};for(const char *cls:{\"BallisticTargetDC_C\",\"OtherBallisticTarget_C\",\"BallisticTarget_C_Copy\",\"PracticeTarget\",\"TrainingManager\"})t.save(g,0x10000,h,cls);assert(!zk::selectCalibration(t).count);++tests;}\n std::printf(\"PASS: %u exact-class calibration selection cases\\n\",tests);return 0;}\n",
            "tests/camera_test.cpp": "#define main old_instance_test_main\n#include \"instances_test.cpp\"\n#undef main\n#include \"../src/targeted_camera.hpp\"\n#include <limits>\nvoid fillCamera(Fixture &f,uintptr_t p){float loc[3]={100,200,300},rot[3]={10,20,30},fov=90,lock=0;\n std::memcpy(f.m.data()+p+0x530-Fixture::base,loc,12);std::memcpy(f.m.data()+p+0x548-Fixture::base,rot,12);f.put(p+0x554,fov);f.put(p+0x4cc,lock);}\nint main(){unsigned tests=0;\n for(unsigned mode=0;mode<6;++mode){zk::CameraView v{};v.cacheFOV=v.nativeFOV=90;\n  if(mode==1)v.location[0]=std::numeric_limits<float>::quiet_NaN();\n  if(mode==2)v.rotation[1]=std::numeric_limits<float>::infinity();\n  if(mode==3)v.nativeFOV=0;\n  if(mode==4)v.nativeFOV=180;\n  if(mode==5)v.location[0]=1e10f;\n  assert(zk::plausibleCamera(v)==(mode==0));++tests;\n }\n {zk::CameraView a{},b{};assert(!zk::cameraChanged(a,b));b.rotation[1]=1;assert(zk::cameraChanged(a,b));++tests;}\n for(unsigned mode=0;mode<4;++mode){Fixture f;setup(f);const uintptr_t ptr=Fixture::objects+5*256;fillCamera(f,ptr);if(mode==1)f.put<float>(ptr+0x4cc,75);if(mode==2)f.put<float>(ptr+0x554,0);\n  zk::OwnershipTarget t;t.ptr=ptr;std::memcpy(&t.original,f.m.data()+ptr-Fixture::base,sizeof(t.original));if(mode==3)++t.original.nameId;\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());zk::CameraView view{};const char *status=zk::readCameraCandidate(t,lookup,view);\n  if(mode<2){assert(!std::strcmp(status,\"plausible_values_UNVERIFIED\"));assert(view.location[2]==300&&view.rotation[1]==20&&view.nativeFOV==(mode==1?75:90));}\n  if(mode==2)assert(!std::strcmp(status,\"numeric_validation_failed\"));if(mode==3)assert(!std::strcmp(status,\"object_changed_since_enumeration\"));++tests;\n }\n for(unsigned fail=1;fail<=80;++fail){Fixture f;setup(f);const uintptr_t ptr=Fixture::objects+5*256;fillCamera(f,ptr);zk::OwnershipTarget t;t.ptr=ptr;std::memcpy(&t.original,f.m.data()+ptr-Fixture::base,sizeof(t.original));\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());f.failAt=f.calls+fail;zk::CameraView view{};auto status=zk::readCameraCandidate(t,lookup,view);assert(status&&f.calls<100);++tests;}\n std::printf(\"PASS: %u camera candidate cases\\n\",tests);return 0;\n}\n",
            "tests/components_test.cpp": "#define main old_local_test_main\n#include \"local_test.cpp\"\n#undef main\nvoid extendWorld(LocalFixture &f){\n f.put<int32_t>(LocalFixture::names+0x400,10);\n for(unsigned id=7;id<=9;++id){f.put<uintptr_t>(LocalFixture::chunk+id*8,LocalFixture::entries+id*128);std::strcpy((char*)f.m.data()+LocalFixture::entries+id*128-LocalFixture::base+12,id==7?\"World\":id==8?\"TrainingWorld\":\"AI_Pawn\");}\n for(unsigned i=9;i<=13;++i){zk::ObjectHead h{};h.index=i;h.vtable=0x40000;h.cls=LocalFixture::object(i==9?0:i==10||i==13?9:i==11?3:4);h.nameId=i==9?7:i==10||i==13?8:i==11?9:6;h.outer=i==11?LocalFixture::object(10):i==12?LocalFixture::object(11):0;f.put(LocalFixture::object(i),h);f.put<uintptr_t>(LocalFixture::items+i*24,LocalFixture::object(i));}\n f.put<uintptr_t>(LocalFixture::object(7)+0x20,LocalFixture::object(10));f.put<uintptr_t>(LocalFixture::object(11)+0x208,LocalFixture::object(12));f.put<float>(LocalFixture::object(12)+0x220,110);f.put<float>(LocalFixture::object(12)+0x224,210);f.put<float>(LocalFixture::object(12)+0x228,310);\n}\n\n#include \"../src/training_components.hpp\"\nint main(){unsigned tests=0;\n for(unsigned mode=0;mode<6;++mode){LocalFixture f;extendWorld(f);uintptr_t a=LocalFixture::object(7),r=LocalFixture::object(8),child=LocalFixture::object(12),list=0x48000;\n f.put<uintptr_t>(child+0x20,a);f.put<uintptr_t>(r+0x198,list);f.put<int32_t>(r+0x1a0,1);f.put<int32_t>(r+0x1a4,1);f.put<uintptr_t>(list,child);\n if(mode==1)f.put<int32_t>(r+0x1a0,0);if(mode==2)f.put<int32_t>(r+0x1a4,0);if(mode==3)f.put<uintptr_t>(child+0x20,0);if(mode==4)f.put<int32_t>(r+0x1a0,-1);if(mode==5)f.put<float>(child+0x220,std::numeric_limits<float>::quiet_NaN());\n auto rd=[&](uintptr_t p,void*out,size_t n){return f.read(p,out,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,14,LocalFixture::names);assert(lookup.names.init());auto s=zk::sampleChildren(a,r,lookup);\n if(!mode){assert(s.valid==1&&s.child[0].index==12&&s.child[0].position[0]==110);}else assert(s.valid==0);++tests;\n }\n for(unsigned fail=1;fail<=80;++fail){LocalFixture f;extendWorld(f);auto rd=[&](uintptr_t p,void*out,size_t n){return f.read(p,out,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,14,LocalFixture::names);assert(lookup.names.init());f.failAt=f.calls+fail;auto s=zk::sampleChildren(LocalFixture::object(7),LocalFixture::object(8),lookup);assert(s.status&&s.valid<=4);++tests;}\n std::printf(\"PASS: %u bounded component cases\\n\",tests);return 0;}\n",
            "tests/control_test.cpp": "#include \"../src/control_rotation_probe.hpp\"\n#include <cassert>\n#include <cstring>\n#include <limits>\n#include <cstdio>\nint main(){\n float angles[3]{20,359,0};unsigned reads=0;\n auto read=[&](uintptr_t p,void*out,size_t n){++reads;if(p!=0x104e0||n!=12)return false;std::memcpy(out,angles,n);return true;};\n auto r=zk::readControlCandidate(0x10000,read);assert(!std::strcmp(r.status,\"finite_candidate_NOT_control_verified\"));\n assert(r.angle[0]==20&&reads==1);\n assert(!std::strcmp(zk::readControlCandidate(0,read).status,\"bad_controller\")&&reads==1);\n assert(!std::strcmp(zk::readControlCandidate(UINTPTR_MAX,read).status,\"bad_controller\")&&reads==1);\n assert(!std::strcmp(zk::readControlCandidate(0x20000,read).status,\"read_failed\"));\n angles[0]=std::numeric_limits<float>::quiet_NaN();assert(!std::strcmp(zk::readControlCandidate(0x10000,read).status,\"invalid_angles\"));\n assert(zk::rotationDifference(359,1)==-2&&zk::rotationDifference(1,359)==2);\n std::puts(\"PASS: bounded control candidate read, failures, invalid angles and wrapped angle differences\");\n}\n",
            "tests/eight_test.cpp": "#include \"../src/training_rank.hpp\"\n#include <cassert>\n#include <algorithm>\n#include <random>\n#include <vector>\n#include <cstdio>\nint main(){unsigned cases=0;std::mt19937 rng(8241);\n for(unsigned n=0;n<=64;++n)for(unsigned trial=0;trial<12;++trial){std::vector<unsigned> order;for(unsigned i=0;i<n;++i)order.push_back(i);std::shuffle(order.begin(),order.end(),rng);zk::TrainingRankEight rank;\n  for(unsigned i:order){rank.offer({i,int32_t(i),.5,.5,100.+i});rank.offer({i,int32_t(i),.5,.5,100.+i});}\n  assert(rank.count==std::min(n,8u));for(unsigned i=0;i<rank.count;++i)assert(rank.marks[i].index==int32_t(i)&&rank.marks[i].distance==100.+i);++cases;\n }\n {zk::TrainingRankEight rank;for(unsigned i=0;i<20;++i)rank.offer({i,int32_t(i),.01,.5,100});assert(rank.count==0);++cases;}\n {zk::TrainingRankEight rank;for(int i=20;i>=1;--i)rank.offer({unsigned(i),i,.5,.5,100});assert(rank.count==8);for(unsigned i=0;i<8;++i)assert(rank.marks[i].index==int32_t(i+1));++cases;}\n std::printf(\"PASS: %u eight-target capacity, shortage, uniqueness, ordering and input cases\\n\",cases);}\n",
            "tests/fov_test.cpp": "#include \"../src/fov_preview.hpp\"\n#include <cassert>\n#include <limits>\n#include <cstdio>\nint main(){\n zk::FovPoint p[]={{7,.5,.5,false,true},{8,.5,.5,true,false},{3,.52,.5},{2,.5,.52}};\n auto r=zk::pickFov(p,4,1000,500,.1);assert(r.index==2&&r.radius==50);\n p[3].x=.9;assert(zk::pickFov(p,4,1000,500,.1).index==3);\n p[2].x=.56;assert(zk::pickFov(p,4,1000,500,.1).index<0);\n assert(zk::pickFov(p,4,1000,500,.2).index==3);\n p[2].x=std::numeric_limits<double>::quiet_NaN();assert(zk::pickFov(p,4,1000,500,.2).index<0);\n assert(zk::pickFov(nullptr,100,1000,500,.2).index<0);\n assert(zk::pickFov(p,4,0,500,.2).index<0);\n assert(zk::fovFraction(0)==.05&&zk::fovFraction(2)==.45);\n assert(zk::fovFraction(std::numeric_limits<double>::quiet_NaN())==.18);\n zk::FovPoint tie[]={{9,.5,.5},{4,.5,.5}};assert(zk::pickFov(tie,2,1000,500,.2).index==4);\n for(unsigned i=0;i<1000;++i){double f=i/1000.;auto a=zk::pickFov(tie,2,1000,500,f);assert(a.index==4&&a.radius>=25&&a.radius<=225);}\n std::puts(\"PASS: FOV size, screen aspect, exclusions, radius change, NaN, empty, tie and 1000 slider positions\");\n}\n",
            "tests/groups_test.cpp": "#define main old_instance_test_main\n#include \"instances_test.cpp\"\n#undef main\nint main(){unsigned tests=0;\n const char *names[]={\"World\",\"STExtraPlayerController\",\"PlayerCameraManager\",\"UAEGameEngine\",\"STExtraGameInstance\",\"GameViewportClient\",\"LocalPlayer\",\"BP_PlayerPawn_C\",\"CharacterMovementComponent\",\"BP_TrainingDummy_C\"};\n for(unsigned i=0;i<zk::groupCount;++i){assert(unsigned(zk::candidateGroup(names[i]))==i);++tests;}\n {assert(zk::candidateGroup(\"Texture2D\")==zk::CandidateGroup::Count);assert(!std::strcmp(zk::groupLabel(999),\"unmatched\"));++tests;}\n {zk::GroupOutput q;for(unsigned i=0;i<500;++i)q.record(zk::CandidateGroup::CharacterOther);assert(q.matched[8]==500&&q.logged[8]==4);assert(q.record(zk::CandidateGroup::World));assert(q.record(zk::CandidateGroup::Camera));assert(!q.record(zk::CandidateGroup::Count));++tests;}\n {zk::GroupOutput q;for(unsigned n=0;n<zk::groupCount;++n){for(unsigned i=0;i<100;++i)q.record(zk::CandidateGroup(n));assert(q.matched[n]==100&&q.logged[n]==zk::GroupOutput::limit(n));}++tests;}\n {Fixture f;constexpr uintptr_t o=0x40000;\n  f.put<int32_t>(Fixture::names+0x400,18);\n  std::strcpy((char*)f.m.data()+Fixture::entries+2*128-Fixture::base+12,\"CharacterMovementComponent\");\n  std::strcpy((char*)f.m.data()+Fixture::entries+4*128-Fixture::base+12,\"World\");\n  for(uint32_t i=0;i<300;++i){zk::ObjectHead h{};h.index=i;h.vtable=0x50000;h.cls=i<3?o:i==299?o+512:o+256;h.nameId=i==0?1:i==1?2:i==2?4:3;f.put(o+i*256,h);f.put<uintptr_t>(Fixture::items+i*24,o+i*256);}\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> reader(rd,Fixture::items,300,Fixture::names);assert(reader.names.init());unsigned world=0,noise=0;\n  auto emit=[&](uint32_t index,const char*,const char *cls,uint32_t){if(!std::strcmp(cls,\"World\")){assert(index==299);++world;}else ++noise;};\n  assert(reader.batch(emit));assert(!reader.batch(emit));assert(world==1&&noise==4);assert(reader.groupOutput.matched[8]==296&&reader.groupOutput.logged[8]==4);assert(reader.groupOutput.matched[0]==1);++tests;\n }\n std::printf(\"PASS: %u grouping and output quota cases\\n\",tests);return 0;\n}\n",
            "tests/growth_test.cpp": "#define main old_object_test_main\n#include \"objects_test.cpp\"\n#undef main\nint main(){unsigned tests=0;\n zk::ArraySnapshot a;a.items=Fixture::items;a.count=264329;a.capacity=520000;\n {auto b=a;assert(zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;b.count=264420;assert(zk::snapshotAccepted(a,a,b));assert(a.count==264329);++tests;}\n {auto b=a;b.count=a.capacity;assert(zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;b.count=a.capacity+1;assert(!zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;--b.count;assert(!std::strcmp(zk::snapshotPolicy(a,a,b),\"count_decreased\"));++tests;}\n {auto p=a;p.count+=100;auto b=p;--b.count;assert(!std::strcmp(zk::snapshotPolicy(a,p,b),\"count_decreased\"));++tests;}\n {auto b=a;b.items+=8;assert(!std::strcmp(zk::snapshotPolicy(a,a,b),\"items_pointer_changed\"));++tests;}\n {auto b=a;++b.capacity;assert(!std::strcmp(zk::snapshotPolicy(a,a,b),\"capacity_changed\"));++tests;}\n {auto b=a;b.count=-1;assert(!zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;b.items=0;assert(!zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;b.capacity=5000001;assert(!zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;b.capacity=-1;assert(!zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;b.items=UINTPTR_MAX-7;assert(!zk::snapshotAccepted(b,b,b));++tests;}\n {Fixture f;f.put<int32_t>(Fixture::base+24,32);const auto baseline=f.run();auto fixed=baseline.after;auto previous=fixed;\n  for(int n:{17,18,25}){auto now=previous;now.count=n;f.put<int32_t>(Fixture::base+28,n);assert(zk::snapshotAccepted(fixed,previous,now));previous=now;}\n  assert(fixed.count==16);++tests;}\n std::printf(\"PASS: %u fixed snapshot policy cases\\n\",tests);return 0;\n}\n",
            "tests/instances_test.cpp": "#include \"../src/targeted_objects.hpp\"\n#include <vector>\n#include <cassert>\n#include <cstdio>\n#include <cstring>\nstruct Fixture {\n static constexpr uintptr_t base=0x10000,names=0x20000,chunk=0x21000,entries=0x22000,items=0x30000,objects=0x31000;\n std::vector<unsigned char> m=std::vector<unsigned char>(0x60000,0);\n size_t calls=0,bytes=0,failAt=0,headerReads=0;bool changeHeader=false;\n template<class T> void put(uintptr_t a,T n){assert(a>=base&&a-base+sizeof(T)<=m.size());std::memcpy(m.data()+a-base,&n,sizeof(T));}\n Fixture(){\n  put<uintptr_t>(base+16,items);put<int32_t>(base+24,16);put<int32_t>(base+28,16);\n  put<uintptr_t>(names,chunk);put<int32_t>(names+0x400,18);\n  for(unsigned i=0;i<18;++i){put<uintptr_t>(chunk+i*8,entries+i*128);std::strcpy((char*)m.data()+entries+i*128-base+12,i==0?\"None\":i==1?\"Class\":\"ObjectName\");}\n  for(unsigned i=0;i<16;++i){put<uintptr_t>(items+i*24,objects+i*256);zk::ObjectHead h{};h.vtable=0x50000;h.index=i;h.cls=objects+256;h.nameId=i==1?1:i+2;put(objects+i*256,h);}\n }\n bool read(uintptr_t a,void*p,size_t n){++calls;bytes+=n;if(calls==failAt)return false;if(a<base||a-base>m.size()||n>m.size()-(a-base))return false;if(a==base+16&&++headerReads==2&&changeHeader)put<int32_t>(base+28,17);std::memcpy(p,m.data()+a-base,n);return true;}\n zk::ObjectResult run(){return zk::checkObjects(base,names,[&](uintptr_t a,void*p,size_t n){return read(a,p,n);});}\n};\n\n#include \"../src/targeted_instances.hpp\"\n#include <string>\nvoid setup(Fixture &f){\n const uintptr_t o=Fixture::objects,e=Fixture::entries,b=Fixture::base;\n f.put<uint32_t>(o+2*256+24,4);std::strcpy((char*)f.m.data()+e+4*128-b+12,\"World\");\n f.put<uintptr_t>(o+3*256+16,o+2*256);\n f.put<uintptr_t>(o+4*256+16,o+2*256);std::strcpy((char*)f.m.data()+e+6*128-b+12,\"Default__World\");\n f.put<uintptr_t>(o+5*256+16,o+6*256);std::strcpy((char*)f.m.data()+e+8*128-b+12,\"STExtraPlayerCameraManager\");\n}\nint main(){unsigned tests=0;\n for(const char *s:{\"World\",\"GameEngine\",\"STExtraPlayerController\",\"STExtraPlayerCameraManager\",\"LocalPlayer\",\"GameInstance\",\"GameViewportClient\",\"BP_PlayerPawn_C\",\"Character\"}){assert(zk::interestingClass(s));++tests;}\n for(const char *s:{\"Class\",\"Package\",\"WorldSettings\",\"CameraComponent\",\"Texture2D\"}){assert(!zk::interestingClass(s));++tests;}\n {Fixture f;setup(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());unsigned emitted=0;\n assert(!x.batch([&](uint32_t i,const char *name,const char *cls,uint32_t){assert(i==3||i==5);assert(std::strncmp(name,\"Default__\",9));assert(zk::interestingClass(cls));++emitted;}));\n assert(x.stats.next==16&&x.stats.matches==2&&x.stats.defaults==1&&emitted==2&&x.stats.failed==0);assert(f.calls<512&&f.bytes<32768);++tests;}\n for(size_t fail=1;fail<=120;++fail){Fixture f;setup(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());f.failAt=f.calls+fail;x.batch([](uint32_t,const char*,const char*,uint32_t){});assert(x.stats.next<=16&&x.stats.matches<=2&&f.calls<512&&f.bytes<32768);++tests;}\n {Fixture f;f.put<int32_t>(Fixture::names+0x400,400);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::NameReader<decltype(rd)> nr{rd,Fixture::names};assert(nr.init());char name[65]{};\n for(uint32_t i=0;i<300;++i){const uintptr_t entry=0x40000+i*128;f.put<uintptr_t>(Fixture::chunk+i*8,entry);std::strcpy((char*)f.m.data()+entry-Fixture::base+12,\"Name\");assert(nr.get(i,name));}assert(nr.used<=256);++tests;}\n {Fixture f;constexpr uintptr_t objs=0x40000;f.put<int32_t>(Fixture::base+24,300);f.put<int32_t>(Fixture::base+28,300);\n for(uint32_t i=0;i<300;++i){zk::ObjectHead h{};h.index=i;h.vtable=0x50000;h.cls=objs+256;h.nameId=i==1?1:2;f.put(objs+i*256,h);f.put<uintptr_t>(Fixture::items+i*24,objs+i*256);}\n auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,300,Fixture::names);assert(x.names.init());auto emit=[](uint32_t,const char*,const char*,uint32_t){};assert(x.batch(emit));assert(x.stats.next==256);assert(!x.batch(emit));assert(x.stats.next==300&&x.stats.classes==300);++tests;}\n\n {Fixture f;setup(f);const uintptr_t o=Fixture::objects,e=Fixture::entries,b=Fixture::base;\n  f.put<uintptr_t>(o+2*256+16,o+6*256);std::strcpy((char*)f.m.data()+e+8*128-b+12,\"BlueprintGeneratedClass\");\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());bool world=false;\n  x.batch([&](uint32_t i,const char*,const char *cls,uint32_t){if(i==3&&!std::strcmp(cls,\"World\"))world=true;});assert(world);++tests;}\n {Fixture f;setup(f);const uintptr_t o=Fixture::objects,e=Fixture::entries,b=Fixture::base;\n  f.put<uintptr_t>(o+2*256+16,o+6*256);std::strcpy((char*)f.m.data()+e+8*128-b+12,\"BogusMetaclass\");\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());bool world=false;\n  x.batch([&](uint32_t i,const char*,const char*,uint32_t){if(i==3)world=true;});assert(!world);++tests;}\n {Fixture f;setup(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());\n  x.batch([](uint32_t,const char*,const char*,uint32_t){});assert(x.sampleCount>0&&x.sampleCount<=64);unsigned before=x.sampleCount;\n  x.sampleClass(x.classSamples[0]);assert(x.sampleCount==before);\n  for(unsigned i=0;i<100;++i){char name[65]{};std::snprintf(name,sizeof(name),\"Sample%u\",i);x.sampleClass(name);}assert(x.sampleCount==64);++tests;}\n std::printf(\"PASS: %u instance reader cases\\n\",tests);return 0;\n}\n",
            "tests/level_test.cpp": "#define main old_local_test_main\n#include \"local_test.cpp\"\n#undef main\n#include \"../src/targeted_pawn_candidates.hpp\"\nvoid extendWorld(LocalFixture &f){\n f.put<int32_t>(LocalFixture::names+0x400,10);\n for(unsigned id=7;id<=9;++id){f.put<uintptr_t>(LocalFixture::chunk+id*8,LocalFixture::entries+id*128);std::strcpy((char*)f.m.data()+LocalFixture::entries+id*128-LocalFixture::base+12,id==7?\"World\":id==8?\"TrainingWorld\":\"AI_Pawn\");}\n for(unsigned i=9;i<=13;++i){zk::ObjectHead h{};h.index=i;h.vtable=0x40000;h.cls=LocalFixture::object(i==9?0:i==10||i==13?9:i==11?3:4);h.nameId=i==9?7:i==10||i==13?8:i==11?9:6;h.outer=i==11?LocalFixture::object(10):i==12?LocalFixture::object(11):0;f.put(LocalFixture::object(i),h);f.put<uintptr_t>(LocalFixture::items+i*24,LocalFixture::object(i));}\n f.put<uintptr_t>(LocalFixture::object(7)+0x20,LocalFixture::object(10));f.put<uintptr_t>(LocalFixture::object(11)+0x208,LocalFixture::object(12));f.put<float>(LocalFixture::object(12)+0x220,110);f.put<float>(LocalFixture::object(12)+0x224,210);f.put<float>(LocalFixture::object(12)+0x228,310);\n}\n\nconstexpr uintptr_t expectedGetter=0x44448;\nvoid addLevels(LocalFixture &f){extendWorld(f);f.put<int32_t>(LocalFixture::names+0x400,11);f.put<uintptr_t>(LocalFixture::chunk+10*8,LocalFixture::entries+10*128);std::strcpy((char*)f.m.data()+LocalFixture::entries+10*128-LocalFixture::base+12,\"Level\");\n for(unsigned i=14;i<=16;++i){zk::ObjectHead h{};h.index=i;h.vtable=0x40000;h.cls=LocalFixture::object(i==16?0:16);h.nameId=i==16?10:6;h.outer=i==14?LocalFixture::object(10):i==15?LocalFixture::object(13):0;f.put(LocalFixture::object(i),h);f.put<uintptr_t>(LocalFixture::items+i*24,LocalFixture::object(i));}\n f.put<uintptr_t>(LocalFixture::object(7)+0x20,LocalFixture::object(14));f.put<uintptr_t>(LocalFixture::object(11)+0x20,LocalFixture::object(15));f.put<uintptr_t>(LocalFixture::object(14)+0xc0,LocalFixture::object(10));f.put<uintptr_t>(LocalFixture::object(15)+0xc0,LocalFixture::object(10));f.put<uintptr_t>(0x40000+0x168,expectedGetter);\n}\nint main(){unsigned tests=0;\n for(unsigned mode=0;mode<5;++mode){LocalFixture f;addLevels(f);if(mode==1)f.put<uintptr_t>(LocalFixture::object(15)+0xc0,LocalFixture::object(13));if(mode==2)f.put<uintptr_t>(LocalFixture::object(15)+0xc0,0);if(mode==3)f.put<uintptr_t>(0x40000+0x168,0);if(mode==4)f.put<uintptr_t>(LocalFixture::object(15)+0xc0,LocalFixture::object(6));\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,17,LocalFixture::names);assert(lookup.names.init());\n  auto local=zk::resolveLevelWorld(LocalFixture::object(7),lookup,expectedGetter);auto other=zk::resolveLevelWorld(LocalFixture::object(11),lookup,expectedGetter);\n  if(!mode){assert(local.world.ptr==other.world.ptr&&local.world.ptr==LocalFixture::object(10));assert(zk::findOwningWorld(LocalFixture::object(11),lookup).ptr==LocalFixture::object(13));zk::OwnershipTarget target;target.ptr=LocalFixture::object(11);std::memcpy(&target.original,f.m.data()+target.ptr-LocalFixture::base,sizeof(target.original));auto result=zk::readOtherPawn(target,LocalFixture::object(7),local.world,lookup,false,expectedGetter);assert(!std::strcmp(result.status,\"same_world_pawn_position_candidate\")&&result.outerWorldIndex==13&&result.worldIndex==10&&result.levelIndex==15);}\n  if(mode==1)assert(other.world.ptr!=local.world.ptr);\n  if(mode==2)assert(!std::strcmp(other.world.status,\"level_world_pointer_invalid\"));if(mode==3)assert(!std::strcmp(other.world.status,\"level_world_getter_mismatch\"));if(mode==4)assert(!std::strcmp(other.world.status,\"level_world_object_invalid\"));++tests;\n }\n {LocalFixture f;addLevels(f);unsigned reads=0;auto rd=[&](uintptr_t a,void*p,size_t n){if(a==LocalFixture::object(15)+0xc0&&++reads==2)f.put<uintptr_t>(a,0);return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,17,LocalFixture::names);assert(lookup.names.init());assert(!std::strcmp(zk::resolveLevelWorld(LocalFixture::object(11),lookup,expectedGetter).world.status,\"level_world_changed_during_read\"));++tests;}\n {zk::OwnershipTargets saved;zk::ObjectHead h{};const unsigned g=unsigned(zk::CandidateGroup::TrainingOther);for(unsigned i=0;i<32;++i)saved.save(g,0x10000+i*8,h,\"TrainingManager\");for(unsigned i=0;i<4;++i)saved.save(g,0x20000+i*8,h,\"BP_ShootingPracticeTarget_3_C\");unsigned priority=0;for(unsigned i=0;i<saved.used[g];++i)priority+=saved.records[g][i].priority?1:0;assert(saved.used[g]==36&&priority==4);const auto selection=zk::selectTraining(saved);assert(selection.count==16);for(unsigned i=0;i<4;++i)assert(saved.records[g][selection.indices[i]].priority);for(unsigned i=0;i<selection.count;++i)for(unsigned j=0;j<i;++j)assert(selection.indices[i]!=selection.indices[j]);++tests;}\n for(unsigned fail=1;fail<=100;++fail){LocalFixture f;addLevels(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,17,LocalFixture::names);assert(lookup.names.init());f.failAt=f.calls+fail;auto result=zk::resolveLevelWorld(LocalFixture::object(11),lookup,expectedGetter);assert(result.world.status&&f.calls<130);++tests;}\n std::printf(\"PASS: %u Level/World relation and priority cases\\n\",tests);return 0;\n}\n",
            "tests/link_test.cpp": "#define main old_instance_test_main\n#include \"instances_test.cpp\"\n#undef main\n#include \"../src/targeted_controller_camera.hpp\"\nvoid configureLink(Fixture &f){setup(f);const uintptr_t o=Fixture::objects,e=Fixture::entries,b=Fixture::base;f.put<uintptr_t>(o+3*256+16,o+7*256);f.put<uint32_t>(o+7*256+24,9);std::strcpy((char*)f.m.data()+e+9*128-b+12,\"BP_PlayerController_MainCity_C\");f.put<uintptr_t>(o+3*256+0x548,o+5*256);}\nint main(){unsigned tests=0;\n for(unsigned mode=0;mode<5;++mode){Fixture f;configureLink(f);const uintptr_t ptr=Fixture::objects+3*256;\n  if(mode==1)f.put<uintptr_t>(ptr+0x548,0);if(mode==2)f.put<uintptr_t>(ptr+0x548,1);if(mode==3)f.put<uintptr_t>(ptr+0x548,Fixture::objects+4*256);\n  zk::OwnershipTarget t;t.ptr=ptr;std::memcpy(&t.original,f.m.data()+ptr-Fixture::base,sizeof(t.original));if(mode==4)++t.original.nameId;\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());auto r=zk::checkControllerCamera(t,lookup);\n  const char *expected[]={\"controller_camera_pointer_validated\",\"null_camera_pointer\",\"referenced_camera_validation_failed\",\"referenced_class_rejected\",\"controller_changed_since_enumeration\"};assert(!std::strcmp(r.status,expected[mode]));++tests;\n }\n {Fixture f;configureLink(f);const uintptr_t ptr=Fixture::objects+3*256;zk::OwnershipTarget t;t.ptr=ptr;std::memcpy(&t.original,f.m.data()+ptr-Fixture::base,sizeof(t.original));unsigned reads=0;\n  auto rd=[&](uintptr_t a,void*p,size_t n){if(a==ptr+0x548&&++reads==2)f.put<uintptr_t>(a,0);return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());assert(!std::strcmp(zk::checkControllerCamera(t,lookup).status,\"controller_link_changed_during_read\"));++tests;\n }\n for(unsigned fail=1;fail<=80;++fail){Fixture f;configureLink(f);const uintptr_t ptr=Fixture::objects+3*256;zk::OwnershipTarget t;t.ptr=ptr;std::memcpy(&t.original,f.m.data()+ptr-Fixture::base,sizeof(t.original));auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());f.failAt=f.calls+fail;auto r=zk::checkControllerCamera(t,lookup);assert(r.status&&f.calls<100);++tests;}\n std::printf(\"PASS: %u controller-camera link cases\\n\",tests);return 0;\n}\n",
            "tests/local_test.cpp": "#include \"../src/targeted_local_position.hpp\"\n#include <cassert>\n#include <cstdio>\n#include <vector>\n#include <limits>\nstruct LocalFixture {\n static constexpr uintptr_t base=0x10000,items=0x20000,names=0x30000,chunk=0x31000,entries=0x32000,objects=0x50000;\n std::vector<unsigned char> m=std::vector<unsigned char>(0x60000,0);size_t calls=0,failAt=0;unsigned linkReads=0;bool change=false;\n static uintptr_t object(unsigned i){return objects+i*0x1000;}\n template<class T>void put(uintptr_t a,T v){assert(a>=base&&a-base+sizeof(T)<=m.size());std::memcpy(m.data()+a-base,&v,sizeof(v));}\n LocalFixture(){const char* n[]={\"None\",\"Class\",\"LocalPlayer\",\"PlayerController\",\"PlayerPawn\",\"CapsuleComponent\",\"Instance\"};put<int32_t>(names+0x400,7);put<uintptr_t>(names,chunk);\n  for(unsigned i=0;i<7;++i){put<uintptr_t>(chunk+i*8,entries+i*128);std::strcpy((char*)m.data()+entries+i*128-base+12,n[i]);}\n  for(unsigned i=0;i<9;++i){zk::ObjectHead h{};h.vtable=0x40000;h.index=i;h.cls=object(i==0?0:i<=4?0:i-4);h.nameId=i==0?1:i<=4?i+1:6;h.outer=i==8?object(7):0;put(object(i),h);put<uintptr_t>(items+i*24,object(i));}\n  put<uintptr_t>(object(5)+0x30,object(6));put<uintptr_t>(object(6)+0x4b8,object(7));put<uintptr_t>(object(7)+0x208,object(8));put<float>(object(8)+0x220,100);put<float>(object(8)+0x224,200);put<float>(object(8)+0x228,300);\n }\n bool read(uintptr_t a,void*p,size_t n){++calls;if(calls==failAt)return false;if(a<base||a-base>m.size()||n>m.size()-(a-base))return false;if(change&&a==object(6)+0x4b8&&++linkReads==2)put<uintptr_t>(a,0);std::memcpy(p,m.data()+a-base,n);return true;}\n zk::OwnershipTarget target(){zk::OwnershipTarget t;t.ptr=object(5);std::memcpy(&t.original,m.data()+t.ptr-base,sizeof(t.original));return t;}\n};\nint main(){unsigned tests=0;\n for(unsigned mode=0;mode<6;++mode){LocalFixture f;\n  if(mode==1)f.put<uintptr_t>(LocalFixture::object(5)+0x30,0);\n  if(mode==2)f.put<uintptr_t>(LocalFixture::object(6)+0x4b8,0);\n  if(mode==3)f.put<uintptr_t>(LocalFixture::object(8)+0x20,0);\n  if(mode==4)f.put<float>(LocalFixture::object(8)+0x220,std::numeric_limits<float>::quiet_NaN());\n  if(mode==5)f.change=true;\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,9,LocalFixture::names);assert(lookup.names.init());auto result=zk::readLocalPosition(f.target(),lookup);\n  const char *expected[]={\"local_pawn_root_position_candidate\",\"local_controller_pointer_invalid\",\"controller_pawn_pointer_invalid\",\"root_component_validation_failed\",\"position_numeric_validation_failed\",\"position_chain_changed_during_read\"};assert(!std::strcmp(result.status,expected[mode]));if(!mode)assert(result.position[0]==100&&result.position[2]==300&&result.pawnIndex==7);++tests;\n }\n for(unsigned fail=1;fail<=120;++fail){LocalFixture f;auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,9,LocalFixture::names);assert(lookup.names.init());f.failAt=f.calls+fail;auto result=zk::readLocalPosition(f.target(),lookup);assert(result.status&&f.calls<150);++tests;}\n std::printf(\"PASS: %u local-position chain cases\\n\",tests);return 0;\n}\n",
            "tests/manual_test.cpp": "#include \"../src/manual_capture.hpp\"\n#include <cassert>\n#include <cstdio>\n#include <thread>\n#include <cstring>\nint main(){unsigned tests=0;\n {zk::CaptureGate g;assert(g.phase()==zk::CapturePhase::Idle);assert(!g.request()&&!g.arm());assert(g.begin());assert(!g.begin()&&!g.request());assert(g.arm());assert(!g.arm());assert(g.request());assert(!g.request());assert(g.wait(std::chrono::milliseconds(1)));g.finish();assert(g.phase()==zk::CapturePhase::Idle);++tests;}\n {zk::CaptureGate g;assert(g.begin()&&g.arm());assert(!g.wait(std::chrono::milliseconds(1)));g.finish();assert(g.begin());++tests;}\n {zk::CaptureGate g;assert(g.begin()&&g.arm());std::thread t([&]{g.request();});assert(g.wait(std::chrono::seconds(1)));t.join();g.finish();++tests;}\n {zk::CaptureGate g;assert(g.begin()&&g.arm());std::thread t([&]{g.finish();});assert(!g.wait(std::chrono::seconds(1)));t.join();++tests;}\n {zk::CaptureGate g;for(unsigned i=0;i<100;++i){assert(g.begin()&&g.arm()&&g.request());assert(g.wait(std::chrono::milliseconds(1)));g.finish();}++tests;}\n {assert(!std::strcmp(zk::capturePhaseLabel(0),\"still_baseline\"));assert(!std::strcmp(zk::capturePhaseLabel(4),\"still_baseline\"));assert(!std::strcmp(zk::capturePhaseLabel(5),\"move_forward\"));assert(!std::strcmp(zk::capturePhaseLabel(9),\"move_forward\"));assert(!std::strcmp(zk::capturePhaseLabel(10),\"still_after\"));assert(!std::strcmp(zk::capturePhaseLabel(15),\"still_after\"));++tests;}\n std::printf(\"PASS: %u manual capture state cases\\n\",tests);return 0;\n}\n",
            "tests/objects_test.cpp": "#include \"../src/targeted_objects.hpp\"\n#include <vector>\n#include <cassert>\n#include <cstdio>\n#include <cstring>\nstruct Fixture {\n static constexpr uintptr_t base=0x10000,names=0x20000,chunk=0x21000,entries=0x22000,items=0x30000,objects=0x31000;\n std::vector<unsigned char> m=std::vector<unsigned char>(0x60000,0);\n size_t calls=0,bytes=0,failAt=0,headerReads=0;bool changeHeader=false;\n template<class T> void put(uintptr_t a,T n){assert(a>=base&&a-base+sizeof(T)<=m.size());std::memcpy(m.data()+a-base,&n,sizeof(T));}\n Fixture(){\n  put<uintptr_t>(base+16,items);put<int32_t>(base+24,16);put<int32_t>(base+28,16);\n  put<uintptr_t>(names,chunk);put<int32_t>(names+0x400,18);\n  for(unsigned i=0;i<18;++i){put<uintptr_t>(chunk+i*8,entries+i*128);std::strcpy((char*)m.data()+entries+i*128-base+12,i==0?\"None\":i==1?\"Class\":\"ObjectName\");}\n  for(unsigned i=0;i<16;++i){put<uintptr_t>(items+i*24,objects+i*256);zk::ObjectHead h{};h.vtable=0x50000;h.index=i;h.cls=objects+256;h.nameId=i==1?1:i+2;put(objects+i*256,h);}\n }\n bool read(uintptr_t a,void*p,size_t n){++calls;bytes+=n;if(calls==failAt)return false;if(a<base||a-base>m.size()||n>m.size()-(a-base))return false;if(a==base+16&&++headerReads==2&&changeHeader)put<int32_t>(base+28,17);std::memcpy(p,m.data()+a-base,n);return true;}\n zk::ObjectResult run(){return zk::checkObjects(base,names,[&](uintptr_t a,void*p,size_t n){return read(a,p,n);});}\n};\nint main(){\n unsigned tests=0;\n {Fixture f;auto r=f.run();assert(r.valid==16&&r.stable&&!std::strcmp(r.status,\"object_sample_matched_camera_NOT_checked\"));assert(f.calls<512&&f.bytes<32768);++tests;}\n for(int32_t n:{-1,0,17,5000001}){Fixture f;f.put<int32_t>(Fixture::base+28,n);auto r=f.run();assert(!std::strcmp(r.status,\"array_header_invalid\"));++tests;}\n {Fixture f;f.put<int32_t>(Fixture::names+0x400,0);assert(!std::strcmp(f.run().status,\"name_count_invalid\"));++tests;}\n {Fixture f;f.put<uintptr_t>(Fixture::items,0);auto r=f.run();assert(!std::strcmp(r.sample[0].status,\"empty_slot\")&&r.valid==15);++tests;}\n {Fixture f;f.put<int32_t>(Fixture::objects+12,99);assert(!std::strcmp(f.run().sample[0].status,\"object_header_mismatch\"));++tests;}\n {Fixture f;f.put<int32_t>(Fixture::objects+256+12,99);assert(!std::strcmp(f.run().sample[0].status,\"class_header_mismatch\"));++tests;}\n {Fixture f;f.put<uintptr_t>(Fixture::items+24,Fixture::objects);assert(!std::strcmp(f.run().sample[0].status,\"class_index_mismatch\"));++tests;}\n {Fixture f;f.m[Fixture::entries+128-Fixture::base+12]='X';assert(!std::strcmp(f.run().sample[0].status,\"metaclass_name_mismatch\"));++tests;}\n {Fixture f;f.put<uint32_t>(Fixture::objects+24,18);assert(!std::strcmp(f.run().sample[0].status,\"name_decode_failed\"));++tests;}\n {Fixture f;f.changeHeader=true;auto r=f.run();assert(!r.stable&&!std::strcmp(r.status,\"array_changed_during_sample\"));++tests;}\n {Fixture f;f.failAt=1;assert(!std::strcmp(f.run().status,\"array_header_read_failed\"));++tests;}\n // Fail each read once: bounded diagnostic must finish without invalid memory access.\n for(size_t fail=2;fail<=180;++fail){Fixture f;f.failAt=fail;auto r=f.run();(void)r;assert(f.calls<512&&f.bytes<32768);++tests;}\n std::printf(\"PASS: %u object reader cases\\n\",tests);return 0;\n}\n",
            "tests/ownership_test.cpp": "#define main old_instance_test_main\n#include \"instances_test.cpp\"\n#undef main\n#include \"../src/targeted_ownership.hpp\"\nint main(){unsigned tests=0;\n {zk::OwnershipTargets t;zk::ObjectHead h{};for(unsigned g=0;g<9;++g)for(unsigned i=0;i<20;++i)t.save(g,0x10000+i*8,h);for(unsigned g=0;g<7;++g)assert(t.used[g]==8);++tests;}\n for(unsigned mode=0;mode<6;++mode){\n  zk::OwnershipTarget target;target.ptr=0x10000;target.original.index=1;target.original.outer=0x20000;\n  unsigned calls=0,emitted=0;\n  auto validate=[&](uintptr_t p,zk::ObjectHead &h,char*,char*){++calls;h=p==target.ptr?target.original:zk::ObjectHead{};h.index=p==target.ptr?1:2;\n   if(mode==1&&p==0x20000)h.outer=target.ptr;\n   if(mode==2&&p==target.ptr)++h.nameId;\n   if(mode==3)return false;\n   if(mode==4&&p==0x20000)h.outer=1;\n   if(mode==5){h.outer=p+0x10000;if(p==target.ptr)h.outer=target.original.outer;}\n   return true;};\n  auto r=zk::walkOuter(target,validate,[&](unsigned,uintptr_t,const zk::ObjectHead&,const char*,const char*){++emitted;});\n  const char *expected[]={\"null_outer_end\",\"outer_cycle\",\"target_changed_since_enumeration\",\"node_validation_failed\",\"invalid_outer_pointer\",\"depth_limit\"};\n  assert(!std::strcmp(r.status,expected[mode]));assert(calls<=8&&emitted==r.nodes);++tests;\n }\n {Fixture f;setup(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());\n  f.put<uintptr_t>(Fixture::objects+5*256+32,Fixture::objects+3*256);\n  zk::OwnershipTarget t;t.ptr=Fixture::objects+5*256;std::memcpy(&t.original,f.m.data()+t.ptr-Fixture::base,sizeof(t.original));\n  auto r=zk::walkOuter(t,[&](uintptr_t p,zk::ObjectHead&h,char*n,char*c){return zk::validateOuterNode(p,lookup,h,n,c);},[](unsigned,uintptr_t,const zk::ObjectHead&,const char*,const char*){});\n  assert(r.nodes==2&&!std::strcmp(r.status,\"null_outer_end\"));++tests;\n }\n for(unsigned fail=1;fail<=80;++fail){Fixture f;setup(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());f.failAt=f.calls+fail;\n  zk::OwnershipTarget t;t.ptr=Fixture::objects+3*256;std::memcpy(&t.original,f.m.data()+t.ptr-Fixture::base,sizeof(t.original));\n  auto r=zk::walkOuter(t,[&](uintptr_t p,zk::ObjectHead&h,char*n,char*c){return zk::validateOuterNode(p,lookup,h,n,c);},[](unsigned,uintptr_t,const zk::ObjectHead&,const char*,const char*){});assert(r.nodes<=1&&f.calls<100);++tests;}\n std::printf(\"PASS: %u bounded ownership cases\\n\",tests);return 0;\n}\n",
            "tests/pawn_test.cpp": "#define main old_local_test_main\n#include \"local_test.cpp\"\n#undef main\n#include \"../src/targeted_pawn_candidates.hpp\"\nvoid extendWorld(LocalFixture &f){\n f.put<int32_t>(LocalFixture::names+0x400,10);\n for(unsigned id=7;id<=9;++id){f.put<uintptr_t>(LocalFixture::chunk+id*8,LocalFixture::entries+id*128);std::strcpy((char*)f.m.data()+LocalFixture::entries+id*128-LocalFixture::base+12,id==7?\"World\":id==8?\"TrainingWorld\":\"AI_Pawn\");}\n for(unsigned i=9;i<=13;++i){zk::ObjectHead h{};h.index=i;h.vtable=0x40000;h.cls=LocalFixture::object(i==9?0:i==10||i==13?9:i==11?3:4);h.nameId=i==9?7:i==10||i==13?8:i==11?9:6;h.outer=i==11?LocalFixture::object(10):i==12?LocalFixture::object(11):0;f.put(LocalFixture::object(i),h);f.put<uintptr_t>(LocalFixture::items+i*24,LocalFixture::object(i));}\n f.put<uintptr_t>(LocalFixture::object(7)+0x20,LocalFixture::object(10));f.put<uintptr_t>(LocalFixture::object(11)+0x208,LocalFixture::object(12));f.put<float>(LocalFixture::object(12)+0x220,110);f.put<float>(LocalFixture::object(12)+0x224,210);f.put<float>(LocalFixture::object(12)+0x228,310);\n}\nint main(){unsigned tests=0;\n for(unsigned mode=0;mode<5;++mode){LocalFixture f;extendWorld(f);\n  if(mode==1)f.put<uintptr_t>(LocalFixture::object(11)+0x20,LocalFixture::object(13));\n  if(mode==2)f.put<uintptr_t>(LocalFixture::object(12)+0x20,0);\n  if(mode==3)f.put<float>(LocalFixture::object(12)+0x220,std::numeric_limits<float>::infinity());\n  zk::OwnershipTarget target;target.ptr=LocalFixture::object(mode==4?7:11);std::memcpy(&target.original,f.m.data()+target.ptr-LocalFixture::base,sizeof(target.original));\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,14,LocalFixture::names);assert(lookup.names.init());auto world=zk::findOwningWorld(LocalFixture::object(7),lookup);assert(world.ptr==LocalFixture::object(10));auto result=zk::readOtherPawn(target,LocalFixture::object(7),world,lookup);\n  const char* expected[]={\"same_world_pawn_position_candidate\",\"different_owning_world\",\"root_validation_failed\",\"position_numeric_rejected\",\"self_excluded\"};assert(!std::strcmp(result.status,expected[mode]));if(!mode)assert(result.position[0]==110&&result.pawnIndex==11);++tests;\n }\n {LocalFixture f;extendWorld(f);f.put<uintptr_t>(LocalFixture::object(7)+0x20,LocalFixture::object(7));auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,14,LocalFixture::names);assert(lookup.names.init());assert(!std::strcmp(zk::findOwningWorld(LocalFixture::object(7),lookup).status,\"ownership_cycle\"));++tests;}\n for(unsigned fail=1;fail<=120;++fail){LocalFixture f;extendWorld(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,14,LocalFixture::names);assert(lookup.names.init());auto world=zk::findOwningWorld(LocalFixture::object(7),lookup);zk::OwnershipTarget target;target.ptr=LocalFixture::object(11);std::memcpy(&target.original,f.m.data()+target.ptr-LocalFixture::base,sizeof(target.original));f.failAt=f.calls+fail;auto result=zk::readOtherPawn(target,LocalFixture::object(7),world,lookup);assert(result.status&&f.calls<200);++tests;}\n std::printf(\"PASS: %u other-pawn candidate cases\\n\",tests);return 0;\n}\n",
            "tests/preparation_test.cpp": "#include \"../src/preparation_pacer.hpp\"\n#include <cassert>\n#include <cstdint>\n#include <cstdio>\nint main(){using P=zk::PreparationPacer;P p;assert(!p.yieldDue(0)&&!p.yieldDue(3999)&&p.yieldDue(4000));p.resumed(9000);assert(!p.yieldDue(8999)&&!p.yieldDue(12999)&&p.yieldDue(13000));assert(!p.progressDue(199999)&&p.progressDue(200000)&&!p.progressDue(200001)&&!p.progressDue(1000)&&p.progressDue(400000));assert(P::percent(0,0)==0&&P::percent(0,300000)==0&&P::percent(150000,300000)==50&&P::percent(400000,300000)==100&&P::percent(UINT32_MAX-1,UINT32_MAX)==99);P fast;unsigned yields=0;for(int64_t us=100;us<=100000;us+=100)if(fast.yieldDue(us)){++yields;fast.resumed(us+1000);}assert(yields==20);std::puts(\"PASS: prep pacing, bounded work slices, progress throttle, backwards time and percentage overflow\");}\n",
            "tests/projection_test.cpp": "#include \"../src/training_projection.hpp\"\n#include <cassert>\n#include <cstring>\n#include <limits>\n#include <cstdio>\n#include <initializer_list>\nint main(){unsigned count=0;const float origin[3]{},zero[3]{};float p[3]{100,0,0};\n auto r=zk::projectTraining(p,origin,zero,90,2);assert(std::fabs(r.x-.5)<1e-9&&std::fabs(r.y-.5)<1e-9);++count;\n p[1]=100;r=zk::projectTraining(p,origin,zero,90,2);assert(std::fabs(r.x-1)<1e-9);++count;\n p[1]=0;p[2]=25;r=zk::projectTraining(p,origin,zero,90,2);assert(std::fabs(r.y-.25)<1e-9);++count;\n p[0]=-100;r=zk::projectTraining(p,origin,zero,90,2);assert(!std::strcmp(r.status,\"behind_or_near_camera\"));++count;\n for(unsigned angle=0;angle<360;++angle){double a=angle*3.14159265358979323846/180;float rotation[3]{0,float(angle),0};float q[3]{float(100*std::cos(a)),float(100*std::sin(a)),0};r=zk::projectTraining(q,origin,rotation,80,2);assert(std::fabs(r.x-.5)<1e-6&&std::fabs(r.y-.5)<1e-6);++count;}\n for(float pitch:{-80.f,-40.f,0.f,40.f,80.f}){double a=pitch*3.14159265358979323846/180;float rotation[3]{pitch,0,0},q[3]{float(100*std::cos(a)),0,float(100*std::sin(a))};r=zk::projectTraining(q,origin,rotation,80,2);assert(std::fabs(r.x-.5)<1e-6&&std::fabs(r.y-.5)<1e-6);++count;}\n float roll[3]{0,0,90},q[3]{100,25,0};r=zk::projectTraining(q,origin,roll,90,2);assert(std::fabs(r.x-.5)<1e-6&&std::fabs(r.y-.25)<1e-6);++count;\n for(double bad:{0.,180.,std::numeric_limits<double>::infinity(),std::numeric_limits<double>::quiet_NaN()}){r=zk::projectTraining(q,origin,zero,bad,2);assert(!std::strcmp(r.status,\"invalid_input\"));++count;}\n q[0]=std::numeric_limits<float>::quiet_NaN();r=zk::projectTraining(q,origin,zero,90,2);assert(!std::strcmp(r.status,\"invalid_input\"));++count;\n std::printf(\"PASS: %u projection geometry cases\\n\",count);return 0;}\n",
            "tests/rank_test.cpp": "#include \"../src/training_rank.hpp\"\n#include \"../src/targeted_instances.hpp\"\n#include <cassert>\n#include <algorithm>\n#include <limits>\n#include <cstdio>\nint main(){unsigned cases=0;unsigned order[]{0,1,2,3};zk::RankedMark candidates[]{{0,10,.5,.5,5000},{1,11,.3,.5,1000},{2,12,.7,.5,2000},{3,13,.03,.5,10}};\n do{zk::TrainingRank rank;for(unsigned i:order)rank.offer(candidates[i]);assert(rank.count==2&&rank.marks[0].index==11&&rank.marks[1].index==12);++cases;}while(std::next_permutation(order,order+4));\n {zk::TrainingRank r;for(double x:{-.1,0.,.03,.09,.91,1.,2.,std::numeric_limits<double>::quiet_NaN()}){r.offer({0,1,x,.5,100});assert(!r.count);++cases;}r.offer({0,10,.5,.5,100});r.offer({0,10,.5,.5,100});assert(r.count==1);++cases;}\n {zk::TrainingRank r;r.offer({0,3,.8,.5,100});r.offer({1,2,.5,.5,100});r.offer({2,1,.5,.5,100});assert(r.count==2&&r.marks[0].index==1&&r.marks[1].index==2);++cases;}\n for(unsigned n=0;n<=140;++n){zk::OwnershipTargets t;zk::ObjectHead h{};for(unsigned i=0;i<n;++i)t.save(unsigned(zk::CandidateGroup::TrainingOther),0x10000+i*8,h,\"BallisticTarget_C\");auto s=zk::selectCalibrationScan(t);assert(s.count==(n<64?n:64));for(unsigned i=0;i<s.count;++i)assert(s.indices[i]==i);++cases;}\n std::printf(\"PASS: %u ranked selection and wide-scan cases\\n\",cases);return 0;}\n",
            "tests/rate_test.cpp": "#include \"../src/tracking_rate.hpp\"\n#include <cassert>\n#include <cstdio>\nint main(){using R=zk::TrackingRate;assert(R::intervalMs==50&&R::maxTicks==600);assert(R::active(0,0)&&R::active(29999,599)&&!R::active(30000,599)&&!R::active(0,600)&&!R::active(-1,0));assert(R::phase(4)==0&&R::phase(5)==1&&R::phase(9)==1&&R::phase(10)==2&&R::phase(15)==2);R r;unsigned logs=0;for(int ms=0;ms<30000;ms+=50)logs+=r.verbose(ms);assert(logs==30);r.record(40);r.record(75);r.record(-1);assert(r.ticks==2&&r.overruns==1&&r.totalWorkMs==115&&r.maxWorkMs==75);assert(R::packetFresh(0)&&R::packetFresh(150)&&!R::packetFresh(151)&&!R::packetFresh(-1));assert(zk::trackingVerboseLine(\"[camera-sample] value\")&&!zk::trackingVerboseLine(\"[camera-stop] invalid\")&&!zk::trackingVerboseLine(\"[tracking-pick] chosen\"));zk::TrackingWaitStats t;t.interval(50000);t.interval(90000);t.interval(-1);t.interval(60000001);assert(t.intervals==2&&t.intervalTotal==140000&&t.intervalMax==90000);\n t.sleep(49900,90000);t.sleep(50000,49999);t.sleep(-1,3);assert(t.sleeps==2&&t.sleepRequested==99900&&t.sleepActual==139999&&t.sleepOverMax==40100);\n t.ui(300);t.ui(700);t.ui(-1);t.work(400);t.work(900);t.work(60000001);assert(t.uiCalls==2&&t.uiTotal==1000&&t.uiMax==700&&t.workCalls==2&&t.workTotal==1300&&t.workMax==900);\n std::puts(\"PASS: tracking deadline, phase timing, log throttling, stale packets and performance accounting\");}\n",
            "tests/rays_test.cpp": "#include \"../src/training_rays.hpp\"\n#include <cassert>\n#include <limits>\n#include <cstdio>\nint main(){float loc[3]{},rot[3]{},front[3]{100,0,0},rear[3]{-100,0,0};auto a=zk::projectTrainingRay(front,loc,rot,90,2);assert(a.valid&&!a.edge&&!a.behind&&std::fabs(a.x-.5)<1e-9);auto b=zk::projectTrainingRay(rear,loc,rot,90,2);assert(b.valid&&b.edge&&b.behind&&std::fabs(b.x-.5)<1e-9&&b.y>.9);rot[1]=180;b=zk::projectTrainingRay(rear,loc,rot,90,2);assert(b.valid&&!b.edge&&!b.behind&&std::fabs(b.x-.5)<1e-6);rot[1]=0;unsigned count=0;for(unsigned i=0;i<360;++i){double angle=i*3.141592653589793/180;float p[3]{float(1000*std::cos(angle)),float(1000*std::sin(angle)),0};auto e=zk::projectTrainingRay(p,loc,rot,90,2);assert(e.valid&&e.x>=0&&e.x<=1&&e.y>=0&&e.y<=1);++count;}float bad[3]{std::numeric_limits<float>::quiet_NaN(),0,0};assert(!zk::projectTrainingRay(bad,loc,rot,90,2).valid&&!zk::projectTrainingRay(loc,loc,rot,90,2).valid&&!zk::projectTrainingRay(nullptr,loc,rot,90,2).valid);zk::RayRank rank;for(int i=30;i>=0;--i){auto e=a;e.distance=100+i;rank.offer({unsigned(i),i,e});rank.offer({unsigned(i),i,e});}assert(rank.count==20);for(unsigned i=0;i<20;++i)assert(rank.marks[i].index==int(i));std::printf(\"PASS: %u ray bearings plus front/rear, rotation, invalid input, bounds and capped unique ranking\\n\",count);}\n",
            "tests/residual_test.cpp": "#include \"../src/training_residual.hpp\"\n#include <cassert>\n#include <limits>\n#include <cstdio>\nint main(){\n float origin[3]{},moved[3]{3,4,0};auto r=zk::trainingResidual(.496576,.498218,1600,900,moved,origin,origin,origin);\n assert(r.valid&&std::fabs(r.dx+5.4784)<1e-8&&std::fabs(r.dy+1.6038)<1e-8&&r.cameraShift==5&&r.targetShift==0);\n auto center=zk::trainingResidual(.5,.5,1600,900,origin,origin,origin,origin);assert(center.valid&&center.distance==0);\n assert(!zk::trainingResidual(.5,.5,0,900,origin,origin,origin,origin).valid);\n assert(!zk::trainingResidual(std::numeric_limits<double>::quiet_NaN(),.5,1600,900,origin,origin,origin,origin).valid);\n zk::ResidualSeries series;assert(!series.due(99,100)&&series.record(100,100,r));assert(!series.record(100099,100,r)&&series.record(100100,100,r));assert(series.settled==0);\n assert(series.record(300100,100,r)&&series.settled==1&&series.sumX==r.dx);assert(!series.due(2000100,100));\n zk::ResidualSeries bounded;for(int64_t i=0;i<200;++i)bounded.record(100+i*10000,100,r);assert(bounded.samples==20&&bounded.settled==17);\n std::puts(\"PASS: signed screen residual, camera/target displacement, invalid data, 100ms pacing and 2-second bounded summary\");\n}\n",
            "tests/retry_test.cpp": "#define main old_object_test_main\n#include \"objects_test.cpp\"\n#undef main\nint main(){unsigned tests=0;\n {zk::ArraySnapshot a{},b{};assert(a.changes(b)==0);b.items=0x10000;assert(a.changes(b)==1);b.capacity=20;assert(a.changes(b)==3);b.count=10;assert(a.changes(b)==7);++tests;}\n {Fixture f;f.changeHeader=true;auto r=f.run();assert(r.afterRead&&r.headerChanges==4&&r.before.count==16&&r.after.count==17);++tests;}\n {Fixture f;auto baseline=f.run();assert(baseline.afterRead);size_t last=f.calls;Fixture g;g.failAt=last;auto r=g.run();assert(!r.afterRead&&!r.stable&&!std::strcmp(r.status,\"array_final_header_unreadable\"));++tests;}\n {Fixture f;f.changeHeader=true;unsigned attempts=0,pauses=0;auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};\n  auto r=zk::retryObjects(Fixture::base,Fixture::names,rd,[&]{++pauses;f.changeHeader=false;f.put<int32_t>(Fixture::base+28,16);},[&](unsigned n,const zk::ObjectResult&){attempts=n;});assert(r.stable&&attempts==2&&pauses==1);++tests;}\n {Fixture f;unsigned attempts=0,pauses=0,headers=0;auto rd=[&](uintptr_t a,void*p,size_t n){if(a==Fixture::base+16){++headers;f.put<int32_t>(Fixture::base+28,headers%2?15:16);}return f.read(a,p,n);};\n  auto r=zk::retryObjects(Fixture::base,Fixture::names,rd,[&]{++pauses;},[&](unsigned n,const zk::ObjectResult&){attempts=n;});assert(!r.stable&&attempts==4&&pauses==3);++tests;}\n {Fixture f;unsigned attempts=0,pauses=0;auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};auto r=zk::retryObjects(Fixture::base,Fixture::names,rd,[&]{++pauses;},[&](unsigned n,const zk::ObjectResult&){attempts=n;});assert(r.stable&&attempts==1&&pauses==0);++tests;}\n {Fixture f;f.failAt=1;unsigned attempts=0,pauses=0;auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};auto r=zk::retryObjects(Fixture::base,Fixture::names,rd,[&]{++pauses;},[&](unsigned n,const zk::ObjectResult&){attempts=n;});assert(!r.stable&&attempts==1&&pauses==0);++tests;}\n