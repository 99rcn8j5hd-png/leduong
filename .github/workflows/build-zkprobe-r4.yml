ra))){return fail(\"camera_binding_changed\");}\n zk::CameraView view{};if(std::strcmp(zk::readCameraCandidate(payload.camera,*lookup,view),\"plausible_values_UNVERIFIED\")){return fail(\"camera_read_failed\");}\n const auto target=zk::readOtherPawn(payload.target,pawn,world.world,*lookup,true,payload.base+0x063362a8);\n if(std::strcmp(target.status,\"same_world_training_actor_candidate\")||std::strcmp(target.cls,\"BallisticTarget_C\")||target.pawnIndex!=state->targetIndex){return fail(\"training_target_identity_rejected\");}\n const float aimPoint[3]{target.position[0],target.position[1],target.position[2]+state->targetHeightCm};\n\n if(first){\n\n  const double rangeCm=std::hypot(\n      std::hypot(double(aimPoint[0])-view.location[0],double(aimPoint[1])-view.location[1]),\n      double(aimPoint[2])-view.location[2]);\n  const double farWeight=state->automatic&&std::isfinite(rangeCm)\n      ? std::fmax(0.0,std::fmin(1.0,(rangeCm-20000.0)/10000.0)) : 0.0;\n  const auto step=zk::trainingStep(aimPoint,view.location,view.rotation,before.angle,view.nativeFOV,state->width,state->height,state->fraction,state->maxDegrees,.25+.50*farWeight);\n  state->errorPitch=step.errorPitch;state->errorYaw=step.errorYaw;state->stepPitch=step.stepPitch;state->stepYaw=step.stepYaw;\n  if(std::strcmp(step.status,\"bounded_training_step_ready\"))return fail(step.status);\n  const double deadzone=0.15-0.10*farWeight;\n  if(std::hypot(step.errorPitch,step.errorYaw)<=deadzone)return fail(\"within_center_deadzone\");\n  std::memcpy(state->cameraBefore,view.location,12);std::memcpy(state->targetBefore,target.position,12);state->initialFov=view.nativeFOV;\n  std::memcpy(state->wanted,step.wanted,12);std::memcpy(state->before,before.angle,12);std::memcpy(state->lastControl,before.angle,12);state->startedUs=now;\n }else{\n  if(std::fabs(view.nativeFOV-state->initialFov)>std::fmax(.1,double(state->initialFov)*.01))return fail(\"camera_fov_changed_cancel\");\n  double moved=0;for(unsigned i=0;i<3;++i){moved+=std::pow(double(target.position[i])-state->targetBefore[i],2);if(std::fabs(zk::angleDelta(before.angle[i],state->lastControl[i]))>.35)return fail(\"external_rotation_changed_cancel\");}\n  if(moved>1)return fail(\"training_target_moved_cancel\");\n }\n const bool refining=state->firstTurnFinishedUs>0;\n const double fraction=zk::smoothFraction(now-state->startedUs,state->durationMs);\n if(fraction==0)return false;\n float frame[3]{float(std::remainder(double(state->before[0])+state->stepPitch*fraction,360.0)),float(std::remainder(double(state->before[1])+state->stepYaw*fraction,360.0)),state->before[2]};\n if(refining){\n  if(now-state->firstTurnFinishedUs<65000)return false;\n  const auto correction=zk::trainingStep(aimPoint,view.location,view.rotation,before.angle,\n      view.nativeFOV,state->width,state->height,state->fraction,1.0);\n  const double distance=std::hypot(correction.errorPitch,correction.errorYaw);\n  if(std::strcmp(correction.status,\"bounded_training_step_ready\")||distance>0.75){\n   state->completedUs=angleNowUs();\n   state->finish(\"first_turn_observed_refinement_skipped\",true);\n   return true;\n  }\n  const double combined=std::hypot(zk::angleDelta(correction.wanted[0],state->before[0]),\n      zk::angleDelta(correction.wanted[1],state->before[1]));\n  if(combined>state->maxDegrees){\n   state->completedUs=angleNowUs();\n   state->finish(\"first_turn_observed_refinement_exceeds_limit\",true);\n   return true;\n  }\n  std::memcpy(frame,correction.wanted,sizeof(frame));\n }\n zk::ObjectHead finalHead{};\n if(!read(controller,&finalHead,sizeof(finalHead))||std::memcmp(&finalHead,&ch,sizeof(ch)))return fail(\"precall_controller_changed\");\n const auto latest=zk::readControlCandidate(controller,read);if(std::strcmp(latest.status,\"finite_candidate_NOT_control_verified\"))return fail(\"precall_rotation_read_failed\");\n for(unsigned i=0;i<3;++i)if(std::fabs(zk::angleDelta(latest.angle[i],before.angle[i]))>.05)return fail(\"precall_rota