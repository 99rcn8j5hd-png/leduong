name: Build ZKProbe Targeted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - run: brew install ldid-procursus
      - name: Test bounded reader and build
        working-directory: companion/ZKProbe
        run: |
          perl -pi -e 's/\r$//' build.sh src/* tests/*
          clang++ -std=c++17 -fsanitize=address,undefined -g tests/targeted_test.cpp -o "$RUNNER_TEMP/targeted-test"
          "$RUNNER_TEMP/targeted-test"
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZKProbe-targeted-candidate
          path: companion/ZKProbe/artifacts/*
          if-no-files-found: error
