          cd "$RUNNER_TEMP/zkprobe-instances-v4"
          for unit in targeted objects instances; do
            clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g "tests/${unit}_test.cpp" -o "$RUNNER_TEMP/zkprobe-${unit}-test"
            "$RUNNER_TEMP/zkprobe-${unit}-test"
          done
      - name: Install signing tool
        run: brew install ldid-procursus
      - name: Build diagnostic dylib
        run: |
          cd "$RUNNER_TEMP/zkprobe-instances-v4"
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZKProbe-instances-v4
          path: ${{ runner.temp }}/zkprobe-instances-v4/artifacts/*
          if-no-files-found: error
