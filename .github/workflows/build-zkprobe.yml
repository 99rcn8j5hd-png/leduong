eLimit=\"read_limit\";return false;}\n          sampleBytes+=n;++sampleCalls;return zk::rd(addr,out,n);\n         };\n         auto cameraLookup=std::make_unique<zk::InstanceReader<decltype(sampleRead)>>(sampleRead,items,objects.count,result.table);\n         zk::CameraView prior[8]{};unsigned valid[8]{},changes[8]{};auto cameraPrevious=previous;\n         if(cameraLookup->names.init()){\n          emit(\"[camera-stage] begin; samples=16 interval_ms=1000; stand still 5s; walk forward 5s; stop 6s\");\n          for(unsigned tick=0;tick<16;++tick){\n           if(tick==0||tick==5||tick==10){displayCapturePhase(tick);emit(\"[capture-phase] sample=%u phase=%s\",tick,zk::capturePhaseLabel(tick));}\n           unsigned char live[16]{};\n           if(!sampleRead(base+objectArrayRVA+16,live,16)||!zk::snapshotAccepted(fixed,cameraPrevious,zk::ArraySnapshot::decode(live))){emit(\"[camera-stop] object table policy rejected or unreadable\");break;}\n           cameraPrevious=zk::ArraySnapshot::decode(live);\n           for(unsigned k=0;k<cameraCount;++k){\n            const auto &camera=reader->targets.records[cameraGroup][k];zk::CameraView view{};\n            const char *status=zk::readCameraCandidate(camera,*cameraLookup,view);\n            emit(\"[camera-sample] index=%d sample=%u phase=%s status=%s location=(%.3f,%.3f,%.3f) rotation=(%.3f,%.3f,%.3f) cache_fov=%.3f locked_fov=%.3f native_fov_candidate=%.3f\",camera.original.index,tick,zk::capturePhaseLabel(tick),status,view.location[0],view.location[1],view.location[2],view.rotation[0],view.rotation[1],view.rotation[2],view.cacheFOV,view.lockedFOV,view.nativeFOV);\n            if(!std::strcmp(status,\"plausible_values_UNVERIFIED\")){if(valid[k]&&zk::cameraChanged(prior[k],view))++changes[k];prior[k]=view;++valid[k];}\n           }\n           if(localCodeOK)for(unsigned localIndex=0;localIndex<localCount;++localIndex){\n            const auto pos=zk::readLocalPosition(reader->targets.records[localGroup][localIndex],*cameraLookup);\n            emit(\"[local-position-sample] sample=%u phase=%s status=%s local_index=%d controller_index=%d pawn_index=%d root_index=%d pawn_name=%s pawn_class=%s position=(%.3f,%.3f,%.3f)\",tick,zk::capturePhaseLabel(tick),pos.status,reader->targets.records[localGroup][localIndex].original.index,pos.controllerIndex,pos.pawnIndex,pos.rootIndex,pos.pawnName,pos.pawnClass,pos.position[0],pos.position[1],pos.position[2]);\n            if(levelCodeOK&&(tick==0||tick==5||tick==10||tick==15)&&!std::strcmp(pos.status,\"local_pawn_root_position_candidate\")){\n             uintptr_t ownPawn=0;\n             if(pos.pawnIndex>=0&&pos.pawnIndex<objects.count&&sampleRead(items+size_t(pos.pawnIndex)*24,&ownPawn,8)){\n              const auto localOuterWorld=zk::findOwningWorld(ownPawn,*cameraLookup);\n              const auto localRuntime=zk::resolveLevelWorld(ownPawn,*cameraLookup,base+0x063362a8);const auto world=localRuntime.world;\n              emit(\"[pawn-world] sample=%u local_pawn_index=%d status=%s level_index=%d runtime_world_index=%d outer_world_index=%d\",tick,pos.pawnIndex,world.status,localRuntime.levelIndex,world.index,localOuterWorld.index);\n              const unsigned pawns=unsigned(zk::CandidateGroup::Pawn);\n              emit(\"[pawn-candidates] sample=%u saved=%u omitted=%u\",tick,reader->targets.used[pawns],reader->groupOutput.matched[pawns]-reader->targets.used[pawns]);\n              for(unsigned c=0;c<reader->targets.used[pawns];++c){\n               const auto candidate=zk::readOtherPawn(reader->targets.records[pawns][c],ownPawn,world,*cameraLookup,false,base+0x063362a8);\n               double distance=-1;\n               if(!std::strcmp(candidate.status,\"same_world_pawn_position_candidate\")){\n                double dx=double(candidate.position[0])-pos.position[0],dy=double(candidate.position[1])-pos.position[1],dz=double(candidate.position[2])-pos.position[2];distance=std::sqrt(dx*dx+dy*dy+dz*dz);\n               }\n               emit(\"[other-pawn-sample] sample=%u phase=%s status=%s index=%d name=%s class=%s root_index=%d world_index=%d outer_world_index=%d level_index=%d flags=0x%08x root_flags=0x%08x position=(%.3f,%.3f,%.3f) distance_engine_units=%.3f\",tick,zk::capturePhaseLabel(tick),candidate.status,candidate.pawnIndex,candidate.name,candidate.cls,candidate.rootIndex,candidate.worldIndex,candidate.outerWorldIndex,candidate.levelIndex,candidate.objectFlags,candidate.rootFlags,candidate.position[0],candidate.position[1],candidate.position[2],distance);\n              }\n              const unsigned training=unsigned(zk::CandidateGroup::TrainingOther);\n              emit(\"[training-candidates] sample=%u saved=%u omitted=%u\",tick,reader->targets.used[training],reader->groupOutput.matched[training]-reader->targets.used[training]);\n              const auto selection=zk::selectTraining(reader->targets);\n              emit(\"[training-selection] sample=%u selected=%u selection_omitted=%u priority_first=1\",tick,selection.count,reader->targets.used[training]-selection.count);\n              for(unsigned selected=0;selected<selection.count;++selected){const unsigned c=selection.indices[selected];\n               const auto candidate=zk::readOtherPawn(reader->targets.records[training][c],ownPawn,world,*cameraLookup,true,base+0x063362a8);\n               emit(\"[training-actor-sample] sample=%u phase=%s status=%s index=%d name=%s class=%s root_index=%d world_index=%d outer_world_index=%d level_index=%d flags=0x%08x root_flags=0x%08x position=(%.3f,%.3f,%.3f)\",tick,zk::capturePhaseLabel(tick),candidate.status,candidate.pawnIndex,candidate.name,candidate.cls,candidate.rootIndex,candidate.worldIndex,candidate.outerWorldIndex,candidate.levelIndex,candidate.objectFlags,candidate.rootFlags,candidate.position[0],candidate.position[1],candidate.position[2]);\n              }\n             }else emit(\"[pawn-candidates-skipped] local pawn slot unreadable\");\n            }\n\n           }\n           if(std::strcmp(sampleLimit,\"none\"))break;\n           if(tick<15)std::this_thread::sleep_for(std::chrono::seconds(1));\n          }\n         }else emit(\"[camera-skipped] name reader rejected\");\n         for(unsigned k=0;k<cameraCount;++k)emit(\"[camera-summary] index=%d valid_samples=%u changed_transitions=%u active_view_NOT_verified\",reader->targets.records[cameraGroup][k].original.index,valid[k],changes[k]);\n         emit(\"[camera-reads] bytes=%llu calls=%llu limit=%s\",(unsigned long long)sampleBytes,(unsigned long long)sampleCalls,sampleLimit);\n        }\n       }else emit(\"[camera-skipped] native code signature mismatch or unreadable\");\n       emit(\"[camera-note] camera cache candidates only; local root translation requires movement comparison; name-filtered Pawn/training candidates do NOT establish player identity, team, health, visibility or correspondence to visible mannequins; flags logged raw only; active-view selection NOT verified; native FOV may differ from subclass override\");\n       } // manual capture requested\n\n\n      } else emit(\"[instances] initialization rejected\");\n     }\n    }\n    if(!(objects.valid>=4 && objects.stable))emit(\"[instances-skipped] status=%s; no stable baseline after bounded attempts\",objects.status);\n    for(unsigned i=0;i<16 && int32_t(i)<objects.count;++i) {\n     const auto &v=objects.sample[i];\n     emit(\"[object] index=%u status=%s name=%s class=%s\",v.index,v.status,v.name,v.className);\n    }\n   } else emit(\"[objects] address overflow\");\n  } else emit(\"[stage] objects skipped: name baseline not confirmed\");\n  const auto &b=zk::scanBudget();\n  emit(\"[post-enumeration-reads] bytes=%llu calls=%llu failures=%llu limit=%s\",(unsigned long long)b.readBytes,(unsigned long long)b.readCalls,(unsigned long long)b.readFailures,b.reason);\n  emit(\"[stage] complete; candidate only; do not copy to offsets.plist\");\n }\n}\n__attribute__((constructor)) static void start() {\n dispatch_after(dispatch_time(DISPATCH_TIME_NOW,5ull*NSEC_PER_SEC),dispatch_get_main_queue(),^{attachCaptureButton(0);});\n}\n",
            "src/dyld_util.hpp": "// dyld_util.hpp \u2014 doc memory an toan + liet ke vung nho + base/range cua main image\n#pragma once\n\n#include <mach/mach.h>\n#include <mach/vm_region.h>\n#include <mach-o/dyld.h>\n#include <mach-o/loader.h>\n#include <stdint.h>\n#include <stdio.h>\n#include <string.h>\n#include <string>\n#include <vector>\n#include <algorithm>\n#include <chrono>\n#include <thread>\n#include \"scan_budget.hpp\"\n\nnamespace zk {\n\n// ---------- read an toan (khong crash khi dia chi rac) ----------\ninline bool rd(uintptr_t addr, void *out, size_t n) {\n    if (!addr || !out || !n || n > UINTPTR_MAX-addr) return false;\n    if (!allowRead(n)) return false;\n    vm_size_t got = 0;\n    kern_return_t kr = vm_read_overwrite(mach_task_self(), (vm_address_t)addr,\n                                         (vm_size_t)n, (vm_address_t)out, &got);\n    bool ok = kr == KERN_SUCCESS && got == n;\n    if (!ok) ++scanBudget().readFailures;\n    return ok;\n}\n\ntemplate <class T> inline T rdv(uintptr_t addr) {\n    T v;\n    memset(&v, 0, sizeof(T));\n    rd(addr, &v, sizeof(T));\n    return v;\n}\n\n// ---------- vung nho ----------\nstruct Region {\n    uintptr_t start;\n    uintptr_t end;\n    bool writable;\n};\n\ninline std::vector<Region>& regionCache() { static std::vector<Region> cache; return cache; }\ninline void refreshRegions() { regionCache().clear(); }\ninline const std::vector<Region> &allRegions() {\n    auto &cache=regionCache();\n    if (!cache.empty()) return cache;\n\n    vm_address_t addr = 0;\n    size_t visited=0;\n    while (visited++ < 8000 && budgetTimeOK()) {\n        vm_size_t size = 0;\n        vm_region_basic_info_data_64_t info;\n        mach_msg_type_number_t cnt = VM_REGION_BASIC_INFO_COUNT_64;\n        mach_port_t obj = MACH_PORT_NULL;\n\n        kern_return_t kr = vm_region_64(mach_task_self(), &addr, &size,\n                                        VM_REGION_BASIC_INFO_64,\n                                        (vm_region_info_t)&info, &cnt, &obj);\n        if (obj != MACH_PORT_NULL) mach_port_deallocate(mach_task_self(),obj);\n        if (kr != KERN_SUCCESS || size == 0 || size > UINTPTR_MAX-addr) break;\n\n        if (info.protection & VM_PROT_READ) {\n            Region r;\n            r.start = (uintptr_t)addr;\n            r.end = (uintptr_t)(addr + size);\n            r.writable = (info.protection & VM_PROT_WRITE) != 0;\n            cache.push_back(r);\n        }\n        addr += size;\n        if (cache.size() > 8000) break;\n    }\n    std::sort(cache.begin(), cache.end(),\n              [](const Region &a, const Region &b) { return a.start < b.start; });\n    return cache;\n}\n\ninline bool inReadableRegion(uintptr_t a) {\n    const std::vector<Region> &rs = allRegions();\n    size_t lo = 0, hi = rs.size();\n    while (lo < hi) {\n        size_t mid = (lo + hi) / 2;\n        if (rs[mid].end <= a) lo = mid + 1;\n        else hi = mid;\n    }\n    return lo < rs.size() && rs[lo].start <= a;\n}\n\n// ---------- range that cua tung image ----------\nstruct ImgRange {\n    uintptr_t base = 0;\n    uintptr_t end = 0;\n    const char *path = nullptr;\n};\n\ninline bool imageRange(uint32_t idx, ImgRange &rg) {\n    const struct mach_header_64 *mh =\n        (const struct mach_header_64 *)_dyld_get_image_header(idx);\n    if (!mh || mh->magic != MH_MAGIC_64) return false;\n\n    intptr_t slide = _dyld_get_image_vmaddr_slide(idx);\n    uintptr_t minA = UINTPTR_MAX, maxA = 0;\n\n    const uint8_t *p = (const uint8_t *)mh + sizeof(struct mach_header_64);\n    for (uint32_t c = 0; c < mh->ncmds; c++) {\n        const struct load_command *lc = (const struct load_command *)p;\n        if (lc->cmdsize < sizeof(struct load_command)) break;\n        if (lc->cmd == LC_SEGMENT_64) {\n            const struct segment_command_64 *sg = (const struct segment_command_64 *)lc;\n            if (sg->initprot == VM_PROT_NONE || sg->filesize==0) { p += lc->cmdsize; continue; }\n            uintptr_t s = (uintptr_t)slide + (uintptr_t)sg->vmaddr;\n            uintptr_t e = s + (uintptr_t)sg->vmsize;\n            if (s < minA) minA = s;\n            if (e > maxA) maxA = e;\n        }\n        p += lc->cmdsize;\n    }\n    if (maxA <= minA) return false;\n    rg.base = (uintptr_t)mh;\n    rg.end = maxA;\n    rg.path = _dyld_get_image_name(idx);\n    return true;\n}\n\ninline bool imageRangeContaining(uintptr_t addr, ImgRange &out) {\n    for (uint32_t i=0;i<_dyld_image_count();i++) {\n        const auto *mh=(const mach_header_64 *)_dyld_get_image_header(i);\n        if (!mh || mh->magic!=MH_MAGIC_64) continue;\n        const uint8_t *p=(const uint8_t *)mh+sizeof(*mh);\n        const uint8_t *end=p+mh->sizeofcmds;\n        intptr_t slide=_dyld_get_image_vmaddr_slide(i);\n        for (uint32_t c=0;c<mh->ncmds && p+sizeof(load_command)<=end;c++) {\n            const auto *lc=(const load_command *)p;\n            if (lc->cmdsize<sizeof(*lc) || (size_t)(end-p)<lc->cmdsize) break;\n            if (lc->cmd==LC_SEGMENT_64 && lc->cmdsize>=sizeof(segment_command_64)) {\n                const auto *sg=(const segment_command_64 *)p;\n                if (sg->initprot!=VM_PROT_NONE && sg->vmsize) {\n                    uintptr_t start=(uintptr_t)sg->vmaddr+slide;\n                    if (addr>=start && addr-start<sg->vmsize) {\n                        out.base=(uintptr_t)mh; out.end=start+sg->vmsize;\n                        out.path=_dyld_get_image_name(i); return true;\n                    }\n                }\n            }\n            p+=lc->cmdsize;\n        }\n    }\n    return false;\n}\n\n// ---------- base cua main executable (ShadowTrackerExtra) ----------\ninline uintptr_t mainBase() {\n    for (uint32_t i=0;i<_dyld_image_count();i++) {\n        const auto *mh=_dyld_get_image_header(i);\n        if (mh && mh->filetype==MH_EXECUTE) return (uintptr_t)mh;\n    }\n    return 0;\n}\n\ninline const char *imageNameContaining(uintptr_t addr) {\n    ImgRange r;\n    if (imageRangeContaining(addr, r) && r.path) return r.path;\n    return \"heap/other\";\n}\n\ninline bool belongsToMainImage(uintptr_t addr) {\n    ImgRange r;\n    if (!imageRangeContaining(addr, r)) return false;\n    return r.base == mainBase();\n}\n\n// ---------- quet vung RW theo tung khoi (tranh cap phat GB) ----------\nconst size_t kScanStep = 64u << 10; // 64 KB per read; bounded buffers\n\ntemplate <class F> void scanWritable(F cb) {\n    const std::vector<Region> &regs = allRegions();\n    std::vector<unsigned char> buf(kScanStep + 16);\n    for (size_t ri = 0; ri < regs.size(); ri++) {\n        const Region &r = regs[ri];\n        if (!r.writable) continue;\n        for (uintptr_t a = r.start; a < r.end; a += kScanStep) {\n            size_t want = (size_t)std::min<uintptr_t>(kScanStep, r.end - a);\n            if (want < 8) break;\n            if (!allowScan(want)) return;\n            if (!rd(a, buf.data(), want)) continue;\n            cb(a, buf.data(), want);\n            std::this_thread::sleep_for(std::chrono::milliseconds(2));\n        }\n    }\n}\n\n// quet chi trong cac vung writable cua mot image (vd: __DATA cua main binary)\ntemplate <class F> void scanImageData(uintptr_t imgBase, F cb) {\n    const std::vector<Region> &regs = allRegions();\n    std::vector<unsigned char> buf(kScanStep + 16);\n    for (size_t ri = 0; ri < regs.size(); ri++) {\n        const Region &r = regs[ri];\n        if (!r.writable) continue;\n\n        ImgRange ir;\n        if (!imageRangeContaining(r.start, ir) || ir.base != imgBase) continue;\n\n        for (uintptr_t a = r.start; a < r.end; a += kScanStep) {\n            size_t want = (size_t)std::min<uintptr_t>(kScanStep, r.end - a);\n            if (want < 8) break;\n            if (!allowScan(want)) return;\n            if (!rd(a, buf.data(), want)) continue;\n            cb(a, buf.data(), want);\n            std::this_thread::sleep_for(std::chrono::milliseconds(2));\n        }\n    }\n}\n\n} // namespace zk\n",
            "src/scan_budget.hpp": "#pragma once\n#include <cstddef>\n#include <chrono>\nnamespace zk {\nstruct ScanBudget {\n    size_t bytes=0, readBytes=0, readCalls=0, readFailures=0;\n    bool exhausted=false;\n    const char *reason=\"none\";\n    std::chrono::steady_clock::time_point start=std::chrono::steady_clock::now();\n};\ninline ScanBudget& scanBudget() { static ScanBudget state; return state; }\ninline void resetScanBudget() { scanBudget()=ScanBudget{}; }\ninline bool budgetTimeOK() {\n    auto &b=scanBudget();\n    if(b.exhausted) return false;\n    if(std::chrono::steady_clock::now()-b.start>=std::chrono::seconds(45)) {\n        b.exhausted=true; b.reason=\"elapsed_limit\"; return false;\n    }\n    return true;\n}\ninline bool allowRead(size_t n) {\n    auto &b=scanBudget();\n    if(!budgetTimeOK()) return false;\n    constexpr size_t limit=(16u<<20);\n    if(n>limit-b.readBytes || b.readCalls>=300000) {\n        b.exhausted=true; b.reason=\"read_limit\"; return false;\n    }\n    b.readBytes+=n; ++b.readCalls; return true;\n}\ninline bool allowScan(size_t n) {\n    if(!budgetTimeOK()) return false;\n    scanBudget().bytes+=n; return true;\n}\n}\n",
            "src/targeted_names.hpp": "#pragma once\n#include <cstdint>\n#include <cstddef>\n#include <cstring>\nnamespace zk {\nstatic_assert(sizeof(uintptr_t)==8,\"64-bit pointers required\");\nstruct TargetedResult {\n const char *status=\"not_checked\";\n uint32_t chainDepth=0;\n uintptr_t table=0;\n unsigned decoded=0;\n char names[16][65]{};\n};\ninline bool candidatePointer(uintptr_t p) { return p>=0x10000 && (p&7)==0 && p<=UINTPTR_MAX-128; }\n// Model inferred from one executable; read callback must have its own hard read budget.\ntemplate<class Read> TargetedResult checkTargetedNames(uintptr_t wrapper, Read read) {\n TargetedResult r;\n if(!candidatePointer(wrapper)) { r.status=\"bad_wrapper_address\"; return r; }\n unsigned char h[16]{};\n if(!read(wrapper,h,sizeof(h))) { r.status=\"wrapper_read_failed\"; return r; }\n uint32_t tag; uintptr_t p;\n std::memcpy(&tag,h,4); std::memcpy(&p,h+8,8);\n if(!(h[4]&1)) { r.status=\"wrapper_not_initialized\"; return r; }\n if(tag<103 || tag>148 || (tag-100)%3) { r.status=\"unexpected_chain_tag\"; return r; }\n r.chainDepth=(tag-100)/3;\n if(!candidatePointer(p)) { r.status=\"invalid_chain_pointer\"; return r; }\n uintptr_t seen[16]{}; seen[0]=p;\n for(uint32_t j=1;j<r.chainDepth;++j) {\n  uintptr_t next=0;\n  if(!read(p,&next,8) || !candidatePointer(next)) { r.status=\"chain_read_failed\"; return r; }\n  for(uint32_t k=0;k<j;++k)if(next==seen[k]) { r.status=\"chain_cycle\"; return r; }\n  seen[j]=next; p=next;\n }\n uintptr_t table=0;\n if(!read(p,&table,8) || !candidatePointer(table)) { r.status=\"table_read_failed\"; return r; }\n r.table=table;\n uintptr_t chunk=0;\n if(!read(table,&chunk,8) || !candidatePointer(chunk)) { r.status=\"chunk0_read_failed\"; return r; }\n for(unsigned id=0;id<16;++id) {\n  uintptr_t entry=0;\n  if(!read(chunk+id*8,&entry,8) || !candidatePointer(entry)) { r.status=\"entry_read_failed\"; return r; }\n  uint32_t flags=0;\n  if(!read(entry+8,&flags,4)) { r.status=\"entry_flags_read_failed\"; return r; }\n  if(flags&1) { r.status=\"wide_entry_not_supported\"; return r; }\n  unsigned char text[64]{};\n  if(!read(entry+12,text,sizeof(text))) { r.status=\"entry_text_read_failed\"; return r; }\n  size_t n=0;\n  for(;n<sizeof(text)&&text[n];++n) {\n   if(text[n]<32||text[n]>126) { r.status=\"non_ascii_name\"; return r; }\n  }\n  if(!n||n==sizeof(text)) { r.status=\"missing_name_terminator\"; return r; }\n  std::memcpy(r.names[id],text,n); ++r.decoded;\n  if(id==0 && std::strcmp(r.names[0],\"None\")) { r.status=\"entry0_not_None\"; return r; }\n }\n r.status=\"candidate_decoded_16_names_NOT_runtime_verified\";\n return r;\n}\n}\n",
            "src/targeted_objects.hpp": "#pragma once\n#include \"targeted_names.hpp\"\n#include <array>\nnamespace zk {\nstruct ObjectSample { uint32_t index=0; const char *status=\"not_checked\"; char name[65]{},className[65]{}; };\nstruct ArraySnapshot {\n uintptr_t items=0;int32_t capacity=0,count=0;\n static ArraySnapshot decode(const unsigned char *p){ArraySnapshot h;std::memcpy(&h.items,p,8);std::memcpy(&h.capacity,p+8,4);std::memcpy(&h.count,p+12,4);return h;}\n unsigned changes(const ArraySnapshot &b)const{return (items!=b.items?1u:0u)|(capacity!=b.capacity?2u:0u)|(count!=b.count?4u:0u);}\n};\nstruct ObjectResult {ArraySnapshot before{},after{};bool afterRead=false;unsigned headerChanges=0;const char *status=\"not_checked\";int32_t count=0,capacity=0;unsigned valid=0;bool stable=false;ObjectSample sample[16]{};};\ninline bool safeSpan(uintptr_t p,size_t n){return p>=0x10000 && n<=UINTPTR_MAX-p;}\n// Fixed snapshot bound: count growth alone does not extend enumeration.\ninline const char *snapshotPolicy(const ArraySnapshot &fixed,const ArraySnapshot &previous,const ArraySnapshot &now){\n if(!candidatePointer(fixed.items)||fixed.count<=0||fixed.capacity<fixed.count||fixed.capacity>5000000||!safeSpan(fixed.items,size_t(fixed.capacity)*24))return \"invalid_baseline\";\n if(!candidatePointer(now.items)||now.count<=0||now.capacity<now.count||now.capacity>5000000||!safeSpan(now.items,size_t(now.capacity)*24))return \"invalid_current_header\";\n if(now.items!=fixed.items)return \"items_pointer_changed\";\n if(now.capacity!=fixed.capacity)return \"capacity_changed\";\n if(now.count<fixed.count||now.count<previous.count)return \"count_decreased\";\n return \"snapshot_bound_accepted\";\n}\ninline bool snapshotAccepted(const ArraySnapshot &a,const ArraySnapshot &p,const ArraySnapshot &n){return !std::strcmp(snapshotPolicy(a,p,n),\"snapshot_bound_accepted\");}\ntemplate<class Read> struct NameReader {\n Read &read;uintptr_t table;uint32_t count=0;\n struct Entry{uint32_t id=0;char text[65]{};};Entry cache[256]{};unsigned used=0;\n bool init(){int32_t n=0;if(!safeSpan(table,0x404)||!read(table+0x400,&n,4)||n<=0||n>2000000)return false;count=uint32_t(n);return true;}\n bool get(uint32_t id,char out[65]){\n  out[0]=0;if(id>=count)return false;\n  for(unsigned i=0;i<used;++i)if(cache[i].id==id){std::memcpy(out,cache[i].text,65);return true;}\n  if(used==256)used=0;\n  uintptr_t chunk=0,entry=0;uint32_t flags=0;\n  if(!read(table+(id/0x4000)*8,&chunk,8)||!candidatePointer(chunk))return false;\n  uintptr_t slot=chunk+(id%0x4000)*8;\n  if(!safeSpan(chunk,(id%0x4000)*8+8)||!read(slot,&entry,8)||!candidatePointer(entry))return false;\n  if(!read(entry+8,&flags,4)||(flags&1)||!read(entry+12,out,64))return false;\n  size_t n=0;for(;n<64&&out[n];++n)if((unsigned char)out[n]<32||(unsigned char)out[n]>126)return false;\n  if(!n||n==64)return false;\n  out[64]=0;cache[used].id=id;std::memcpy(cache[used++].text,out,65);return true;\n }\n};\nstruct ObjectHead{uintptr_t vtable;uint32_t flags;int32_t index;uintptr_t cls;uint32_t nameId,number;uintptr_t outer;};\nstatic_assert(sizeof(ObjectHead)==40,\"Expected 64-bit UObject header layout\");\ntemplate<class Read> ObjectResult checkObjects(uintptr_t array,uintptr_t names,Read read){\n ObjectResult result;\n if(!candidatePointer(array)){result.status=\"invalid_array_address\";return result;}\n unsigned char header[16]{};uintptr_t items=0;\n if(!safeSpan(array,0x20)||!read(array+0x10,header,16)){result.status=\"array_header_read_failed\";return result;}\n result.before=ArraySnapshot::decode(header);std::memcpy(&items,header,8);std::memcpy(&result.capacity,header+8,4);std::memcpy(&result.count,header+12,4);\n if(!candidatePointer(items)||result.count<=0||result.capacity<result.count||result.capacity>5000000){result.status=\"array_header_invalid\";return result;}\n NameReader<Read> nr{read,names};if(!nr.init()){result.status=\"name_count_invalid\";return result;}\n const unsigned n=unsigned(result.count)<16?unsigned(result.count):16;\n for(unsigned i=0;i<n;++i){\n  auto &s=result.sample[i];s.index=i;s.status=\"item_read_failed\";\n  uintptr_t obj=0;if(!read(items+i*24,&obj,8))continue;\n  if(!obj){s.status=\"empty_slot\";continue;}\n  if(!candidatePointer(obj)){s.status=\"object_pointer_invalid\";continue;}\n  ObjectHead h{};if(!read(obj,&h,sizeof(h))){s.status=\"object_header_read_failed\";continue;}\n  if(h.index!=int32_t(i)||!candidatePointer(h.vtable)||!candidatePointer(h.cls)){s.status=\"object_header_mismatch\";continue;}\n  ObjectHead cl{};if(!read(h.cls,&cl,sizeof(cl))){s.status=\"class_header_read_failed\";continue;}\n  if(cl.index<0||cl.index>=result.count||!candidatePointer(cl.cls)){s.status=\"class_header_mismatch\";continue;}\n  uintptr_t classSlot=0;\n  if(!safeSpan(items,size_t(cl.index)*24+8)||!read(items+size_t(cl.index)*24,&classSlot,8)||classSlot!=h.cls){s.status=\"class_index_mismatch\";continue;}\n  ObjectHead meta{};char metaName[65]{};\n  if(!read(cl.cls,&meta,sizeof(meta))||!nr.get(meta.nameId,metaName)||std::strcmp(metaName,\"Class\")){s.status=\"metaclass_name_mismatch\";continue;}\n  if(!nr.get(h.nameId,s.name)||!nr.get(cl.nameId,s.className)){s.status=\"name_decode_failed\";continue;}\n  s.status=\"index_name_class_matched\";++result.valid;\n }\n unsigned char after[16]{};\n result.afterRead=read(array+0x10,after,16);\n if(result.afterRead){result.after=ArraySnapshot::decode(after);result.headerChanges=result.before.changes(result.after);}\n result.stable=result.afterRead && result.headerChanges==0;\n if(!result.afterRead){result.status=\"array_final_header_unreadable\";return result;}\n result.status=!result.stable?\"array_changed_during_sample\":result.valid>=4?\"object_sample_matched_camera_NOT_checked\":\"object_sample_inconclusive\";\n return result;\n}\n// At most four samples and three pauses. Read failures and invalid layouts are not retried.\ntemplate<class Read,class Wait,class Report>\nObjectResult retryObjects(uintptr_t array,uintptr_t names,Read read,Wait wait,Report report){\n ObjectResult result;\n for(unsigned attempt=1;attempt<=4;++attempt){\n  bool readFailed=false;\n  auto tracked=[&](uintptr_t a,void*p,size_t n){const bool ok=read(a,p,n);if(!ok)readFailed=true;return ok;};\n  result=checkObjects(array,names,tracked);report(attempt,result);\n  if(readFailed || result.stable || result.valid<4 || std::strcmp(result.status,\"array_changed_during_sample\") || attempt==4)break;\n  wait();\n }\n return result;\n}\n}\n",
            "src/targeted_instances.hpp": "#pragma once\n#include \"targeted_objects.hpp\"\n#include <array>\n#include <algorithm>\nnamespace zk {\ninline bool definitionClass(const char *s){\n const size_t n=std::strlen(s),k=14;\n return !std::strcmp(s,\"Class\") || !std::strcmp(s,\"DynamicClass\") || (n>=k && !std::strcmp(s+n-k,\"GeneratedClass\"));\n}\ninline bool trainingClass(const char *s){return std::strstr(s,\"Training\")||std::strstr(s,\"Target\")||std::strstr(s,\"Dummy\")||std::strstr(s,\"Shooting\")||std::strstr(s,\"Practice\");}\ninline bool interestingClass(const char *s){\n return !std::strcmp(s,\"World\") || std::strstr(s,\"GameEngine\") || std::strstr(s,\"PlayerController\") || std::strstr(s,\"CameraManager\") || std::strstr(s,\"LocalPlayer\") || std::strstr(s,\"GameInstance\") || std::strstr(s,\"ViewportClient\") || std::strstr(s,\"PlayerPawn\") || std::strstr(s,\"Character\") || trainingClass(s);\n}\nenum class CandidateGroup : unsigned {World,Controller,Camera,Engine,GameInstance,Viewport,LocalPlayer,Pawn,CharacterOther,TrainingOther,Count};\nconstexpr unsigned groupCount=unsigned(CandidateGroup::Count);\ninline CandidateGroup candidateGroup(const char *s){\n if(!std::strcmp(s,\"World\"))return CandidateGroup::World;\n if(std::strstr(s,\"PlayerController\"))return CandidateGroup::Controller;\n if(std::strstr(s,\"CameraManager\"))return CandidateGroup::Camera;\n if(std::strstr(s,\"GameEngine\"))return CandidateGroup::Engine;\n if(std::strstr(s,\"GameInstance\"))return CandidateGroup::GameInstance;\n if(std::strstr(s,\"ViewportClient\"))return CandidateGroup::Viewport;\n if(std::strstr(s,\"LocalPlayer\"))return CandidateGroup::LocalPlayer;\n if(std::strstr(s,\"PlayerPawn\"))return CandidateGroup::Pawn;\n if(trainingClass(s))return CandidateGroup::TrainingOther;\n if(std::strstr(s,\"Character\"))return CandidateGroup::CharacterOther;\n return CandidateGroup::Count;\n}\ninline const char *groupLabel(unsigned n){\n constexpr const char *labels[]={\"world_name_candidate\",\"controller_name_candidate\",\"camera_name_candidate\",\"engine_name_candidate\",\"game_instance_name_candidate\",\"viewport_name_candidate\",\"local_player_name_candidate\",\"pawn_name_candidate\",\"character_other\",\"training_name_candidate\"};\n return n<groupCount?labels[n]:\"unmatched\";\n}\nstruct GroupOutput {\n uint32_t matched[groupCount]{},logged[groupCount]{};\n static unsigned limit(unsigned n){return n>=groupCount?0:n==unsigned(CandidateGroup::CharacterOther)?4:(n<3||n==unsigned(CandidateGroup::TrainingOther))?16:8;}\n bool record(CandidateGroup group){const unsigned n=unsigned(group);if(n>=groupCount)return false;++matched[n];if(logged[n]>=limit(n))return false;++logged[n];return true;}\n};\nstruct OwnershipTarget {uintptr_t ptr=0;ObjectHead original{};bool priority=false;};\nstruct OwnershipTargets {\n OwnershipTarget records[10][32]{};unsigned used[10]{};\n void save(unsigned group,uintptr_t ptr,const ObjectHead &h,const char *cls=nullptr){\n  if(group>=10||group==unsigned(CandidateGroup::CharacterOther))return;\n  const bool training=group==unsigned(CandidateGroup::TrainingOther);\n  const bool priority=training&&cls&&(std::strstr(cls,\"PracticeTarget\")||std::strstr(cls,\"Dummy\")||std::strstr(cls,\"HumanTarget\")||std::strstr(cls,\"Mannequin\"));\n  const unsigned cap=training?32u:8u;\n  if(used[group]<cap){records[group][used[group]++]={ptr,h,priority};return;}\n  if(priority)for(unsigned i=0;i<cap;++i)if(!records[group][i].priority){records[group][i]={ptr,h,true};return;}\n }\n};\nstruct TrainingSelection {unsigned indices[16]{},count=0;};\ninline TrainingSelection selectTraining(const OwnershipTargets &targets){\n TrainingSelection result;const unsigned g=unsigned(CandidateGroup::TrainingOther);\n for(unsigned pass=0;pass<2;++pass)for(unsigned i=0;i<targets.used[g]&&result.count<16;++i)if(targets.records[g][i].priority==(pass==0))result.indices[result.count++]=i;\n return result;\n}\nstruct ClassMemo {uintptr_t ptr=0;bool good=false;char name[65]{};};\nstruct InstanceStats {uint32_t next=0,objects=0,classes=0,defaults=0,matches=0,failed=0;};\n// Reads only known object slots. Caller supplies global read budget, pacing, and log sink.\ntemplate<class Read> struct InstanceReader {\n Read read;uintptr_t items;int32_t count;NameReader<Read> names;\n ClassMemo memo[512]{};unsigned replace=0;InstanceStats stats;GroupOutput groupOutput;OwnershipTargets targets;\n char classSamples[64][65]{};unsigned sampleCount=0;\n void sampleClass(const char *name){\n  for(unsigned i=0;i<sampleCount;++i)if(!std::strcmp(classSamples[i],name))return;\n  if(sampleCount<64)std::memcpy(classSamples[sampleCount++],name,65);\n }\n InstanceReader(Read fn,uintptr_t a,int32_t n,uintptr_t table):read(fn),items(a),count(n),names{read,table}{}\n bool className(uintptr_t p,char out[65]){\n  for(auto &c:memo)if(c.ptr==p){if(c.good)std::memcpy(out,c.name,65);return c.good;}\n  auto &c=memo[replace++%512];c=ClassMemo{};c.ptr=p;\n  if(!candidatePointer(p))return false;\n  ObjectHead h{},meta{};uintptr_t at=0;char mn[65]{};\n  if(!read(p,&h,sizeof(h))||h.index<0||h.index>=count||!candidatePointer(h.cls))return false;\n  if(!read(items+size_t(h.index)*24,&at,8)||at!=p)return false;\n  if(!read(h.cls,&meta,sizeof(meta))||!names.get(meta.nameId,mn))return false;\n  if(std::strcmp(mn,\"Class\")) {\n   ObjectHead root{};char rootName[65]{};\n   if(!definitionClass(mn)||!candidatePointer(meta.cls)||!read(meta.cls,&root,sizeof(root))||!names.get(root.nameId,rootName)||std::strcmp(rootName,\"Class\"))return false;\n  }\n  if(!names.get(h.nameId,c.name))return false;\n  c.good=true;std::memcpy(out,c.name,65);return true;\n }\n template<class Emit> bool batch(Emit emit){\n  if(count<=0||!safeSpan(items,size_t(count)*24)||stats.next>=uint32_t(count))return false;\n  const uint32_t begin=stats.next,n=std::min<uint32_t>(256,uint32_t(count)-begin);\n  std::array<unsigned char,256*24> slots{};\n  if(!read(items+size_t(begin)*24,slots.data(),size_t(n)*24))return false;\n  for(uint32_t k=0;k<n;++k){\n   const uint32_t index=begin+k;uintptr_t obj=0;std::memcpy(&obj,slots.data()+k*24,8);\n   if(!obj){stats.next=index+1;continue;}\n   if(!candidatePointer(obj)){++stats.failed;stats.next=index+1;continue;}\n   ObjectHead h{};\n   if(!read(obj,&h,sizeof(h)))return false;\n   stats.next=index+1;\n   if(h.index!=int32_t(index)||!candidatePointer(h.cls)||!candidatePointer(h.vtable)){++stats.failed;continue;}\n   ++stats.objects;char cls[65]{};\n   if(!className(h.cls,cls)){++stats.failed;continue;}\n   sampleClass(cls);\n   if(definitionClass(cls)){++stats.classes;continue;}\n   if(!interestingClass(cls))continue;\n   char name[65]{};if(!names.get(h.nameId,name)){++stats.failed;continue;}\n   if(!std::strncmp(name,\"Default__\",9)){++stats.defaults;continue;}\n   ObjectHead after{};\n   if(!read(obj,&after,sizeof(after))||std::memcmp(&h,&after,sizeof(h))){++stats.failed;continue;}\n   ++stats.matches;\n   targets.save(unsigned(candidateGroup(cls)),obj,h,cls);\n   if(groupOutput.record(candidateGroup(cls)))emit(index,name,cls,h.number);\n  }\n  return stats.next<uint32_t(count);\n }\n};\n}\n",
            "tests/targeted_test.cpp": "#include \"../src/targeted_names.hpp\"\n#include \"../src/scan_budget.hpp\"\n#include <cassert>\n#include <vector>\n#include <cstring>\n#include <cstdio>\nstruct Fixture {\n static constexpr uintptr_t base=0x10000,table=0x12000,chunk=0x13000,entry=0x14000;\n std::vector<unsigned char> m=std::vector<unsigned char>(0x20000,0);\n size_t bytes=0,calls=0,failAt=0;\n template<class T> void put(uintptr_t a,T value){assert(a>=base && a-base+sizeof(T)<=m.size());std::memcpy(m.data()+a-base,&value,sizeof(T));}\n Fixture(unsigned depth=1){\n  put<uint32_t>(base,100+depth*3);m[4]=1;put<uintptr_t>(base+8,0x11000);\n  for(unsigned i=0;i<depth;++i)put<uintptr_t>(0x11000+i*8,i+1==depth?table:0x11000+(i+1)*8);\n  put<uintptr_t>(table,chunk);\n  for(unsigned i=0;i<16;++i){put<uintptr_t>(chunk+i*8,entry+i*128);std::strcpy((char*)m.data()+entry+i*128-base+12,i?\"TestName\":\"None\");}\n }\n bool read(uintptr_t a,void *p,size_t n){\n  ++calls;bytes+=n;if(calls==failAt)return false;\n  if(a<base || a-base>m.size() || n>m.size()-(a-base))return false;\n  std::memcpy(p,m.data()+a-base,n);return true;\n }\n zk::TargetedResult run(){return zk::checkTargetedNames(base,[&](uintptr_t a,void*p,size_t n){return read(a,p,n);});}\n};\nint main(){\n unsigned count=0;\n auto status=[&](Fixture &f,const char *expected){auto r=f.run();if(std::strcmp(r.status,expected))std::fprintf(stderr,\"expected=%s actual=%s\\n\",expected,r.status);assert(!std::strcmp(r.status,expected));assert(f.bytes<=4096 && f.calls<=128);++count;};\n for(unsigned depth=1;depth<=16;++depth){Fixture f(depth);auto r=f.run();assert(r.decoded==16 && r.chainDepth==depth && !std::strcmp(r.names[0],\"None\"));assert(f.bytes<=4096 && f.calls<=128);++count;}\n {Fixture f;f.m[4]=0;status(f,\"wrapper_not_initialized\");}\n for(uint32_t tag:{0u,100u,102u,104u,149u,0xffffffffu}){Fixture f;f.put<uint32_t>(Fixture::base,tag);status(f,\"unexpected_chain_tag\");}\n {Fixture f;f.put<uintptr_t>(Fixture::base+8,1);status(f,\"invalid_chain_pointer\");}\n {Fixture f(16);f.put<uintptr_t>(0x11000,0x11000);status(f,\"chain_cycle\");}\n {Fixture f;f.m[Fixture::entry-Fixture::base+12]='X';status(f,\"entry0_not_None\");}\n {Fixture f;f.put<uint32_t>(Fixture::entry+8,1);status(f,\"wide_entry_not_supported\");}\n {Fixture f;f.m[Fixture::entry-Fixture::base+12]=0x80;status(f,\"non_ascii_name\");}\n {Fixture f;std::memset(f.m.data()+Fixture::entry-Fixture::base+12,'A',64);status(f,\"missing_name_terminator\");}\n {Fixture f;f.m[Fixture::entry-Fixture::base+12]=0;status(f,\"missing_name_terminator\");}\n for(size_t i=1;i<=51;++i){Fixture f;f.failAt=i;auto r=f.run();assert(std::strcmp(r.status,\"candidate_decoded_16_names_NOT_runtime_verified\"));assert(f.calls==i);++count;}\n zk::resetScanBudget();assert(zk::allowRead(16u<<20));assert(!zk::allowRead(1));++count;\n zk::resetScanBudget();for(int i=0;i<300000;++i)assert(zk::allowRead(1));assert(!zk::allowRead(1));++count;\n zk::resetScanBudget();zk::scanBudget().start-=std::chrono::seconds(46);assert(!zk::allowRead(1));++count;\n std::printf(\"PASS: %u bounded-reader and budget cases\\n\",count);\n}\n",
            "tests/objects_test.cpp": "#include \"../src/targeted_objects.hpp\"\n#include <vector>\n#include <cassert>\n#include <cstdio>\n#include <cstring>\nstruct Fixture {\n static constexpr uintptr_t base=0x10000,names=0x20000,chunk=0x21000,entries=0x22000,items=0x30000,objects=0x31000;\n std::vector<unsigned char> m=std::vector<unsigned char>(0x60000,0);\n size_t calls=0,bytes=0,failAt=0,headerReads=0;bool changeHeader=false;\n template<class T> void put(uintptr_t a,T n){assert(a>=base&&a-base+sizeof(T)<=m.size());std::memcpy(m.data()+a-base,&n,sizeof(T));}\n Fixture(){\n  put<uintptr_t>(base+16,items);put<int32_t>(base+24,16);put<int32_t>(base+28,16);\n  put<uintptr_t>(names,chunk);put<int32_t>(names+0x400,18);\n  for(unsigned i=0;i<18;++i){put<uintptr_t>(chunk+i*8,entries+i*128);std::strcpy((char*)m.data()+entries+i*128-base+12,i==0?\"None\":i==1?\"Class\":\"ObjectName\");}\n  for(unsigned i=0;i<16;++i){put<uintptr_t>(items+i*24,objects+i*256);zk::ObjectHead h{};h.vtable=0x50000;h.index=i;h.cls=objects+256;h.nameId=i==1?1:i+2;put(objects+i*256,h);}\n }\n bool read(uintptr_t a,void*p,size_t n){++calls;bytes+=n;if(calls==failAt)return false;if(a<base||a-base>m.size()||n>m.size()-(a-base))return false;if(a==base+16&&++headerReads==2&&changeHeader)put<int32_t>(base+28,17);std::memcpy(p,m.data()+a-base,n);return true;}\n zk::ObjectResult run(){return zk::checkObjects(base,names,[&](uintptr_t a,void*p,size_t n){return read(a,p,n);});}\n};\nint main(){\n unsigned tests=0;\n {Fixture f;auto r=f.run();assert(r.valid==16&&r.stable&&!std::strcmp(r.status,\"object_sample_matched_camera_NOT_checked\"));assert(f.calls<512&&f.bytes<32768);++tests;}\n for(int32_t n:{-1,0,17,5000001}){Fixture f;f.put<int32_t>(Fixture::base+28,n);auto r=f.run();assert(!std::strcmp(r.status,\"array_header_invalid\"));++tests;}\n {Fixture f;f.put<int32_t>(Fixture::names+0x400,0);assert(!std::strcmp(f.run().status,\"name_count_invalid\"));++tests;}\n {Fixture f;f.put<uintptr_t>(Fixture::items,0);auto r=f.run();assert(!std::strcmp(r.sample[0].status,\"empty_slot\")&&r.valid==15);++tests;}\n {Fixture f;f.put<int32_t>(Fixture::objects+12,99);assert(!std::strcmp(f.run().sample[0].status,\"object_header_mismatch\"));++tests;}\n {Fixture f;f.put<int32_t>(Fixture::objects+256+12,99);assert(!std::strcmp(f.run().sample[0].status,\"class_header_mismatch\"));++tests;}\n {Fixture f;f.put<uintptr_t>(Fixture::items+24,Fixture::objects);assert(!std::strcmp(f.run().sample[0].status,\"class_index_mismatch\"));++tests;}\n {Fixture f;f.m[Fixture::entries+128-Fixture::base+12]='X';assert(!std::strcmp(f.run().sample[0].status,\"metaclass_name_mismatch\"));++tests;}\n {Fixture f;f.put<uint32_t>(Fixture::objects+24,18);assert(!std::strcmp(f.run().sample[0].status,\"name_decode_failed\"));++tests;}\n {Fixture f;f.changeHeader=true;auto r=f.run();assert(!r.stable&&!std::strcmp(r.status,\"array_changed_during_sample\"));++tests;}\n {Fixture f;f.failAt=1;assert(!std::strcmp(f.run().status,\"array_header_read_failed\"));++tests;}\n // Fail each read once: bounded diagnostic must finish without invalid memory access.\n for(size_t fail=2;fail<=180;++fail){Fixture f;f.failAt=fail;auto r=f.run();(void)r;assert(f.calls<512&&f.bytes<32768);++tests;}\n std::printf(\"PASS: %u object reader cases\\n\",tests);return 0;\n}\n",
            "tests/instances_test.cpp": "#include \"../src/targeted_objects.hpp\"\n#include <vector>\n#include <cassert>\n#include <cstdio>\n#include <cstring>\nstruct Fixture {\n static constexpr uintptr_t base=0x10000,names=0x20000,chunk=0x21000,entries=0x22000,items=0x30000,objects=0x31000;\n std::vector<unsigned char> m=std::vector<unsigned char>(0x60000,0);\n size_t calls=0,bytes=0,failAt=0,headerReads=0;bool changeHeader=false;\n template<class T> void put(uintptr_t a,T n){assert(a>=base&&a-base+sizeof(T)<=m.size());std::memcpy(m.data()+a-base,&n,sizeof(T));}\n Fixture(){\n  put<uintptr_t>(base+16,items);put<int32_t>(base+24,16);put<int32_t>(base+28,16);\n  put<uintptr_t>(names,chunk);put<int32_t>(names+0x400,18);\n  for(unsigned i=0;i<18;++i){put<uintptr_t>(chunk+i*8,entries+i*128);std::strcpy((char*)m.data()+entries+i*128-base+12,i==0?\"None\":i==1?\"Class\":\"ObjectName\");}\n  for(unsigned i=0;i<16;++i){put<uintptr_t>(items+i*24,objects+i*256);zk::ObjectHead h{};h.vtable=0x50000;h.index=i;h.cls=objects+256;h.nameId=i==1?1:i+2;put(objects+i*256,h);}\n }\n bool read(uintptr_t a,void*p,size_t n){++calls;bytes+=n;if(calls==failAt)return false;if(a<base||a-base>m.size()||n>m.size()-(a-base))return false;if(a==base+16&&++headerReads==2&&changeHeader)put<int32_t>(base+28,17);std::memcpy(p,m.data()+a-base,n);return true;}\n zk::ObjectResult run(){return zk::checkObjects(base,names,[&](uintptr_t a,void*p,size_t n){return read(a,p,n);});}\n};\n\n#include \"../src/targeted_instances.hpp\"\n#include <string>\nvoid setup(Fixture &f){\n const uintptr_t o=Fixture::objects,e=Fixture::entries,b=Fixture::base;\n f.put<uint32_t>(o+2*256+24,4);std::strcpy((char*)f.m.data()+e+4*128-b+12,\"World\");\n f.put<uintptr_t>(o+3*256+16,o+2*256);\n f.put<uintptr_t>(o+4*256+16,o+2*256);std::strcpy((char*)f.m.data()+e+6*128-b+12,\"Default__World\");\n f.put<uintptr_t>(o+5*256+16,o+6*256);std::strcpy((char*)f.m.data()+e+8*128-b+12,\"STExtraPlayerCameraManager\");\n}\nint main(){unsigned tests=0;\n for(const char *s:{\"World\",\"GameEngine\",\"STExtraPlayerController\",\"STExtraPlayerCameraManager\",\"LocalPlayer\",\"GameInstance\",\"GameViewportClient\",\"BP_PlayerPawn_C\",\"Character\"}){assert(zk::interestingClass(s));++tests;}\n for(const char *s:{\"Class\",\"Package\",\"WorldSettings\",\"CameraComponent\",\"Texture2D\"}){assert(!zk::interestingClass(s));++tests;}\n {Fixture f;setup(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());unsigned emitted=0;\n assert(!x.batch([&](uint32_t i,const char *name,const char *cls,uint32_t){assert(i==3||i==5);assert(std::strncmp(name,\"Default__\",9));assert(zk::interestingClass(cls));++emitted;}));\n assert(x.stats.next==16&&x.stats.matches==2&&x.stats.defaults==1&&emitted==2&&x.stats.failed==0);assert(f.calls<512&&f.bytes<32768);++tests;}\n for(size_t fail=1;fail<=120;++fail){Fixture f;setup(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());f.failAt=f.calls+fail;x.batch([](uint32_t,const char*,const char*,uint32_t){});assert(x.stats.next<=16&&x.stats.matches<=2&&f.calls<512&&f.bytes<32768);++tests;}\n {Fixture f;f.put<int32_t>(Fixture::names+0x400,400);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::NameReader<decltype(rd)> nr{rd,Fixture::names};assert(nr.init());char name[65]{};\n for(uint32_t i=0;i<300;++i){const uintptr_t entry=0x40000+i*128;f.put<uintptr_t>(Fixture::chunk+i*8,entry);std::strcpy((char*)f.m.data()+entry-Fixture::base+12,\"Name\");assert(nr.get(i,name));}assert(nr.used<=256);++tests;}\n {Fixture f;constexpr uintptr_t objs=0x40000;f.put<int32_t>(Fixture::base+24,300);f.put<int32_t>(Fixture::base+28,300);\n for(uint32_t i=0;i<300;++i){zk::ObjectHead h{};h.index=i;h.vtable=0x50000;h.cls=objs+256;h.nameId=i==1?1:2;f.put(objs+i*256,h);f.put<uintptr_t>(Fixture::items+i*24,objs+i*256);}\n auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,300,Fixture::names);assert(x.names.init());auto emit=[](uint32_t,const char*,const char*,uint32_t){};assert(x.batch(emit));assert(x.stats.next==256);assert(!x.batch(emit));assert(x.stats.next==300&&x.stats.classes==300);++tests;}\n\n {Fixture f;setup(f);const uintptr_t o=Fixture::objects,e=Fixture::entries,b=Fixture::base;\n  f.put<uintptr_t>(o+2*256+16,o+6*256);std::strcpy((char*)f.m.data()+e+8*128-b+12,\"BlueprintGeneratedClass\");\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());bool world=false;\n  x.batch([&](uint32_t i,const char*,const char *cls,uint32_t){if(i==3&&!std::strcmp(cls,\"World\"))world=true;});assert(world);++tests;}\n {Fixture f;setup(f);const uintptr_t o=Fixture::objects,e=Fixture::entries,b=Fixture::base;\n  f.put<uintptr_t>(o+2*256+16,o+6*256);std::strcpy((char*)f.m.data()+e+8*128-b+12,\"BogusMetaclass\");\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());bool world=false;\n  x.batch([&](uint32_t i,const char*,const char*,uint32_t){if(i==3)world=true;});assert(!world);++tests;}\n {Fixture f;setup(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());\n  x.batch([](uint32_t,const char*,const char*,uint32_t){});assert(x.sampleCount>0&&x.sampleCount<=64);unsigned before=x.sampleCount;\n  x.sampleClass(x.classSamples[0]);assert(x.sampleCount==before);\n  for(unsigned i=0;i<100;++i){char name[65]{};std::snprintf(name,sizeof(name),\"Sample%u\",i);x.sampleClass(name);}assert(x.sampleCount==64);++tests;}\n std::printf(\"PASS: %u instance reader cases\\n\",tests);return 0;\n}\n",
            "build.sh": "#!/bin/bash\nset -euo pipefail\ncd \"$(dirname \"$0\")\"\nmkdir -p build artifacts\nSDK=$(xcrun --sdk iphoneos --show-sdk-path)\nfor arch in arm64 arm64e; do\n  mkdir -p \"build/$arch\"\n  xcrun clang++ -isysroot \"$SDK\" -arch \"$arch\" -miphoneos-version-min=15.0 -std=c++17 -O2 -fobjc-arc -Isrc -c src/probe.mm -o \"build/$arch/probe.o\"\n  xcrun clang++ -isysroot \"$SDK\" -arch \"$arch\" -miphoneos-version-min=15.0 -dynamiclib \"build/$arch/probe.o\" -framework Foundation -framework UIKit -framework QuartzCore -Wl,-install_name,@rpath/ZKProbe.dylib -o \"build/$arch/ZKProbe.dylib\"\ndone\nxcrun lipo -create build/arm64/ZKProbe.dylib build/arm64e/ZKProbe.dylib -output artifacts/ZKProbe.dylib\nldid -S artifacts/ZKProbe.dylib\nxcrun lipo -info artifacts/ZKProbe.dylib\nshasum -a 256 artifacts/ZKProbe.dylib > artifacts/SHA256.txt\n",
            "tests/retry_test.cpp": "#define main old_object_test_main\n#include \"objects_test.cpp\"\n#undef main\nint main(){unsigned tests=0;\n {zk::ArraySnapshot a{},b{};assert(a.changes(b)==0);b.items=0x10000;assert(a.changes(b)==1);b.capacity=20;assert(a.changes(b)==3);b.count=10;assert(a.changes(b)==7);++tests;}\n {Fixture f;f.changeHeader=true;auto r=f.run();assert(r.afterRead&&r.headerChanges==4&&r.before.count==16&&r.after.count==17);++tests;}\n {Fixture f;auto baseline=f.run();assert(baseline.afterRead);size_t last=f.calls;Fixture g;g.failAt=last;auto r=g.run();assert(!r.afterRead&&!r.stable&&!std::strcmp(r.status,\"array_final_header_unreadable\"));++tests;}\n {Fixture f;f.changeHeader=true;unsigned attempts=0,pauses=0;auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};\n  auto r=zk::retryObjects(Fixture::base,Fixture::names,rd,[&]{++pauses;f.changeHeader=false;f.put<int32_t>(Fixture::base+28,16);},[&](unsigned n,const zk::ObjectResult&){attempts=n;});assert(r.stable&&attempts==2&&pauses==1);++tests;}\n {Fixture f;unsigned attempts=0,pauses=0,headers=0;auto rd=[&](uintptr_t a,void*p,size_t n){if(a==Fixture::base+16){++headers;f.put<int32_t>(Fixture::base+28,headers%2?15:16);}return f.read(a,p,n);};\n  auto r=zk::retryObjects(Fixture::base,Fixture::names,rd,[&]{++pauses;},[&](unsigned n,const zk::ObjectResult&){attempts=n;});assert(!r.stable&&attempts==4&&pauses==3);++tests;}\n {Fixture f;unsigned attempts=0,pauses=0;auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};auto r=zk::retryObjects(Fixture::base,Fixture::names,rd,[&]{++pauses;},[&](unsigned n,const zk::ObjectResult&){attempts=n;});assert(r.stable&&attempts==1&&pauses==0);++tests;}\n {Fixture f;f.failAt=1;unsigned attempts=0,pauses=0;auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};auto r=zk::retryObjects(Fixture::base,Fixture::names,rd,[&]{++pauses;},[&](unsigned n,const zk::ObjectResult&){attempts=n;});assert(!r.stable&&attempts==1&&pauses==0);++tests;}\n {Fixture f;f.changeHeader=true;f.failAt=5;unsigned attempts=0,pauses=0;auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};auto r=zk::retryObjects(Fixture::base,Fixture::names,rd,[&]{++pauses;},[&](unsigned n,const zk::ObjectResult&){attempts=n;});assert(!r.stable&&attempts==1&&pauses==0);++tests;}\n std::printf(\"PASS: %u snapshot and retry cases\\n\",tests);return 0;\n}\n",
            "tests/growth_test.cpp": "#define main old_object_test_main\n#include \"objects_test.cpp\"\n#undef main\nint main(){unsigned tests=0;\n zk::ArraySnapshot a;a.items=Fixture::items;a.count=264329;a.capacity=520000;\n {auto b=a;assert(zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;b.count=264420;assert(zk::snapshotAccepted(a,a,b));assert(a.count==264329);++tests;}\n {auto b=a;b.count=a.capacity;assert(zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;b.count=a.capacity+1;assert(!zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;--b.count;assert(!std::strcmp(zk::snapshotPolicy(a,a,b),\"count_decreased\"));++tests;}\n {auto p=a;p.count+=100;auto b=p;--b.count;assert(!std::strcmp(zk::snapshotPolicy(a,p,b),\"count_decreased\"));++tests;}\n {auto b=a;b.items+=8;assert(!std::strcmp(zk::snapshotPolicy(a,a,b),\"items_pointer_changed\"));++tests;}\n {auto b=a;++b.capacity;assert(!std::strcmp(zk::snapshotPolicy(a,a,b),\"capacity_changed\"));++tests;}\n {auto b=a;b.count=-1;assert(!zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;b.items=0;assert(!zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;b.capacity=5000001;assert(!zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;b.capacity=-1;assert(!zk::snapshotAccepted(a,a,b));++tests;}\n {auto b=a;b.items=UINTPTR_MAX-7;assert(!zk::snapshotAccepted(b,b,b));++tests;}\n {Fixture f;f.put<int32_t>(Fixture::base+24,32);const auto baseline=f.run();auto fixed=baseline.after;auto previous=fixed;\n  for(int n:{17,18,25}){auto now=previous;now.count=n;f.put<int32_t>(Fixture::base+28,n);assert(zk::snapshotAccepted(fixed,previous,now));previous=now;}\n  assert(fixed.count==16);++tests;}\n std::printf(\"PASS: %u fixed snapshot policy cases\\n\",tests);return 0;\n}\n",
            "tests/groups_test.cpp": "#define main old_instance_test_main\n#include \"instances_test.cpp\"\n#undef main\nint main(){unsigned tests=0;\n const char *names[]={\"World\",\"STExtraPlayerController\",\"PlayerCameraManager\",\"UAEGameEngine\",\"STExtraGameInstance\",\"GameViewportClient\",\"LocalPlayer\",\"BP_PlayerPawn_C\",\"CharacterMovementComponent\",\"BP_TrainingDummy_C\"};\n for(unsigned i=0;i<zk::groupCount;++i){assert(unsigned(zk::candidateGroup(names[i]))==i);++tests;}\n {assert(zk::candidateGroup(\"Texture2D\")==zk::CandidateGroup::Count);assert(!std::strcmp(zk::groupLabel(999),\"unmatched\"));++tests;}\n {zk::GroupOutput q;for(unsigned i=0;i<500;++i)q.record(zk::CandidateGroup::CharacterOther);assert(q.matched[8]==500&&q.logged[8]==4);assert(q.record(zk::CandidateGroup::World));assert(q.record(zk::CandidateGroup::Camera));assert(!q.record(zk::CandidateGroup::Count));++tests;}\n {zk::GroupOutput q;for(unsigned n=0;n<zk::groupCount;++n){for(unsigned i=0;i<100;++i)q.record(zk::CandidateGroup(n));assert(q.matched[n]==100&&q.logged[n]==zk::GroupOutput::limit(n));}++tests;}\n {Fixture f;constexpr uintptr_t o=0x40000;\n  f.put<int32_t>(Fixture::names+0x400,18);\n  std::strcpy((char*)f.m.data()+Fixture::entries+2*128-Fixture::base+12,\"CharacterMovementComponent\");\n  std::strcpy((char*)f.m.data()+Fixture::entries+4*128-Fixture::base+12,\"World\");\n  for(uint32_t i=0;i<300;++i){zk::ObjectHead h{};h.index=i;h.vtable=0x50000;h.cls=i<3?o:i==299?o+512:o+256;h.nameId=i==0?1:i==1?2:i==2?4:3;f.put(o+i*256,h);f.put<uintptr_t>(Fixture::items+i*24,o+i*256);}\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> reader(rd,Fixture::items,300,Fixture::names);assert(reader.names.init());unsigned world=0,noise=0;\n  auto emit=[&](uint32_t index,const char*,const char *cls,uint32_t){if(!std::strcmp(cls,\"World\")){assert(index==299);++world;}else ++noise;};\n  assert(reader.batch(emit));assert(!reader.batch(emit));assert(world==1&&noise==4);assert(reader.groupOutput.matched[8]==296&&reader.groupOutput.logged[8]==4);assert(reader.groupOutput.matched[0]==1);++tests;\n }\n std::printf(\"PASS: %u grouping and output quota cases\\n\",tests);return 0;\n}\n",
            "src/targeted_ownership.hpp": "#pragma once\n#include \"targeted_instances.hpp\"\nnamespace zk {\nstruct OuterWalkResult {const char *status=\"not_started\";unsigned nodes=0;};\n// Validator must check identity, names and slot back-reference before emitting a node.\ntemplate<class Validate,class Emit>\nOuterWalkResult walkOuter(const OwnershipTarget &target,Validate validate,Emit emit){\n OuterWalkResult result;uintptr_t p=target.ptr,seen[8]{};\n for(unsigned depth=0;depth<8;++depth){\n  if(!p){result.status=\"null_outer_end\";return result;}\n  if(!candidatePointer(p)){result.status=\"invalid_outer_pointer\";return result;}\n  for(unsigned i=0;i<depth;++i)if(seen[i]==p){result.status=\"outer_cycle\";return result;}\n  seen[depth]=p;ObjectHead h{};char name[65]{},cls[65]{};\n  if(!validate(p,h,name,cls)){result.status=\"node_validation_failed\";return result;}\n  if(depth==0&&std::memcmp(&target.original,&h,sizeof(h))){result.status=\"target_changed_since_enumeration\";return result;}\n  emit(depth,p,h,name,cls);++result.nodes;p=h.outer;\n }\n result.status=p?\"depth_limit\":\"null_outer_end\";return result;\n}\ntemplate<class Read>\nbool validateOuterNode(uintptr_t p,InstanceReader<Read> &lookup,ObjectHead &h,char name[65],char cls[65]){\n if(!candidatePointer(p)||!lookup.read(p,&h,sizeof(h)))return false;\n if(h.index<0||h.index>=lookup.count||!candidatePointer(h.cls)||!candidatePointer(h.vtable))return false;\n uintptr_t slot=0;\n if(!safeSpan(lookup.items,size_t(h.index)*24+8)||!lookup.read(lookup.items+size_t(h.index)*24,&slot,8)||slot!=p)return false;\n if(!lookup.names.get(h.nameId,name)||!lookup.className(h.cls,cls))return false;\n ObjectHead after{};return lookup.read(p,&after,sizeof(after))&&!std::memcmp(&h,&after,sizeof(h));\n}\n}\n",
            "tests/ownership_test.cpp": "#define main old_instance_test_main\n#include \"instances_test.cpp\"\n#undef main\n#include \"../src/targeted_ownership.hpp\"\nint main(){unsigned tests=0;\n {zk::OwnershipTargets t;zk::ObjectHead h{};for(unsigned g=0;g<9;++g)for(unsigned i=0;i<20;++i)t.save(g,0x10000+i*8,h);for(unsigned g=0;g<7;++g)assert(t.used[g]==8);++tests;}\n for(unsigned mode=0;mode<6;++mode){\n  zk::OwnershipTarget target;target.ptr=0x10000;target.original.index=1;target.original.outer=0x20000;\n  unsigned calls=0,emitted=0;\n  auto validate=[&](uintptr_t p,zk::ObjectHead &h,char*,char*){++calls;h=p==target.ptr?target.original:zk::ObjectHead{};h.index=p==target.ptr?1:2;\n   if(mode==1&&p==0x20000)h.outer=target.ptr;\n   if(mode==2&&p==target.ptr)++h.nameId;\n   if(mode==3)return false;\n   if(mode==4&&p==0x20000)h.outer=1;\n   if(mode==5){h.outer=p+0x10000;if(p==target.ptr)h.outer=target.original.outer;}\n   return true;};\n  auto r=zk::walkOuter(target,validate,[&](unsigned,uintptr_t,const zk::ObjectHead&,const char*,const char*){++emitted;});\n  const char *expected[]={\"null_outer_end\",\"outer_cycle\",\"target_changed_since_enumeration\",\"node_validation_failed\",\"invalid_outer_pointer\",\"depth_limit\"};\n  assert(!std::strcmp(r.status,expected[mode]));assert(calls<=8&&emitted==r.nodes);++tests;\n }\n {Fixture f;setup(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());\n  f.put<uintptr_t>(Fixture::objects+5*256+32,Fixture::objects+3*256);\n  zk::OwnershipTarget t;t.ptr=Fixture::objects+5*256;std::memcpy(&t.original,f.m.data()+t.ptr-Fixture::base,sizeof(t.original));\n  auto r=zk::walkOuter(t,[&](uintptr_t p,zk::ObjectHead&h,char*n,char*c){return zk::validateOuterNode(p,lookup,h,n,c);},[](unsigned,uintptr_t,const zk::ObjectHead&,const char*,const char*){});\n  assert(r.nodes==2&&!std::strcmp(r.status,\"null_outer_end\"));++tests;\n }\n for(unsigned fail=1;fail<=80;++fail){Fixture f;setup(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());f.failAt=f.calls+fail;\n  zk::OwnershipTarget t;t.ptr=Fixture::objects+3*256;std::memcpy(&t.original,f.m.data()+t.ptr-Fixture::base,sizeof(t.original));\n  auto r=zk::walkOuter(t,[&](uintptr_t p,zk::ObjectHead&h,char*n,char*c){return zk::validateOuterNode(p,lookup,h,n,c);},[](unsigned,uintptr_t,const zk::ObjectHead&,const char*,const char*){});assert(r.nodes<=1&&f.calls<100);++tests;}\n std::printf(\"PASS: %u bounded ownership cases\\n\",tests);return 0;\n}\n",
            "src/targeted_camera.hpp": "#pragma once\n#include \"targeted_ownership.hpp\"\n#include <cmath>\nnamespace zk {\nstruct CameraView {float location[3]{},rotation[3]{},cacheFOV=0,lockedFOV=0,nativeFOV=0;};\ninline bool plausibleCamera(const CameraView &v){\n for(float x:v.location)if(!std::isfinite(x)||std::fabs(x)>1e9f)return false;\n for(float x:v.rotation)if(!std::isfinite(x)||std::fabs(x)>360000.f)return false;\n return std::isfinite(v.cacheFOV)&&std::isfinite(v.lockedFOV)&&std::isfinite(v.nativeFOV)&&v.nativeFOV>0.f&&v.nativeFOV<180.f;\n}\ninline bool cameraChanged(const CameraView &a,const CameraView &b){\n for(unsigned i=0;i<3;++i)if(std::fabs(a.location[i]-b.location[i])>0.001f||std::fabs(a.rotation[i]-b.rotation[i])>0.001f)return true;\n return std::fabs(a.nativeFOV-b.nativeFOV)>0.001f;\n}\ntemplate<class Read> const char *readCameraCandidate(const OwnershipTarget &target,InstanceReader<Read> &lookup,CameraView &view){\n ObjectHead h{};char name[65]{},cls[65]{};\n if(!validateOuterNode(target.ptr,lookup,h,name,cls))return \"object_validation_failed\";\n if(std::memcmp(&h,&target.original,sizeof(h)))return \"object_changed_since_enumeration\";\n if(!std::strstr(cls,\"CameraManager\"))return \"camera_class_rejected\";\n if(!safeSpan(target.ptr,0x558))return \"address_overflow\";\n unsigned char raw[40]{};\n if(!lookup.read(target.ptr+0x530,raw,sizeof(raw))||!lookup.read(target.ptr+0x4cc,&view.lockedFOV,4))return \"camera_fields_read_failed\";\n std::memcpy(view.location,raw,12);std::memcpy(view.rotation,raw+24,12);std::memcpy(&view.cacheFOV,raw+36,4);\n view.nativeFOV=view.lockedFOV>0?view.lockedFOV:view.cacheFOV;\n ObjectHead after{};if(!lookup.read(target.ptr,&after,sizeof(after))||std::memcmp(&h,&after,sizeof(h)))return \"object_changed_during_camera_read\";\n return plausibleCamera(view)?\"plausible_values_UNVERIFIED\":\"numeric_validation_failed\";\n}\n}\n",
            "tests/camera_test.cpp": "#define main old_instance_test_main\n#include \"instances_test.cpp\"\n#undef main\n#include \"../src/targeted_camera.hpp\"\n#include <limits>\nvoid fillCamera(Fixture &f,uintptr_t p){float loc[3]={100,200,300},rot[3]={10,20,30},fov=90,lock=0;\n std::memcpy(f.m.data()+p+0x530-Fixture::base,loc,12);std::memcpy(f.m.data()+p+0x548-Fixture::base,rot,12);f.put(p+0x554,fov);f.put(p+0x4cc,lock);}\nint main(){unsigned tests=0;\n for(unsigned mode=0;mode<6;++mode){zk::CameraView v{};v.cacheFOV=v.nativeFOV=90;\n  if(mode==1)v.location[0]=std::numeric_limits<float>::quiet_NaN();\n  if(mode==2)v.rotation[1]=std::numeric_limits<float>::infinity();\n  if(mode==3)v.nativeFOV=0;\n  if(mode==4)v.nativeFOV=180;\n  if(mode==5)v.location[0]=1e10f;\n  assert(zk::plausibleCamera(v)==(mode==0));++tests;\n }\n {zk::CameraView a{},b{};assert(!zk::cameraChanged(a,b));b.rotation[1]=1;assert(zk::cameraChanged(a,b));++tests;}\n for(unsigned mode=0;mode<4;++mode){Fixture f;setup(f);const uintptr_t ptr=Fixture::objects+5*256;fillCamera(f,ptr);if(mode==1)f.put<float>(ptr+0x4cc,75);if(mode==2)f.put<float>(ptr+0x554,0);\n  zk::OwnershipTarget t;t.ptr=ptr;std::memcpy(&t.original,f.m.data()+ptr-Fixture::base,sizeof(t.original));if(mode==3)++t.original.nameId;\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());zk::CameraView view{};const char *status=zk::readCameraCandidate(t,lookup,view);\n  if(mode<2){assert(!std::strcmp(status,\"plausible_values_UNVERIFIED\"));assert(view.location[2]==300&&view.rotation[1]==20&&view.nativeFOV==(mode==1?75:90));}\n  if(mode==2)assert(!std::strcmp(status,\"numeric_validation_failed\"));if(mode==3)assert(!std::strcmp(status,\"object_changed_since_enumeration\"));++tests;\n }\n for(unsigned fail=1;fail<=80;++fail){Fixture f;setup(f);const uintptr_t ptr=Fixture::objects+5*256;fillCamera(f,ptr);zk::OwnershipTarget t;t.ptr=ptr;std::memcpy(&t.original,f.m.data()+ptr-Fixture::base,sizeof(t.original));\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());f.failAt=f.calls+fail;zk::CameraView view{};auto status=zk::readCameraCandidate(t,lookup,view);assert(status&&f.calls<100);++tests;}\n std::printf(\"PASS: %u camera candidate cases\\n\",tests);return 0;\n}\n",
            "src/targeted_controller_camera.hpp": "#pragma once\n#include \"targeted_ownership.hpp\"\nnamespace zk {\nstruct ControllerCameraResult {const char *status=\"not_checked\";uintptr_t ptr=0;ObjectHead camera{};char name[65]{},cls[65]{};};\ntemplate<class Read> ControllerCameraResult checkControllerCamera(const OwnershipTarget &target,InstanceReader<Read> &lookup){\n ControllerCameraResult result;ObjectHead controller{};char name[65]{},cls[65]{};\n if(!validateOuterNode(target.ptr,lookup,controller,name,cls)){result.status=\"controller_validation_failed\";return result;}\n if(std::memcmp(&controller,&target.original,sizeof(controller))){result.status=\"controller_changed_since_enumeration\";return result;}\n if(!std::strstr(cls,\"PlayerController\")){result.status=\"controller_class_rejected\";return result;}\n if(!safeSpan(target.ptr,0x550)||!lookup.read(target.ptr+0x548,&result.ptr,8)){result.status=\"camera_pointer_read_failed\";return result;}\n if(!result.ptr){result.status=\"null_camera_pointer\";return result;}\n if(!validateOuterNode(result.ptr,lookup,result.camera,result.name,result.cls)){result.status=\"referenced_camera_validation_failed\";return result;}\n if(!std::strstr(result.cls,\"CameraManager\")){result.status=\"referenced_class_rejected\";return result;}\n uintptr_t after=0;ObjectHead controllerAfter{};\n if(!lookup.read(target.ptr+0x548,&after,8)||!lookup.read(target.ptr,&controllerAfter,sizeof(controllerAfter))){result.status=\"controller_final_read_failed\";return result;}\n if(after!=result.ptr||std::memcmp(&controller,&controllerAfter,sizeof(controller))){result.status=\"controller_link_changed_during_read\";return result;}\n result.status=\"controller_camera_pointer_validated\";return result;\n}\n}\n",
            "tests/link_test.cpp": "#define main old_instance_test_main\n#include \"instances_test.cpp\"\n#undef main\n#include \"../src/targeted_controller_camera.hpp\"\nvoid configureLink(Fixture &f){setup(f);const uintptr_t o=Fixture::objects,e=Fixture::entries,b=Fixture::base;f.put<uintptr_t>(o+3*256+16,o+7*256);f.put<uint32_t>(o+7*256+24,9);std::strcpy((char*)f.m.data()+e+9*128-b+12,\"BP_PlayerController_MainCity_C\");f.put<uintptr_t>(o+3*256+0x548,o+5*256);}\nint main(){unsigned tests=0;\n for(unsigned mode=0;mode<5;++mode){Fixture f;configureLink(f);const uintptr_t ptr=Fixture::objects+3*256;\n  if(mode==1)f.put<uintptr_t>(ptr+0x548,0);if(mode==2)f.put<uintptr_t>(ptr+0x548,1);if(mode==3)f.put<uintptr_t>(ptr+0x548,Fixture::objects+4*256);\n  zk::OwnershipTarget t;t.ptr=ptr;std::memcpy(&t.original,f.m.data()+ptr-Fixture::base,sizeof(t.original));if(mode==4)++t.original.nameId;\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());auto r=zk::checkControllerCamera(t,lookup);\n  const char *expected[]={\"controller_camera_pointer_validated\",\"null_camera_pointer\",\"referenced_camera_validation_failed\",\"referenced_class_rejected\",\"controller_changed_since_enumeration\"};assert(!std::strcmp(r.status,expected[mode]));++tests;\n }\n {Fixture f;configureLink(f);const uintptr_t ptr=Fixture::objects+3*256;zk::OwnershipTarget t;t.ptr=ptr;std::memcpy(&t.original,f.m.data()+ptr-Fixture::base,sizeof(t.original));unsigned reads=0;\n  auto rd=[&](uintptr_t a,void*p,size_t n){if(a==ptr+0x548&&++reads==2)f.put<uintptr_t>(a,0);return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());assert(!std::strcmp(zk::checkControllerCamera(t,lookup).status,\"controller_link_changed_during_read\"));++tests;\n }\n for(unsigned fail=1;fail<=80;++fail){Fixture f;configureLink(f);const uintptr_t ptr=Fixture::objects+3*256;zk::OwnershipTarget t;t.ptr=ptr;std::memcpy(&t.original,f.m.data()+ptr-Fixture::base,sizeof(t.original));auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,Fixture::items,16,Fixture::names);assert(lookup.names.init());f.failAt=f.calls+fail;auto r=zk::checkControllerCamera(t,lookup);assert(r.status&&f.calls<100);++tests;}\n std::printf(\"PASS: %u controller-camera link cases\\n\",tests);return 0;\n}\n",
            "src/manual_capture.hpp": "#pragma once\n#include <mutex>\n#include <condition_variable>\n#include <chrono>\nnamespace zk {\nenum class CapturePhase {Idle,Preparing,Ready,Measuring};\nclass CaptureGate {\n std::mutex mutex;std::condition_variable condition;CapturePhase value=CapturePhase::Idle;\npublic:\n CapturePhase phase(){std::lock_guard<std::mutex> lock(mutex);return value;}\n bool begin(){std::lock_guard<std::mutex> lock(mutex);if(value!=CapturePhase::Idle)return false;value=CapturePhase::Preparing;return true;}\n bool arm(){std::lock_guard<std::mutex> lock(mutex);if(value!=CapturePhase::Preparing)return false;value=CapturePhase::Ready;return true;}\n bool request(){std::lock_guard<std::mutex> lock(mutex);if(value!=CapturePhase::Ready)return false;value=CapturePhase::Measuring;condition.notify_all();return true;}\n template<class Rep,class Period> bool wait(const std::chrono::duration<Rep,Period> &timeout){std::unique_lock<std::mutex> lock(mutex);return condition.wait_for(lock,timeout,[&]{return value==CapturePhase::Measuring||value==CapturePhase::Idle;})&&value==CapturePhase::Measuring;}\n void finish(){std::lock_guard<std::mutex> lock(mutex);value=CapturePhase::Idle;condition.notify_all();}\n};\ninline const char *capturePhaseLabel(unsigned tick){return tick<5?\"still_baseline\":tick<10?\"move_forward\":\"still_after\";}\n}\n",
            "tests/manual_test.cpp": "#include \"../src/manual_capture.hpp\"\n#include <cassert>\n#include <cstdio>\n#include <thread>\n#include <cstring>\nint main(){unsigned tests=0;\n {zk::CaptureGate g;assert(g.phase()==zk::CapturePhase::Idle);assert(!g.request()&&!g.arm());assert(g.begin());assert(!g.begin()&&!g.request());assert(g.arm());assert(!g.arm());assert(g.request());assert(!g.request());assert(g.wait(std::chrono::milliseconds(1)));g.finish();assert(g.phase()==zk::CapturePhase::Idle);++tests;}\n {zk::CaptureGate g;assert(g.begin()&&g.arm());assert(!g.wait(std::chrono::milliseconds(1)));g.finish();assert(g.begin());++tests;}\n {zk::CaptureGate g;assert(g.begin()&&g.arm());std::thread t([&]{g.request();});assert(g.wait(std::chrono::seconds(1)));t.join();g.finish();++tests;}\n {zk::CaptureGate g;assert(g.begin()&&g.arm());std::thread t([&]{g.finish();});assert(!g.wait(std::chrono::seconds(1)));t.join();++tests;}\n {zk::CaptureGate g;for(unsigned i=0;i<100;++i){assert(g.begin()&&g.arm()&&g.request());assert(g.wait(std::chrono::milliseconds(1)));g.finish();}++tests;}\n {assert(!std::strcmp(zk::capturePhaseLabel(0),\"still_baseline\"));assert(!std::strcmp(zk::capturePhaseLabel(4),\"still_baseline\"));assert(!std::strcmp(zk::capturePhaseLabel(5),\"move_forward\"));assert(!std::strcmp(zk::capturePhaseLabel(9),\"move_forward\"));assert(!std::strcmp(zk::capturePhaseLabel(10),\"still_after\"));assert(!std::strcmp(zk::capturePhaseLabel(15),\"still_after\"));++tests;}\n std::printf(\"PASS: %u manual capture state cases\\n\",tests);return 0;\n}\n",
            "src/targeted_local_position.hpp": "#pragma once\n#include \"targeted_camera.hpp\"\nnamespace zk {\nstruct LocalPosition {const char *status=\"not_checked\";int32_t controllerIndex=-1,pawnIndex=-1,rootIndex=-1;char pawnName[65]{},pawnClass[65]{};float position[3]{};};\ntemplate<class Read> LocalPosition readLocalPosition(const OwnershipTarget &target,InstanceReader<Read> &lookup){\n LocalPosition result;ObjectHead local{},controller{},pawn{},root{};char name[65]{},cls[65]{};\n if(!validateOuterNode(target.ptr,lookup,local,name,cls)||std::memcmp(&target.original,&local,sizeof(local))){result.status=\"local_player_validation_failed\";return result;}\n if(!std::strstr(cls,\"LocalPlayer\")){result.status=\"local_player_class_rejected\";return result;}\n uintptr_t c=0,p=0,r=0;\n if(!safeSpan(target.ptr,0x38)||!lookup.read(target.ptr+0x30,&c,8)||!candidatePointer(c)){result.status=\"local_controller_pointer_invalid\";return result;}\n if(!validateOuterNode(c,lookup,controller,name,cls)||!std::strstr(cls,\"PlayerController\")){result.status=\"local_controller_validation_failed\";return result;}\n result.controllerIndex=controller.index;\n if(!safeSpan(c,0x4c0)||!lookup.read(c+0x4b8,&p,8)||!candidatePointer(p)){result.status=\"controller_pawn_pointer_invalid\";return result;}\n if(!validateOuterNode(p,lookup,pawn,result.pawnName,result.pawnClass)){result.status=\"pawn_validation_failed\";return result;}\n result.pawnIndex=pawn.index;\n if(!std::strstr(result.pawnClass,\"Pawn\")&&!std::strstr(result.pawnClass,\"Character\")){result.status=\"pawn_class_name_rejected\";return result;}\n if(!safeSpan(p,0x210)||!lookup.read(p+0x208,&r,8)||!candidatePointer(r)){result.status=\"root_component_pointer_invalid\";return result;}\n if(!validateOuterNode(r,lookup,root,name,cls)||!std::strstr(cls,\"Component\")||root.outer!=p){result.status=\"root_component_validation_failed\";return result;}\n result.rootIndex=root.index;\n if(!safeSpan(r,0x22c)||!lookup.read(r+0x220,result.position,12)){result.status=\"position_read_failed\";return result;}\n for(float v:result.position)if(!std::isfinite(v)||std::fabs(v)>1e9f){result.status=\"position_numeric_validation_failed\";return result;}\n uintptr_t c2=0,p2=0,r2=0;ObjectHead l2{},controller2{},pawn2{},root2{};\n if(!lookup.read(target.ptr+0x30,&c2,8)||!lookup.read(c+0x4b8,&p2,8)||!lookup.read(p+0x208,&r2,8)||!lookup.read(target.ptr,&l2,sizeof(l2))||!lookup.read(c,&controller2,sizeof(controller2))||!lookup.read(p,&pawn2,sizeof(pawn2))||!lookup.read(r,&root2,sizeof(root2))){result.status=\"position_chain_final_read_failed\";return result;}\n if(c2!=c||p2!=p||r2!=r||std::memcmp(&local,&l2,sizeof(local))||std::memcmp(&controller,&controller2,sizeof(controller))||std::memcmp(&pawn,&pawn2,sizeof(pawn))||std::memcmp(&root,&root2,sizeof(root))){result.status=\"position_chain_changed_during_read\";return result;}\n result.status=\"local_pawn_root_position_candidate\";return result;\n}\n}\n",
            "tests/local_test.cpp": "#include \"../src/targeted_local_position.hpp\"\n#include <cassert>\n#include <cstdio>\n#include <vector>\n#include <limits>\nstruct LocalFixture {\n static constexpr uintptr_t base=0x10000,items=0x20000,names=0x30000,chunk=0x31000,entries=0x32000,objects=0x50000;\n std::vector<unsigned char> m=std::vector<unsigned char>(0x60000,0);size_t calls=0,failAt=0;unsigned linkReads=0;bool change=false;\n static uintptr_t object(unsigned i){return objects+i*0x1000;}\n template<class T>void put(uintptr_t a,T v){assert(a>=base&&a-base+sizeof(T)<=m.size());std::memcpy(m.data()+a-base,&v,sizeof(v));}\n LocalFixture(){const char* n[]={\"None\",\"Class\",\"LocalPlayer\",\"PlayerController\",\"PlayerPawn\",\"CapsuleComponent\",\"Instance\"};put<int32_t>(names+0x400,7);put<uintptr_t>(names,chunk);\n  for(unsigned i=0;i<7;++i){put<uintptr_t>(chunk+i*8,entries+i*128);std::strcpy((char*)m.data()+entries+i*128-base+12,n[i]);}\n  for(unsigned i=0;i<9;++i){zk::ObjectHead h{};h.vtable=0x40000;h.index=i;h.cls=object(i==0?0:i<=4?0:i-4);h.nameId=i==0?1:i<=4?i+1:6;h.outer=i==8?object(7):0;put(object(i),h);put<uintptr_t>(items+i*24,object(i));}\n  put<uintptr_t>(object(5)+0x30,object(6));put<uintptr_t>(object(6)+0x4b8,object(7));put<uintptr_t>(object(7)+0x208,object(8));put<float>(object(8)+0x220,100);put<float>(object(8)+0x224,200);put<float>(object(8)+0x228,300);\n }\n bool read(uintptr_t a,void*p,size_t n){++calls;if(calls==failAt)return false;if(a<base||a-base>m.size()||n>m.size()-(a-base))return false;if(change&&a==object(6)+0x4b8&&++linkReads==2)put<uintptr_t>(a,0);std::memcpy(p,m.data()+a-base,n);return true;}\n zk::OwnershipTarget target(){zk::OwnershipTarget t;t.ptr=object(5);std::memcpy(&t.original,m.data()+t.ptr-base,sizeof(t.original));return t;}\n};\nint main(){unsigned tests=0;\n for(unsigned mode=0;mode<6;++mode){LocalFixture f;\n  if(mode==1)f.put<uintptr_t>(LocalFixture::object(5)+0x30,0);\n  if(mode==2)f.put<uintptr_t>(LocalFixture::object(