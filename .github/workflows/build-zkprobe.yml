# Complete source snapshot; no dependency on uploaded companion files.
name: Build ZKProbe Level World
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Prepare complete source snapshot
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          sources=json.loads(r'''{
            "src/probe.mm": "#import <Foundation/Foundation.h>\n#import <UIKit/UIKit.h>\n#import <QuartzCore/QuartzCore.h>\n#import <dispatch/dispatch.h>\n#include \"dyld_util.hpp\"\n#include \"targeted_names.hpp\"\n#include \"targeted_objects.hpp\"\n#include \"targeted_instances.hpp\"\n#include \"targeted_ownership.hpp\"\n#include \"targeted_camera.hpp\"\n#include \"targeted_controller_camera.hpp\"\n#include \"targeted_local_position.hpp\"\n#include \"targeted_pawn_candidates.hpp\"\n#include <mutex>\n#include <memory>\n#include <cstdarg>\n#include \"manual_capture.hpp\"\nstatic zk::CaptureGate captureGate;\nstatic UIButton *captureButton=nil;\nextern \"C\" void zkProbe();\nstatic void refreshCaptureButton(){\n dispatch_async(dispatch_get_main_queue(),^{\n  switch(captureGate.phase()){\n   case zk::CapturePhase::Idle:[captureButton setTitle:@\"Probe \u00b7 Chu\u1ea9n b\u1ecb\" forState:UIControlStateNormal];captureButton.enabled=YES;break;\n   case zk::CapturePhase::Preparing:[captureButton setTitle:@\"\u0110ang chu\u1ea9n b\u1ecb\u2026\" forState:UIControlStateNormal];captureButton.enabled=NO;break;\n   case zk::CapturePhase::Ready:[captureButton setTitle:@\"S\u1eb5n s\u00e0ng \u00b7 \u0110o 16s\" forState:UIControlStateNormal];captureButton.enabled=YES;break;\n   case zk::CapturePhase::Measuring:[captureButton setTitle:@\"\u0110ang l\u1ea5y m\u1eabu\u2026\" forState:UIControlStateNormal];captureButton.enabled=NO;break;\n  }\n });\n}\nstatic void displayCapturePhase(unsigned tick){\n NSString *label=tick<5?@\"\u0110\u1ee9ng y\u00ean \u00b7 5s\":tick<10?@\"\u0110i th\u1eb3ng \u00b7 5s\":@\"D\u1eebng l\u1ea1i \u00b7 6s\";\n dispatch_async(dispatch_get_main_queue(),^{if(captureGate.phase()==zk::CapturePhase::Measuring)[captureButton setTitle:label forState:UIControlStateNormal];});\n}\n@interface ZKManualActions : NSObject\n- (void)tapped:(id)sender;\n@end\n@implementation ZKManualActions\n- (void)tapped:(id)sender {\n (void)sender;\n if(captureGate.phase()==zk::CapturePhase::Idle){\n  if(captureGate.begin()){refreshCaptureButton();dispatch_async(dispatch_get_global_queue(QOS_CLASS_UTILITY,0),^{zkProbe();});}\n }else if(captureGate.request())refreshCaptureButton();\n}\n@end\nstatic ZKManualActions *captureActions=nil;\nstatic void attachCaptureButton(unsigned attempt){\n if(captureButton.superview)return;\n UIWindow *window=nil;\n for(UIScene *scene in UIApplication.sharedApplication.connectedScenes){\n  if(![scene isKindOfClass:UIWindowScene.class]||scene.activationState!=UISceneActivationStateForegroundActive)continue;\n  for(UIWindow *candidate in ((UIWindowScene *)scene).windows){\n   if(candidate.hidden||!candidate.rootViewController||candidate.windowLevel!=UIWindowLevelNormal)continue;\n   if(!window||candidate.isKeyWindow)window=candidate;\n  }\n }\n if(!window){if(attempt<12)dispatch_after(dispatch_time(DISPATCH_TIME_NOW,10ull*NSEC_PER_SEC),dispatch_get_main_queue(),^{attachCaptureButton(attempt+1);});return;}\n if(!captureActions)captureActions=[ZKManualActions new];\n captureButton=[UIButton buttonWithType:UIButtonTypeSystem];\n captureButton.translatesAutoresizingMaskIntoConstraints=NO;\n captureButton.backgroundColor=[UIColor colorWithRed:0.05 green:0.17 blue:0.32 alpha:0.92];\n captureButton.layer.cornerRadius=8;\n captureButton.titleLabel.font=[UIFont systemFontOfSize:13 weight:UIFontWeightSemibold];\n [captureButton setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];\n [captureButton setTitleColor:UIColor.lightGrayColor forState:UIControlStateDisabled];\n captureButton.accessibilityLabel=@\"L\u1ea5y m\u1eabu camera ch\u1ea9n \u0111o\u00e1n\";\n [captureButton addTarget:captureActions action:@selector(tapped:) forControlEvents:UIControlEventTouchUpInside];\n [window addSubview:captureButton];\n [NSLayoutConstraint activateConstraints:@[\n  [captureButton.trailingAnchor constraintEqualToAnchor:window.safeAreaLayoutGuide.trailingAnchor constant:-8],\n  [captureButton.topAnchor constraintEqualToAnchor:window.safeAreaLayoutGuide.topAnchor constant:8],\n  [captureButton.widthAnchor constraintEqualToConstant:166],\n  [captureButton.heightAnchor constraintEqualToConstant:38]\n ]];\n refreshCaptureButton();\n}\n\nstatic FILE *logFile=nullptr;\nstatic std::mutex runLock;\nstatic void emit(const char *fmt,...) {\n if(!logFile)return;\n va_list a;va_start(a,fmt);vfprintf(logFile,fmt,a);va_end(a);fputc('\\n',logFile);fflush(logFile);\n}\nstatic bool expectedUUID(uintptr_t base) {\n const unsigned char expected[16]={0xbe,0xf9,0x0c,0x8f,0x5c,0xb6,0x3a,0x9c,0x81,0xc1,0x48,0x0e,0x7f,0xaf,0xaa,0xc4};\n const auto *mh=(const mach_header_64 *)base;\n if(!mh||mh->magic!=MH_MAGIC_64||mh->sizeofcmds>(1u<<20))return false;\n const unsigned char *p=(const unsigned char *)(mh+1),*end=p+mh->sizeofcmds;\n for(uint32_t k=0;k<mh->ncmds&&size_t(end-p)>=sizeof(load_command);++k) {\n  const auto *c=(const load_command *)p;\n  if(c->cmdsize<sizeof(*c)||c->cmdsize>size_t(end-p))return false;\n  if(c->cmd==LC_UUID && c->cmdsize>=sizeof(uuid_command))return !memcmp(((const uuid_command *)p)->uuid,expected,16);\n  p+=c->cmdsize;\n }\n return false;\n}\nstatic bool cameraCodeMatches(uintptr_t base){\n {const unsigned char expected[]={0x0,0x30,0x45,0xbd,0x1,0x34,0x45,0xbd,0x2,0x38,0x45,0xbd,0xc0,0x3,0x5f,0xd6};unsigned char actual[sizeof(expected)]{};if(base>UINTPTR_MAX-0x64db07c||!zk::rd(base+0x64db07c,actual,sizeof(actual))||memcmp(expected,actual,sizeof(actual)))return false;}\n {const unsigned char expected[]={0x0,0x48,0x45,0xbd,0x1,0x4c,0x45,0xbd,0x2,0x50,0x45,0xbd,0xc0,0x3,0x5f,0xd6};unsigned char actual[sizeof(expected)]{};if(base>UINTPTR_MAX-0x64db06c||!zk::rd(base+0x64db06c,actual,sizeof(actual))||memcmp(expected,actual,sizeof(actual)))return false;}\n {const unsigned char expected[]={0x0,0xcc,0x44,0xbd,0x8,0x20,0x20,0x1e,0x4c,0x0,0x0,0x54,0x0,0x54,0x45,0xbd,0xc0,0x3,0x5f,0xd6};unsigned char actual[sizeof(expected)]{};if(base>UINTPTR_MAX-0x64daff4||!zk::rd(base+0x64daff4,actual,sizeof(actual))||memcmp(expected,actual,sizeof(actual)))return false;}\n return true;\n}\nstatic bool controllerCameraCodeMatches(uintptr_t base){\n const unsigned char expected[]={0xfd,0x7b,0xbf,0xa9,0xfd,0x3,0x0,0x91,0xb5,0xff,0xff,0x97,0x40,0x0,0x0,0xb4,0x0,0xa4,0x42,0xf9,0xfd,0x7b,0xc1,0xa8,0xc0,0x3,0x5f,0xd6};unsigned char actual[sizeof(expected)]{};\n return base<=UINTPTR_MAX-0x0627a8c0 && zk::rd(base+0x0627a8c0,actual,sizeof(actual))&&!memcmp(expected,actual,sizeof(actual));\n}\nstatic bool localPositionCodeMatches(uintptr_t base){\n {const unsigned char expected[]={0x60,0x5e,0x42,0xf9};unsigned char actual[sizeof(expected)]{};if(base>UINTPTR_MAX-0x61df868||!zk::rd(base+0x61df868,actual,sizeof(actual))||memcmp(expected,actual,sizeof(actual)))return false;}\n {const unsigned char expected[]={0x88,0x6,0x41,0xf9,0x88,0x0,0x0,0xb4,0x0,0x89,0xc0,0x3d,0x2,0x4,0x14,0x5e,0x5,0x0,0x0,0x14};unsigned char actual[sizeof(expected)]{};if(base>UINTPTR_MAX-0x67032a4||!zk::rd(base+0x67032a4,actual,sizeof(actual))||memcmp(expected,actual,sizeof(actual)))return false;}\n return true;\n}\nstatic bool levelWorldCodeMatches(uintptr_t base){\n const unsigned char expected[]={0x0,0x60,0x40,0xf9,0xc0,0x3,0x5f,0xd6};unsigned char actual[sizeof(expected)]{};\n return base<=UINTPTR_MAX-0x063362a8&&zk::rd(base+0x063362a8,actual,sizeof(actual))&&!memcmp(expected,actual,sizeof(actual));\n}\nextern \"C\" void zkProbe() {\n std::unique_lock<std::mutex> lock(runLock,std::try_to_lock);if(!lock.owns_lock())return;\n if(captureGate.phase()==zk::CapturePhase::Idle&&!captureGate.begin())return;\n struct FinishCapture {~FinishCapture(){captureGate.finish();refreshCaptureButton();}} finishCapture;\n @autoreleasepool {\n  NSString *docs=NSSearchPathForDirectoriesInDomains(NSDocumentDirectory,NSUserDomainMask,YES).firstObject;\n  NSString *path=[docs stringByAppendingPathComponent:@\"zkprobe-instances-v16.txt\"];\n  logFile=fopen(path.UTF8String,\"a\");if(!logFile)return;\n  struct Close {~Close(){fclose(logFile);logFile=nullptr;}} close;\n  emit(\"[session] instances-v16 time=%s\",[NSDate.date.description UTF8String]);\n  emit(\"[mode] manual_start=1 manual_sample_wait_seconds=90 max_sample_attempts=4 retry_pause_seconds=5; bounded object-list enumeration; NO region scan; NO game function calls\");\n  uintptr_t base=zk::mainBase();\n  if(!expectedUUID(base)){emit(\"[stop] executable UUID mismatch; no candidate reads\");return;}\n  emit(\"[uuid] match bef90c8f5cb63a9c81c1480e7fafaac4\");\n  constexpr uintptr_t wrapperRVA=0x0a446b20;\n  if(base>UINTPTR_MAX-wrapperRVA){emit(\"[stop] address overflow\");return;}\n  zk::resetScanBudget();\n  emit(\"[stage] wrapper begin\");\n  auto result=zk::checkTargetedNames(base+wrapperRVA,[](uintptr_t a,void *p,size_t n){return zk::rd(a,p,n);});\n  emit(\"[result] status=%s depth=%u decoded=%u\",result.status,result.chainDepth,result.decoded);\n  for(unsigned i=0;i<result.decoded;++i)emit(\"[name] id=%u text=%s\",i,result.names[i]);\n  if(result.decoded==16 && !std::strcmp(result.status,\"candidate_decoded_16_names_NOT_runtime_verified\")) {\n   emit(\"[stage] objects begin\");\n   constexpr uintptr_t objectArrayRVA=0x0a692d18;\n   if(base<=UINTPTR_MAX-objectArrayRVA) {\n    auto objects=zk::retryObjects(base+objectArrayRVA,result.table,\n     [](uintptr_t a,void*p,size_t n){return zk::rd(a,p,n);},\n     []{emit(\"[retry] waiting 5 seconds before next sample\");std::this_thread::sleep_for(std::chrono::seconds(5));},\n     [](unsigned attempt,const zk::ObjectResult &r){\n      emit(\"[sample-attempt] number=%u status=%s valid=%u final_header_read=%d items_changed=%d capacity_changed=%d count_changed=%d count_before=%d count_after=%d capacity_before=%d capacity_after=%d\",attempt,r.status,r.valid,r.afterRead?1:0,r.afterRead?int(bool(r.headerChanges&1)):-1,r.afterRead?int(bool(r.headerChanges&2)):-1,r.afterRead?int(bool(r.headerChanges&4)):-1,r.before.count,r.after.count,r.before.capacity,r.after.capacity);\n     });\n    emit(\"[objects] status=%s count=%d capacity=%d valid=%u stable=%d\",objects.status,objects.count,objects.capacity,objects.valid,objects.stable?1:0);\n    if(objects.valid>=4 && objects.stable) {\n     unsigned char initial[16]{};uintptr_t items=0;\n     if(zk::rd(base+objectArrayRVA+16,initial,16)) {\n      std::memcpy(&items,initial,8);\n      auto rd=[](uintptr_t a,void*p,size_t n){return zk::rd(a,p,n);};\n      auto reader=std::make_unique<zk::InstanceReader<decltype(rd)>>(rd,items,objects.count,result.table);\n      const auto fixed=objects.after;\n      auto previous=zk::ArraySnapshot::decode(initial);\n      emit(\"[initial-header] policy=%s fixed_count=%d current_count=%d\",zk::snapshotPolicy(fixed,fixed,previous),fixed.count,previous.count);\n      if(zk::snapshotAccepted(fixed,fixed,previous) && reader->names.init()) {\n       emit(\"[stage] instances begin; slots=%d group=256 pause_ms=20 log_caps=per_group\",objects.count);\n       const auto sessionStart=std::chrono::steady_clock::now();\n       for(unsigned page=0;page<8 && reader->stats.next<uint32_t(objects.count);++page) {\n        if(std::chrono::steady_clock::now()-sessionStart>=std::chrono::seconds(240)){emit(\"[stop] total elapsed limit\");break;}\n        // Revalidate this process's table before every slice; never reuse a saved pointer across launches.\n        zk::resetScanBudget();\n        unsigned char current[16]{};\n        const bool pageHeaderRead=zk::rd(base+objectArrayRVA+16,current,16);\n        if(!pageHeaderRead){emit(\"[stop] page header unreadable\");break;}\n        const auto now=zk::ArraySnapshot::decode(current);\n        const char *policy=zk::snapshotPolicy(fixed,previous,now);\n        emit(\"[page-header] policy=%s fixed_count=%d previous_count=%d current_count=%d items_changed=%d capacity_changed=%d\",policy,fixed.count,previous.count,now.count,int(now.items!=fixed.items),int(now.capacity!=fixed.capacity));\n        if(!zk::snapshotAccepted(fixed,previous,now)){emit(\"[stop] snapshot policy rejected\");break;}\n        previous=now;\n        const uint32_t begin=reader->stats.next;\n        const uint32_t stop=begin+std::min<uint32_t>(65536,uint32_t(objects.count)-begin);\n        while(zk::budgetTimeOK() && reader->stats.next<stop && std::chrono::steady_clock::now()-sessionStart<std::chrono::seconds(240)) {\n         const uint32_t before=reader->stats.next;\n         const bool more=reader->batch([](uint32_t index,const char *name,const char *cls,uint32_t number){emit(\"[instance] group=%s index=%u name=%s number=%u class=%s\",zk::groupLabel(unsigned(zk::candidateGroup(cls))),index,name,number,cls);});\n         if(!more || reader->stats.next==before)break;\n         std::this_thread::sleep_for(std::chrono::milliseconds(20));\n        }\n        const auto &budget=zk::scanBudget();\n        emit(\"[page] number=%u begin=%u next=%u bytes=%llu calls=%llu failures=%llu limit=%s\",page+1,begin,reader->stats.next,(unsigned long long)budget.readBytes,(unsigned long long)budget.readCalls,(unsigned long long)budget.readFailures,budget.reason);\n        if(budget.readFailures || reader->stats.next==begin){emit(\"[stop] failed read or no progress\");break;}\n        if(reader->stats.next<uint32_t(objects.count))std::this_thread::sleep_for(std::chrono::seconds(1));\n       }\n       for(unsigned i=0;i<zk::groupCount;++i)emit(\"[group-summary] group=%s matched=%u logged=%u omitted=%u\",zk::groupLabel(i),reader->groupOutput.matched[i],reader->groupOutput.logged[i],reader->groupOutput.matched[i]-reader->groupOutput.logged[i]);\n       for(unsigned i=0;i<reader->sampleCount;++i)emit(\"[class-sample] name=%s\",reader->classSamples[i]);\n       // A separate, bounded validation read distinguishes unreadable from changed.\n       zk::resetScanBudget();\n       unsigned char end[16]{};bool headerRead=zk::rd(base+objectArrayRVA+16,end,16);\n       int headerStable=headerRead?(!memcmp(initial,end,16)?1:0):-1;\n       emit(\"[final-header] policy=%s fixed_count=%d current_count=%d\",headerRead?zk::snapshotPolicy(fixed,previous,zk::ArraySnapshot::decode(end)):\"unreadable\",fixed.count,headerRead?zk::ArraySnapshot::decode(end).count:-1);\n       const auto &v=reader->stats;\n       emit(\"[coverage] examined_to=%u snapshot_count=%d objects=%u class_definitions=%u defaults_skipped=%u matches=%u failed=%u complete=%d header_stable=%d\",v.next,objects.count,v.objects,v.classes,v.defaults,v.matches,v.failed,v.next==uint32_t(objects.count)?1:0,headerStable);\n       emit(\"[note] name-based candidate groups only; group labels do NOT verify active world/controller/camera; fixed snapshot slots only; later additions omitted; unchanged header does not prove immutable slots; camera values, player positions and active-world relations NOT checked\");\n       // Separate bounded ownership pass. Outer is ownership, not an active-world selector.\n       zk::resetScanBudget();\n       size_t relationBytes=0,relationCalls=0;const char *relationLimit=\"none\";\n       const auto relationStart=std::chrono::steady_clock::now();\n       auto relationRead=[&](uintptr_t addr,void*out,size_t n){\n        if(std::chrono::steady_clock::now()-relationStart>=std::chrono::seconds(10)){relationLimit=\"elapsed_limit\";return false;}\n        if(n>(512u<<10)-relationBytes||relationCalls>=4096){relationLimit=\"read_limit\";return false;}\n        relationBytes+=n;++relationCalls;return zk::rd(addr,out,n);\n       };\n       unsigned char relationHeader[16]{};\n       if(relationRead(base+objectArrayRVA+16,relationHeader,16)&&zk::snapshotAccepted(fixed,previous,zk::ArraySnapshot::decode(relationHeader))){\n        auto lookup=std::make_unique<zk::InstanceReader<decltype(relationRead)>>(relationRead,items,objects.count,result.table);\n        if(lookup->names.init()){\n         for(unsigned g=0;g<7;++g){\n          emit(\"[ownership-targets] group=%s saved=%u omitted=%u\",zk::groupLabel(g),reader->targets.used[g],reader->groupOutput.matched[g]-reader->targets.used[g]);