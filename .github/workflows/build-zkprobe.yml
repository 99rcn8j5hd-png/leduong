# Self-contained source snapshot; no dependency on uploaded companion files.
# Revision targeted-v2: isolated test fixtures + bounded cycle rejection.
name: Build ZKProbe Targeted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Prepare complete source snapshot
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          sources = json.loads(r'''{
            "src/probe.mm": "#import <Foundation/Foundation.h>\n#import <dispatch/dispatch.h>\n#include \"dyld_util.hpp\"\n#include \"targeted_names.hpp\"\n#include <mutex>\n#include <cstdarg>\nstatic FILE *logFile=nullptr;\nstatic std::mutex runLock;\nstatic void emit(const char *fmt,...) {\n if(!logFile)return;\n va_list a;va_start(a,fmt);vfprintf(logFile,fmt,a);va_end(a);fputc('\\n',logFile);fflush(logFile);\n}\nstatic bool expectedUUID(uintptr_t base) {\n const unsigned char expected[16]={0xbe,0xf9,0x0c,0x8f,0x5c,0xb6,0x3a,0x9c,0x81,0xc1,0x48,0x0e,0x7f,0xaf,0xaa,0xc4};\n const auto *mh=(const mach_header_64 *)base;\n if(!mh||mh->magic!=MH_MAGIC_64||mh->sizeofcmds>(1u<<20))return false;\n const unsigned char *p=(const unsigned char *)(mh+1),*end=p+mh->sizeofcmds;\n for(uint32_t k=0;k<mh->ncmds&&size_t(end-p)>=sizeof(load_command);++k) {\n  const auto *c=(const load_command *)p;\n  if(c->cmdsize<sizeof(*c)||c->cmdsize>size_t(end-p))return false;\n  if(c->cmd==LC_UUID && c->cmdsize>=sizeof(uuid_command))return !memcmp(((const uuid_command *)p)->uuid,expected,16);\n  p+=c->cmdsize;\n }\n return false;\n}\nextern \"C\" void zkProbe() {\n std::unique_lock<std::mutex> lock(runLock,std::try_to_lock);if(!lock.owns_lock())return;\n @autoreleasepool {\n  NSString *docs=NSSearchPathForDirectoriesInDomains(NSDocumentDirectory,NSUserDomainMask,YES).firstObject;\n  NSString *path=[docs stringByAppendingPathComponent:@\"zkprobe-targeted.txt\"];\n  logFile=fopen(path.UTF8String,\"a\");if(!logFile)return;\n  struct Close {~Close(){fclose(logFile);logFile=nullptr;}} close;\n  emit(\"[session] targeted-v2 time=%s\",[NSDate.date.description UTF8String]);\n  emit(\"[mode] bounded candidate reads; NO memory scan; NO game function calls\");\n  uintptr_t base=zk::mainBase();\n  if(!expectedUUID(base)){emit(\"[stop] executable UUID mismatch; no candidate reads\");return;}\n  emit(\"[uuid] match bef90c8f5cb63a9c81c1480e7fafaac4\");\n  constexpr uintptr_t wrapperRVA=0x0a446b20;\n  if(base>UINTPTR_MAX-wrapperRVA){emit(\"[stop] address overflow\");return;}\n  zk::resetScanBudget();\n  emit(\"[stage] wrapper begin\");\n  auto result=zk::checkTargetedNames(base+wrapperRVA,[](uintptr_t a,void *p,size_t n){return zk::rd(a,p,n);});\n  emit(\"[result] status=%s depth=%u decoded=%u\",result.status,result.chainDepth,result.decoded);\n  for(unsigned i=0;i<result.decoded;++i)emit(\"[name] id=%u text=%s\",i,result.names[i]);\n  const auto &b=zk::scanBudget();\n  emit(\"[reads] bytes=%llu calls=%llu failures=%llu limit=%s\",(unsigned long long)b.readBytes,(unsigned long long)b.readCalls,(unsigned long long)b.readFailures,b.reason);\n  emit(\"[stage] complete; candidate only; do not copy to offsets.plist\");\n }\n}\n__attribute__((constructor)) static void start() {\n dispatch_after(dispatch_time(DISPATCH_TIME_NOW,12ull*NSEC_PER_SEC),dispatch_get_global_queue(QOS_CLASS_UTILITY,0),^{zkProbe();});\n}\n",
            "src/dyld_util.hpp": "// dyld_util.hpp \u2014 doc memory an toan + liet ke vung nho + base/range cua main image\n#pragma once\n\n#include <mach/mach.h>\n#include <mach/vm_region.h>\n#include <mach-o/dyld.h>\n#include <mach-o/loader.h>\n#include <stdint.h>\n#include <stdio.h>\n#include <string.h>\n#include <string>\n#include <vector>\n#include <algorithm>\n#include <chrono>\n#include <thread>\n#include \"scan_budget.hpp\"\n\nnamespace zk {\n\n// ---------- read an toan (khong crash khi dia chi rac) ----------\ninline bool rd(uintptr_t addr, void *out, size_t n) {\n    if (!addr || !out || !n || n > UINTPTR_MAX-addr) return false;\n    if (!allowRead(n)) return false;\n    vm_size_t got = 0;\n    kern_return_t kr = vm_read_overwrite(mach_task_self(), (vm_address_t)addr,\n                                         (vm_size_t)n, (vm_address_t)out, &got);\n    bool ok = kr == KERN_SUCCESS && got == n;\n    if (!ok) ++scanBudget().readFailures;\n    return ok;\n}\n\ntemplate <class T> inline T rdv(uintptr_t addr) {\n    T v;\n    memset(&v, 0, sizeof(T));\n    rd(addr, &v, sizeof(T));\n    return v;\n}\n\n// ---------- vung nho ----------\nstruct Region {\n    uintptr_t start;\n    uintptr_t end;\n    bool writable;\n};\n\ninline std::vector<Region>& regionCache() { static std::vector<Region> cache; return cache; }\ninline void refreshRegions() { regionCache().clear(); }\ninline const std::vector<Region> &allRegions() {\n    auto &cache=regionCache();\n    if (!cache.empty()) return cache;\n\n    vm_address_t addr = 0;\n    size_t visited=0;\n    while (visited++ < 8000 && budgetTimeOK()) {\n        vm_size_t size = 0;\n        vm_region_basic_info_data_64_t info;\n        mach_msg_type_number_t cnt = VM_REGION_BASIC_INFO_COUNT_64;\n        mach_port_t obj = MACH_PORT_NULL;\n\n        kern_return_t kr = vm_region_64(mach_task_self(), &addr, &size,\n                                        VM_REGION_BASIC_INFO_64,\n                                        (vm_region_info_t)&info, &cnt, &obj);\n        if (obj != MACH_PORT_NULL) mach_port_deallocate(mach_task_self(),obj);\n        if (kr != KERN_SUCCESS || size == 0 || size > UINTPTR_MAX-addr) break;\n\n        if (info.protection & VM_PROT_READ) {\n            Region r;\n            r.start = (uintptr_t)addr;\n            r.end = (uintptr_t)(addr + size);\n            r.writable = (info.protection & VM_PROT_WRITE) != 0;\n            cache.push_back(r);\n        }\n        addr += size;\n        if (cache.size() > 8000) break;\n    }\n    std::sort(cache.begin(), cache.end(),\n              [](const Region &a, const Region &b) { return a.start < b.start; });\n    return cache;\n}\n\ninline bool inReadableRegion(uintptr_t a) {\n    const std::vector<Region> &rs = allRegions();\n    size_t lo = 0, hi = rs.size();\n    while (lo < hi) {\n        size_t mid = (lo + hi) / 2;\n        if (rs[mid].end <= a) lo = mid + 1;\n        else hi = mid;\n    }\n    return lo < rs.size() && rs[lo].start <= a;\n}\n\n// ---------- range that cua tung image ----------\nstruct ImgRange {\n    uintptr_t base = 0;\n    uintptr_t end = 0;\n    const char *path = nullptr;\n};\n\ninline bool imageRange(uint32_t idx, ImgRange &rg) {\n    const struct mach_header_64 *mh =\n        (const struct mach_header_64 *)_dyld_get_image_header(idx);\n    if (!mh || mh->magic != MH_MAGIC_64) return false;\n\n    intptr_t slide = _dyld_get_image_vmaddr_slide(idx);\n    uintptr_t minA = UINTPTR_MAX, maxA = 0;\n\n    const uint8_t *p = (const uint8_t *)mh + sizeof(struct mach_header_64);\n    for (uint32_t c = 0; c < mh->ncmds; c++) {\n        const struct load_command *lc = (const struct load_command *)p;\n        if (lc->cmdsize < sizeof(struct load_command)) break;\n        if (lc->cmd == LC_SEGMENT_64) {\n            const struct segment_command_64 *sg = (const struct segment_command_64 *)lc;\n            if (sg->initprot == VM_PROT_NONE || sg->filesize==0) { p += lc->cmdsize; continue; }\n            uintptr_t s = (uintptr_t)slide + (uintptr_t)sg->vmaddr;\n            uintptr_t e = s + (uintptr_t)sg->vmsize;\n            if (s < minA) minA = s;\n            if (e > maxA) maxA = e;\n        }\n        p += lc->cmdsize;\n    }\n    if (maxA <= minA) return false;\n    rg.base = (uintptr_t)mh;\n    rg.end = maxA;\n    rg.path = _dyld_get_image_name(idx);\n    return true;\n}\n\ninline bool imageRangeContaining(uintptr_t addr, ImgRange &out) {\n    for (uint32_t i=0;i<_dyld_image_count();i++) {\n        const auto *mh=(const mach_header_64 *)_dyld_get_image_header(i);\n        if (!mh || mh->magic!=MH_MAGIC_64) continue;\n        const uint8_t *p=(const uint8_t *)mh+sizeof(*mh);\n        const uint8_t *end=p+mh->sizeofcmds;\n        intptr_t slide=_dyld_get_image_vmaddr_slide(i);\n        for (uint32_t c=0;c<mh->ncmds && p+sizeof(load_command)<=end;c++) {\n            const auto *lc=(const load_command *)p;\n            if (lc->cmdsize<sizeof(*lc) || (size_t)(end-p)<lc->cmdsize) break;\n            if (lc->cmd==LC_SEGMENT_64 && lc->cmdsize>=sizeof(segment_command_64)) {\n                const auto *sg=(const segment_command_64 *)p;\n                if (sg->initprot!=VM_PROT_NONE && sg->vmsize) {\n                    uintptr_t start=(uintptr_t)sg->vmaddr+slide;\n                    if (addr>=start && addr-start<sg->vmsize) {\n                        out.base=(uintptr_t)mh; out.end=start+sg->vmsize;\n                        out.path=_dyld_get_image_name(i); return true;\n                    }\n                }\n            }\n            p+=lc->cmdsize;\n        }\n    }\n    return false;\n}\n\n// ---------- base cua main executable (ShadowTrackerExtra) ----------\ninline uintptr_t mainBase() {\n    for (uint32_t i=0;i<_dyld_image_count();i++) {\n        const auto *mh=_dyld_get_image_header(i);\n        if (mh && mh->filetype==MH_EXECUTE) return (uintptr_t)mh;\n    }\n    return 0;\n}\n\ninline const char *imageNameContaining(uintptr_t addr) {\n    ImgRange r;\n    if (imageRangeContaining(addr, r) && r.path) return r.path;\n    return \"heap/other\";\n}\n\ninline bool belongsToMainImage(uintptr_t addr) {\n    ImgRange r;\n    if (!imageRangeContaining(addr, r)) return false;\n    return r.base == mainBase();\n}\n\n// ---------- quet vung RW theo tung khoi (tranh cap phat GB) ----------\nconst size_t kScanStep = 64u << 10; // 64 KB per read; bounded buffers\n\ntemplate <class F> void scanWritable(F cb) {\n    const std::vector<Region> &regs = allRegions();\n    std::vector<unsigned char> buf(kScanStep + 16);\n    for (size_t ri = 0; ri < regs.size(); ri++) {\n        const Region &r = regs[ri];\n        if (!r.writable) continue;\n        for (uintptr_t a = r.start; a < r.end; a += kScanStep) {\n            size_t want = (size_t)std::min<uintptr_t>(kScanStep, r.end - a);\n            if (want < 8) break;\n            if (!allowScan(want)) return;\n            if (!rd(a, buf.data(), want)) continue;\n            cb(a, buf.data(), want);\n            std::this_thread::sleep_for(std::chrono::milliseconds(2));\n        }\n    }\n}\n\n// quet chi trong cac vung writable cua mot image (vd: __DATA cua main binary)\ntemplate <class F> void scanImageData(uintptr_t imgBase, F cb) {\n    const std::vector<Region> &regs = allRegions();\n    std::vector<unsigned char> buf(kScanStep + 16);\n    for (size_t ri = 0; ri < regs.size(); ri++) {\n        const Region &r = regs[ri];\n        if (!r.writable) continue;\n\n        ImgRange ir;\n        if (!imageRangeContaining(r.start, ir) || ir.base != imgBase) continue;\n\n        for (uintptr_t a = r.start; a < r.end; a += kScanStep) {\n            size_t want = (size_t)std::min<uintptr_t>(kScanStep, r.end - a);\n            if (want < 8) break;\n            if (!allowScan(want)) return;\n            if (!rd(a, buf.data(), want)) continue;\n            cb(a, buf.data(), want);\n            std::this_thread::sleep_for(std::chrono::milliseconds(2));\n        }\n    }\n}\n\n} // namespace zk\n",
            "src/scan_budget.hpp": "#pragma once\n#include <cstddef>\n#include <chrono>\nnamespace zk {\nstruct ScanBudget {\n    size_t bytes=0, readBytes=0, readCalls=0, readFailures=0;\n    bool exhausted=false;\n    const char *reason=\"none\";\n    std::chrono::steady_clock::time_point start=std::chrono::steady_clock::now();\n};\ninline ScanBudget& scanBudget() { static ScanBudget state; return state; }\ninline void resetScanBudget() { scanBudget()=ScanBudget{}; }\ninline bool budgetTimeOK() {\n    auto &b=scanBudget();\n    if(b.exhausted) return false;\n    if(std::chrono::steady_clock::now()-b.start>=std::chrono::seconds(2)) {\n        b.exhausted=true; b.reason=\"elapsed_limit\"; return false;\n    }\n    return true;\n}\ninline bool allowRead(size_t n) {\n    auto &b=scanBudget();\n    if(!budgetTimeOK()) return false;\n    constexpr size_t limit=4096u;\n    if(n>limit-b.readBytes || b.readCalls>=128) {\n        b.exhausted=true; b.reason=\"read_limit\"; return false;\n    }\n    b.readBytes+=n; ++b.readCalls; return true;\n}\ninline bool allowScan(size_t n) {\n    if(!budgetTimeOK()) return false;\n    scanBudget().bytes+=n; return true;\n}\n}\n",
            "src/targeted_names.hpp": "#pragma once\n#include <cstdint>\n#include <cstddef>\n#include <cstring>\nnamespace zk {\nstatic_assert(sizeof(uintptr_t)==8,\"64-bit pointers required\");\nstruct TargetedResult {\n const char *status=\"not_checked\";\n uint32_t chainDepth=0;\n uintptr_t table=0;\n unsigned decoded=0;\n char names[16][65]{};\n};\ninline bool candidatePointer(uintptr_t p) { return p>=0x10000 && (p&7)==0 && p<=UINTPTR_MAX-128; }\n// Model inferred from one executable; read callback must have its own hard read budget.\ntemplate<class Read> TargetedResult checkTargetedNames(uintptr_t wrapper, Read read) {\n TargetedResult r;\n if(!candidatePointer(wrapper)) { r.status=\"bad_wrapper_address\"; return r; }\n unsigned char h[16]{};\n if(!read(wrapper,h,sizeof(h))) { r.status=\"wrapper_read_failed\"; return r; }\n uint32_t tag; uintptr_t p;\n std::memcpy(&tag,h,4); std::memcpy(&p,h+8,8);\n if(!(h[4]&1)) { r.status=\"wrapper_not_initialized\"; return r; }\n if(tag<103 || tag>148 || (tag-100)%3) { r.status=\"unexpected_chain_tag\"; return r; }\n r.chainDepth=(tag-100)/3;\n if(!candidatePointer(p)) { r.status=\"invalid_chain_pointer\"; return r; }\n uintptr_t seen[16]{}; seen[0]=p;\n for(uint32_t j=1;j<r.chainDepth;++j) {\n  uintptr_t next=0;\n  if(!read(p,&next,8) || !candidatePointer(next)) { r.status=\"chain_read_failed\"; return r; }\n  for(uint32_t k=0;k<j;++k)if(next==seen[k]) { r.status=\"chain_cycle\"; return r; }\n  seen[j]=next; p=next;\n }\n uintptr_t table=0;\n if(!read(p,&table,8) || !candidatePointer(table)) { r.status=\"table_read_failed\"; return r; }\n r.table=table;\n uintptr_t chunk=0;\n if(!read(table,&chunk,8) || !candidatePointer(chunk)) { r.status=\"chunk0_read_failed\"; return r; }\n for(unsigned id=0;id<16;++id) {\n  uintptr_t entry=0;\n  if(!read(chunk+id*8,&entry,8) || !candidatePointer(entry)) { r.status=\"entry_read_failed\"; return r; }\n  uint32_t flags=0;\n  if(!read(entry+8,&flags,4)) { r.status=\"entry_flags_read_failed\"; return r; }\n  if(flags&1) { r.status=\"wide_entry_not_supported\"; return r; }\n  unsigned char text[64]{};\n  if(!read(entry+12,text,sizeof(text))) { r.status=\"entry_text_read_failed\"; return r; }\n  size_t n=0;\n  for(;n<sizeof(text)&&text[n];++n) {\n   if(text[n]<32||text[n]>126) { r.status=\"non_ascii_name\"; return r; }\n  }\n  if(!n||n==sizeof(text)) { r.status=\"missing_name_terminator\"; return r; }\n  std::memcpy(r.names[id],text,n); ++r.decoded;\n  if(id==0 && std::strcmp(r.names[0],\"None\")) { r.status=\"entry0_not_None\"; return r; }\n }\n r.status=\"candidate_decoded_16_names_NOT_runtime_verified\";\n return r;\n}\n}\n",
            "tests/targeted_test.cpp": "#include \"../src/targeted_names.hpp\"\n#include \"../src/scan_budget.hpp\"\n#include <cassert>\n#include <vector>\n#include <cstring>\n#include <cstdio>\nstruct Fixture {\n static constexpr uintptr_t base=0x10000,table=0x12000,chunk=0x13000,entry=0x14000;\n std::vector<unsigned char> m=std::vector<unsigned char>(0x20000,0);\n size_t bytes=0,calls=0,failAt=0;\n template<class T> void put(uintptr_t a,T value){assert(a>=base && a-base+sizeof(T)<=m.size());std::memcpy(m.data()+a-base,&value,sizeof(T));}\n Fixture(unsigned depth=1){\n  put<uint32_t>(base,100+depth*3);m[4]=1;put<uintptr_t>(base+8,0x11000);\n  for(unsigned i=0;i<depth;++i)put<uintptr_t>(0x11000+i*8,i+1==depth?table:0x11000+(i+1)*8);\n  put<uintptr_t>(table,chunk);\n  for(unsigned i=0;i<16;++i){put<uintptr_t>(chunk+i*8,entry+i*128);std::strcpy((char*)m.data()+entry+i*128-base+12,i?\"TestName\":\"None\");}\n }\n bool read(uintptr_t a,void *p,size_t n){\n  ++calls;bytes+=n;if(calls==failAt)return false;\n  if(a<base || a-base>m.size() || n>m.size()-(a-base))return false;\n  std::memcpy(p,m.data()+a-base,n);return true;\n }\n zk::TargetedResult run(){return zk::checkTargetedNames(base,[&](uintptr_t a,void*p,size_t n){return read(a,p,n);});}\n};\nint main(){\n unsigned count=0;\n auto status=[&](Fixture &f,const char *expected){auto r=f.run();if(std::strcmp(r.status,expected))std::fprintf(stderr,\"expected=%s actual=%s\\n\",expected,r.status);assert(!std::strcmp(r.status,expected));assert(f.bytes<=4096 && f.calls<=128);++count;};\n for(unsigned depth=1;depth<=16;++depth){Fixture f(depth);auto r=f.run();assert(r.decoded==16 && r.chainDepth==depth && !std::strcmp(r.names[0],\"None\"));assert(f.bytes<=4096 && f.calls<=128);++count;}\n {Fixture f;f.m[4]=0;status(f,\"wrapper_not_initialized\");}\n for(uint32_t tag:{0u,100u,102u,104u,149u,0xffffffffu}){Fixture f;f.put<uint32_t>(Fixture::base,tag);status(f,\"unexpected_chain_tag\");}\n {Fixture f;f.put<uintptr_t>(Fixture::base+8,1);status(f,\"invalid_chain_pointer\");}\n {Fixture f(16);f.put<uintptr_t>(0x11000,0x11000);status(f,\"chain_cycle\");}\n {Fixture f;f.m[Fixture::entry-Fixture::base+12]='X';status(f,\"entry0_not_None\");}\n {Fixture f;f.put<uint32_t>(Fixture::entry+8,1);status(f,\"wide_entry_not_supported\");}\n {Fixture f;f.m[Fixture::entry-Fixture::base+12]=0x80;status(f,\"non_ascii_name\");}\n {Fixture f;std::memset(f.m.data()+Fixture::entry-Fixture::base+12,'A',64);status(f,\"missing_name_terminator\");}\n {Fixture f;f.m[Fixture::entry-Fixture::base+12]=0;status(f,\"missing_name_terminator\");}\n for(size_t i=1;i<=51;++i){Fixture f;f.failAt=i;auto r=f.run();assert(std::strcmp(r.status,\"candidate_decoded_16_names_NOT_runtime_verified\"));assert(f.calls==i);++count;}\n zk::resetScanBudget();assert(zk::allowRead(4096));assert(!zk::allowRead(1));++count;\n zk::resetScanBudget();for(int i=0;i<128;++i)assert(zk::allowRead(1));assert(!zk::allowRead(1));++count;\n zk::resetScanBudget();zk::scanBudget().start-=std::chrono::seconds(3);assert(!zk::allowRead(1));++count;\n std::printf(\"PASS: %u bounded-reader and budget cases\\n\",count);\n}\n",
            "build.sh": "#!/bin/bash\nset -euo pipefail\ncd \"$(dirname \"$0\")\"\nmkdir -p build artifacts\nSDK=$(xcrun --sdk iphoneos --show-sdk-path)\nfor arch in arm64 arm64e; do\n  mkdir -p \"build/$arch\"\n  xcrun clang++ -isysroot \"$SDK\" -arch \"$arch\" -miphoneos-version-min=15.0 -std=c++17 -O2 -fobjc-arc -Isrc -c src/probe.mm -o \"build/$arch/probe.o\"\n  xcrun clang++ -isysroot \"$SDK\" -arch \"$arch\" -miphoneos-version-min=15.0 -dynamiclib \"build/$arch/probe.o\" -framework Foundation -framework UIKit -Wl,-install_name,@rpath/ZKProbe.dylib -o \"build/$arch/ZKProbe.dylib\"\ndone\nxcrun lipo -create build/arm64/ZKProbe.dylib build/arm64e/ZKProbe.dylib -output artifacts/ZKProbe.dylib\nldid -S artifacts/ZKProbe.dylib\nxcrun lipo -info artifacts/ZKProbe.dylib\nshasum -a 256 artifacts/ZKProbe.dylib > artifacts/SHA256.txt\n"
          }''')
          expected = {'src/probe.mm': 'dc6fae00701ed679f638b198d44d0ea5a4d1f068b61a4f8f6336ce2cbe2e4ea1', 'src/dyld_util.hpp': '7043756f5e92103ba4f638ba50c59eeff069877db29f74e198827cb8f4a8a564', 'src/scan_budget.hpp': 'fbc13051e3cbfaa6cffa39de5dc668b4fe5fdecf156f16ee04fbec4568954927', 'src/targeted_names.hpp': 'd744c765b34cb9f2ffdcc2a5e982de2a4f7d7cd2692011e926f0e0ac2438ce97', 'tests/targeted_test.cpp': '4a3a5ed5182fe5c6674545b7709641187c79b4aae351e74f9c0c8c9510834052', 'build.sh': 'a37e4eb71f13d5fe5f46dc0ff3613a47dd1013dff5a017f50655cb258d5073cf'}
          root = Path(os.environ['RUNNER_TEMP']) / 'zkprobe-targeted-v2'
          root.mkdir(parents=True, exist_ok=True)
          for relative, content in sources.items():
              data = content.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == expected[relative], relative
              dest = root / relative
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
          print('PASS: all 6 embedded source/build files verified')
          PY
      - name: Test bounded reader
        run: |
          cd "$RUNNER_TEMP/zkprobe-targeted-v2"
          clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/targeted_test.cpp -o "$RUNNER_TEMP/zkprobe-targeted-test"
          "$RUNNER_TEMP/zkprobe-targeted-test"
      - name: Install signing tool
        run: brew install ldid-procursus
      - name: Build diagnostic dylib
        run: |
          cd "$RUNNER_TEMP/zkprobe-targeted-v2"
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZKProbe-targeted-v2
          path: ${{ runner.temp }}/zkprobe-targeted-v2/artifacts/*
          if-no-files-found: error
