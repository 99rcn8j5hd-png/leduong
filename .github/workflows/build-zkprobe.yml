::object(15)+0xc0,LocalFixture::object(10));f.put<uintptr_t>(0x40000+0x168,expectedGetter);\n}\nint main(){unsigned tests=0;\n for(unsigned mode=0;mode<5;++mode){LocalFixture f;addLevels(f);if(mode==1)f.put<uintptr_t>(LocalFixture::object(15)+0xc0,LocalFixture::object(13));if(mode==2)f.put<uintptr_t>(LocalFixture::object(15)+0xc0,0);if(mode==3)f.put<uintptr_t>(0x40000+0x168,0);if(mode==4)f.put<uintptr_t>(LocalFixture::object(15)+0xc0,LocalFixture::object(6));\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,17,LocalFixture::names);assert(lookup.names.init());\n  auto local=zk::resolveLevelWorld(LocalFixture::object(7),lookup,expectedGetter);auto other=zk::resolveLevelWorld(LocalFixture::object(11),lookup,expectedGetter);\n  if(!mode){assert(local.world.ptr==other.world.ptr&&local.world.ptr==LocalFixture::object(10));assert(zk::findOwningWorld(LocalFixture::object(11),lookup).ptr==LocalFixture::object(13));zk::OwnershipTarget target;target.ptr=LocalFixture::object(11);std::memcpy(&target.original,f.m.data()+target.ptr-LocalFixture::base,sizeof(target.original));auto result=zk::readOtherPawn(target,LocalFixture::object(7),local.world,lookup,false,expectedGetter);assert(!std::strcmp(result.status,\"same_world_pawn_position_candidate\")&&result.outerWorldIndex==13&&result.worldIndex==10&&result.levelIndex==15);}\n  if(mode==1)assert(other.world.ptr!=local.world.ptr);\n  if(mode==2)assert(!std::strcmp(other.world.status,\"level_world_pointer_invalid\"));if(mode==3)assert(!std::strcmp(other.world.status,\"level_world_getter_mismatch\"));if(mode==4)assert(!std::strcmp(other.world.status,\"level_world_object_invalid\"));++tests;\n }\n {LocalFixture f;addLevels(f);unsigned reads=0;auto rd=[&](uintptr_t a,void*p,size_t n){if(a==LocalFixture::object(15)+0xc0&&++reads==2)f.put<uintptr_t>(a,0);return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> lookup(rd,LocalFixture::items,17,LocalFixture::name