# Complete source snapshot; no dependency on uploaded companion files.
name: Build ZKProbe Instances
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Prepare complete source snapshot
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          sources=json.loads(r'''{
            "src/probe.mm": "#import <Foundation/Foundation.h>\n#import <dispatch/dispatch.h>\n#include \"dyld_util.hpp\"\n#include \"targeted_names.hpp\"\n#include \"targeted_objects.hpp\"\n#include \"targeted_instances.hpp\"\n#include <mutex>\n#include <memory>\n#include <cstdarg>\nstatic FILE *logFile=nullptr;\nstatic std::mutex runLock;\nstatic void emit(const char *fmt,...) {\n if(!logFile)return;\n va_list a;va_start(a,fmt);vfprintf(logFile,fmt,a);va_end(a);fputc('\\n',logFile);fflush(logFile);\n}\nstatic bool expectedUUID(uintptr_t base) {\n const unsigned char expected[16]={0xbe,0xf9,0x0c,0x8f,0x5c,0xb6,0x3a,0x9c,0x81,0xc1,0x48,0x0e,0x7f,0xaf,0xaa,0xc4};\n const auto *mh=(const mach_header_64 *)base;\n if(!mh||mh->magic!=MH_MAGIC_64||mh->sizeofcmds>(1u<<20))return false;\n const unsigned char *p=(const unsigned char *)(mh+1),*end=p+mh->sizeofcmds;\n for(uint32_t k=0;k<mh->ncmds&&size_t(end-p)>=sizeof(load_command);++k) {\n  const auto *c=(const load_command *)p;\n  if(c->cmdsize<sizeof(*c)||c->cmdsize>size_t(end-p))return false;\n  if(c->cmd==LC_UUID && c->cmdsize>=sizeof(uuid_command))return !memcmp(((const uuid_command *)p)->uuid,expected,16);\n  p+=c->cmdsize;\n }\n return false;\n}\nextern \"C\" void zkProbe() {\n std::unique_lock<std::mutex> lock(runLock,std::try_to_lock);if(!lock.owns_lock())return;\n @autoreleasepool {\n  NSString *docs=NSSearchPathForDirectoriesInDomains(NSDocumentDirectory,NSUserDomainMask,YES).firstObject;\n  NSString *path=[docs stringByAppendingPathComponent:@\"zkprobe-instances.txt\"];\n  logFile=fopen(path.UTF8String,\"a\");if(!logFile)return;\n  struct Close {~Close(){fclose(logFile);logFile=nullptr;}} close;\n  emit(\"[session] instances-v4 time=%s\",[NSDate.date.description UTF8String]);\n  emit(\"[mode] bounded object-list enumeration; NO region scan; NO game function calls\");\n  uintptr_t base=zk::mainBase();\n  if(!expectedUUID(base)){emit(\"[stop] executable UUID mismatch; no candidate reads\");return;}\n  emit(\"[uuid] match bef90c8f5cb63a9c81c1480e7fafaac4\");\n  constexpr uintptr_t wrapperRVA=0x0a446b20;\n  if(base>UINTPTR_MAX-wrapperRVA){emit(\"[stop] address overflow\");return;}\n  zk::resetScanBudget();\n  emit(\"[stage] wrapper begin\");\n  auto result=zk::checkTargetedNames(base+wrapperRVA,[](uintptr_t a,void *p,size_t n){return zk::rd(a,p,n);});\n  emit(\"[result] status=%s depth=%u decoded=%u\",result.status,result.chainDepth,result.decoded);\n  for(unsigned i=0;i<result.decoded;++i)emit(\"[name] id=%u text=%s\",i,result.names[i]);\n  if(result.decoded==16 && !std::strcmp(result.status,\"candidate_decoded_16_names_NOT_runtime_verified\")) {\n   emit(\"[stage] objects begin\");\n   constexpr uintptr_t objectArrayRVA=0x0a692d18;\n   if(base<=UINTPTR_MAX-objectArrayRVA) {\n    auto objects=zk::checkObjects(base+objectArrayRVA,result.table,[](uintptr_t a,void*p,size_t n){return zk::rd(a,p,n);});\n    emit(\"[objects] status=%s count=%d capacity=%d valid=%u stable=%d\",objects.status,objects.count,objects.capacity,objects.valid,objects.stable?1:0);\n    if(objects.valid>=4 && objects.stable) {\n     unsigned char initial[16]{};uintptr_t items=0;\n     if(zk::rd(base+objectArrayRVA+16,initial,16)) {\n      std::memcpy(&items,initial,8);\n      auto rd=[](uintptr_t a,void*p,size_t n){return zk::rd(a,p,n);};\n      auto reader=std::make_unique<zk::InstanceReader<decltype(rd)>>(rd,items,objects.count,result.table);\n      int32_t currentCount=0,currentCapacity=0;\n      std::memcpy(&currentCount,initial+12,4);std::memcpy(&currentCapacity,initial+8,4);\n      if(currentCount==objects.count && currentCapacity==objects.capacity && zk::candidatePointer(items) && reader->names.init()) {\n       emit(\"[stage] instances begin; slots=%d group=256 pause_ms=20 log_cap=64\",objects.count);\n       unsigned batches=0;\n       while(zk::budgetTimeOK()) {\n        const bool more=reader->batch([](uint32_t index,const char *name,const char *cls,uint32_t number){emit(\"[instance] index=%u name=%s number=%u class=%s\",index,name,number,cls);});\n        if((++batches%32)==0)emit(\"[progress] next=%u total=%d matches=%u\",reader->stats.next,objects.count,reader->stats.matches);\n        if(!more)break;\n        std::this_thread::sleep_for(std::chrono::milliseconds(20));\n       }\n       unsigned char end[16]{};bool headerStable=zk::rd(base+objectArrayRVA+16,end,16)&&!memcmp(initial,end,16);\n       const auto &v=reader->stats;\n       emit(\"[coverage] examined_to=%u snapshot_count=%d objects=%u class_definitions=%u defaults_skipped=%u matches=%u failed=%u complete=%d header_stable=%d\",v.next,objects.count,v.objects,v.classes,v.defaults,v.matches,v.failed,v.next==uint32_t(objects.count)?1:0,headerStable?1:0);\n       emit(\"[note] class-name filter only; camera values, player positions and active-world relations NOT checked\");\n      } else emit(\"[instances] initialization rejected\");\n     }\n    }\n    for(unsigned i=0;i<16 && int32_t(i)<objects.count;++i) {\n     const auto &v=objects.sample[i];\n     emit(\"[object] index=%u status=%s name=%s class=%s\",v.index,v.status,v.name,v.className);\n    }\n   } else emit(\"[objects] address overflow\");\n  } else emit(\"[stage] objects skipped: name baseline not confirmed\");\n  const auto &b=zk::scanBudget();\n  emit(\"[reads] bytes=%llu calls=%llu failures=%llu limit=%s\",(unsigned long long)b.readBytes,(unsigned long long)b.readCalls,(unsigned long long)b.readFailures,b.reason);\n  emit(\"[stage] complete; candidate only; do not copy to offsets.plist\");\n }\n}\n__attribute__((constructor)) static void start() {\n dispatch_after(dispatch_time(DISPATCH_TIME_NOW,12ull*NSEC_PER_SEC),dispatch_get_global_queue(QOS_CLASS_UTILITY,0),^{zkProbe();});\n}\n",
            "src/dyld_util.hpp": "// dyld_util.hpp \u2014 doc memory an toan + liet ke vung nho + base/range cua main image\n#pragma once\n\n#include <mach/mach.h>\n#include <mach/vm_region.h>\n#include <mach-o/dyld.h>\n#include <mach-o/loader.h>\n#include <stdint.h>\n#include <stdio.h>\n#include <string.h>\n#include <string>\n#include <vector>\n#include <algorithm>\n#include <chrono>\n#include <thread>\n#include \"scan_budget.hpp\"\n\nnamespace zk {\n\n// ---------- read an toan (khong crash khi dia chi rac) ----------\ninline bool rd(uintptr_t addr, void *out, size_t n) {\n    if (!addr || !out || !n || n > UINTPTR_MAX-addr) return false;\n    if (!allowRead(n)) return false;\n    vm_size_t got = 0;\n    kern_return_t kr = vm_read_overwrite(mach_task_self(), (vm_address_t)addr,\n                                         (vm_size_t)n, (vm_address_t)out, &got);\n    bool ok = kr == KERN_SUCCESS && got == n;\n    if (!ok) ++scanBudget().readFailures;\n    return ok;\n}\n\ntemplate <class T> inline T rdv(uintptr_t addr) {\n    T v;\n    memset(&v, 0, sizeof(T));\n    rd(addr, &v, sizeof(T));\n    return v;\n}\n\n// ---------- vung nho ----------\nstruct Region {\n    uintptr_t start;\n    uintptr_t end;\n    bool writable;\n};\n\ninline std::vector<Region>& regionCache() { static std::vector<Region> cache; return cache; }\ninline void refreshRegions() { regionCache().clear(); }\ninline const std::vector<Region> &allRegions() {\n    auto &cache=regionCache();\n    if (!cache.empty()) return cache;\n\n    vm_address_t addr = 0;\n    size_t visited=0;\n    while (visited++ < 8000 && budgetTimeOK()) {\n        vm_size_t size = 0;\n        vm_region_basic_info_data_64_t info;\n        mach_msg_type_number_t cnt = VM_REGION_BASIC_INFO_COUNT_64;\n        mach_port_t obj = MACH_PORT_NULL;\n\n        kern_return_t kr = vm_region_64(mach_task_self(), &addr, &size,\n                                        VM_REGION_BASIC_INFO_64,\n                                        (vm_region_info_t)&info, &cnt, &obj);\n        if (obj != MACH_PORT_NULL) mach_port_deallocate(mach_task_self(),obj);\n        if (kr != KERN_SUCCESS || size == 0 || size > UINTPTR_MAX-addr) break;\n\n        if (info.protection & VM_PROT_READ) {\n            Region r;\n            r.start = (uintptr_t)addr;\n            r.end = (uintptr_t)(addr + size);\n            r.writable = (info.protection & VM_PROT_WRITE) != 0;\n            cache.push_back(r);\n        }\n        addr += size;\n        if (cache.size() > 8000) break;\n    }\n    std::sort(cache.begin(), cache.end(),\n              [](const Region &a, const Region &b) { return a.start < b.start; });\n    return cache;\n}\n\ninline bool inReadableRegion(uintptr_t a) {\n    const std::vector<Region> &rs = allRegions();\n    size_t lo = 0, hi = rs.size();\n    while (lo < hi) {\n        size_t mid = (lo + hi) / 2;\n        if (rs[mid].end <= a) lo = mid + 1;\n        else hi = mid;\n    }\n    return lo < rs.size() && rs[lo].start <= a;\n}\n\n// ---------- range that cua tung image ----------\nstruct ImgRange {\n    uintptr_t base = 0;\n    uintptr_t end = 0;\n    const char *path = nullptr;\n};\n\ninline bool imageRange(uint32_t idx, ImgRange &rg) {\n    const struct mach_header_64 *mh =\n        (const struct mach_header_64 *)_dyld_get_image_header(idx);\n    if (!mh || mh->magic != MH_MAGIC_64) return false;\n\n    intptr_t slide = _dyld_get_image_vmaddr_slide(idx);\n    uintptr_t minA = UINTPTR_MAX, maxA = 0;\n\n    const uint8_t *p = (const uint8_t *)mh + sizeof(struct mach_header_64);\n    for (uint32_t c = 0; c < mh->ncmds; c++) {\n        const struct load_command *lc = (const struct load_command *)p;\n        if (lc->cmdsize < sizeof(struct load_command)) break;\n        if (lc->cmd == LC_SEGMENT_64) {\n            const struct segment_command_64 *sg = (const struct segment_command_64 *)lc;\n            if (sg->initprot == VM_PROT_NONE || sg->filesize==0) { p += lc->cmdsize; continue; }\n            uintptr_t s = (uintptr_t)slide + (uintptr_t)sg->vmaddr;\n            uintptr_t e = s + (uintptr_t)sg->vmsize;\n            if (s < minA) minA = s;\n            if (e > maxA) maxA = e;\n        }\n        p += lc->cmdsize;\n    }\n    if (maxA <= minA) return false;\n    rg.base = (uintptr_t)mh;\n    rg.end = maxA;\n    rg.path = _dyld_get_image_name(idx);\n    return true;\n}\n\ninline bool imageRangeContaining(uintptr_t addr, ImgRange &out) {\n    for (uint32_t i=0;i<_dyld_image_count();i++) {\n        const auto *mh=(const mach_header_64 *)_dyld_get_image_header(i);\n        if (!mh || mh->magic!=MH_MAGIC_64) continue;\n        const uint8_t *p=(const uint8_t *)mh+sizeof(*mh);\n        const uint8_t *end=p+mh->sizeofcmds;\n        intptr_t slide=_dyld_get_image_vmaddr_slide(i);\n        for (uint32_t c=0;c<mh->ncmds && p+sizeof(load_command)<=end;c++) {\n            const auto *lc=(const load_command *)p;\n            if (lc->cmdsize<sizeof(*lc) || (size_t)(end-p)<lc->cmdsize) break;\n            if (lc->cmd==LC_SEGMENT_64 && lc->cmdsize>=sizeof(segment_command_64)) {\n                const auto *sg=(const segment_command_64 *)p;\n                if (sg->initprot!=VM_PROT_NONE && sg->vmsize) {\n                    uintptr_t start=(uintptr_t)sg->vmaddr+slide;\n                    if (addr>=start && addr-start<sg->vmsize) {\n                        out.base=(uintptr_t)mh; out.end=start+sg->vmsize;\n                        out.path=_dyld_get_image_name(i); return true;\n                    }\n                }\n            }\n            p+=lc->cmdsize;\n        }\n    }\n    return false;\n}\n\n// ---------- base cua main executable (ShadowTrackerExtra) ----------\ninline uintptr_t mainBase() {\n    for (uint32_t i=0;i<_dyld_image_count();i++) {\n        const auto *mh=_dyld_get_image_header(i);\n        if (mh && mh->filetype==MH_EXECUTE) return (uintptr_t)mh;\n    }\n    return 0;\n}\n\ninline const char *imageNameContaining(uintptr_t addr) {\n    ImgRange r;\n    if (imageRangeContaining(addr, r) && r.path) return r.path;\n    return \"heap/other\";\n}\n\ninline bool belongsToMainImage(uintptr_t addr) {\n    ImgRange r;\n    if (!imageRangeContaining(addr, r)) return false;\n    return r.base == mainBase();\n}\n\n// ---------- quet vung RW theo tung khoi (tranh cap phat GB) ----------\nconst size_t kScanStep = 64u << 10; // 64 KB per read; bounded buffers\n\ntemplate <class F> void scanWritable(F cb) {\n    const std::vector<Region> &regs = allRegions();\n    std::vector<unsigned char> buf(kScanStep + 16);\n    for (size_t ri = 0; ri < regs.size(); ri++) {\n        const Region &r = regs[ri];\n        if (!r.writable) continue;\n        for (uintptr_t a = r.start; a < r.end; a += kScanStep) {\n            size_t want = (size_t)std::min<uintptr_t>(kScanStep, r.end - a);\n            if (want < 8) break;\n            if (!allowScan(want)) return;\n            if (!rd(a, buf.data(), want)) continue;\n            cb(a, buf.data(), want);\n            std::this_thread::sleep_for(std::chrono::milliseconds(2));\n        }\n    }\n}\n\n// quet chi trong cac vung writable cua mot image (vd: __DATA cua main binary)\ntemplate <class F> void scanImageData(uintptr_t imgBase, F cb) {\n    const std::vector<Region> &regs = allRegions();\n    std::vector<unsigned char> buf(kScanStep + 16);\n    for (size_t ri = 0; ri < regs.size(); ri++) {\n        const Region &r = regs[ri];\n        if (!r.writable) continue;\n\n        ImgRange ir;\n        if (!imageRangeContaining(r.start, ir) || ir.base != imgBase) continue;\n\n        for (uintptr_t a = r.start; a < r.end; a += kScanStep) {\n            size_t want = (size_t)std::min<uintptr_t>(kScanStep, r.end - a);\n            if (want < 8) break;\n            if (!allowScan(want)) return;\n            if (!rd(a, buf.data(), want)) continue;\n            cb(a, buf.data(), want);\n            std::this_thread::sleep_for(std::chrono::milliseconds(2));\n        }\n    }\n}\n\n} // namespace zk\n",
            "src/scan_budget.hpp": "#pragma once\n#include <cstddef>\n#include <chrono>\nnamespace zk {\nstruct ScanBudget {\n    size_t bytes=0, readBytes=0, readCalls=0, readFailures=0;\n    bool exhausted=false;\n    const char *reason=\"none\";\n    std::chrono::steady_clock::time_point start=std::chrono::steady_clock::now();\n};\ninline ScanBudget& scanBudget() { static ScanBudget state; return state; }\ninline void resetScanBudget() { scanBudget()=ScanBudget{}; }\ninline bool budgetTimeOK() {\n    auto &b=scanBudget();\n    if(b.exhausted) return false;\n    if(std::chrono::steady_clock::now()-b.start>=std::chrono::seconds(45)) {\n        b.exhausted=true; b.reason=\"elapsed_limit\"; return false;\n    }\n    return true;\n}\ninline bool allowRead(size_t n) {\n    auto &b=scanBudget();\n    if(!budgetTimeOK()) return false;\n    constexpr size_t limit=(16u<<20);\n    if(n>limit-b.readBytes || b.readCalls>=300000) {\n        b.exhausted=true; b.reason=\"read_limit\"; return false;\n    }\n    b.readBytes+=n; ++b.readCalls; return true;\n}\ninline bool allowScan(size_t n) {\n    if(!budgetTimeOK()) return false;\n    scanBudget().bytes+=n; return true;\n}\n}\n",
            "src/targeted_names.hpp": "#pragma once\n#include <cstdint>\n#include <cstddef>\n#include <cstring>\nnamespace zk {\nstatic_assert(sizeof(uintptr_t)==8,\"64-bit pointers required\");\nstruct TargetedResult {\n const char *status=\"not_checked\";\n uint32_t chainDepth=0;\n uintptr_t table=0;\n unsigned decoded=0;\n char names[16][65]{};\n};\ninline bool candidatePointer(uintptr_t p) { return p>=0x10000 && (p&7)==0 && p<=UINTPTR_MAX-128; }\n// Model inferred from one executable; read callback must have its own hard read budget.\ntemplate<class Read> TargetedResult checkTargetedNames(uintptr_t wrapper, Read read) {\n TargetedResult r;\n if(!candidatePointer(wrapper)) { r.status=\"bad_wrapper_address\"; return r; }\n unsigned char h[16]{};\n if(!read(wrapper,h,sizeof(h))) { r.status=\"wrapper_read_failed\"; return r; }\n uint32_t tag; uintptr_t p;\n std::memcpy(&tag,h,4); std::memcpy(&p,h+8,8);\n if(!(h[4]&1)) { r.status=\"wrapper_not_initialized\"; return r; }\n if(tag<103 || tag>148 || (tag-100)%3) { r.status=\"unexpected_chain_tag\"; return r; }\n r.chainDepth=(tag-100)/3;\n if(!candidatePointer(p)) { r.status=\"invalid_chain_pointer\"; return r; }\n uintptr_t seen[16]{}; seen[0]=p;\n for(uint32_t j=1;j<r.chainDepth;++j) {\n  uintptr_t next=0;\n  if(!read(p,&next,8) || !candidatePointer(next)) { r.status=\"chain_read_failed\"; return r; }\n  for(uint32_t k=0;k<j;++k)if(next==seen[k]) { r.status=\"chain_cycle\"; return r; }\n  seen[j]=next; p=next;\n }\n uintptr_t table=0;\n if(!read(p,&table,8) || !candidatePointer(table)) { r.status=\"table_read_failed\"; return r; }\n r.table=table;\n uintptr_t chunk=0;\n if(!read(table,&chunk,8) || !candidatePointer(chunk)) { r.status=\"chunk0_read_failed\"; return r; }\n for(unsigned id=0;id<16;++id) {\n  uintptr_t entry=0;\n  if(!read(chunk+id*8,&entry,8) || !candidatePointer(entry)) { r.status=\"entry_read_failed\"; return r; }\n  uint32_t flags=0;\n  if(!read(entry+8,&flags,4)) { r.status=\"entry_flags_read_failed\"; return r; }\n  if(flags&1) { r.status=\"wide_entry_not_supported\"; return r; }\n  unsigned char text[64]{};\n  if(!read(entry+12,text,sizeof(text))) { r.status=\"entry_text_read_failed\"; return r; }\n  size_t n=0;\n  for(;n<sizeof(text)&&text[n];++n) {\n   if(text[n]<32||text[n]>126) { r.status=\"non_ascii_name\"; return r; }\n  }\n  if(!n||n==sizeof(text)) { r.status=\"missing_name_terminator\"; return r; }\n  std::memcpy(r.names[id],text,n); ++r.decoded;\n  if(id==0 && std::strcmp(r.names[0],\"None\")) { r.status=\"entry0_not_None\"; return r; }\n }\n r.status=\"candidate_decoded_16_names_NOT_runtime_verified\";\n return r;\n}\n}\n",
            "src/targeted_objects.hpp": "#pragma once\n#include \"targeted_names.hpp\"\n#include <array>\nnamespace zk {\nstruct ObjectSample { uint32_t index=0; const char *status=\"not_checked\"; char name[65]{},className[65]{}; };\nstruct ObjectResult {const char *status=\"not_checked\";int32_t count=0,capacity=0;unsigned valid=0;bool stable=false;ObjectSample sample[16]{};};\ninline bool safeSpan(uintptr_t p,size_t n){return p>=0x10000 && n<=UINTPTR_MAX-p;}\ntemplate<class Read> struct NameReader {\n Read &read;uintptr_t table;uint32_t count=0;\n struct Entry{uint32_t id=0;char text[65]{};};Entry cache[256]{};unsigned used=0;\n bool init(){int32_t n=0;if(!safeSpan(table,0x404)||!read(table+0x400,&n,4)||n<=0||n>2000000)return false;count=uint32_t(n);return true;}\n bool get(uint32_t id,char out[65]){\n  out[0]=0;if(id>=count)return false;\n  for(unsigned i=0;i<used;++i)if(cache[i].id==id){std::memcpy(out,cache[i].text,65);return true;}\n  if(used==256)used=0;\n  uintptr_t chunk=0,entry=0;uint32_t flags=0;\n  if(!read(table+(id/0x4000)*8,&chunk,8)||!candidatePointer(chunk))return false;\n  uintptr_t slot=chunk+(id%0x4000)*8;\n  if(!safeSpan(chunk,(id%0x4000)*8+8)||!read(slot,&entry,8)||!candidatePointer(entry))return false;\n  if(!read(entry+8,&flags,4)||(flags&1)||!read(entry+12,out,64))return false;\n  size_t n=0;for(;n<64&&out[n];++n)if((unsigned char)out[n]<32||(unsigned char)out[n]>126)return false;\n  if(!n||n==64)return false;\n  out[64]=0;cache[used].id=id;std::memcpy(cache[used++].text,out,65);return true;\n }\n};\nstruct ObjectHead{uintptr_t vtable;uint32_t flags;int32_t index;uintptr_t cls;uint32_t nameId,number;uintptr_t outer;};\nstatic_assert(sizeof(ObjectHead)==40,\"Expected 64-bit UObject header layout\");\ntemplate<class Read> ObjectResult checkObjects(uintptr_t array,uintptr_t names,Read read){\n ObjectResult result;\n if(!candidatePointer(array)){result.status=\"invalid_array_address\";return result;}\n unsigned char header[16]{};uintptr_t items=0;\n if(!safeSpan(array,0x20)||!read(array+0x10,header,16)){result.status=\"array_header_read_failed\";return result;}\n std::memcpy(&items,header,8);std::memcpy(&result.capacity,header+8,4);std::memcpy(&result.count,header+12,4);\n if(!candidatePointer(items)||result.count<=0||result.capacity<result.count||result.capacity>5000000){result.status=\"array_header_invalid\";return result;}\n NameReader<Read> nr{read,names};if(!nr.init()){result.status=\"name_count_invalid\";return result;}\n const unsigned n=unsigned(result.count)<16?unsigned(result.count):16;\n for(unsigned i=0;i<n;++i){\n  auto &s=result.sample[i];s.index=i;s.status=\"item_read_failed\";\n  uintptr_t obj=0;if(!read(items+i*24,&obj,8))continue;\n  if(!obj){s.status=\"empty_slot\";continue;}\n  if(!candidatePointer(obj)){s.status=\"object_pointer_invalid\";continue;}\n  ObjectHead h{};if(!read(obj,&h,sizeof(h))){s.status=\"object_header_read_failed\";continue;}\n  if(h.index!=int32_t(i)||!candidatePointer(h.vtable)||!candidatePointer(h.cls)){s.status=\"object_header_mismatch\";continue;}\n  ObjectHead cl{};if(!read(h.cls,&cl,sizeof(cl))){s.status=\"class_header_read_failed\";continue;}\n  if(cl.index<0||cl.index>=result.count||!candidatePointer(cl.cls)){s.status=\"class_header_mismatch\";continue;}\n  uintptr_t classSlot=0;\n  if(!safeSpan(items,size_t(cl.index)*24+8)||!read(items+size_t(cl.index)*24,&classSlot,8)||classSlot!=h.cls){s.status=\"class_index_mismatch\";continue;}\n  ObjectHead meta{};char metaName[65]{};\n  if(!read(cl.cls,&meta,sizeof(meta))||!nr.get(meta.nameId,metaName)||std::strcmp(metaName,\"Class\")){s.status=\"metaclass_name_mismatch\";continue;}\n  if(!nr.get(h.nameId,s.name)||!nr.get(cl.nameId,s.className)){s.status=\"name_decode_failed\";continue;}\n  s.status=\"index_name_class_matched\";++result.valid;\n }\n unsigned char after[16]{};\n result.stable=read(array+0x10,after,16)&&!std::memcmp(header,after,16);\n result.status=!result.stable?\"array_changed_during_sample\":result.valid>=4?\"object_sample_matched_camera_NOT_checked\":\"object_sample_inconclusive\";\n return result;\n}\n}\n",
            "src/targeted_instances.hpp": "#pragma once\n#include \"targeted_objects.hpp\"\n#include <array>\n#include <algorithm>\nnamespace zk {\ninline bool definitionClass(const char *s){\n const size_t n=std::strlen(s),k=14;\n return !std::strcmp(s,\"Class\") || !std::strcmp(s,\"DynamicClass\") || (n>=k && !std::strcmp(s+n-k,\"GeneratedClass\"));\n}\ninline bool interestingClass(const char *s){\n return !std::strcmp(s,\"World\") || std::strstr(s,\"GameEngine\") || std::strstr(s,\"PlayerController\") || std::strstr(s,\"CameraManager\") || std::strstr(s,\"LocalPlayer\") || std::strstr(s,\"GameInstance\") || std::strstr(s,\"ViewportClient\") || std::strstr(s,\"PlayerPawn\") || std::strstr(s,\"Character\");\n}\nstruct ClassMemo {uintptr_t ptr=0;bool good=false;char name[65]{};};\nstruct InstanceStats {uint32_t next=0,objects=0,classes=0,defaults=0,matches=0,failed=0;};\n// Reads only known object slots. Caller supplies global read budget, pacing, and log sink.\ntemplate<class Read> struct InstanceReader {\n Read read;uintptr_t items;int32_t count;NameReader<Read> names;\n ClassMemo memo[512]{};unsigned replace=0;InstanceStats stats;\n InstanceReader(Read fn,uintptr_t a,int32_t n,uintptr_t table):read(fn),items(a),count(n),names{read,table}{}\n bool className(uintptr_t p,char out[65]){\n  for(auto &c:memo)if(c.ptr==p){if(c.good)std::memcpy(out,c.name,65);return c.good;}\n  auto &c=memo[replace++%512];c=ClassMemo{};c.ptr=p;\n  if(!candidatePointer(p))return false;\n  ObjectHead h{},meta{};uintptr_t at=0;char mn[65]{};\n  if(!read(p,&h,sizeof(h))||h.index<0||h.index>=count||!candidatePointer(h.cls))return false;\n  if(!read(items+size_t(h.index)*24,&at,8)||at!=p)return false;\n  if(!read(h.cls,&meta,sizeof(meta))||!names.get(meta.nameId,mn))return false;\n  if(std::strcmp(mn,\"Class\")) {\n   ObjectHead root{};char rootName[65]{};\n   if(!definitionClass(mn)||!candidatePointer(meta.cls)||!read(meta.cls,&root,sizeof(root))||!names.get(root.nameId,rootName)||std::strcmp(rootName,\"Class\"))return false;\n  }\n  if(!names.get(h.nameId,c.name))return false;\n  c.good=true;std::memcpy(out,c.name,65);return true;\n }\n template<class Emit> bool batch(Emit emit){\n  if(count<=0||!safeSpan(items,size_t(count)*24)||stats.next>=uint32_t(count))return false;\n  const uint32_t begin=stats.next,n=std::min<uint32_t>(256,uint32_t(count)-begin);\n  std::array<unsigned char,256*24> slots{};\n  if(!read(items+size_t(begin)*24,slots.data(),size_t(n)*24))return false;\n  for(uint32_t k=0;k<n;++k){\n   const uint32_t index=begin+k;uintptr_t obj=0;std::memcpy(&obj,slots.data()+k*24,8);\n   if(!obj){stats.next=index+1;continue;}\n   if(!candidatePointer(obj)){++stats.failed;stats.next=index+1;continue;}\n   ObjectHead h{};\n   if(!read(obj,&h,sizeof(h)))return false;\n   stats.next=index+1;\n   if(h.index!=int32_t(index)||!candidatePointer(h.cls)||!candidatePointer(h.vtable)){++stats.failed;continue;}\n   ++stats.objects;char cls[65]{};\n   if(!className(h.cls,cls)){++stats.failed;continue;}\n   if(definitionClass(cls)){++stats.classes;continue;}\n   if(!interestingClass(cls))continue;\n   char name[65]{};if(!names.get(h.nameId,name)){++stats.failed;continue;}\n   if(!std::strncmp(name,\"Default__\",9)){++stats.defaults;continue;}\n   ObjectHead after{};\n   if(!read(obj,&after,sizeof(after))||std::memcmp(&h,&after,sizeof(h))){++stats.failed;continue;}\n   ++stats.matches;\n   if(stats.matches<=64)emit(index,name,cls,h.number);\n  }\n  return stats.next<uint32_t(count);\n }\n};\n}\n",
            "tests/targeted_test.cpp": "#include \"../src/targeted_names.hpp\"\n#include \"../src/scan_budget.hpp\"\n#include <cassert>\n#include <vector>\n#include <cstring>\n#include <cstdio>\nstruct Fixture {\n static constexpr uintptr_t base=0x10000,table=0x12000,chunk=0x13000,entry=0x14000;\n std::vector<unsigned char> m=std::vector<unsigned char>(0x20000,0);\n size_t bytes=0,calls=0,failAt=0;\n template<class T> void put(uintptr_t a,T value){assert(a>=base && a-base+sizeof(T)<=m.size());std::memcpy(m.data()+a-base,&value,sizeof(T));}\n Fixture(unsigned depth=1){\n  put<uint32_t>(base,100+depth*3);m[4]=1;put<uintptr_t>(base+8,0x11000);\n  for(unsigned i=0;i<depth;++i)put<uintptr_t>(0x11000+i*8,i+1==depth?table:0x11000+(i+1)*8);\n  put<uintptr_t>(table,chunk);\n  for(unsigned i=0;i<16;++i){put<uintptr_t>(chunk+i*8,entry+i*128);std::strcpy((char*)m.data()+entry+i*128-base+12,i?\"TestName\":\"None\");}\n }\n bool read(uintptr_t a,void *p,size_t n){\n  ++calls;bytes+=n;if(calls==failAt)return false;\n  if(a<base || a-base>m.size() || n>m.size()-(a-base))return false;\n  std::memcpy(p,m.data()+a-base,n);return true;\n }\n zk::TargetedResult run(){return zk::checkTargetedNames(base,[&](uintptr_t a,void*p,size_t n){return read(a,p,n);});}\n};\nint main(){\n unsigned count=0;\n auto status=[&](Fixture &f,const char *expected){auto r=f.run();if(std::strcmp(r.status,expected))std::fprintf(stderr,\"expected=%s actual=%s\\n\",expected,r.status);assert(!std::strcmp(r.status,expected));assert(f.bytes<=4096 && f.calls<=128);++count;};\n for(unsigned depth=1;depth<=16;++depth){Fixture f(depth);auto r=f.run();assert(r.decoded==16 && r.chainDepth==depth && !std::strcmp(r.names[0],\"None\"));assert(f.bytes<=4096 && f.calls<=128);++count;}\n {Fixture f;f.m[4]=0;status(f,\"wrapper_not_initialized\");}\n for(uint32_t tag:{0u,100u,102u,104u,149u,0xffffffffu}){Fixture f;f.put<uint32_t>(Fixture::base,tag);status(f,\"unexpected_chain_tag\");}\n {Fixture f;f.put<uintptr_t>(Fixture::base+8,1);status(f,\"invalid_chain_pointer\");}\n {Fixture f(16);f.put<uintptr_t>(0x11000,0x11000);status(f,\"chain_cycle\");}\n {Fixture f;f.m[Fixture::entry-Fixture::base+12]='X';status(f,\"entry0_not_None\");}\n {Fixture f;f.put<uint32_t>(Fixture::entry+8,1);status(f,\"wide_entry_not_supported\");}\n {Fixture f;f.m[Fixture::entry-Fixture::base+12]=0x80;status(f,\"non_ascii_name\");}\n {Fixture f;std::memset(f.m.data()+Fixture::entry-Fixture::base+12,'A',64);status(f,\"missing_name_terminator\");}\n {Fixture f;f.m[Fixture::entry-Fixture::base+12]=0;status(f,\"missing_name_terminator\");}\n for(size_t i=1;i<=51;++i){Fixture f;f.failAt=i;auto r=f.run();assert(std::strcmp(r.status,\"candidate_decoded_16_names_NOT_runtime_verified\"));assert(f.calls==i);++count;}\n zk::resetScanBudget();assert(zk::allowRead(16u<<20));assert(!zk::allowRead(1));++count;\n zk::resetScanBudget();for(int i=0;i<300000;++i)assert(zk::allowRead(1));assert(!zk::allowRead(1));++count;\n zk::resetScanBudget();zk::scanBudget().start-=std::chrono::seconds(46);assert(!zk::allowRead(1));++count;\n std::printf(\"PASS: %u bounded-reader and budget cases\\n\",count);\n}\n",
            "tests/objects_test.cpp": "#include \"../src/targeted_objects.hpp\"\n#include <vector>\n#include <cassert>\n#include <cstdio>\n#include <cstring>\nstruct Fixture {\n static constexpr uintptr_t base=0x10000,names=0x20000,chunk=0x21000,entries=0x22000,items=0x30000,objects=0x31000;\n std::vector<unsigned char> m=std::vector<unsigned char>(0x60000,0);\n size_t calls=0,bytes=0,failAt=0,headerReads=0;bool changeHeader=false;\n template<class T> void put(uintptr_t a,T n){assert(a>=base&&a-base+sizeof(T)<=m.size());std::memcpy(m.data()+a-base,&n,sizeof(T));}\n Fixture(){\n  put<uintptr_t>(base+16,items);put<int32_t>(base+24,16);put<int32_t>(base+28,16);\n  put<uintptr_t>(names,chunk);put<int32_t>(names+0x400,18);\n  for(unsigned i=0;i<18;++i){put<uintptr_t>(chunk+i*8,entries+i*128);std::strcpy((char*)m.data()+entries+i*128-base+12,i==0?\"None\":i==1?\"Class\":\"ObjectName\");}\n  for(unsigned i=0;i<16;++i){put<uintptr_t>(items+i*24,objects+i*256);zk::ObjectHead h{};h.vtable=0x50000;h.index=i;h.cls=objects+256;h.nameId=i==1?1:i+2;put(objects+i*256,h);}\n }\n bool read(uintptr_t a,void*p,size_t n){++calls;bytes+=n;if(calls==failAt)return false;if(a<base||a-base>m.size()||n>m.size()-(a-base))return false;if(a==base+16&&++headerReads==2&&changeHeader)put<int32_t>(base+28,17);std::memcpy(p,m.data()+a-base,n);return true;}\n zk::ObjectResult run(){return zk::checkObjects(base,names,[&](uintptr_t a,void*p,size_t n){return read(a,p,n);});}\n};\nint main(){\n unsigned tests=0;\n {Fixture f;auto r=f.run();assert(r.valid==16&&r.stable&&!std::strcmp(r.status,\"object_sample_matched_camera_NOT_checked\"));assert(f.calls<512&&f.bytes<32768);++tests;}\n for(int32_t n:{-1,0,17,5000001}){Fixture f;f.put<int32_t>(Fixture::base+28,n);auto r=f.run();assert(!std::strcmp(r.status,\"array_header_invalid\"));++tests;}\n {Fixture f;f.put<int32_t>(Fixture::names+0x400,0);assert(!std::strcmp(f.run().status,\"name_count_invalid\"));++tests;}\n {Fixture f;f.put<uintptr_t>(Fixture::items,0);auto r=f.run();assert(!std::strcmp(r.sample[0].status,\"empty_slot\")&&r.valid==15);++tests;}\n {Fixture f;f.put<int32_t>(Fixture::objects+12,99);assert(!std::strcmp(f.run().sample[0].status,\"object_header_mismatch\"));++tests;}\n {Fixture f;f.put<int32_t>(Fixture::objects+256+12,99);assert(!std::strcmp(f.run().sample[0].status,\"class_header_mismatch\"));++tests;}\n {Fixture f;f.put<uintptr_t>(Fixture::items+24,Fixture::objects);assert(!std::strcmp(f.run().sample[0].status,\"class_index_mismatch\"));++tests;}\n {Fixture f;f.m[Fixture::entries+128-Fixture::base+12]='X';assert(!std::strcmp(f.run().sample[0].status,\"metaclass_name_mismatch\"));++tests;}\n {Fixture f;f.put<uint32_t>(Fixture::objects+24,18);assert(!std::strcmp(f.run().sample[0].status,\"name_decode_failed\"));++tests;}\n {Fixture f;f.changeHeader=true;auto r=f.run();assert(!r.stable&&!std::strcmp(r.status,\"array_changed_during_sample\"));++tests;}\n {Fixture f;f.failAt=1;assert(!std::strcmp(f.run().status,\"array_header_read_failed\"));++tests;}\n // Fail each read once: bounded diagnostic must finish without invalid memory access.\n for(size_t fail=2;fail<=180;++fail){Fixture f;f.failAt=fail;auto r=f.run();(void)r;assert(f.calls<512&&f.bytes<32768);++tests;}\n std::printf(\"PASS: %u object reader cases\\n\",tests);\n}\n",
            "tests/instances_test.cpp": "#include \"../src/targeted_objects.hpp\"\n#include <vector>\n#include <cassert>\n#include <cstdio>\n#include <cstring>\nstruct Fixture {\n static constexpr uintptr_t base=0x10000,names=0x20000,chunk=0x21000,entries=0x22000,items=0x30000,objects=0x31000;\n std::vector<unsigned char> m=std::vector<unsigned char>(0x60000,0);\n size_t calls=0,bytes=0,failAt=0,headerReads=0;bool changeHeader=false;\n template<class T> void put(uintptr_t a,T n){assert(a>=base&&a-base+sizeof(T)<=m.size());std::memcpy(m.data()+a-base,&n,sizeof(T));}\n Fixture(){\n  put<uintptr_t>(base+16,items);put<int32_t>(base+24,16);put<int32_t>(base+28,16);\n  put<uintptr_t>(names,chunk);put<int32_t>(names+0x400,18);\n  for(unsigned i=0;i<18;++i){put<uintptr_t>(chunk+i*8,entries+i*128);std::strcpy((char*)m.data()+entries+i*128-base+12,i==0?\"None\":i==1?\"Class\":\"ObjectName\");}\n  for(unsigned i=0;i<16;++i){put<uintptr_t>(items+i*24,objects+i*256);zk::ObjectHead h{};h.vtable=0x50000;h.index=i;h.cls=objects+256;h.nameId=i==1?1:i+2;put(objects+i*256,h);}\n }\n bool read(uintptr_t a,void*p,size_t n){++calls;bytes+=n;if(calls==failAt)return false;if(a<base||a-base>m.size()||n>m.size()-(a-base))return false;if(a==base+16&&++headerReads==2&&changeHeader)put<int32_t>(base+28,17);std::memcpy(p,m.data()+a-base,n);return true;}\n zk::ObjectResult run(){return zk::checkObjects(base,names,[&](uintptr_t a,void*p,size_t n){return read(a,p,n);});}\n};\n\n#include \"../src/targeted_instances.hpp\"\n#include <string>\nvoid setup(Fixture &f){\n const uintptr_t o=Fixture::objects,e=Fixture::entries,b=Fixture::base;\n f.put<uint32_t>(o+2*256+24,4);std::strcpy((char*)f.m.data()+e+4*128-b+12,\"World\");\n f.put<uintptr_t>(o+3*256+16,o+2*256);\n f.put<uintptr_t>(o+4*256+16,o+2*256);std::strcpy((char*)f.m.data()+e+6*128-b+12,\"Default__World\");\n f.put<uintptr_t>(o+5*256+16,o+6*256);std::strcpy((char*)f.m.data()+e+8*128-b+12,\"STExtraPlayerCameraManager\");\n}\nint main(){unsigned tests=0;\n for(const char *s:{\"World\",\"GameEngine\",\"STExtraPlayerController\",\"STExtraPlayerCameraManager\",\"LocalPlayer\",\"GameInstance\",\"GameViewportClient\",\"BP_PlayerPawn_C\",\"Character\"}){assert(zk::interestingClass(s));++tests;}\n for(const char *s:{\"Class\",\"Package\",\"WorldSettings\",\"CameraComponent\",\"Texture2D\"}){assert(!zk::interestingClass(s));++tests;}\n {Fixture f;setup(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());unsigned emitted=0;\n assert(!x.batch([&](uint32_t i,const char *name,const char *cls,uint32_t){assert(i==3||i==5);assert(std::strncmp(name,\"Default__\",9));assert(zk::interestingClass(cls));++emitted;}));\n assert(x.stats.next==16&&x.stats.matches==2&&x.stats.defaults==1&&emitted==2&&x.stats.failed==0);assert(f.calls<512&&f.bytes<32768);++tests;}\n for(size_t fail=1;fail<=120;++fail){Fixture f;setup(f);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());f.failAt=f.calls+fail;x.batch([](uint32_t,const char*,const char*,uint32_t){});assert(x.stats.next<=16&&x.stats.matches<=2&&f.calls<512&&f.bytes<32768);++tests;}\n {Fixture f;f.put<int32_t>(Fixture::names+0x400,400);auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::NameReader<decltype(rd)> nr{rd,Fixture::names};assert(nr.init());char name[65]{};\n for(uint32_t i=0;i<300;++i){const uintptr_t entry=0x40000+i*128;f.put<uintptr_t>(Fixture::chunk+i*8,entry);std::strcpy((char*)f.m.data()+entry-Fixture::base+12,\"Name\");assert(nr.get(i,name));}assert(nr.used<=256);++tests;}\n {Fixture f;constexpr uintptr_t objs=0x40000;f.put<int32_t>(Fixture::base+24,300);f.put<int32_t>(Fixture::base+28,300);\n for(uint32_t i=0;i<300;++i){zk::ObjectHead h{};h.index=i;h.vtable=0x50000;h.cls=objs+256;h.nameId=i==1?1:2;f.put(objs+i*256,h);f.put<uintptr_t>(Fixture::items+i*24,objs+i*256);}\n auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,300,Fixture::names);assert(x.names.init());auto emit=[](uint32_t,const char*,const char*,uint32_t){};assert(x.batch(emit));assert(x.stats.next==256);assert(!x.batch(emit));assert(x.stats.next==300&&x.stats.classes==300);++tests;}\n\n {Fixture f;setup(f);const uintptr_t o=Fixture::objects,e=Fixture::entries,b=Fixture::base;\n  f.put<uintptr_t>(o+2*256+16,o+6*256);std::strcpy((char*)f.m.data()+e+8*128-b+12,\"BlueprintGeneratedClass\");\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());bool world=false;\n  x.batch([&](uint32_t i,const char*,const char *cls,uint32_t){if(i==3&&!std::strcmp(cls,\"World\"))world=true;});assert(world);++tests;}\n {Fixture f;setup(f);const uintptr_t o=Fixture::objects,e=Fixture::entries,b=Fixture::base;\n  f.put<uintptr_t>(o+2*256+16,o+6*256);std::strcpy((char*)f.m.data()+e+8*128-b+12,\"BogusMetaclass\");\n  auto rd=[&](uintptr_t a,void*p,size_t n){return f.read(a,p,n);};zk::InstanceReader<decltype(rd)> x(rd,Fixture::items,16,Fixture::names);assert(x.names.init());bool world=false;\n  x.batch([&](uint32_t i,const char*,const char*,uint32_t){if(i==3)world=true;});assert(!world);++tests;}\n std::printf(\"PASS: %u instance reader cases\\n\",tests);\n}\n",
