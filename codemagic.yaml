workflows:
  leduong-dylib:
    name: le duong dylib - M2
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: '16.4'
    scripts:
    - name: Install signing tool
      script: |
        set -euo pipefail
        export HOMEBREW_NO_AUTO_UPDATE=1
        if ! command -v ldid >/dev/null 2>&1; then brew install ldid; fi
        xcodebuild -version
    - name: Prepare source, test and build
      script: |
        set -euo pipefail
        mkdir -p "$CM_BUILD_DIR/leduong-source"
        cd "$CM_BUILD_DIR/leduong-source"
        python3 - <<'PY'
        import json
        from pathlib import Path
        sources = json.loads(r'''{"build.sh": "#!/bin/bash\nset -euo pipefail\ncd \"$(dirname \"$0\")\"\nmkdir -p build artifacts\nSDK=$(xcrun --sdk iphoneos --show-sdk-path)\nfor arch in arm64 arm64e; do\n  mkdir -p \"build/$arch\"\n  for source in src/probe.mm src/character_overlay.mm src/vng07/Backend.mm src/vng07/OverlayView.mm; do\n    unit=$(basename \"$source\" .mm)\n    xcrun clang++ -isysroot \"$SDK\" -arch \"$arch\" -miphoneos-version-min=15.0 -std=c++17 -O2 -fobjc-arc -Isrc -c \"$source\" -o \"build/$arch/$unit.o\"\n  done\n  xcrun clang++ -isysroot \"$SDK\" -arch \"$arch\" -miphoneos-version-min=15.0 -dynamiclib \"build/$arch/\"*.o -framework Foundation -framework UIKit -framework QuartzCore -framework CoreGraphics -Wl,-install_name,@rpath/ZKProbe.dylib -o \"build/$arch/ZKProbe.dylib\"\ndone\nxcrun lipo -create build/arm64/ZKProbe.dylib build/arm64e/ZKProbe.dylib -output artifacts/ZKProbe.dylib\nldid -S artifacts/ZKProbe.dylib\nxcrun lipo -info artifacts/ZKProbe.dylib\nshasum -a 256 artifacts/ZKProbe.dylib > artifacts/SHA256.txt\n", "R75_compensation_table.csv": "distance_upper_m,compensation_cm,source\n20,20,user\n40,52,user\n50,70,user\n60,90,user\n70,115,user\n80,138,user\n90,153,user\n100,175,user\n110,200,user\n120,232,user\n130,247,user\n140,261,user\n150,272,user\n160,283,user\n170,294,user\n180,315,user\n190,342,user\n200,363,user\n210,386,estimated\n220,409,estimated\n230,432,estimated\n240,455,estimated\n250,478,estimated\n260,501,estimated\n270,524,estimated\n280,547,estimated\n290,570,estimated\n300,593,estimated\n", "R78_MEMORY.md": "Imported from user ZIP akios999-18-source.zip, VNG 4.6.0 profile.\nNew to ZKProbe: Object.Index, Character.WeaponManager, Weapon/RecoilInfo/NativeRecoil groups.\nValues copied from source, not runtime pointers. Original mode-0 and mode-1 evidence included.\nOnly selected climb/fail/variation/min/max fields receive 30%; 7 other edit fields receive zero.\nOther modules (movement, dumper, diagnostics UI) excluded. MIT source notice retained.\nNative functions are called only after 16-byte ABI checks; calls on reader queue inherit Akio's\nunresolved device/thread-safety limitations. No claim of observed recoil percentage.\nOriginal R77 package retained for rollback; full iOS/device validation pending.\n", "R79_MEMORY.md": "R79 changes only ADS kick selection relative to R78.\nEvidence: user photo photo_2026-11-05_00-29-48.jpg and description of elevated shot-2+ group.\nHypothesis: remaining ADS kick may contribute; causality unknown without device measurements.\nReused field: Weapon.RecoilKickADS, owner UShootWeaponEntity, float, 0xCF0 relative offset;\nsource akios999-18-source.zip/Dumper/TrainingOverlay/GameOffsets.h. No new native addresses.\nConfig percentage 100 is an experiment, not an assertion of measured gameplay reduction.\nR78 package retained unchanged for rollback. Full Xcode/device validation pending.\n", "R81_MEMORY.md": "R81 reuses all R78/R79 profile addresses unchanged.\nOnly PIVertical::Percent changed 30 -> 98 and the matching UI label/test expectation.\nRecoilKickADS configuration reduction stays 100%; no values beyond 100 are accepted.\nObservation: user reports improvement from R79, elevated grouping at 120 m.\nNo causal verification or new measured recoil data. R79 rollback package preserved.\nStatic YAML/hash/string checks only; C++/Xcode/device validation pending.\n", "R82_MEMORY.md": "R82 changes the existing angle controller's gain and speed cap using a 0.25-2 multiplier.\nUI value captured on main thread and passed by value through the serial reader queue.\nVertical-amplitude configuration reduction changed from 98 to 100 by user request.\nNo offsets changed: existing camera, control rotation, weapon and recoil profiles reused.\nInvalid speed values rejected; tests cover monotonic response, combined bounds and invalid input.\nDefault multiplier 1 preserves R81 behavior. Native recoil path unchanged.\nNo remote build requested or started. No device-result claim.\n", "R83_MEMORY.md": "R83 reuses existing skeleton metadata and mesh-to-world transform.\nNo offsets changed. Sequence uses observed touch duration, not game firing/ADS states.\nSmoothstep interpolation is continuous with zero endpoint slope in normalized timing.\nPose is sampled fresh each frame so the interpolation follows the actual moving bones.\nTests added for boundaries, monotonicity, continuity, moving anchors and invalid inputs.\nStatic packaging checked; C++/iOS/device behavior requires the user's manual build/test.\n", "R83_README.txt": "R83: time-based torso -> chest -> head sequence, selected by the new ChuoI segment (default).\nUses verified metadata names spine_01, spine_03 and head; no invented bone coordinates.\nHold torso through 0.20 s; smooth torso-to-chest transition 0.20-0.65 s;\nsmooth chest-to-head transition 0.65-1.15 s; then holds head until release.\nThese are selected animation timings, not measured shot times or bullet counts.\nOnly creates sequence aim candidates while the observed fire button is held.\nRelease cancels candidates; a new press starts the sequence at the torso.\nMissing any required bone: no sequence aim candidate. Existing chest/head modes remain.\nThere is NO verified ADS state reader: open the scope manually before using this mode.\nIt can also activate during hip-fire if left selected; do not describe it as ADS-only.\nNo random misses, shot redirection or guarantee of hit order.\nKeeps R82 speed slider and vertical/ADS configuration reduction at 100/100.\nNo new engine offsets, native functions, timers or logs. No build started by agent.\n", "README.md": "# AIM fresh-pose / ESP update\n\nChanges from the attached message (2).txt:\n- Refresh the selected target pose after the visibility query, before reading camera and calculating the control angle. Preserve chest, head and timed sequence modes.\n- Reject read-to-write intervals over 1/30 second; recheck controller, mesh and player key before writing. This is a conservative policy, not a measured tick rate.\n- Advance held-button time across queue, ESP and visibility-query delays.\n- Keep incremental level-actor discovery running even when GObjects cannot be read. Existing ESP refresh requests remain at up to 30 Hz; full discovery takes multiple requests.\n- Preserve the existing verified CurrentVehicle fallback and label its approximate vehicle-origin anchor. Exact seated skeletons still require a readable mesh transform; no invented seat offsets or vehicle-origin aim targets.\n\nValidation: local source/package checks only. No C++ compiler or Apple SDK is available on this Windows machine. The included GitHub Actions workflow runs host C++ tests before building. No remote workflow was launched. iOS build and device validation remain pending.\n\nThis patch addresses stale target sampling as a hypothesis. It does not establish the cause of missed damage, synchronize atomically with an engine tick, or confirm server hit registration.\n\nBuild on macOS with Xcode and ldid: `bash build.sh`.\nOutput: artifacts/ZKProbe.dylib (arm64 and arm64e).\nOriginal third-party license retained under src/vng07/.\n", "test-host.sh": "#!/bin/bash\nset -euo pipefail\ncd \"$(dirname \"$0\")\"\nmkdir -p build/host\nfor source in tests/vng07/test_*.cpp; do\n  unit=$(basename \"$source\" .cpp)\n  clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc -Isrc/vng07 \"$source\" -o \"build/host/$unit\"\n  \"build/host/$unit\"\ndone\n", "src/character_overlay.h": "#pragma once\n#import <UIKit/UIKit.h>\n// Main-thread entry point; no independent constructor or menu.\nvoid ZKAttachCharacterOverlay(UIWindow *window, UIScrollView *body);\n", "src/character_overlay.mm": "#import \"character_overlay.h\"\n#import \"vng07/Backend.h\"\n#import \"vng07/OverlayView.h\"\n#import <QuartzCore/QuartzCore.h>\n#import <dispatch/dispatch.h>\n#include <atomic>\n#include <memory>\n#include \"SessionPolicy.h\"\n#include \"FixedDistanceCompensation.h\"\n\nstatic UILabel* ZK75Label(NSString* text,CGFloat size,BOOL bold){\n UILabel* l=[UILabel new];l.text=text;l.font=bold?[UIFont boldSystemFontOfSize:size]:[UIFont systemFontOfSize:size];\n l.textColor=bold?UIColor.whiteColor:[UIColor colorWithRed:.63 green:.69 blue:.78 alpha:1];return l;\n}\nstatic UIView* ZK75Card(UIView* parent,CGFloat y,CGFloat height){\n UIView* v=[[UIView alloc] initWithFrame:CGRectMake(0,y,256,height)];v.backgroundColor=[UIColor colorWithWhite:1 alpha:.045];v.layer.cornerRadius=12;\n v.layer.borderWidth=.5;v.layer.borderColor=[UIColor colorWithWhite:1 alpha:.09].CGColor;[parent addSubview:v];return v;\n}\n@interface ZKCharacterOverlay : NSObject <UIGestureRecognizerDelegate>\n@property(nonatomic,strong) UIView* panel;\n@property(nonatomic,strong) UISwitch* espSwitch;\n@property(nonatomic,strong) UISwitch* aimSwitch;\n@property(nonatomic,strong) UISegmentedControl* targetJoint;\n@property(nonatomic,strong) UISlider* radius;\n@property(nonatomic,strong) UISlider* ipadView;\n@property(nonatomic,strong) UILabel* ipadViewText;\n@property(nonatomic,strong) UISlider* aimSpeed;\n@property(nonatomic,strong) UILabel* aimSpeedText;\n@property(nonatomic,strong) UILabel* radiusText;\n@property(nonatomic,strong) UILabel* status;\n@property(nonatomic,strong) UIButton* fireSelect;\n@property(nonatomic,strong) UILongPressGestureRecognizer* fireObserver;\n@property(nonatomic) CGPoint fireCenter;\n@property(nonatomic) BOOL selectingFire;\n@property(nonatomic) double fireHoldStart;\n@property(nonatomic,strong) PVTrainingPlayerOverlayView* overlay;\n@property(nonatomic,strong) CADisplayLink* link;\n@property(nonatomic,strong) dispatch_queue_t queue;\n@property(nonatomic) BOOL busy;\n@property(nonatomic) BOOL ready;\n@property(nonatomic) BOOL discover;\n@property(nonatomic) CFTimeInterval lastRequest;\n@property(nonatomic) CFTimeInterval lastFrame;\n@end\n\n@implementation ZKCharacterOverlay {\n ZKSession::Policy _session;\n std::shared_ptr<std::atomic<bool>> _aimPermit;\n}\n- (instancetype)init {\n if((self=[super init])){\n  _queue=dispatch_queue_create(\"zkprobe.character-reader\",DISPATCH_QUEUE_SERIAL);\n  _panel=[[UIView alloc] initWithFrame:CGRectMake(12,6,256,469)];\n  UIColor* gold=[UIColor colorWithRed:1 green:.82 blue:.32 alpha:1];\n  UIView* esp=ZK75Card(_panel,0,52);\n  UILabel* l=ZK75Label(@\"ESP nh\u00e2n v\u1eadt\",13,YES);l.frame=CGRectMake(12,8,166,18);[esp addSubview:l];\n  l=ZK75Label(@\"350 m \u00b7 ch\u1ec9 ng\u01b0\u1eddi ch\u01a1i th\u1eadt\",10,NO);l.frame=CGRectMake(12,28,180,15);[esp addSubview:l];\n  _espSwitch=[[UISwitch alloc] initWithFrame:CGRectMake(194,10,49,31)];_espSwitch.onTintColor=gold;_espSwitch.accessibilityLabel=@\"B\u1eadt t\u1eaft ESP v\u00e0 qu\u00e9t m\u1edbi\";\n  [_espSwitch addTarget:self action:@selector(espChanged) forControlEvents:UIControlEventValueChanged];[esp addSubview:_espSwitch];\n  UIView* aim=ZK75Card(_panel,58,52);\n  l=ZK75Label(@\"Aim nh\u00e2n v\u1eadt\",13,YES);l.frame=CGRectMake(12,8,166,18);[aim addSubview:l];\n  l=ZK75Label(@\"300 m \u00b7 d\u1ecdc 100% \u00b7 kick ADS 100%\",10,NO);l.frame=CGRectMake(12,28,180,15);[aim addSubview:l];\n  _aimSwitch=[[UISwitch alloc] initWithFrame:CGRectMake(194,10,49,31)];_aimSwitch.onTintColor=gold;_aimSwitch.accessibilityLabel=@\"B\u1eadt t\u1eaft Aim\";\n  [_aimSwitch addTarget:self action:@selector(aimChanged) forControlEvents:UIControlEventValueChanged];[aim addSubview:_aimSwitch];\n  UIView* target=ZK75Card(_panel,116,58);\n  l=ZK75Label(@\"\u0110I\u1ec2M NG\u1eaeM\",9,NO);l.frame=CGRectMake(12,5,220,13);[target addSubview:l];\n  _targetJoint=[[UISegmentedControl alloc] initWithItems:@[@\"Ng\u1ef1c\",@\"\u0110\u1ea7u\",@\"Chu\u1ed7i\"]];_targetJoint.frame=CGRectMake(10,22,236,28);_targetJoint.selectedSegmentIndex=2;_targetJoint.selectedSegmentTintColor=gold;\n  [_targetJoint setTitleTextAttributes:@{NSForegroundColorAttributeName:UIColor.whiteColor} forState:UIControlStateNormal];\n  [_targetJoint setTitleTextAttributes:@{NSForegroundColorAttributeName:UIColor.blackColor} forState:UIControlStateSelected];\n  [_targetJoint addTarget:self action:@selector(targetChanged) forControlEvents:UIControlEventValueChanged];[target addSubview:_targetJoint];\n  UIView* fov=ZK75Card(_panel,180,58);\n  _radiusText=ZK75Label(@\"V\u00d2NG FOV \u00b7 120 pt\",9,NO);_radiusText.frame=CGRectMake(12,6,220,14);[fov addSubview:_radiusText];\n  _radius=[[UISlider alloc] initWithFrame:CGRectMake(12,25,232,26)];_radius.minimumValue=40;_radius.maximumValue=220;_radius.value=120;_radius.minimumTrackTintColor=gold;\n  [_radius addTarget:self action:@selector(radiusChanged) forControlEvents:UIControlEventValueChanged];[fov addSubview:_radius];\n  UIView* speedCard=ZK75Card(_panel,246,58);\n  _aimSpeedText=ZK75Label(@\"T\u1ed0C \u0110\u1ed8 K\u00c9O T\u00c2M \u00b7 100%\",9,NO);_aimSpeedText.frame=CGRectMake(12,6,232,14);[speedCard addSubview:_aimSpeedText];\n  _aimSpeed=[[UISlider alloc] initWithFrame:CGRectMake(12,25,232,26)];_aimSpeed.minimumValue=25;_aimSpeed.maximumValue=200;_aimSpeed.value=100;_aimSpeed.minimumTrackTintColor=gold;\n  _aimSpeed.accessibilityLabel=@\"T\u1ed1c \u0111\u1ed9 k\u00e9o t\u00e2m, ph\u1ea7n tr\u0103m\";\n  [_aimSpeed addTarget:self action:@selector(aimSpeedChanged) forControlEvents:UIControlEventValueChanged];[speedCard addSubview:_aimSpeed];\n  _fireSelect=[UIButton buttonWithType:UIButtonTypeSystem];_fireSelect.frame=CGRectMake(0,312,256,34);[_fireSelect setTitle:@\"Ch\u1ecdn v\u1ecb tr\u00ed n\u00fat b\u1eafn\" forState:UIControlStateNormal];_fireSelect.titleLabel.font=[UIFont systemFontOfSize:12 weight:UIFontWeightSemibold];[_fireSelect setTitleColor:gold forState:UIControlStateNormal];_fireSelect.layer.borderColor=[gold colorWithAlphaComponent:.25].CGColor;_fireSelect.layer.borderWidth=.5;_fireSelect.layer.cornerRadius=10;\n  [_fireSelect addTarget:self action:@selector(selectFireButton) forControlEvents:UIControlEventTouchUpInside];[_panel addSubview:_fireSelect];\n  UIView* cameraCard=ZK75Card(_panel,350,53);\n  _ipadViewText=ZK75Label(@\"iPad View \u00b7 0% (g\u1ed1c)\",10,YES);\n  _ipadViewText.frame=CGRectMake(12,5,232,16);[cameraCard addSubview:_ipadViewText];\n  _ipadView=[[UISlider alloc] initWithFrame:CGRectMake(12,24,232,26)];\n  _ipadView.minimumValue=0;_ipadView.maximumValue=25;_ipadView.minimumTrackTintColor=gold;\n  _ipadView.accessibilityLabel=@\"T\u0103ng g\u00f3c nh\u00ecn c\u01a1 s\u1edf\";\n  [_ipadView addTarget:self action:@selector(ipadViewChanged) forControlEvents:UIControlEventValueChanged];\n  [cameraCard addSubview:_ipadView];\n  _status=ZK75Label(@\"S\u1eb5n s\u00e0ng \u00b7 b\u1eadt ESP \u0111\u1ec3 t\u00ecm nh\u00e2n v\u1eadt\",10,NO);_status.frame=CGRectMake(4,409,248,55);_status.numberOfLines=3;[_panel addSubview:_status];\n  _fireCenter=CGPointMake(.219,.217);\n  [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(pauseSession) name:UIApplicationWillResignActiveNotification object:nil];\n  [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(resumeSession) name:UIApplicationDidBecomeActiveNotification object:nil];\n }\n return self;\n}\n- (void)ipadViewChanged {\n self.ipadViewText.text=self.ipadView.value>0?[NSString stringWithFormat:@\"iPad View \u00b7 +%.0f%%\",self.ipadView.value]:@\"iPad View \u00b7 0% (g\u1ed1c)\";\n if(!_session.canRead())self.status.text=@\"B\u1eadt ESP \u0111\u1ec3 \u00e1p d\u1ee5ng iPad View\";\n}\n- (void)aimSpeedChanged {\n self.aimSpeedText.text=[NSString stringWithFormat:@\"T\u1ed0C \u0110\u1ed8 K\u00c9O T\u00c2M \u00b7 %.0f%%\",self.aimSpeed.value];\n}\n- (void)radiusChanged {self.radiusText.text=[NSString stringWithFormat:@\"V\u00d2NG FOV \u00b7 %.0f pt\",self.radius.value];}\n- (void)renewPermit {\n if(_aimPermit)_aimPermit->store(false,std::memory_order_release);\n _session.refresh();_aimPermit=std::make_shared<std::atomic<bool>>(_session.canAim());\n if(_session.enabled&&!self.ready)self.discover=YES;\n}\n- (void)endObservedFire {\n if(self.fireHoldStart<=0)return;\n self.fireHoldStart=0;[self renewPermit];\n}\n- (void)restoreRecoil {\n dispatch_async(self.queue,^{@autoreleasepool {\n  NSDictionary* state=PIBackend::VerticalRecoil(false);\n  dispatch_async(dispatch_get_main_queue(),^{\n   if(!self.aimSwitch.on||!self.espSwitch.on){\n    if([state[@\"pending\"] boolValue]){\n     self.status.text=@\"\u0110ang kh\u00f4i ph\u1ee5c th\u00f4ng s\u1ed1 gi\u1eadt d\u1ecdc\u2026\";\n     if(UIApplication.sharedApplication.applicationState==UIApplicationStateActive)\n      dispatch_after(dispatch_time(DISPATCH_TIME_NOW,200*NSEC_PER_MSEC),dispatch_get_main_queue(),^{\n       if(!self.aimSwitch.on||!self.espSwitch.on)[self restoreRecoil];\n      });\n    }\n   }\n  });\n }});\n}\n- (void)stop {\n self.fireObserver.enabled=NO;self.fireHoldStart=0;self.selectingFire=NO;\n if(_aimPermit)_aimPermit->store(false,std::memory_order_release);\n _session.stop();dispatch_async(self.queue,^{ PIBackend::CameraView(0); });[self restoreRecoil];self.ready=NO;self.discover=NO;\n [self.link invalidate];self.link=nil;self.overlay.frameData=nil;self.overlay.hidden=YES;\n self.status.text=@\"ESP \u0111\u00e3 t\u1eaft \u00b7 b\u1eadt l\u1ea1i \u0111\u1ec3 qu\u00e9t m\u1edbi\";\n}\n- (void)espChanged {\n if(!self.espSwitch.on){[self stop];return;}\n if(!self.overlay.window||UIApplication.sharedApplication.applicationState!=UIApplicationStateActive){[self.espSwitch setOn:NO animated:YES];return;}\n _session.start();_session.aim=self.aimSwitch.on;self.ready=NO;self.discover=YES;\n self.lastRequest=0;self.lastFrame=0;self.overlay.hidden=YES;\n _aimPermit=std::make_shared<std::atomic<bool>>(_session.canAim());self.fireObserver.enabled=_session.aim;\n self.status.text=@\"\u0110ang qu\u00e9t nh\u00e2n v\u1eadt\u2026\";[self startDisplayLink];\n}\n- (void)aimChanged {\n [self endObservedFire];_session.aim=self.aimSwitch.on&&_session.enabled;[self renewPermit];\n self.fireObserver.enabled=_session.canAim()||self.s