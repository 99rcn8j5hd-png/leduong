0;bool Inferred=false;std::vector<Candidate> Candidates;std::string CacheError;int CacheCount=0; };\ninline bool Shape(const PIBones::Pose& P){\n    if(!P.Stable||P.Values.size()<8||P.Values.size()>1024)return false;\n    size_t Good=0;\n    for(const auto& T:P.Values){\n        if(!PIBones::Valid(T))continue;\n        double Norm=0;for(float V:T.Rotation)Norm+=V*V;\n        bool Scale=true;for(float V:T.Scale)if(std::abs(V)>100)Scale=false;\n        if(Norm>=0.8&&Norm<=1.2&&Scale)++Good;\n    }\n    return Good*100>=P.Values.size()*95;\n}\ntemplate<class Read,class Lookup> Result Probe(Read R,Lookup Name,uintptr_t Mesh,uintptr_t Asset,uintptr_t Skeleton){\n    Result Out;Out.Pose=PIBones::ReadPose(R,Mesh+O::Mesh::CachedComponentPose);\n    Out.CacheError=Out.Pose.Error;Out.CacheCount=Out.Pose.Header.Count;\n    std::vector<std::pair<uintptr_t,size_t>> Regions;\n    if(Asset)Regions.emplace_back(Asset,O::Mesh::AssetSize);\n    if(Skeleton)Regions.emplace_back(Skeleton,O::Mesh::SkeletonSize);\n    if(Shape(Out.Pose)){Out.Offset=O::Mesh::CachedComponentPose;Out.Metadata=PIBones::FindMetadata(R,Name,Regions,Out.Pose.Header.Count);return Out;}\n    Out.Pose={};Out.Pose.Error=\"no_valid_live_pose\";\n    std::unordered_map<int,PIBones::Metadata> Trees;\n    double Best=-1;\n    for(int Off=int(O::Mesh::ScanStart);Off+16<=int(O::Mesh::ComponentSize);Off+=8){\n        PIBones::Array H{};\n        if(!R(Mesh+Off,&H,sizeof(H))||!PIBones::ValidArray(H)||H.Count<8||H.Count>1024||H.Data%16)continue;\n        auto Pose=PIBones::ReadPose(R,Mesh+Off);if(!Shape(Pose))continue;\n        auto It=Trees.find(H.Count);\n        if(It==Trees.end())It=Trees.emplace(H.Count,PIBones::FindMetadata(R,Name,Regions,H.Count)).first;\n        bool Pair=false;\n        for(int Delta:{-16,16}){\n            if(Off+Delta<int(O::Mesh::ScanStart)||Off+Delta+16>int(O::Mesh::ComponentSize))continue;\n            PIBones::Array Other{};\n            if(R(Mesh+Off+Delta,&Other,sizeof(Other))&&Other.Count==H.Count&&Other.Data!=H.Data&&PIBones::ValidArray(Other))\n                if(Shape(PIBones::ReadPose(R,Mesh+Off+Delta)))Pair=true;\n        }\n        Candidate C{Off,H.Count,Pair,It->second.At&&!It->second.Ambiguous,Off<int(O::Mesh::NativeBaseSize),0};\n        C.Score=(C.Base?0.5:0.1)+(C.Pair?0.3:0)+(C.Metadata?0.2:0);Out.Candidates.push_back(C);\n        // Only infer component-space for arrays in the native SkinnedMesh base\n        // with a matching validated reference tree. Extended arrays stay evidence.\n        if(C.Base&&C.Metadata&&C.Score>Best){Best=C.Score;Out.Pose=std::move(Pose);Out.Metadata=It->second;Out.Offset=Off;Out.Inferred=true;}\n    }\n    return Out;\n}\n}\n", "src/vng07/LivePoseAdapter.h": "#pragma once\nstatic PILive::Result LiveMeshPose(uintptr_t Mesh)\n{\n    struct Choice{uintptr_t Asset=0;unsigned Epoch=0;PILive::Result Last;std::chrono::steady_clock::time_point Attempt;};\n    static std::unordered_map<uintptr_t,Choice> Choices;\n    const uintptr_t Asset=Mesh?Ptr(Mesh+O::Mesh::Asset):0,Skeleton=Asset?Ptr(Asset+O::Mesh::Skeleton):0;\n    auto It=Choices.find(Mesh);\n    const auto Now=std::chrono::steady_clock::now();\n    if(!Mesh){PILive::Result R;R.Pose.Error=\"no_mesh\";return R;}\n    if(It!=Choices.end()&&It->second.Asset==Asset&&It->second.Epoch==DiscoverGeneration&&\n       !It->second.Last.Offset&&Now-It->second.Attempt<std::chrono::seconds(3))return It->second.Last;\n    if(It!=Choices.end()&&It->second.Asset==Asset&&It->second.Epoch==DiscoverGeneration&&It->second.Last.Offset){\n        auto P=PIBones::ReadPose(Read,Mesh+It->second.Last.Offset);\n        if(PILive::Shape(P)&&P.Header.Count==It->second.Last.Pose.Header.Count){auto R=It->second.Last;R.Pose=std::move(P);return R;}\n    }\n    auto Result=PILive::Probe(Read,[](int Index){return PINames::Lookup(Read,Names,Index);},Mesh,Asset,Skeleton);\n    if(Choices.size()>=128&&It==Choices.end())Choices.clear();\n    Choices[Mesh]={Asset,DiscoverGeneration,Result,Now};\n    return Result;\n}\n", "src/vng07/Names.h": "#include \"GameOffsets.h\"\n#pragma once\n#include <cstdint>\n#include <string>\n#include <unordered_set>\n\nnamespace PINames\n{\nnamespace O=PIGame;\ninline bool ValidString(int Count, int Capacity)\n{ return Count >= 0 && Count <= 256 && Capacity >= Count && Capacity <= 4096; }\n\ntemplate<class Reader>\nstd::string Lookup(Reader Read, uintptr_t Table, int Index)\n{\n    if (!Table || Index < 0 || Index >= 0x4000000) return {};\n    uintptr_t Chunk = 0, Entry = 0;\n    if (!Read(Table + uintptr_t(Index / O::Names::ElementsPerChunk) * 8, &Chunk, 8) || !Chunk) return {};\n    if (!Read(Chunk + uintptr_t(Index % O::Names::ElementsPerChunk) * 8, &Entry, 8) || !Entry) return {};\n    uint32_t Packed = 0;\n    if (!Read(Entry + O::Names::PackedIndex, &Packed, 4)) return {};\n    const bool Wide = (Packed & 1) != 0;\n    std::string Out;\n    for (size_t I = 0; I < 128; ++I)\n    {\n        uint16_t C = 0;\n        if (!Read(Entry + O::Names::Characters + I * (Wide ? 2 : 1), &C, Wide ? 2 : 1)) return {};\n        if (!C) return Out;\n        if (C < 32 || C > 126) return {};\n        Out.push_back(static_cast<char>(C));\n    }\n    return {};\n}\n\ntemplate<class Reader>\nuintptr_t Resolve(Reader Read, uintptr_t Root, std::unordered_set<uintptr_t>& Seen, unsigned Depth = 0)\n{\n    if (Root < 0x10000 || Root % 8 || Depth > 16 || Seen.size() >= 48 || !Seen.insert(Root).second) return 0;\n    if (Lookup(Read, Root, 0) == \"None\") return Root;\n    for (uintptr_t Offset : {uintptr_t(0), O::Names::Manager})\n    {\n        uintptr_t Next = 0;\n        if (Read(Root + Offset, &Next, 8))\n            if (uintptr_t Table = Resolve(Read, Next, Seen, Depth + 1)) return Table;\n    }\n    int32_t Header = 0; uintptr_t Next = 0;\n    if (Read(Root, &Header, 4) && Header >= 103 && Header <= 148 && (Header - 100) % 3 == 0 && Read(Root + O::Names::LegacyNext, &Next, 8))\n    {\n        bool Good = true;\n        for (int I = 1; I < (Header - 100) / 3; ++I)\n            if (!Read(Next, &Next, 8)) { Good = false; break; }\n        if (Good) return Resolve(Read, Next, Seen, Depth + 1);\n    }\n    return 0;\n}\n}\n", "src/vng07/NativeRecoilAdapter.h": "#pragma once\n// Inside PIBackend, serial reader queue only. The game owns the wrapped storage;\n// use its accessors, never copy/zero its encoded bytes or change the source mode.\nstruct NativeRecoilContext {\n    PIRecoil::Identity Entity{},Track{};\n    uintptr_t Gun=0,Config=0;\n    std::array<uintptr_t,9> Storage{};\n    bool Validated=false;\n    PIRecoil::Identity Key()const{return {Config,Entity.Object,Gun,Entity.Index,Entity.Name};}\n};\nstatic bool NativeRecoilABI(){\n    uint8_t B[16];\n    return Read(Slide+O::NativeRecoil::ConfigGetter,B,16)&&!memcmp(B,O::NativeRecoil::ConfigCode,16)&&\n        Read(Slide+O::NativeRecoil::FloatGetter,B,16)&&!memcmp(B,O::NativeRecoil::GetterCode,16)&&\n        Read(Slide+O::NativeRecoil::FloatSetter,B,16)&&!memcmp(B,O::NativeRecoil::SetterCode,16);\n}\nstatic bool NativeRecoilLinks(const NativeRecoilContext& C){\n    int32_t Mode=-1;\n    return C.Gun&&RecoilLive(C.Entity)&&RecoilLive(C.Track)&&\n        Ptr(C.Gun+O::Weapon::Entity)==C.Entity.Object&&Ptr(C.Gun+O::Weapon::BulletTrack)==C.Track.Object&&\n        Ptr(C.Track.Object+O::Weapon::TrackOwner)==C.Gun&&Get(C.Track.Object+O::Weapon::TrackMode,Mode)&&Mode==1;\n}\nstatic bool NativeRecoilStorage(const NativeRecoilContext& C,size_t I){\n    uint8_t Bytes[0x31];\n    return C.Config&&Ptr(C.Config+O::NativeRecoil::Fields[I])==C.Storage[I]&&C.Storage[I]&&\n        Read(C.Storage[I],Bytes,sizeof(Bytes))&&Bytes[0x30]<8;\n}\nstatic bool ResolveNativeRecoil(NativeRecoilContext& C,bool Existing){\n    C.Validated=false;\n    if(!NativeRecoilABI()||!NativeRecoilLinks(C))return false;\n    using Getter=uintptr_t(*)(uintptr_t);\n    const uintptr_t Config=reinterpret_cast<Getter>(Slide+O::NativeRecoil::ConfigGetter)(C.Track.Object);\n    if(!Config||(Config&7)||(Exist