(!PIStyle::HealthBar(100,0).Known);\n    assert(!PIStyle::HealthBar(100,-1).Known);\n    assert(!PIStyle::HealthBar(std::numeric_limits<double>::quiet_NaN(),100).Known);\n    assert(!PIStyle::HealthBar(100,std::numeric_limits<double>::infinity()).Known);\n    assert(!PIStyle::HealthBar(100,1e9).Known);\n    assert(!PIStyle::HealthBar(1e30,1000).Known);\n    auto Far=PIStyle::Ink(20),Mid=PIStyle::Ink(60),Near=PIStyle::Ink(300);\n    assert(!Far.Dots&&Mid.Dots&&Near.Dots);\n    assert(Far.Radius<Mid.Radius&&Mid.Radius<Near.Radius);\n    assert(Near.Radius<=1.2&&Near.OutlineRadius<=1.6&&Near.Line<=1.15);\n    assert(Far.Line<=Mid.Line&&Mid.Line<=Near.Line);\n    assert(!PIStyle::Ink(0).Dots&&!PIStyle::Ink(-10).Dots);\n    assert(!PIStyle::Ink(std::numeric_limits<double>::quiet_NaN()).Dots);\n    std::cout<<\"PASS: captured 67-bone skeleton -> 18 joints/17 links, safe parent bridging/rejections, health limits/colors and distance-scaled skeleton ink\\n\";\n}\n", "tests/vng07/test_player_aim.cpp": "#include \"PlayerAimMath.h\"\n#include <cassert>\n#include <limits>\nint main(){\n float C[3]={0,0,2};\n auto R=PIPlayerAim::Step({1000,0,0},{},{},C,1.0/30);assert(R.Valid&&R.Rotation[0]==0&&R.Rotation[1]==0&&R.Rotation[2]==2);\n R=PIPlayerAim::Step({1000,1000,1000},{},{},C,1.0/30);assert(R.Valid&&R.Rotation[0]>0&&R.Rotation[0]<=3&&R.Rotation[1]<=3);\n R=PIPlayerAim::Step({-1000,-1,0},{},{0,179,0},C,1.0/30);assert(R.Valid&&R.Rotation[1]>0&&R.Rotation[1]<1);\n assert(!PIPlayerAim::Step({},{},{},C,1.0/30).Valid);\n assert(!PIPlayerAim::Step({1000,0,0},{},{},C,.5).Valid);\n assert(!PIPlayerAim::Step({1000,0,0},{},{},nullptr,.03).Valid);\n C[0]=350;R=PIPlayerAim::Step({1000,0,-176.32698},{},{-10,0,0},C,.03);assert(R.Valid&&R.Rotation[0]<-9.9&&R.Rotation[0]>-10.1);\n for(double dt: {.001,.016,.033333333,.1}){\n  float zero[3]={0,0,0};\n  auto bounded=PIPlayerAim::Step({1000,1000,1000},{},{},zero,dt);\n  assert(bounded.Valid);\n  assert(std::hypot(bounded.Rotation[0],bounded.Rotation[1])<=90*std::min(dt,1.0/30.0)+1e-6);\n }\n C[0]=std::numeric_limits<float>::quiet_NaN();assert(!PIPlayerAim::Step({1000,0,0},{},{},C,.03).Valid);\n // Slider scales the angular response, not update cadence or recoil values.\n float zero[3]={0,0,0};\n auto slow=PIPlayerAim::Step({1000,100,50},{},{},zero,1.0/30,0,.25);\n auto normal=PIPlayerAim::Step({1000,100,50},{},{},zero,1.0/30,0,1);\n auto fast=PIPlayerAim::Step({1000,100,50},{},{},zero,1.0/30,0,2);\n assert(slow.Valid&&normal.Valid&&fast.Valid);\n auto length=[](auto r){return std::hypot(r.Rotation[0],r.Rotation[1]);};\n assert(length(slow)<length(normal)&&length(normal)<length(fast));\n for(double speed:{.25,1.,2.})for(double dt:{.001,.016,1.0/30,.1}){\n  auto r=PIPlayerAim::Step({1000,1000,1000},{},{},zero,dt,0,speed);\n  assert(r.Valid&&length(r)<=90*speed*std::min(dt,1.0/30)+1e-6);\n }\n for(double speed:{0.,.24,2.01,std::numeric_limits<double>::infinity(),std::numeric_limits<double>::quiet_NaN()})\n  assert(!PIPlayerAim::Step({1000,100,50},{},{},zero,.03,0,speed).Valid);\n\n}\n", "tests/vng07/test_recoil_parameters.cpp": "#include \"RecoilParameters.h\"\n#include <map>\n#include <cassert>\n#include <iostream>\n#include <limits>\nusing C=PIParams::Control<12>;\nstruct Mock {\n std::map<uintptr_t,std::array<float,12>> Values;\n std::array<float,12> Original{.7f,2.1f,.1f,.05f,7.f,-.75f,.75f,-.03f,.1f,1.f,.2f,.3f};\n bool FailAll=false,Uncertain=false;int Fail=-1,Writes=0;\n Mock(){Values[1]=Original;Values[2]=Original;}\n bool Live(PIRecoil::Identity I){return Values.count(I.Object);}\n bool Read(PIRecoil::Identity I,size_t K,float& V){if(!Live(I))return false;V=Values[I.Object][K];return true;}\n bool Write(PIRecoil::Identity I,size_t K,float B,float A){if(!Live(I)||FailAll||!PIRecoil::Equal(Values[I.Object][K],B))return false;if(int(K)==Fail){Fail=-1;if(Uncertain)Values[I.Object][K]=A;return false;}Values[I.Object][K]=A;++Writes;return true;}\n auto Step(C& Control,uintptr_t O,bool E,double Amp,double Cam){std::array<double,12> P{};for(int I=0;I<12;++I)P[I]=I<9?Amp:Cam;return Control.Step({O,10,20,1,30},E,P,[&](auto I){return Live(I);},[&](auto I,size_t K,float& V){return Read(I,K,V);},[&](auto I,size_t K,float B,float A){return Write(I,K,B,A);});}\n void Restored(uintptr_t O){for(int I=0;I<12;++I)assert(PIRecoil::Equal(Values[O][I],Original[I]));}\n};\nint main(){\n {Mock M;C S;M.Step(S,1,false,100,100);assert(M.Writes==0);M.Step(S,1,true,0,0);assert(M.Writes==0);}\n {Mock M;C S;assert(M.Step(S,1,true,50,100).Applied);assert(PIRecoil::Equal(M.Values[1][5],-.375f));assert(M.Values[1][9]==0);int W=M.Writes;M.Step(S,1,true,50,100);assert(M.Writes==W);M.Step(S,1,false,0,0);M.Restored(1);}\n {Mock M;C S;M.Step(S,1,true,100,0);for(int I=0;I<9;++I)assert(M.Values[1][I]==0);for(int I=9;I<12;++I)assert(M.Values[1][I]==M.Original[I]);M.Step(S,1,true,0,50);for(int I=0;I<9;++I)assert(PIRecoil::Equal(M.Values[1][I],M.Original[I]));M.Step(S,1,false,0,0);M.Restored(1);}\n {Mock M;C S;M.Step(S,1,true,50,50);M.Step(S,2,true,50,50);M.Restored(1);M.Step(S,2,false,0,0);M.Restored(2);}\n for(bool U:{false,true}){Mock M;C S;M.Fail=7;M.Uncertain=U;auto R=M.Step(S,1,true,100,100);assert(!R.Applied&&!R.Pending);M.Restored(1);}\n {Mock M;C S;M.Step(S,1,true,50,50);M.Values[1][5]=-1.f;M.Step(S,1,true,50,50);assert(PIRecoil::Equal(M.Values[1][5],-.5f));M.Step(S,1,false,0,0);assert(PIRecoil::Equal(M.Values[1][5],-1.f));}\n {Mock M;C S;M.Step(S,1,true,100,100);M.FailAll=true;assert(M.Step(S,1,false,0,0).Pending);M.FailAll=false;M.Step(S,1,false,0,0);M.Restored(1);}\n {Mock M;C S;M.Step(S,1,true,50,50);M.Values.erase(1);assert(M.Step(S,2,true,50,50).Applied);M.Step(S,2,false,0,0);M.Restored(2);}\n {Mock M;C S;M.Values[1][5]=std::numeric_limits<float>::quiet_NaN();assert(!M.Step(S,1,true,100,100).Applied&&M.Writes==0);}\n {Mock M;C S;M.Step(S,1,true,50,50);assert(!M.Step(S,1,true,101,0).Applied);M.Restored(1);}\n {Mock M;C S;M.Step(S,1,true,50,50);M.FailAll=true;assert(M.Step(S,1,false,0,0).Pending);assert(M.Step(S,1,true,100,100).Pending);M.FailAll=false;assert(M.Step(S,1,true,100,100).Applied);M.Step(S,1,false,0,0);M.Restored(1);}\n for(bool U:{false,true}){Mock M;C S;M.Step(S,1,true,50,50);M.Fail=7;M.Uncertain=U;auto R=M.Step(S,1,true,100,100);assert(!R.Applied&&!R.Pending);M.Restored(1);}\n std::cout<<\"PASS parameter groups: signed AUG amplitudes, mixed sliders, no compounding, original restore, swap/stale, invalid data, partial and uncertain writes/retry\\n\";\n}\n", "tests/vng07/test_sequence.cpp": "#include \"TimedAimSequence.h\"\n#include <cassert>\n#include <limits>\nint main(){\n using namespace PITimedAim;\n PIProjection::Vec a{0,0,10},b{0,0,20},c{0,0,30};\n assert(!Sample(a,b,c,-1).Valid&&!Sample(a,b,c,std::numeric_limits<double>::quiet_NaN()).Valid);\n assert(Sample(a,b,c,0).Point.Z==10&&Sample(a,b,c,.20).Point.Z==10);\n assert(Sample(a,b,c,.65).Point.Z==20&&Sample(a,b,c,1.15).Point.Z==30&&Sample(a,b,c,10).Point.Z==30);\n double last=10;for(int i=0;i<=2000;++i){auto r=Sample(a,b,c,i/1000.);assert(r.Valid&&r.Point.Z>=last&&r.Point.Z>=10&&r.Point.Z<=30);last=r.Point.Z;}\n for(double boundary:{.20,.65,1.15})assert(std::abs(Sample(a,b,c,boundary-1e-6).Point.Z-Sample(a,b,c,boundary+1e-6).Point.Z)<1e-6);\n assert(Sample({5,0,10},{5,0,20},{5,0,30},.5).Point.X==5);\n a.X=std::numeric_limits<double>::infinity();assert(!Sample(a,b,c,.5).Valid);\n}\n", "tests/vng07/test_session.cpp": "#include \"SessionPolicy.h\"\n#include <cassert>\nint main(){\n ZKSession::Policy p;assert(!p.canRead()&&!p.canAim());\n p.start();p.aim=true;auto first=p.epoch;assert(p.canRead()&&p.canAim()&&p.accepts(first));\n assert(p.pause());assert(!p.canRead()&&!p.canAim()&&p.aim&&!p.accepts(first));\n assert(!p.pause());assert(p.resume()&&p.canAim()&&!p.accepts(first));\n auto active=p.epoch;p.refresh();assert(!p.accepts(active)&&p.canAim());\n p.stop();assert(!p.canRead()&&!p.aim&&!p.resume());\n p.start();assert(p.canRead()&&!p.canAim());\n // No cumulative lifetime or action quota, even across long repeated sessions.\n for(int i=0;i<100000;++i){p.aim=true;auto old=p.epoch;assert(p.pause()&&p.resume());assert(p.canAim()&&!p.accepts(old));}\n p.stop();assert(!p.canRead());\n}\n", "tests/vng07/test_vertical.cpp": "#include \"VerticalRecoilPolicy.h\"\n#include \"RecoilParameters.h\"\n#include <cassert>\nint main(){\n static_assert(PIVertical::Percent==100&&PIVertical::ADSKickPercent==100);\n auto configured=PIVertical::EntityPercents<12>(PIVertical::Percent,PIVertical::ADSKickPercent);\n for(size_t i=0;i<12;++i)assert(configured[i]==(i<5?100:(i==10?100:0)));\n auto p=PIVertical::Percents<12>(30);\n PIParams::Control<12> c;std::array<float,12> values{};values.fill(2);\n auto live=[](auto){return true;};\n auto read=[&](auto,size_t i,float& v){v=values[i];return true;};\n auto write=[&](auto,size_t i,float before,float after){assert(values[i]==before);values[i]=after;return true;};\n PIRecoil::Identity key{1,2,3,4,5};\n assert(c.Step(key,true,p,live,read,write).Applied);\n for(size_t i=0;i<12;++i)assert(PIRecoil::Equal(values[i],i<5?1.4f:2.f));\n c.Step(key,true,p,live,read,write);assert(PIRecoil::Equal(values[0],1.4f));\n // Preserve a newer attachment/game value on stop.\n values[0]=3;assert(c.Restore(live,read,write));assert(values[0]==3);\n for(size_t i=1;i<12;++i)assert(values[i]==2);\n auto ads=PIVertical::EntityPercents<12>(30,100);\n for(size_t i=0;i<12;++i)assert(ads[i]==(i<5?30:(i==10?100:0)));\n values.fill(2);\n assert(c.Step(key,true,ads,live,read,write).Applied);\n for(size_t i=0;i<12;++i)assert(PIRecoil::Equal(values[i],i<5?1.4f:(i==10?0.f:2.f)));\n c.Step(key,true,ads,live,read,write);\n assert(PIRecoil::Equal(values[0],1.4f)&&values[10]==0);\n // A new attachment value must survive restoration.\n values[10]=4;assert(c.Restore(live,read,write));assert(values[10]==4);\n for(size_t i=0;i<12;++i)if(i!=10)assert(values[i]==2);\n values.fill(2);c.Step(key,true,configured,live,read,write);\n for(size_t i=0;i<12;++i)assert(PIRecoil::Equal(values[i],i<5?0.f:(i==10?0.f:2.f)));\n assert(c.Restore(live,read,write));for(float v:values)assert(v==2);\n}\n"}''')
